name: Add Backlog Task (temporary, manual)

# One-off — runs scripts/_tmp-add-backlog-task.mjs once, then this file and
# the script are deleted in the same PR. Same reasoning as fetch-tasks.yml
# for why this has to run in Actions rather than a sandbox (no network
# egress to shamrock84-github-io.vercel.app there).
on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            api
            scripts
            config
            data
            .github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add task
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node scripts/_tmp-add-backlog-task.mjs
