name: Diagnose Salary Cap Fields (manual, read-only)

# Deliberately workflow_dispatch ONLY. Read-only research to find how MFL's
# API exposes salary cap totals/adjustments — delete this workflow and
# scripts/diag-salary-cap.mjs once the real fields are confirmed and wired
# into providers.mjs.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dump salary/cap fields
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: node scripts/diag-salary-cap.mjs
