name: Test Sleeper Provider Functions (manual, read-only)

# Deliberately workflow_dispatch ONLY. Exercises the new Sleeper provider
# functions (scripts/lib/providers.mjs) against the real SFB16 league before
# they're trusted in the full sync — delete this workflow and
# scripts/test-sleeper.mjs once the integration is verified working.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Sleeper provider functions
        run: node scripts/test-sleeper.mjs
