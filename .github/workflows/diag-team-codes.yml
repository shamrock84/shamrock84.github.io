name: Test Sleeper Bye Weeks and Points (manual, read-only)

# Deliberately workflow_dispatch ONLY. Verifies the MFL-team-code crosswalk
# and the season-points aggregation against the real SFB16 league before
# trusting them in the full sync — delete this workflow and
# scripts/test-sleeper-bye-pts.mjs once verified working.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Sleeper bye weeks and points
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: node scripts/test-sleeper-bye-pts.mjs
