name: Diagnose MFL Team Codes (manual, read-only)

# Deliberately workflow_dispatch ONLY. Read-only research to build an
# accurate MFL-team-code crosswalk for Sleeper bye weeks — delete this
# workflow and scripts/diag-team-codes.mjs once confirmed and wired in.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dump MFL team codes
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: node scripts/diag-team-codes.mjs
