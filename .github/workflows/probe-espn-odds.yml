name: Probe ESPN odds (manual, read-only, no secrets needed)

# Deliberately workflow_dispatch ONLY — never add a schedule trigger here, the
# same rule the other manual workflows follow.
#
# Asks ESPN's public endpoints whether they serve NFL point spreads, totals
# and moneylines, and in what shape, ahead of the NFL tab's spread column and
# a possible betting card. ESPN is unreachable from the sandbox this repo is
# normally edited from. See scripts/probe-espn-odds.mjs's header.
#
# Read-only: a few dozen GETs.
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week to sample (blank = ESPN current week)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Blobless + sparse checkout: skips mfl/PSD and images/, which no
      # workflow here reads. Same five directories everywhere on purpose;
      # see sync-fantasy-rosters.yml for the reasoning and the numbers.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            api
            scripts
            config
            data
            .github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe ESPN's public odds endpoints
        env:
          WEEK: ${{ inputs.week }}
        run: node scripts/probe-espn-odds.mjs
