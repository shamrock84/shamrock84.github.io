name: Probe FantasyPros Weekly ECR (manual, read-only)

# Deliberately workflow_dispatch ONLY — never add a schedule trigger here, the
# same rule the other manual workflows follow.
#
# Asks FantasyPros what type=WEEKLY on the consensus-rankings endpoint returns
# (per-position or overall, which `week` it wants, field names, depth), ahead
# of using weekly ECR for the Game-Time Watchlist's replacement suggestions.
# api.fantasypros.com is unreachable from a sandbox and the key is a secret,
# so a workflow run is the only place to ask. See
# scripts/probe-fantasypros-weekly-ecr.mjs's header.
#
# Read-only: about twenty-five paced GETs.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Blobless + sparse checkout: skips mfl/PSD and images/, which no
      # workflow here reads. Same five directories everywhere on purpose;
      # see sync-fantasy-rosters.yml for the reasoning and the numbers.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            api
            scripts
            config
            data
            .github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe type=WEEKLY on consensus-rankings
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: node scripts/probe-fantasypros-weekly-ecr.mjs
