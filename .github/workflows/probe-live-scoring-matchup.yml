name: Probe Live Scoring Matchup (manual, read-only)

# Deliberately workflow_dispatch ONLY — never add a schedule trigger here, the
# same rule the other manual workflows follow. Answers whether MFL exposes
# head-to-head opponent pairing anywhere reachable from what the Scoring tab
# already fetches, before writing any parsing code for it. See
# scripts/probe-live-scoring-matchup.mjs for the full rationale.
#
# Read-only: TYPE=liveScoring, TYPE=league, TYPE=weeklyResults. Nothing is
# written.
on:
  workflow_dispatch:
    inputs:
      mfl_league_id:
        description: 'MFL league ID to probe'
        required: false
        default: '26696'
      week:
        description: 'Week to probe'
        required: false
        default: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # TEMPORARY, reverted immediately after this run. A workflow_dispatch
      # workflow can only be dispatched if it is registered on the DEFAULT
      # branch, and probe-live-scoring-players.yml exists only on this
      # feature branch — so this already-registered file is standing in as
      # the launcher for it, on this branch only. main is untouched.
      - name: Dump per-player live-scoring shapes (temporary stand-in)
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          PROBE_MFL_LEAGUE_ID: ${{ inputs.mfl_league_id }}
          PROBE_ESPN_LEAGUE_ID: '421871710'
          PROBE_SLEEPER_LEAGUE_ID: '1367867592919760896'
          PROBE_WEEK: ${{ inputs.week }}
        run: node scripts/probe-live-scoring-players.mjs
