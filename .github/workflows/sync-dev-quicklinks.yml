name: Sync Dev Quick Links (manual)

# Deliberately workflow_dispatch ONLY — never add a schedule trigger here.
# Runs scripts/sync-dev-quicklinks.mjs: compares each site's "Dev" Quick Links
# group against myFFL's (config/leagues.json, the source of truth) and, for the
# sites named in `apply`, rewrites just that group (see the script's header).
# Reads need no login; writes use the same SITE_PASSWORD repo secret as
# fetch-tasks.yml. Leave `apply` empty for a report only.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Sites to update, comma-separated (vikings, bangers, fam, fish). Empty = report only.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Blobless + sparse checkout: skips mfl/PSD and images/, which no
      # workflow here reads. Same five directories everywhere on purpose;
      # see sync-fantasy-rosters.yml for the reasoning and the numbers.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            api
            scripts
            config
            data
            .github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync Dev quick links
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          APPLY_SITES: ${{ github.event.inputs.apply }}
        run: node scripts/sync-dev-quicklinks.mjs
