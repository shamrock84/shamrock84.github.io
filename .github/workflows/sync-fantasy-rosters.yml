name: Sync Fantasy Rosters

on:
  schedule:
    # Every 4 hours, offset to :17 rather than :00. GitHub's scheduler
    # queues every repo's top-of-hour cron together, and that contention is
    # what turned into 20-70 minute delays here — a less popular minute
    # queues behind less of it. Not a guarantee, just less lateness.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      refresh_availability:
        description: 'Re-read every league''s full rosters now (free agents), instead of waiting for the daily read'
        type: boolean
        default: false
      refresh_draftonly_rosters:
        description: 'Also re-read frozen draft-only league rosters (rarely needed — they do not change once the draft ends)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shared with backfill-history.yml on purpose: both write to
  # data/rosters.json, and queuing (rather than running them side by side)
  # is what keeps one from clobbering the other's commit.
  group: rosters-data-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Blobless partial clone + sparse checkout. At the tip this repo is
      # ~173MB of working tree and ~121MB of git objects, almost all of it
      # mfl/PSD (132MB of Photoshop sources) and images/ — static art that
      # only Pages serves and that no workflow here ever reads.
      #
      # actions/checkout is ALREADY shallow (depth 1), and that does not help
      # with this: depth 1 still downloads every blob in the tip tree, which
      # is exactly where the PSDs are. `filter: blob:none` is the half that
      # skips them, fetching a blob on demand only if something opens it.
      # Measured: 121MB -> 1.8MB of objects, 173MB -> 4.3MB of worktree.
      # This job runs six times a day, so that is the bulk of its wall clock.
      #
      # The sparse list is the SAME five directories in every workflow here,
      # deliberately, rather than trimmed per job — uniformity is worth more
      # than shaving another 100KB, since it means the next workflow added
      # copies a block that is already right. Cone mode also always
      # materializes the root directory, which is what keeps myffl.html and
      # package.json present without either being listed.
      #
      # Safe for the commit step below: `git add data/rosters.json` stages one
      # path, and the sparse-excluded paths stay skip-worktree in the index
      # rather than reading as deletions. Verified end to end before this
      # landed — commit, push, and the whole scripts/test-*.mjs suite all run
      # clean from a clone made this way.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            api
            scripts
            config
            data
            .github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch rosters from MFL and ESPN
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          # Optional — without it the sync just skips the ECR columns.
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          # Empty on a scheduled run, which is what leaves the free agent
          # re-read on its once-a-day rule by default.
          REFRESH_AVAILABILITY: ${{ inputs.refresh_availability }}
          # Deliberately separate from REFRESH_AVAILABILITY above: a draft-only
          # roster doesn't change post-draft, so forcing fresh free agents has
          # no reason to also spend three MFL requests per draft-only league
          # re-reading rosters that come back identical (see
          # draftonlyRosterIsSettled in fetch-rosters.mjs).
          REFRESH_DRAFTONLY_ROSTERS: ${{ inputs.refresh_draftonly_rosters }}
        run: node scripts/fetch-rosters.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rosters.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update MFL rosters data"
            git push
          fi
