name: Syntax Check

# Parses every JS/MJS file under api/ and scripts/ and validates
# config/leagues.json. Needs no secrets and touches no external API, so unlike
# the other workflows here it is safe to run automatically on every PR.
#
# The point is timing: a syntax error in api/ only surfaces when Vercel builds,
# and one in scripts/ only surfaces at 4am when the scheduled sync runs. This
# catches both at review time instead.
#
# The two paths lists below are duplicated on purpose — GitHub Actions does not
# support YAML anchors, so they have to be kept in sync by hand. Path filtering
# keeps the every-4-hours "Update MFL rosters data" commit, which only touches
# data/rosters.json, from triggering a pointless run.

on:
  pull_request:
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'config/leagues.json'
      - 'package.json'
      - 'myffl.html'
      - 'CLAUDE.md'
      - '.claude/rules/**'
      - '.github/workflows/syntax-check.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'config/leagues.json'
      - 'package.json'
      - 'myffl.html'
      - 'CLAUDE.md'
      - '.claude/rules/**'
      - '.github/workflows/syntax-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Blobless + sparse checkout: skips mfl/PSD and images/, which no
      # workflow here reads. The same five directories as everywhere else
      # (see sync-fantasy-rosters.yml for the reasoning and the numbers),
      # plus .claude here only, for the rules size check below.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            api
            scripts
            config
            data
            .github
            .claude

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the runtime the sync workflow and Vercel use, so this rejects
          # syntax those would reject rather than merely parsing under a newer
          # engine. node --check honours package.json's "type": "module" here,
          # so the ESM files under api/ that use a plain .js extension parse
          # correctly rather than being treated as CommonJS.
          node-version: '24'

      - name: Parse every JS/MJS file under api/ and scripts/
        run: |
          fail=0
          for f in $(find api scripts -type f \( -name '*.js' -o -name '*.mjs' \) | sort); do
            if node --check "$f"; then
              echo "  ok    $f"
            else
              echo "  FAIL  $f"
              fail=1
            fi
          done
          exit $fail

      # CLAUDE.md is loaded in full at the start of every Claude Code session,
      # so its length is a cost paid on every task. It holds only what every
      # task needs; the per-subsystem invariants live in .claude/rules/*.md,
      # which Claude Code loads only when a file matching their `paths:`
      # frontmatter is read. Both are meant to be an index of rules pointing
      # at the code comments that explain them, and the single-file version
      # twice drifted past 90KB by accumulating those explanations instead.
      # This is the backstop for that: compress an existing entry rather than
      # raise a number. The rules total is the old single-file limit, since a
      # myffl.html session can still load nearly all of them.
      - name: Check CLAUDE.md and .claude/rules stay an index
        run: |
          fail=0
          size=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md is $size bytes (limit 16000)"
          if [ "$size" -gt 16000 ]; then
            echo "CLAUDE.md is over 16000 bytes. Subsystem rules belong in .claude/rules/; reasoning belongs in the code comment it describes."
            fail=1
          fi
          total=$(cat .claude/rules/*.md | wc -c)
          echo ".claude/rules/*.md total $total bytes (limit 45000)"
          if [ "$total" -gt 45000 ]; then
            echo ".claude/rules is over 45000 bytes. Move reasoning into the code comment it describes and keep the entry to the rule, a pointer, and how it fails."
            fail=1
          fi
          # A rules file without paths: frontmatter loads in every session,
          # which silently undoes the split.
          for f in .claude/rules/*.md; do
            if [ "$(head -n 2 "$f" | tr -d '\n')" != "---paths:" ]; then
              echo "$f does not start with paths: frontmatter"
              fail=1
            fi
          done
          exit $fail

      # Runs every scripts/test-*.mjs, so a new test is picked up without
      # anyone editing this file. What each test pins, and how it fails
      # silently, is explained in its own header, not here. It runs them all
      # and lists every failure rather than stopping at the first, and it fails
      # if the glob matches nothing.
      #
      # test-set-lineup.mjs is the one deliberate exception and always will be:
      # it performs a real lineup WRITE against MFL, which needs credentials
      # and must never run unattended on a pull request. It has its own
      # workflow_dispatch-only workflow (test-set-lineup.yml) for that reason.
      - name: Run every scripts/test-*.mjs
        run: |
          fail=0
          ran=0
          for f in scripts/test-*.mjs; do
            if [ "$f" = scripts/test-set-lineup.mjs ]; then
              echo "  skip  $f (workflow_dispatch-only, real MFL write)"
              continue
            fi
            ran=$((ran + 1))
            if node "$f"; then
              echo "  ok    $f"
            else
              echo "::error file=$f::$f failed"
              fail=1
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "No tests found under scripts/test-*.mjs"
            exit 1
          fi
          exit $fail

      - name: Validate config/leagues.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const parsed = JSON.parse(readFileSync("config/leagues.json", "utf8"));
            if (!Array.isArray(parsed.leagues) || parsed.leagues.length === 0) {
              throw new Error("leagues[] is missing or empty");
            }
            const ids = parsed.leagues.map((l) => l.id);
            const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (dupes.length) {
              // Every lookup here is leagues.find((l) => l.id === id), so a
              // duplicate silently shadows a league rather than erroring.
              throw new Error(`duplicate league id(s): ${[...new Set(dupes)].join(", ")}`);
            }
            console.log(`config/leagues.json OK — ${parsed.leagues.length} leagues, ids unique`);
          '
