name: Syntax Check

# Parses every JS/MJS file under api/ and scripts/ and validates
# config/leagues.json. Needs no secrets and touches no external API, so unlike
# the other workflows here it is safe to run automatically on every PR.
#
# The point is timing: a syntax error in api/ only surfaces when Vercel builds,
# and one in scripts/ only surfaces at 4am when the scheduled sync runs. This
# catches both at review time instead.
#
# The two paths lists below are duplicated on purpose — GitHub Actions does not
# support YAML anchors, so they have to be kept in sync by hand. Path filtering
# keeps the every-4-hours "Update MFL rosters data" commit, which only touches
# data/rosters.json, from triggering a pointless run.

on:
  pull_request:
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'config/leagues.json'
      - 'package.json'
      - 'myffl.html'
      - '.github/workflows/syntax-check.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'config/leagues.json'
      - 'package.json'
      - 'myffl.html'
      - '.github/workflows/syntax-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the runtime the sync workflow and Vercel use, so this rejects
          # syntax those would reject rather than merely parsing under a newer
          # engine. node --check honours package.json's "type": "module" here,
          # so the ESM files under api/ that use a plain .js extension parse
          # correctly rather than being treated as CommonJS.
          node-version: '20'

      - name: Parse every JS/MJS file under api/ and scripts/
        run: |
          fail=0
          for f in $(find api scripts -type f \( -name '*.js' -o -name '*.mjs' \) | sort); do
            if node --check "$f"; then
              echo "  ok    $f"
            else
              echo "  FAIL  $f"
              fail=1
            fi
          done
          exit $fail

      # Pure functions, no network and no secrets — the guardrails on the one
      # write path that commits straight to main without a pull request.
      - name: Test the Admin tab's save validation
        run: node scripts/test-save-leagues.mjs

      # Also pure functions with no network: the NFL-calendar rules that flip
      # the automatic ranking set to rest-of-season at kickoff and back after
      # the Super Bowl. Nobody is watching on the day either boundary fires.
      - name: Test the automatic ranking-set calendar
        run: node scripts/test-season-phase.mjs

      # Which season each league is read from during the rollover window. Both
      # ways of getting this wrong are silent: too early and cards go empty,
      # too late and last season's rosters render like fresh ones.
      - name: Test the per-league season rollover
        run: node scripts/test-season-rollover.mjs

      # Which FantasyPros list the ECR column is drawn from. Silent when wrong:
      # the column still fills with plausible ranks, just for a different game.
      - name: Test scoring-format detection
        run: node scripts/test-scoring-format.mjs

      # The merge/replace rules the planning values round-trip through. Getting
      # these wrong loses a plan silently — a wipe in one direction, a plan that
      # refuses to clear in the other.
      - name: Test the plan store's merge rules
        run: node scripts/test-plans.mjs

      # The client half of the same thing, run against myffl.html itself: what
      # the page does with a merge answer. A union cannot express a deletion, so
      # this is what keeps a cleared contract length from coming back.
      - name: Test the page's plan reconciliation
        run: node scripts/test-plan-sync.mjs

      # The Dynasty cut-planning dropdown's own offseason boundary, narrower
      # than nflInSeason() and with its own year-wraparound math (the last
      # game of Week 17 crosses the new year in some seasons and not others).
      # Wrong in either direction is silent: the dropdown just doesn't show up
      # when it should, or keeps showing when it shouldn't.
      - name: Test the cut-planning window
        run: node scripts/test-cut-planning-window.mjs

      # The Analytics tab's judgement calls, run against myffl.html itself.
      # Every one of them is invisible when wrong — a denominator that quietly
      # counts a league it shouldn't, or a player you own not being recognised
      # as owned — so nothing on screen says the card is lying.
      - name: Test the Injury Exposure card
        run: node scripts/test-injury-exposure.mjs

      # The sync half of the same card: which designations MFL publishes and
      # what survives off a row of its injury report. A mis-normalised code
      # renders as a plausible badge and sorts wrong, which is the quietest way
      # this can break.
      - name: Test injury detail and designation parsing
        run: node scripts/test-injury-detail.mjs

      - name: Test the Top Available card
        run: node scripts/test-top-available.mjs

      # The cross-league problems digest, run against myffl.html itself. Its
      # failure mode is noise rather than error: one wrong inclusion rule and
      # the strip opens on fourteen benign preseason rows, which trains the
      # eye to skip the one row that matters.
      - name: Test the problems digest
        run: node scripts/test-problems-digest.mjs

      # The power ranks: projection joins, slot parsing, the greedy lineup
      # valuation, and the page's standings join. Every failure here renders
      # as a plausible column of small numbers — nothing on screen says a
      # franchise was credited with the wrong Josh Allen.
      - name: Test the power ranks
        run: node scripts/test-power-rank.mjs

      # Team Needs: the per-position split of the same power-rank data,
      # and the card's own click-to-sort / weakest-cell highlighting. A
      # wrong split here renders a plausible small number crediting one
      # position with another's points.
      - name: Test the Team Needs card
        run: node scripts/test-team-needs.mjs

      # Click-to-sort on the shared analytics table. The sort state lives in a
      # closure rather than a pure function, so this one drives a DOM stub — and
      # every way it can break still renders a plausible-looking table.
      - name: Test the analytics column sorting
        run: node scripts/test-analytics-sort.mjs

      # Whether a league's draft has finished, which decides if its wire is
      # shown at all. The fixtures are copied from what the real MFL API
      # returned, since the shape is undocumented and unreachable from CI.
      - name: Test draft detection
        run: node scripts/test-draft-status.mjs

      # What goes into the ranking pool the wire is filtered from. Excluding
      # kickers and defenses before the truncation rather than after is the
      # part that's silent when wrong — the card just stops a bit shallower.
      - name: Test the ranking pool
        run: node scripts/test-ranking-pool.mjs

      # The History tab's placement derivation: MFL bracket-name
      # classification, the winner/loser walk, and the gap-filling fallback
      # to regular-season order. Silent when wrong in the most consequential
      # way on this whole page — a franchise credited with someone else's
      # championship reads as a perfectly plausible result.
      - name: Test History placement derivation
        run: node scripts/test-history.mjs

      # The Results card itself, run against myffl.html — average-finish
      # math, sort order, and that an estimated finish is never shown
      # identically to a confirmed one.
      - name: Test the Results card
        run: node scripts/test-results-card.mjs

      # The weekly/season high-score derivation: the max/sum over a season's
      # fetched weeks, and which years still need it backfilled. Silent when
      # wrong: a mis-derived high score renders as a perfectly plausible
      # week and point total.
      - name: Test weekly/season high-score derivation
        run: node scripts/test-scoring-records.mjs

      # The parsing step feeding the derivation above: a franchise with no
      # head-to-head game that week is a flat entry under weeklyResults
      # .franchise rather than inside .matchup, and reading only .matchup
      # silently drops it. That is a real bug this fixture is copied from —
      # MNMx 2021 week 15, where the dropped franchise held the true weekly
      # high — and nothing on screen says a weekly high went to the wrong team.
      - name: Test weekly score parsing
        run: node scripts/test-weekly-scores.mjs

      # The Sleepers sub-line's own join. type=SLEEPERS is served back as the
      # Draft list if the literal is ever mistyped (FantasyPros does not 4xx an
      # unrecognised type), so a break here ships a line that quietly means
      # something else rather than failing loudly.
      - name: Test the Sleepers join
        run: node scripts/test-sleepers.mjs

      # The values that exist twice on purpose, once in the sync and once in
      # myffl.html, because the page has no build step and no imports.
      # POWER_POSITIONS must match exactly; POSITION_ORDER must deliberately
      # NOT, since the sync also carries the IDP positions. Also checks that
      # every position the committed snapshot actually carries is one the page
      # can rank — the assertion that fires the day an IDP league is added,
      # which otherwise sorts a whole defense as one undifferentiated block.
      - name: Test the cross-boundary shared constants
        run: node scripts/test-shared-constants.mjs

      # The Finances card itself, run against myffl.html — Won as placement
      # payout plus weekly/season high-score payout, both able to land the
      # same year, and every contributing reason named in the Won cell.
      - name: Test the Finances card
        run: node scripts/test-finances-card.mjs

      # The Depth Charts tab's ESPN parsing: rank vs. slot semantics (order
      # comes from rank, WR's slot is a role tag, never a depth group), the
      # roster-id join, and graceful handling of a missing/unresolvable
      # entry. Pinned against fixtures shaped exactly like the real
      # responses probe-espn-depth-chart-slot.mjs captured.
      - name: Test the ESPN depth-chart parsing
        run: node scripts/test-espn-depth-chart.mjs

      - name: Validate config/leagues.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const parsed = JSON.parse(readFileSync("config/leagues.json", "utf8"));
            if (!Array.isArray(parsed.leagues) || parsed.leagues.length === 0) {
              throw new Error("leagues[] is missing or empty");
            }
            const ids = parsed.leagues.map((l) => l.id);
            const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (dupes.length) {
              // Every lookup here is leagues.find((l) => l.id === id), so a
              // duplicate silently shadows a league rather than erroring.
              throw new Error(`duplicate league id(s): ${[...new Set(dupes)].join(", ")}`);
            }
            console.log(`config/leagues.json OK — ${parsed.leagues.length} leagues, ids unique`);
          '
