<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>myBangers</title>
	<meta property="og:title" content="Hoot Owl Bangers"/>
	<meta property="og:image" content="https://melbostads.com/images/bangerslogo_large.png"/>
	<link rel="apple-touch-icon" href="/bangersicons/apple-touch-icon.png?v=1">
	<link rel="icon" type="image/png" sizes="32x32" href="/bangersicons/favicon-32x32.png?v=1">
	<link rel="icon" type="image/png" sizes="16x16" href="/bangersicons/favicon-16x16.png?v=1">
	<link rel="shortcut icon" href="/bangersicons/favicon.ico?v=1">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F2683">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#140f1e">
	<style>
		/* Same palette and shell as myffl.html and vikings.html (purple = primary
		   accent, gold = "notable"); only the tokens this page uses are copied.
		   Keep them in step if myffl.html's palette changes. The plaques are the
		   exception: they are always dark brass on the pale marble, in dark mode too. */
		:root {
			--bg: #f5f3f9;
			--card-bg: #ffffff;
			--text: #1b1425;
			--muted: #6b6478;
			--border: #e3daf0;
			--accent: #4F2683;
			--chip-bg: #ede3f8;
			--ir-text: #991b1b;
			--ir-bg: #fef2f2;
			--gain-text: #166534;
			--gold: #FFC62F;
			--gold-chip-bg: #fff3d1;
			--gold-chip-text: #7a5c00;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #140f1e;
				--card-bg: #1e1730;
				--text: #ede9f5;
				--muted: #a79bc2;
				--border: #362a4a;
				--accent: #b48ee0;
				--chip-bg: #2c2145;
				--ir-text: #fca5a5;
				--ir-bg: #341313;
				--gain-text: #86efac;
				--gold-chip-bg: #3d2e05;
				--gold-chip-text: #f0c33e;
			}
		}
		body::before {
			content: '';
			display: block;
			height: 4px;
			background: linear-gradient(90deg, var(--accent), var(--gold));
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}
		.hidden { display: none !important; }
		main { max-width: 62rem; margin: 0 auto; padding: 1.2rem 1rem; }
		/* Centered masthead, same treatment as myffl.html's .site-logo. */
		header {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 0.4rem;
			text-align: center;
			margin-bottom: 0.8rem;
		}
		h1 { margin: 0; }
		.site-title { display: flex; align-items: center; justify-content: center; }
		.site-logo-prefix {
			font-family: Georgia, 'Times New Roman', serif;
			font-weight: 400;
			font-size: 1.85rem;
			line-height: 1;
			color: var(--text);
			margin-right: 0.15rem;
			margin-top: 0.75rem;
		}
		.site-logo { height: 64px; width: auto; display: block; }
		@media (prefers-color-scheme: dark) { .site-logo { filter: invert(1); } }

		/* Login control: same look as vikings.html's. */
		.login { font-size: 0.8rem; }
		.login-toggle { background: none; border: none; color: var(--accent); font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 0; }
		.login-toggle:hover { text-decoration: underline; }
		.login-form { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; justify-content: center; }
		.login-form input[type="password"] {
			flex: 1; min-width: 8rem; padding: 0.4rem 0.6rem; border-radius: 6px;
			border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
			font-size: 16px; /* under 16px, iOS Safari zooms in on focus */
		}
		.login-form button[type="submit"] {
			border: 1px solid var(--accent); background: var(--accent); color: #fff;
			padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
		}
		.login-form button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
		.login-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.login-status { font-size: 0.78rem; color: var(--ir-text); }

		/* Pill tabs, same look as myffl.html's .tab-btn. */
		.tabs { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
		.tab-btn {
			border: 1px solid var(--border); background: var(--card-bg); color: var(--muted);
			padding: 0.45rem 1rem; border-radius: 999px; font: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer;
		}
		.tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
		.tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

		.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; }
		.card-heading { margin: 0 0 0.6rem; font-size: 1.05rem; color: var(--accent); }
		.card-heading.collapsible { position: relative; padding-right: 2.3rem; cursor: pointer; }
		.card-collapse-toggle {
			position: absolute; top: 50%; right: 0; transform: translateY(-50%);
			background: none; border: none; padding: 0.15rem 0.3rem; margin: 0;
			color: var(--muted); cursor: pointer; font-size: 1.5rem; line-height: 1; transition: transform 0.15s ease;
		}
		.card-collapse-toggle:hover { color: var(--text); }
		.card.card-collapsed .card-collapse-toggle { transform: translateY(-50%) rotate(-90deg); }
		.card.card-collapsed > *:not(.card-heading) { display: none; }
		.card.card-collapsed > .card-heading { margin-bottom: 0; }
		.message { padding: 1rem 0.2rem; color: var(--muted); }
		.message.error { color: var(--ir-text); }
		.status-bar { position: sticky; bottom: 0; background: var(--bg); padding: 0.2rem 0; }
		.status { min-height: 1.2em; margin-top: 0.4rem; font-size: 0.8rem; color: var(--muted); text-align: center; }
		.status.error { color: var(--ir-text); }
		.status.ok { color: var(--gain-text); }

		/* ---- The trophy board --------------------------------------------------
		   Purple marble panel, a black title plate with gold lettering, and one brass-and-
		   black plaque per song, as on the page this replaced, drawn in CSS so it
		   scales to any screen. */
		.board {
			padding: 1rem;
			border-radius: 12px;
			border: 2px solid #444;
			border-color: #afafaf #444 #444 #afafaf;
			background: #bba6dc url(images/purple_marble.jpg) center top / 1024px auto;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(0, 0, 0, 0.5);
		}
		.board-title {
			margin: 0 0 1rem;
			padding: 0.7rem 1rem;
			text-align: center;
			font-family: Georgia, 'Times New Roman', serif;
			font-size: 1.5rem;
			color: #2f1259;
			position: relative;
			border-radius: 8px;
			border: 1px solid rgba(255, 255, 255, 0.75);
			background: linear-gradient(165deg, #f6f7fa 0%, #d3d6dc 42%, #b4b8c1 100%);
			box-shadow: 0 3px 7px rgba(40, 20, 70, 0.45), inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0, 0, 0, 0.15);
			text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
			letter-spacing: 0.02em;
		}
		.plaques { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: 0.9rem; }
		.plaque {
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			gap: 0.25rem;
			padding: 0.8rem 1.3rem 0.9rem;
			border-radius: 8px;
			border: 1px solid rgba(255, 255, 255, 0.75);
			background: linear-gradient(165deg, #f6f7fa 0%, #d3d6dc 42%, #b4b8c1 100%);
			box-shadow: 0 3px 7px rgba(40, 20, 70, 0.45), inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0, 0, 0, 0.15);
			font-family: Georgia, 'Times New Roman', serif;
		}
		/* A screw at each end. */
		.plaque::before, .plaque::after {
			content: '';
			position: absolute;
			top: 50%;
			width: 6px;
			height: 6px;
			margin-top: -3px;
			border-radius: 50%;
			background: radial-gradient(circle at 35% 35%, #ffffff, #6b6f78);
		}
		.plaque::before { left: 6px; }
		.plaque::after { right: 6px; }
		/* The title plate and year bands carry the same screws. */
		.board-title::before, .board-title::after, .year-band::before, .year-band::after {
			content: '';
			position: absolute;
			top: 50%;
			width: 6px;
			height: 6px;
			margin-top: -3px;
			border-radius: 50%;
			background: radial-gradient(circle at 35% 35%, #ffffff, #6b6f78);
		}
		.board-title::before, .year-band::before { left: 6px; }
		.board-title::after, .year-band::after { right: 6px; }
		.plaque-year { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #3f1d72; }
		.plaque-by { font-size: 0.85rem; font-weight: 700; color: #1b1425; }
		.plaque-by.unknown { font-weight: 400; font-style: italic; color: #5d5a68; }
		.plaque-song { font-size: 0.82rem; line-height: 1.3; color: #2e2a3b; overflow-wrap: anywhere; }
		.plaque-song q { quotes: '\201C' '\201D'; }
		/* In the Nominees view the winner stands out and the also-rans recede. */
		.plaque.winner { border-color: #d4a017; box-shadow: 0 0 0 2px #d4a017, 0 0 14px rgba(212, 160, 23, 0.55), 0 3px 7px rgba(40, 20, 70, 0.45); }
		.plaque.nominee { opacity: 0.88; }
		.plaque-badge {
			margin-top: 0.15rem;
			padding: 0.05rem 0.55rem;
			border-radius: 999px;
			background: #d4a017;
			color: #1a1200;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-size: 0.65rem;
			font-weight: 800;
			letter-spacing: 0.06em;
			text-transform: uppercase;
		}
		.year-section + .year-section { margin-top: 1.1rem; }
		.year-section .plaques { margin-top: 0.7rem; }
		.year-section.folded .plaques { display: none; }
		/* The band is the button that folds its year. */
		.year-band {
			position: relative;
			display: flex;
			width: 100%;
			align-items: baseline;
			justify-content: center;
			gap: 0.6rem;
			margin: 0;
			cursor: pointer;
			appearance: none;
			text-align: center;
			padding: 0.35rem 2.2rem;
			font-family: Georgia, 'Times New Roman', serif;
			font-size: 1.05rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: #2f1259;
			border-radius: 8px;
			border: 1px solid rgba(255, 255, 255, 0.75);
			background: linear-gradient(165deg, #f6f7fa 0%, #d3d6dc 42%, #b4b8c1 100%);
			box-shadow: 0 3px 7px rgba(40, 20, 70, 0.45), inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0, 0, 0, 0.15);
			text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
		}
		.year-band:hover { filter: brightness(1.05); }
		.year-band:focus-visible { outline: 2px solid #2f1259; outline-offset: 2px; }
		.year-chev { position: absolute; left: 1.1rem; color: #3f1d72; top: 50%; margin-top: -0.55em; font-size: 0.85rem; line-height: 1.1; transition: transform 0.12s; transform: rotate(90deg); }
		.year-section.folded .year-chev { transform: none; }
		.board-tools { display: flex; justify-content: flex-end; margin: -0.4rem 0 0.7rem; }
		.fold-all {
			font: inherit; font-size: 0.78rem; font-weight: 600; color: #2f1259; cursor: pointer;
			background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 999px; padding: 0.25rem 0.8rem;
		}
		.fold-all:hover { background: #fff; }
		.fold-all:focus-visible { outline: 2px solid #2f1259; outline-offset: 2px; }
		.year-band small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.03em; color: #4a4659; text-shadow: none; }
		.board-empty { padding: 1.2rem; text-align: center; color: #efe6fb; font-family: Georgia, 'Times New Roman', serif; }

		/* ---- Admin ------------------------------------------------------------ */
		#view > * + * { margin-top: 0.8rem; }
		.task-input {
			font: inherit;
			font-size: 16px;
			padding: 0.35rem 0.55rem;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: var(--card-bg);
			color: inherit;
			min-width: 0;
		}
		.task-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.add-year-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0 0 0.8rem; }
		.add-year-row .task-input { flex: 1 1 12rem; }
		.task-add-btn {
			font: inherit; font-size: 0.85rem; color: var(--accent); background: transparent;
			border: 1px solid var(--accent); border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer;
		}
		.task-add-btn:disabled { opacity: 0.5; cursor: default; }
		.task-add-btn.primary { background: var(--accent); color: #fff; }
		.task-icon-btn {
			font: inherit; font-size: 0.8rem; line-height: 1; color: var(--ir-text); background: var(--ir-bg);
			border: 1px solid var(--border); border-radius: 4px; padding: 0.3rem 0.4rem; cursor: pointer; flex-shrink: 0;
		}
		.task-icon-btn.move { color: var(--accent); background: var(--chip-bg); }
		.task-icon-btn:disabled { opacity: 0.35; cursor: default; }
		.year-mini { border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; margin-top: 0.5rem; }
		.year-mini > summary {
			display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.2rem 0.7rem; cursor: pointer; list-style: none;
			font-weight: 700; color: var(--accent);
		}
		.year-mini > summary::-webkit-details-marker { display: none; }
		.year-mini > summary::before { content: '\25B8'; display: inline-block; transition: transform 0.12s; }
		.year-mini[open] > summary::before { transform: rotate(90deg); }
		.year-sub { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
		.year-body { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.6rem; }
		.year-head-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.5rem; }
		.year-head-row .task-input { flex: 1 1 10rem; font-weight: 600; }
		.nom-row {
			display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.4rem 0.5rem; padding: 0.6rem;
			border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 8px; background: var(--bg);
		}
		.nom-row.is-winner { border-left-color: var(--gold); }
		.nom-field { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
		.nom-field span { font-size: 0.7rem; color: var(--muted); }
		.nom-song { flex: 2 1 12rem; }
		.nom-artist { flex: 2 1 10rem; }
		.nom-by { flex: 1 1 7rem; }
		.nom-field .task-input { width: 100%; }
		.nom-win {
			display: flex; align-items: center; gap: 0.35rem; align-self: center; flex: 0 0 auto;
			font-size: 0.85rem; font-weight: 600; color: var(--gold-chip-text); background: var(--gold-chip-bg);
			border-radius: 999px; padding: 0.3rem 0.7rem; cursor: pointer; user-select: none;
		}
		.nom-win input { width: 1.1rem; height: 1.1rem; margin: 0; accent-color: var(--accent); cursor: pointer; }
		.nom-win:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
		.admin-actions {
			position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
			margin: 0.8rem -0.8rem -0.8rem; padding: 0.6rem 0.8rem; background: var(--card-bg);
			border-top: 1px solid var(--border); border-radius: 0 0 10px 10px;
		}
		.dirty-flag { font-size: 0.8rem; font-weight: 600; color: var(--gold-chip-text); background: var(--gold-chip-bg); border-radius: 999px; padding: 0.15rem 0.6rem; }
		.admin-errors { color: var(--ir-text); font-size: 0.85rem; margin: 0.5rem 0 0; padding-left: 1.1rem; }
		.admin-note { color: var(--muted); font-size: 0.8rem; margin: 0.6rem 0 0; }
		.task-empty { color: var(--muted); font-size: 0.85rem; margin: 0.4rem 0; }

		/* ---- Quick links toolbar and Tasks card: ported from vikings.html; keep in step. ---- */
		/* Header quick-link toolbar: the same look as myffl.html's. Empty means
		   no bar at all (:empty also drops the padding and border). */
		#quicklinks {
			position: sticky; top: 0; z-index: 30;
			display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.4rem;
			background: var(--card-bg);
		}
		#quicklinks:not(:empty) { padding: 0.4rem 1rem; border-bottom: 1px solid var(--border); }
		#quicklinks a { color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600; padding: 0.15rem 0; white-space: nowrap; }
		#quicklinks a:hover, #quicklinks a:focus-visible { color: var(--accent); }
		#quicklinks a::after { content: ''; display: inline-block; width: 1px; height: 0.7rem; background: var(--border); margin-left: 0.4rem; vertical-align: middle; }
		#quicklinks a:last-child::after { display: none; }
		#quicklinks a.quicklink-gold, #quicklinks a.quicklink-purple { padding: 0; }
		#quicklinks a.quicklink-gold .quicklink-pill { background: var(--gold-chip-bg); color: var(--gold-chip-text); }
		#quicklinks a.quicklink-purple .quicklink-pill { background: var(--chip-bg); color: var(--accent); }
		#quicklinks a.quicklink-gold .quicklink-pill, #quicklinks a.quicklink-purple .quicklink-pill { display: inline-block; border-radius: 999px; padding: 0.15rem 0.55rem; }
		#quicklinks a.quicklink-gold:hover .quicklink-pill, #quicklinks a.quicklink-gold:focus-visible .quicklink-pill,
		#quicklinks a.quicklink-purple:hover .quicklink-pill, #quicklinks a.quicklink-purple:focus-visible .quicklink-pill { color: var(--text); }
		/* A group: one button whose menu holds its links. */
		#quicklinks .quicklink-combo { position: relative; display: inline-flex; align-items: center; }
		#quicklinks .quicklink-combo:not(:last-child)::after { content: ''; display: inline-block; width: 1px; height: 0.7rem; background: var(--border); margin-left: 0.4rem; }
		#quicklinks .quicklink-combo-btn { font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 0.15rem 0.55rem; cursor: pointer; }
		#quicklinks .quicklink-combo-btn.quicklink-combo-gold { color: var(--gold-chip-text); background: var(--gold-chip-bg); }
		#quicklinks .quicklink-combo-btn.quicklink-combo-purple { color: var(--accent); background: var(--chip-bg); }
		#quicklinks .quicklink-combo-btn:hover, #quicklinks .quicklink-combo-btn:focus-visible, #quicklinks .quicklink-combo.open .quicklink-combo-btn { color: var(--text); }
		#quicklinks .quicklink-combo-menu { display: none; position: absolute; top: calc(100% + 0.35rem); left: 0; z-index: 31; flex-direction: column; align-items: flex-start; gap: 0.35rem; background: transparent; padding: 0; }
		#quicklinks .quicklink-combo.align-right .quicklink-combo-menu { left: auto; right: 0; }
		#quicklinks .quicklink-combo.open .quicklink-combo-menu { display: flex; }
		#quicklinks .quicklink-combo-menu a::after { display: none; }
		/* Admin > Quick Links rows. */
		.ql-list { display: flex; flex-direction: column; gap: 0.7rem; }
		.ql-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.4rem 0.5rem; padding: 0.6rem; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; background: var(--bg); }
		.ql-field { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
		.ql-field span { font-size: 0.7rem; color: var(--muted); }
		.ql-link { flex: 2 1 14rem; }
		.ql-nick, .ql-group { flex: 1 1 7rem; }
		.ql-style { flex: 0 0 auto; }
		.ql-row .task-input { width: 100%; min-width: 0; box-sizing: border-box; }
		.ql-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.8rem; }
		.ql-errors { color: var(--ir-text); font-size: 0.85rem; margin: 0.5rem 0 0; padding-left: 1.1rem; }
		.ql-note { color: var(--muted); font-size: 0.8rem; margin: 0.6rem 0 0; }
		/* Tasks card: the same look as myffl.html's, under its own names. */
		.task-add-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.6rem 0 0.8rem; }
		.task-add-row .task-input:first-child { flex: 2 1 12rem; }
		.task-add-row .suggest-wrap { flex: 1 1 8rem; }
		.suggest-wrap { position: relative; min-width: 0; }
		.suggest-wrap .task-input { width: 100%; }
		.suggest-list {
			position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin-top: 2px;
			max-height: 9rem; overflow-y: auto;
			background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
		}
		.suggest-item { padding: 0.3rem 0.55rem; font-size: 0.85rem; cursor: pointer; }
		.suggest-item:hover { background: var(--chip-bg); }
		.task-save-btn { color: var(--accent); background: var(--chip-bg); }
		.task-counter { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
		.task-counter.limit { color: var(--ir-text); }
		.task-sync-status { color: var(--ir-text); background: var(--ir-bg); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.85rem; margin: 0.4rem 0 0; }
		.task-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
		.task-row.editing { flex-wrap: wrap; }
		.task-row.editing .task-input:first-of-type { flex: 2 1 12rem; }
		.task-text { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
		.task-done .task-text { color: var(--muted); text-decoration: line-through; }
		.task-grip { color: var(--muted); cursor: grab; line-height: 1; flex-shrink: 0; }
		.task-row:active .task-grip { cursor: grabbing; }
		@media (hover: none) { .task-grip { display: none; } }
		.task-move { display: flex; gap: 0.2rem; flex-shrink: 0; }
		.task-move-btn {
			font: inherit; font-size: 0.8rem; line-height: 1; color: var(--accent); background: var(--chip-bg);
			border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.35rem; cursor: pointer; flex-shrink: 0;
		}
		.task-move-btn:disabled { opacity: 0.35; cursor: default; }
		.task-row.dragging { opacity: 0.4; }
		.task-row.drop-before { box-shadow: inset 0 3px 0 0 var(--accent); }
		.task-row.drop-after { box-shadow: inset 0 -3px 0 0 var(--accent); }
		.task-section { margin-top: 0.7rem; }
		.task-section summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }

		@media (min-width: 48.01rem) {
			main { padding: 1.5rem 1rem; }
			.card { padding: 1.2rem 1.4rem; }
			.admin-actions { margin: 0.8rem -1.4rem -1.2rem; padding: 0.6rem 1.4rem; }
			.board { padding: 1.4rem; }
			.board-title { font-size: 1.9rem; }
			.plaques { grid-template-columns: repeat(auto-fill, minmax(14.5rem, 1fr)); gap: 1.1rem; }
		}
		@media (max-width: 40rem) {
			main { padding: 0.6rem; }
			.board { padding: 0.7rem; }
			.board-title { font-size: 1.25rem; }
			.plaques { grid-template-columns: 1fr; gap: 0.7rem; }
		}
	</style>
</head>
<body>
	<div id="quicklinks" aria-label="Quick links"></div>
	<main>
		<header>
			<h1 id="title" class="site-title">
				<span class="site-logo-prefix">my</span>
				<img src="images/bangerslogo.png" alt="Certified Banger" class="site-logo">
			</h1>
			<div class="login" id="login"></div>
		</header>
		<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
		<div id="view"><div class="card"><div class="message">Loading…</div></div></div>
		<div class="status-bar"><div class="status" id="status" role="status" aria-live="polite"></div></div>
	</main>

	<script>
		// melbostads.com/bangers — the Hoot Owl Bangers, year by year. Three
		// tabs: Winners (one plaque per winning song) and Nominees (every song
		// put up, the winner picked out in gold) are read-only text for
		// everyone; Admin exists only when logged in (the same password and
		// token as myFFL and myVST, same localStorage key) and holds the Years
		// card: add a year, add nominees to it, tick the winner. Above it sit the
		// same Tasks and Quick Links cards as vikings.html's Admin tab; the Quick
		// Links card fills the toolbar at the top of the page for everyone.
		//
		// Those two live in the Upstash store behind api/bangers.js
		// (`?resource=tasks` / `?resource=quicklinks`), not in the repo: the
		// toolbar is public to read, tasks are login-only both ways.
		//
		// The list is data/bangers.json, a committed file served by Pages like
		// the rest of the site. Admin's Save POSTs the whole list to
		// api/bangers.js, which commits the file to main (as the myFFL Admin tab
		// does for config/leagues.json); deploy-pages.yml then republishes, so
		// the public page changes a minute or two after the save. This page
		// keeps the saved list in memory meanwhile. Like myFFL, it sends the git
		// blob sha of the exact bytes it loaded, and the server refuses a save
		// made from a stale copy (another device, or a reload before Pages has
		// finished publishing the last save).

		const BANGERS_URL = 'https://shamrock84-github-io.vercel.app/api/bangers';
		const DATA_URL = 'data/bangers.json';
		const LOGIN_URL = 'https://shamrock84-github-io.vercel.app/api/login';
		const AUTH_TOKEN_KEY = 'mflAuthToken';
		const TAB_KEY = 'bangersTab';

		// Deep copy, with every field present so nothing downstream has to guess.
		const copyYears = (list) => list.map((y) => ({
			id: y.id,
			label: y.label || '',
			nominees: (y.nominees || []).map((n) => ({ id: n.id, title: n.title || '', artist: n.artist || '', by: n.by || '', winner: !!n.winner })),
		}));
		// The same list trimmed, as a string: what Save would send, and how
		// "unsaved changes" is told apart from a field someone typed a space into.
		const normalized = (list) => copyYears(list).map((y) => ({
			...y,
			label: y.label.trim(),
			nominees: y.nominees.map((n) => ({ ...n, title: n.title.trim(), artist: n.artist.trim(), by: n.by.trim() })),
		}));
		const normalizedKey = (list) => JSON.stringify(normalized(list));
		const makeId = (prefix) => `${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;

		function el(tag, attrs = {}, children = []) {
			const node = document.createElement(tag);
			for (const [k, v] of Object.entries(attrs)) {
				if (k === 'text') node.textContent = v;
				else node.setAttribute(k, v);
			}
			for (const c of [].concat(children)) if (c) node.appendChild(c);
			return node;
		}

		// Collapsed cards are remembered per device, phone and desktop kept apart
		// (same 600px cutoff and key shape as myffl.html). Absence means expanded.
		const collapseKey = (key) => `bangersCardCollapsed:${window.matchMedia('(max-width: 600px)').matches ? 'mobile' : 'desktop'}:${key}`;
		function isCardCollapsed(key) {
			try { return localStorage.getItem(collapseKey(key)) === '1'; } catch (e) { return false; }
		}
		function setCardCollapsed(key, collapsed) {
			try {
				if (collapsed) localStorage.setItem(collapseKey(key), '1'); else localStorage.removeItem(collapseKey(key));
			} catch (e) { /* the toggle still works for this render */ }
		}
		// The key is fixed per card, not per render: the card is rebuilt on every
		// structural edit and the new node has to remember what the old one was doing.
		function makeCollapsible(card, heading, key) {
			const collapsed = isCardCollapsed(key);
			card.classList.toggle('card-collapsed', collapsed);
			heading.classList.add('collapsible');
			const toggle = el('button', { type: 'button', class: 'card-collapse-toggle', 'aria-expanded': String(!collapsed), title: collapsed ? 'Expand' : 'Collapse', 'aria-label': collapsed ? 'Expand' : 'Collapse', text: '▾' });
			const flip = () => {
				const next = !card.classList.contains('card-collapsed');
				card.classList.toggle('card-collapsed', next);
				toggle.setAttribute('aria-expanded', String(!next));
				toggle.title = next ? 'Expand' : 'Collapse';
				toggle.setAttribute('aria-label', next ? 'Expand' : 'Collapse');
				setCardCollapsed(key, next);
			};
			toggle.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
			heading.appendChild(toggle);
			heading.addEventListener('click', flip);
		}

		// ---- State ---------------------------------------------------------------
		let authToken = null;
		try { authToken = localStorage.getItem(AUTH_TOKEN_KEY) || null; } catch (e) { /* storage blocked: stay logged out */ }
		const isLoggedIn = () => !!authToken;

		let bangers = [];       // what visitors see: the last saved list
		let baseSha = null;     // git blob sha of the file it came from, for the stale check
		let loadState = 'loading';           // loading | ready | failed
		let loadError = '';
		let tab = 'winners';
		// Which years are folded on the Nominees tab, kept on this device like the
		// Admin cards' collapsed state.
		const FOLD_KEY = 'bangersNomineesFolded';
		// id -> true (folded) / false (open). A year with no saved choice follows the
		// default: the most recent year is open and every older one folded.
		let foldState = {};
		try {
			const f = JSON.parse(localStorage.getItem(FOLD_KEY));
			if (f && typeof f === 'object' && !Array.isArray(f)) for (const [id, v] of Object.entries(f)) if (typeof v === 'boolean') foldState[id] = v;
		} catch (e) { /* defaults */ }
		function saveFolded() {
			try { localStorage.setItem(FOLD_KEY, JSON.stringify(foldState)); } catch (e) { /* works for this visit */ }
		}
		const isFolded = (y, index) => (y.id in foldState ? foldState[y.id] : index > 0);
		try { const t = localStorage.getItem(TAB_KEY); if (t === 'nominees' || t === 'admin') tab = t; } catch (e) { /* default tab */ }

		const statusEl = document.getElementById('status');
		function setStatus(text, kind) {
			statusEl.textContent = text || '';
			statusEl.className = `status${kind ? ' ' + kind : ''}`;
		}

		// ---- Login ----------------------------------------------------------------
		async function doLogin(password) {
			const res = await fetch(LOGIN_URL, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ password }),
			});
			const body = await res.json().catch(() => ({}));
			if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
			authToken = body.token;
			try { localStorage.setItem(AUTH_TOKEN_KEY, authToken); } catch (e) { /* works for this visit */ }
		}

		function doLogout() {
			authToken = null;
			draft = null;
			tasks = {};
			tasksState = 'idle';
			try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) { /* ignore */ }
			setStatus('');
			renderAll();
		}

		function expireSession() {
			authToken = null;
			draft = null;
			tasks = {};
			tasksState = 'idle';
			try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) { /* ignore */ }
			renderAll();
			setStatus('Your session expired — log in again to save.', 'error');
		}

		function renderLogin() {
			const wrap = document.getElementById('login');
			wrap.textContent = '';
			if (isLoggedIn()) {
				const out = el('button', { type: 'button', class: 'login-toggle', text: 'Log out' });
				out.addEventListener('click', doLogout);
				wrap.appendChild(out);
				return;
			}
			const toggle = el('button', { type: 'button', class: 'login-toggle', text: 'Log in' });
			const form = el('form', { class: 'login-form hidden' });
			const input = el('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password', 'aria-label': 'Password' });
			const submit = el('button', { type: 'submit', text: 'Log in' });
			const msg = el('span', { class: 'login-status' });
			form.append(input, submit, msg);
			toggle.addEventListener('click', () => {
				toggle.classList.add('hidden');
				form.classList.remove('hidden');
				input.focus();
			});
			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				if (!input.value) return;
				msg.textContent = 'Logging in…';
				submit.disabled = true;
				try {
					await doLogin(input.value);
					renderAll();
				} catch (err) {
					msg.textContent = err.message;
					submit.disabled = false;
				}
			});
			wrap.append(toggle, form);
		}

		// ---- Winners and Nominees -----------------------------------------------
		const message = (text, kind) => el('div', { class: 'card' }, [el('div', { class: `message${kind ? ' ' + kind : ''}`, text })]);

		// One plaque: the year over the nominator over the song. A song title is
		// set between curly quotes, with its artist after.
		function plaque(label, n, mode) {
			const by = n.by.trim();
			const song = el('div', { class: 'plaque-song' });
			const q = el('q', { text: n.title });
			song.appendChild(q);
			if (n.artist.trim()) song.appendChild(document.createTextNode(` by ${n.artist.trim()}`));
			const card = el('div', { class: `plaque${mode === 'winner' ? ' winner' : mode === 'nominee' ? ' nominee' : ''}` }, [
				el('div', { class: 'plaque-year', text: label }),
				el('div', { class: `plaque-by${by ? '' : ' unknown'}`, text: by || 'Unknown' }),
				song,
			]);
			if (mode === 'winner') card.appendChild(el('div', { class: 'plaque-badge', text: '★ Winner' }));
			return card;
		}

		function winnersView() {
			const board = el('div', { class: 'board' }, [el('h2', { class: 'board-title', text: 'Hoot Owl Bangers' })]);
			const grid = el('div', { class: 'plaques' });
			for (const y of bangers) for (const n of y.nominees) if (n.winner) grid.appendChild(plaque(y.label, n, null));
			if (grid.children.length) board.appendChild(grid);
			else board.appendChild(el('div', { class: 'board-empty', text: 'No winners yet.' }));
			return [board];
		}

		// Every nominee, under its year; a winner goes first and is lit in gold.
		function nomineesView() {
			const board = el('div', { class: 'board' }, [el('h2', { class: 'board-title', text: 'Hoot Owl Bangers' })]);
			const years = bangers.filter((y) => y.nominees.length);
			if (!years.length) {
				board.appendChild(el('div', { class: 'board-empty', text: 'No nominees yet.' }));
				return [board];
			}
			const sections = [];
			const allBtn = el('button', { type: 'button', class: 'fold-all' });
			const refreshAll = () => { allBtn.textContent = years.every((y, i) => isFolded(y, i)) ? 'Expand all' : 'Collapse all'; };
			allBtn.addEventListener('click', () => {
				const fold = !years.every((y, i) => isFolded(y, i));
				for (const { y, section, band } of sections) {
					foldState[y.id] = fold;
					section.classList.toggle('folded', fold);
					band.setAttribute('aria-expanded', String(!fold));
				}
				saveFolded();
				refreshAll();
			});
			board.appendChild(el('div', { class: 'board-tools' }, [allBtn]));
			years.forEach((y, index) => {
				const sorted = [...y.nominees].sort((a, b) => Number(b.winner) - Number(a.winner)); // stable: ties keep their order
				const count = `${sorted.length} ${sorted.length === 1 ? 'nominee' : 'nominees'}`;
				const folded = isFolded(y, index);
				const band = el('button', { type: 'button', class: 'year-band', 'aria-expanded': String(!folded) }, [
					el('span', { class: 'year-chev', 'aria-hidden': 'true', text: '\u25B8' }),
					el('span', { text: y.label }),
					el('small', { text: count }),
				]);
				const grid = el('div', { class: 'plaques' });
				for (const n of sorted) grid.appendChild(plaque(y.label, n, n.winner ? 'winner' : 'nominee'));
				const section = el('div', { class: `year-section${folded ? ' folded' : ''}` }, [band, grid]);
				band.addEventListener('click', () => {
					const next = !section.classList.contains('folded');
					section.classList.toggle('folded', next);
					band.setAttribute('aria-expanded', String(!next));
					foldState[y.id] = next;
					saveFolded();
					refreshAll();
				});
				sections.push({ y, section, band });
				board.appendChild(section);
			});
			refreshAll();
			return [board];
		}

		// ---- Admin: the Years card ------------------------------------------------
		// Edits go into `draft` and nothing is saved until Save, like the Quick
		// Links card on myFFL and myVST. Typing never rebuilds the card (that would
		// steal focus); only adding, removing and moving does, and the open/closed
		// state of each year is kept in openYears across those rebuilds.
		let draft = null;
		let adminErrors = [];
		let yearsSaving = false;
		let cardEl = null;
		let focusId = null;       // the field to focus after the next rebuild
		let updateDirty = () => {};
		const openYears = new Set();

		const yearSummary = (y) => {
			const n = y.nominees.length;
			const winners = y.nominees.filter((x) => x.winner).map((x) => x.title.trim() || '(untitled)');
			const winner = winners.length ? `Winner: ${winners.join(', ')}` : 'no winner yet';
			return `${n} ${n === 1 ? 'nominee' : 'nominees'} · ${winner}`;
		};

		function refreshAdmin() {
			if (!cardEl) return;
			const next = buildAdminCard();
			cardEl.replaceWith(next);
			cardEl = next;
			const target = focusId && cardEl.querySelector('[data-focus]');
			focusId = null;
			if (target) { target.focus(); target.scrollIntoView({ block: 'nearest' }); }
		}

		async function saveBangers() {
			adminErrors = [];
			const clean = normalized(draft);
			clean.forEach((y, i) => {
				if (!y.label) adminErrors.push(`Year ${i + 1}: a name is required.`);
				y.nominees.forEach((n, j) => { if (!n.title) adminErrors.push(`${y.label || `Year ${i + 1}`}, nominee ${j + 1}: a song title is required.`); });
			});
			if (adminErrors.length) { refreshAdmin(); return; }
			yearsSaving = true;
			refreshAdmin();
			setStatus('Saving…');
			try {
				const res = await fetch(BANGERS_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
					body: JSON.stringify({ years: clean, baseSha }),
				});
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { yearsSaving = false; expireSession(); return; }
				if (!res.ok) throw new Error((body.details && body.details.join(' ')) || body.error || `HTTP ${res.status}`);
				bangers = copyYears(body.years);
				baseSha = body.sha || null;
				draft = copyYears(bangers);
				setStatus('Saved. The public page updates in a minute or two.', 'ok');
			} catch (err) {
				adminErrors = [`Not saved: ${err.message}`];
				setStatus('');
			}
			yearsSaving = false;
			refreshAdmin();
		}

		function buildNomineeRow(y, n, nIndex) {
			const row = el('div', { class: `nom-row${n.winner ? ' is-winner' : ''}` });
			const field = (cls, label, input) => el('label', { class: `nom-field ${cls}` }, [el('span', { text: label }), input]);
			const text = (key, placeholder, max) => {
				const input = el('input', { type: 'text', class: 'task-input', value: n[key], placeholder, autocomplete: 'off', maxlength: String(max) });
				if (key === 'title' && focusId === n.id) input.setAttribute('data-focus', '');
				input.addEventListener('input', () => { n[key] = input.value; if (key === 'title') refreshYearSummary(y); updateDirty(); });
				return input;
			};
			const box = el('input', { type: 'checkbox', ...(n.winner ? { checked: '' } : {}) });
			box.checked = n.winner;
			box.addEventListener('change', () => {
				n.winner = box.checked;
				row.classList.toggle('is-winner', n.winner);
				refreshYearSummary(y);
				updateDirty();
			});
			const win = el('label', { class: 'nom-win', title: 'Mark this song as a winner for the year' }, [box, el('span', { text: 'Winner' })]);
			const remove = el('button', { type: 'button', class: 'task-icon-btn', title: 'Remove this nominee', 'aria-label': 'Remove this nominee', text: '✕' });
			remove.addEventListener('click', () => { y.nominees.splice(nIndex, 1); refreshAdmin(); });
			row.append(
				win,
				field('nom-song', 'Song', text('title', 'Song title', 120)),
				field('nom-artist', 'Artist', text('artist', 'optional', 120)),
				field('nom-by', 'Nominated by', text('by', 'optional', 60)),
				remove,
			);
			return row;
		}

		// The summary line of each year, kept so typing can update it in place.
		const summaryRefreshers = new Map();
		function refreshYearSummary(y) { const fn = summaryRefreshers.get(y.id); if (fn) fn(); }

		function buildYear(y, i) {
			const det = el('details', { class: 'year-mini' });
			if (openYears.has(y.id)) det.open = true;
			det.addEventListener('toggle', () => { if (det.open) openYears.add(y.id); else openYears.delete(y.id); });
			const sum = el('summary');
			const fill = () => {
				sum.textContent = '';
				sum.append(el('span', { text: y.label.trim() || '(unnamed)' }), el('span', { class: 'year-sub', text: yearSummary(y) }));
			};
			summaryRefreshers.set(y.id, fill);
			fill();

			const name = el('input', { type: 'text', class: 'task-input', value: y.label, placeholder: 'Year name, e.g. 2024', 'aria-label': 'Year name', maxlength: '40', autocomplete: 'off' });
			name.addEventListener('input', () => { y.label = name.value; fill(); updateDirty(); });
			const move = (to) => { openYears.add(y.id); draft.splice(to, 0, draft.splice(i, 1)[0]); refreshAdmin(); };
			const up = el('button', { type: 'button', class: 'task-icon-btn move', title: 'Move up', 'aria-label': 'Move this year up', text: '↑' });
			const down = el('button', { type: 'button', class: 'task-icon-btn move', title: 'Move down', 'aria-label': 'Move this year down', text: '↓' });
			up.disabled = i === 0;
			down.disabled = i === draft.length - 1;
			up.addEventListener('click', () => move(i - 1));
			down.addEventListener('click', () => move(i + 1));
			const removeYear = el('button', { type: 'button', class: 'task-icon-btn', title: 'Remove this year', 'aria-label': 'Remove this year', text: '✕' });
			removeYear.addEventListener('click', () => {
				if (y.nominees.length && !window.confirm(`Remove ${y.label.trim() || 'this year'} and its ${y.nominees.length} ${y.nominees.length === 1 ? 'nominee' : 'nominees'}?`)) return;
				draft.splice(i, 1);
				openYears.delete(y.id);
				refreshAdmin();
			});

			const body = el('div', { class: 'year-body' }, [el('div', { class: 'year-head-row' }, [name, up, down, removeYear])]);
			if (focusId === y.id) name.setAttribute('data-focus', '');
			if (!y.nominees.length) body.appendChild(el('div', { class: 'task-empty', text: 'No nominees yet.' }));
			y.nominees.forEach((n, j) => body.appendChild(buildNomineeRow(y, n, j)));
			const add = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add nominee' });
			add.style.alignSelf = 'flex-start';
			add.addEventListener('click', () => {
				const n = { id: makeId('n'), title: '', artist: '', by: '', winner: false };
				y.nominees.push(n);
				openYears.add(y.id);
				focusId = n.id;
				refreshAdmin();
			});
			body.appendChild(add);
			det.append(sum, body);
			return det;
		}

		function buildAdminCard() {
			if (!draft) draft = copyYears(bangers);
			summaryRefreshers.clear();
			const head = el('h2', { class: 'card-heading', text: `Years (${draft.length})` });
			const card = el('div', { class: 'card' }, [head]);
			makeCollapsible(card, head, 'years');
			if (loadState === 'failed') {
				card.appendChild(el('div', { class: 'message error', text: `Couldn’t load the list (${loadError}), so editing is turned off. Reload to try again.` }));
				return card;
			}

			const newYear = el('input', { type: 'text', class: 'task-input', placeholder: 'New year, e.g. 2024', 'aria-label': 'New year name', maxlength: '40', autocomplete: 'off' });
			const addYear = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add year' });
			const doAdd = () => {
				const label = newYear.value.trim();
				if (!label) { newYear.focus(); return; }
				const y = { id: makeId('y'), label, nominees: [] };
				draft.unshift(y); // newest first, like the Winners and Nominees tabs
				openYears.add(y.id);
				focusId = null;
				refreshAdmin();
			};
			addYear.addEventListener('click', doAdd);
			newYear.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
			card.appendChild(el('div', { class: 'add-year-row' }, [newYear, addYear]));

			draft.forEach((y, i) => card.appendChild(buildYear(y, i)));
			if (!draft.length) card.appendChild(el('div', { class: 'task-empty', text: 'No years yet. Add one above.' }));

			const save = el('button', { type: 'button', class: 'task-add-btn primary', text: yearsSaving ? 'Saving…' : 'Save' });
			save.disabled = yearsSaving;
			save.addEventListener('click', saveBangers);
			const discard = el('button', { type: 'button', class: 'task-add-btn', text: 'Discard changes' });
			const flag = el('span', { class: 'dirty-flag hidden', text: 'Unsaved changes' });
			updateDirty = () => {
				const d = normalizedKey(draft) !== normalizedKey(bangers);
				flag.classList.toggle('hidden', !d);
				discard.disabled = yearsSaving || !d;
			};
			discard.addEventListener('click', () => { draft = copyYears(bangers); adminErrors = []; refreshAdmin(); });
			updateDirty();
			card.appendChild(el('div', { class: 'admin-actions' }, [save, discard, flag]));
			if (adminErrors.length) card.appendChild(el('ul', { class: 'admin-errors' }, adminErrors.map((t) => el('li', { text: t }))));
			card.appendChild(el('div', { class: 'admin-note', text: 'Newest first, in the order shown on the Winners and Nominees tabs (use the arrows to reorder). Tick Winner on every song that won that year; a year can have more than one, or none yet. Nothing is saved until you press Save; the public page updates a minute or two after that.' }));
			return card;
		}

		// ---- Remembered view state ------------------------------------------------
		// Which Tasks sections (a category, or Completed) are open, kept on this
		// device so a rebuilt card reopens as it was left.
		const VIEW_KEY = 'bangersView';
		const taskOpen = {};
		function trackTaskSection(details, key, openByDefault) {
			details.open = key in taskOpen ? !!taskOpen[key] : openByDefault;
			details.addEventListener('toggle', () => {
				if (details.open === (key in taskOpen ? !!taskOpen[key] : openByDefault)) return;
				taskOpen[key] = details.open;
				saveView();
			});
		}
		function saveView() {
			try { localStorage.setItem(VIEW_KEY, JSON.stringify({ taskOpen })); } catch (e) { /* works for this visit */ }
		}
		(function restoreView() {
			let saved = null;
			try { saved = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (e) { /* none */ }
			const open = saved && saved.taskOpen;
			if (open && typeof open === 'object' && !Array.isArray(open)) Object.assign(taskOpen, open);
		})();

		// ---- Quick links ----------------------------------------------------------
		// The header toolbar, same behaviour as myffl.html's: plain, gold or
		// purple entries, and links sharing a Group fold into one dropdown. The
		// list is public (the GET needs no login) and edited from the Admin tab's
		// Quick Links card. With no links the bar is empty and CSS hides it.
		let quickLinks = [];

		function closeQuickLinkCombos() {
			for (const open of document.querySelectorAll('.quicklink-combo.open')) {
				open.classList.remove('open');
				const b = open.querySelector('.quicklink-combo-btn');
				if (b) b.setAttribute('aria-expanded', 'false');
			}
		}
		// Registered once: renderQuickLinks rebuilds the bar and must not stack these.
		document.addEventListener('click', (e) => { if (!e.target.closest || !e.target.closest('.quicklink-combo')) closeQuickLinkCombos(); });
		document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeQuickLinkCombos(); });

		function appendQuickLink(bar, { url, label, style }) {
			const cls = style === 'gold' ? 'quicklink-gold' : style === 'purple' ? 'quicklink-purple' : '';
			const link = el('a', { href: url, target: '_blank', rel: 'noopener', ...(cls ? { class: cls } : {}) });
			if (cls) link.appendChild(el('span', { class: 'quicklink-pill', text: label }));
			else link.textContent = label;
			bar.appendChild(link);
		}

		function renderQuickLinks() {
			const bar = document.getElementById('quicklinks');
			bar.textContent = '';
			const groups = new Map();
			for (const link of quickLinks) {
				if (link.visibility === 'never' || (link.visibility === 'loggedin' && !authToken)) continue;
				const opts = { url: link.url, label: link.nickname, style: link.style };
				const name = typeof link.group === 'string' ? link.group.trim() : '';
				if (!name) { appendQuickLink(bar, opts); continue; }
				const key = name.toLowerCase();
				let menu = groups.get(key);
				if (!menu) {
					const wrap = el('div', { class: 'quicklink-combo' });
					const btn = el('button', {
						type: 'button',
						class: `quicklink-combo-btn${link.style === 'gold' ? ' quicklink-combo-gold' : link.style === 'purple' ? ' quicklink-combo-purple' : ''}`,
						'aria-haspopup': 'true',
						'aria-expanded': 'false',
						text: `${name} ▾`,
					});
					menu = el('div', { class: 'quicklink-combo-menu' });
					btn.addEventListener('click', () => {
						const opening = !wrap.classList.contains('open');
						closeQuickLinkCombos();
						if (!opening) return;
						wrap.classList.add('open');
						btn.setAttribute('aria-expanded', 'true');
						wrap.classList.remove('align-right');
						if (btn.getBoundingClientRect().left + menu.offsetWidth > window.innerWidth - 8) wrap.classList.add('align-right');
					});
					wrap.append(btn, menu);
					bar.appendChild(wrap);
					groups.set(key, menu);
				}
				appendQuickLink(menu, opts);
			}
		}

		// Admin > Quick Links. Edits go into a draft and nothing is saved until
		// Save, like myFFL's card; the whole ordered list is replaced in one write.
		let qlDraft = null;
		let qlErrors = [];
		let qlSaving = false;
		let qlCardEl = null;
		const qlCopy = (list) => list.map((l) => ({ url: l.url || '', nickname: l.nickname || '', style: l.style || '', visibility: l.visibility || '', group: l.group || '' }));
		const qlDirty = () => JSON.stringify(qlCopy(qlDraft)) !== JSON.stringify(qlCopy(quickLinks));

		function refreshQuickLinksCard() {
			if (!qlCardEl) return;
			const next = buildQuickLinksCard();
			qlCardEl.replaceWith(next);
			qlCardEl = next;
		}

		async function saveQuickLinks() {
			qlErrors = [];
			// Same rules as the server, so a mistake is named before the round trip.
			const draft = qlCopy(qlDraft).map((l) => ({ ...l, url: l.url.trim(), nickname: l.nickname.trim(), group: l.group.trim() }));
			draft.forEach((l, i) => {
				if (!l.nickname) qlErrors.push(`Link ${i + 1}: nickname is required.`);
				if (!/^https?:\/\/\S+$/i.test(l.url)) qlErrors.push(`Link ${i + 1}: link must start with http:// or https://.`);
			});
			if (qlErrors.length) { refreshQuickLinksCard(); return; }
			qlSaving = true;
			refreshQuickLinksCard();
			setStatus('Saving…');
			try {
				const res = await fetch(BANGERS_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
					body: JSON.stringify({ resource: 'quicklinks', links: draft }),
				});
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { qlSaving = false; expireSession(); return; }
				if (!res.ok) throw new Error((body.details && body.details.join('; ')) || body.error || `HTTP ${res.status}`);
				quickLinks = body.links || [];
				qlDraft = qlCopy(quickLinks);
				renderQuickLinks();
				setStatus('Saved', 'ok');
			} catch (err) {
				qlErrors = [`Not saved: ${err.message}`];
				setStatus('');
			}
			qlSaving = false;
			refreshQuickLinksCard();
		}

		function buildQuickLinksCard() {
			if (!qlDraft) qlDraft = qlCopy(quickLinks);
			const qlHead = el('h2', { class: 'card-heading', text: `Quick Links (${qlDraft.length})` });
			const card = el('div', { class: 'card' }, [qlHead]);
			makeCollapsible(card, qlHead, 'quicklinks');
			const list = el('div', { class: 'ql-list' });
			const field = (cls, label, input) => el('label', { class: `ql-field ${cls}` }, [el('span', { text: label }), input]);
			const text = (link, key, placeholder, type) => {
				const input = el('input', { type: 'text', class: 'task-input', value: link[key], placeholder, autocomplete: 'off', ...(type === 'url' ? { inputmode: 'url', maxlength: '500' } : { maxlength: '40' }) });
				input.addEventListener('input', () => { link[key] = input.value; });
				return input;
			};
			qlDraft.forEach((link, i) => {
				const style = el('select', { class: 'task-input' }, [['', 'Plain'], ['gold', 'Gold'], ['purple', 'Purple']].map(([v, t]) => {
					const o = el('option', { value: v, text: t });
					if ((link.style || '') === v) o.selected = true;
					return o;
				}));
				style.addEventListener('change', () => { link.style = style.value; });
				const visibility = el('select', { class: 'task-input' }, [['', 'Always'], ['loggedin', 'Logged in'], ['never', 'Never']].map(([v, t]) => {
					const o = el('option', { value: v, text: t });
					if ((link.visibility || '') === v) o.selected = true;
					return o;
				}));
				visibility.addEventListener('change', () => { link.visibility = visibility.value; });
				const move = (to) => { qlDraft.splice(to, 0, qlDraft.splice(i, 1)[0]); refreshQuickLinksCard(); };
				const up = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Move up', 'aria-label': 'Move up', text: '↑' });
				const down = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Move down', 'aria-label': 'Move down', text: '↓' });
				up.disabled = i === 0;
				down.disabled = i === qlDraft.length - 1;
				up.addEventListener('click', () => move(i - 1));
				down.addEventListener('click', () => move(i + 1));
				const remove = el('button', { type: 'button', class: 'task-icon-btn', title: 'Remove this link', 'aria-label': 'Remove this link', text: '✕' });
				remove.addEventListener('click', () => { qlDraft.splice(i, 1); refreshQuickLinksCard(); });
				list.appendChild(el('div', { class: 'ql-row' }, [
					field('ql-link', 'Link', text(link, 'url', 'https://…', 'url')),
					field('ql-nick', 'Nickname', text(link, 'nickname', 'e.g. Playlist')),
					field('ql-group', 'Group', text(link, 'group', 'optional')),
					field('ql-style', 'Style', style),
					field('ql-style', 'Visibility', visibility),
					up, down, remove,
				]));
			});
			if (!qlDraft.length) card.appendChild(el('div', { class: 'task-empty', text: 'No links yet. With none, the toolbar stays hidden.' }));
			card.appendChild(list);
			const add = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add a link' });
			add.addEventListener('click', () => {
				qlDraft.push({ url: '', nickname: '', style: '', visibility: '', group: '' });
				refreshQuickLinksCard();
				const rows = qlCardEl.querySelectorAll('.ql-row');
				const last = rows[rows.length - 1];
				if (last) last.querySelector('input').focus();
			});
			const save = el('button', { type: 'button', class: 'task-add-btn', text: qlSaving ? 'Saving…' : 'Save' });
			save.disabled = qlSaving;
			save.addEventListener('click', saveQuickLinks);
			const discard = el('button', { type: 'button', class: 'task-add-btn', text: 'Discard changes' });
			discard.disabled = qlSaving || !qlDirty();
			discard.addEventListener('click', () => { qlDraft = qlCopy(quickLinks); qlErrors = []; refreshQuickLinksCard(); });
			card.appendChild(el('div', { class: 'ql-actions' }, [add, save, discard]));
			if (qlErrors.length) card.appendChild(el('ul', { class: 'ql-errors' }, qlErrors.map((t) => el('li', { text: t }))));
			card.appendChild(el('div', { class: 'ql-note', text: 'Shown in the header toolbar, in this order. Links sharing a Group name fold into one dropdown with that name. Both a link and a nickname are required.' }));
			return card;
		}

		// ---- Tasks card ---------------------------------------------------------
		// The same list as myffl.html's Tasks card, but its own: stored under its
		// own key by api/vikings.js (`?resource=tasks`, login-gated both ways), not
		// in the plans document. Each change goes up as a per-task patch
		// ({ id: task | null }), queued one at a time so two quick edits can't race
		// each other's read-modify-write on the server. The list is fetched when the
		// Admin tab opens and whenever the page returns to the foreground, so a task
		// added on another device shows up without a reload.

		const MAX_TASK_TEXT_LENGTH = 2000;
		const TASK_COUNTER_THRESHOLD = MAX_TASK_TEXT_LENGTH - 400;
		let tasks = {};
		let tasksState = 'idle'; // idle | loading | ready | error
		let tasksError = '';
		let tasksSyncError = '';
		let editingTaskId = null;
		let tasksCardEl = null;
		let pushChain = Promise.resolve();
		// Changes the server hasn't confirmed yet, id -> task | null. They stay
		// here until a save succeeds (so a failed save is retried with the next
		// one, never silently dropped), and the list is not refetched over them.
		const unsaved = {};
		let saving = false;

		// First load shows "Loading…"; later calls (opening the tab, coming back to
		// the page) refetch quietly, because another device may have changed the
		// list since this page loaded. Never over unsaved edits, an edit in
		// progress or text typed into the add row.
		async function loadTasks() {
			if (tasksState === 'loading') return;
			const quiet = tasksState === 'ready';
			if (quiet) {
				const typing = tasksCardEl && [...tasksCardEl.querySelectorAll('.task-input')].some((i) => i.value);
				if (saving || Object.keys(unsaved).length || editingTaskId || typing) return;
			} else {
				tasksState = 'loading';
			}
			try {
				const res = await fetch(`${BANGERS_URL}?resource=tasks`, { headers: { Authorization: `Bearer ${authToken}` }, cache: 'no-store' });
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { tasksState = 'idle'; expireSession(); return; }
				if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
				// A save or edit may have started while this was in flight; don't clobber it.
				if (quiet && (saving || Object.keys(unsaved).length || editingTaskId)) return;
				tasks = body.tasks || {};
				tasksState = 'ready';
			} catch (err) {
				if (quiet) return; // a failed background refresh keeps what is on screen
				tasksState = 'error';
				tasksError = err.message;
			}
			refreshTasksCard();
		}

		// Send every unconfirmed change. One at a time, so two quick edits can't
		// race each other's read-modify-write on the server.
		function flushTasks() {
			pushChain = pushChain.then(async () => {
				const sent = { ...unsaved };
				if (!Object.keys(sent).length) return;
				saving = true;
				try {
					const res = await fetch(BANGERS_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
						body: JSON.stringify({ resource: 'tasks', tasks: sent }),
					});
					const body = await res.json().catch(() => ({}));
					if (res.status === 401) { saving = false; expireSession(); return; }
					if (!res.ok) throw new Error((body.details && body.details.join('; ')) || body.error || `HTTP ${res.status}`);
					// Keep anything edited again while this was in flight.
					for (const id of Object.keys(sent)) if (unsaved[id] === sent[id]) delete unsaved[id];
					tasksSyncError = '';
				} catch (err) {
					tasksSyncError = err.message;
				}
				saving = false;
				refreshTasksCard();
			});
		}

		// Apply a { id: task | null } change locally, show it, and send it.
		function commitTasks(changed) {
			for (const [id, t] of Object.entries(changed)) {
				if (t === null) delete tasks[id]; else tasks[id] = t;
			}
			Object.assign(unsaved, changed);
			refreshTasksCard();
			flushTasks();
		}

		const makeTaskId = () => `t${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
		const taskOrderValue = (t) => (typeof t.order === 'number' ? t.order : t.createdAt);
		function openTaskIdsByCategory(category) {
			return Object.entries(tasks)
				.filter(([, t]) => !t.done && t.category === category)
				.sort((a, b) => taskOrderValue(a[1]) - taskOrderValue(b[1]))
				.map(([id]) => id);
		}
		// Stamps `order` on every task in the category, not just the one moved: a
		// task nobody has reordered has no `order` and would sort back to the front.
		function moveTaskWithinCategory(category, from, to) {
			const ids = openTaskIdsByCategory(category);
			if (from === to || from < 0 || from >= ids.length || to < 0 || to >= ids.length) return;
			const [moved] = ids.splice(from, 1);
			ids.splice(to, 0, moved);
			const changed = {};
			ids.forEach((id, order) => { changed[id] = { ...tasks[id], order }; });
			commitTasks(changed);
		}
		function addTask(text, category) {
			const now = Date.now();
			commitTasks({ [makeTaskId()]: { text, category, done: false, order: now, createdAt: now, completedAt: null } });
		}
		const patchTask = (id, updates) => { if (tasks[id]) commitTasks({ [id]: { ...tasks[id], ...updates } }); };

		// A hand-rolled stand-in for <datalist>, which iOS handles badly.
		function attachCategorySuggestions(input, getCategories) {
			const wrap = el('div', { class: 'suggest-wrap' });
			wrap.appendChild(input);
			const list = el('div', { class: 'suggest-list hidden' });
			wrap.appendChild(list);
			function render() {
				const q = input.value.trim().toLowerCase();
				const matches = getCategories().filter((c) => c.toLowerCase().includes(q) && c.toLowerCase() !== q);
				list.textContent = '';
				if (!matches.length) { list.classList.add('hidden'); return; }
				for (const c of matches) {
					const item = el('div', { class: 'suggest-item', text: c });
					// mousedown, not click: it lands before the input's blur hides the list.
					item.addEventListener('mousedown', (e) => {
						e.preventDefault();
						input.value = c;
						list.classList.add('hidden');
						input.focus();
					});
					list.appendChild(item);
				}
				list.classList.remove('hidden');
			}
			input.addEventListener('focus', render);
			input.addEventListener('input', render);
			input.addEventListener('blur', () => list.classList.add('hidden'));
			return wrap;
		}

		// Only shown once text nears the limit; most tasks are a line.
		function attachTaskCharCounter(input) {
			const counter = el('span', { class: 'task-counter hidden' });
			const update = () => {
				const len = input.value.length;
				counter.classList.toggle('hidden', len < TASK_COUNTER_THRESHOLD);
				counter.classList.toggle('limit', len >= MAX_TASK_TEXT_LENGTH);
				counter.textContent = `${len}/${MAX_TASK_TEXT_LENGTH}`;
			};
			input.addEventListener('input', update);
			update();
			return counter;
		}

		// Bug first, then the manager's fixed buckets, anything new alphabetically,
		// Backlog last.
		const categoryTier = (key) => (key === 'Bug' ? 0 : key === 'Manual Task' ? 2 : key === 'Site Enhancement' ? 3 : key === 'Backlog' ? 5 : 4);

		function refreshTasksCard() {
			if (!tasksCardEl || !tasksCardEl.isConnected) return;
			const next = buildTasksCard();
			tasksCardEl.replaceWith(next);
			tasksCardEl = next;
		}

		function buildTasksCard() {
			const card = el('div', { class: 'card' });
			if (tasksState !== 'ready') {
				const loadingHead = el('h2', { class: 'card-heading', text: 'Tasks' });
				card.appendChild(loadingHead);
				makeCollapsible(card, loadingHead, 'tasks');
				card.appendChild(el('div', { class: `message${tasksState === 'error' ? ' error' : ''}`, text: tasksState === 'error' ? `Couldn’t load tasks (${tasksError}). Reload to try again.` : 'Loading…' }));
				return card;
			}
			const entries = Object.entries(tasks);
			const tasksHead = el('h2', { class: 'card-heading', text: `Tasks (${entries.filter(([, t]) => !t.done).length})` });
			card.appendChild(tasksHead);
			makeCollapsible(card, tasksHead, 'tasks');
			// Stays up until the unsaved changes go through; Retry resends them.
			if (tasksSyncError && Object.keys(unsaved).length) {
				const warn = el('div', { class: 'task-sync-status' }, [document.createTextNode(`⚠ Not saved yet (${tasksSyncError}). `)]);
				const retry = el('button', { type: 'button', class: 'task-add-btn', text: 'Retry' });
				retry.addEventListener('click', flushTasks);
				warn.appendChild(retry);
				card.appendChild(warn);
			}

			const categories = [...new Set(entries.map(([, t]) => t.category).filter(Boolean))].sort();
			const addRow = el('div', { class: 'task-add-row' });
			const textInput = el('input', { type: 'text', class: 'task-input', placeholder: 'New task…', autocomplete: 'off', maxlength: String(MAX_TASK_TEXT_LENGTH) });
			const categoryInput = el('input', { type: 'text', class: 'task-input', placeholder: 'Category', autocomplete: 'off' });
			const addBtn = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add' });
			// Both fields are required, so every open task sits under a real category.
			const submit = () => {
				const text = textInput.value.trim();
				const category = categoryInput.value.trim();
				if (!text || !category) return;
				addTask(text, category);
			};
			addBtn.addEventListener('click', submit);
			textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
			addRow.append(textInput, attachTaskCharCounter(textInput), attachCategorySuggestions(categoryInput, () => categories), addBtn);
			card.appendChild(addRow);

			if (!entries.length) {
				card.appendChild(el('div', { class: 'task-empty', text: 'No tasks yet.' }));
				return card;
			}

			let dragFrom = null;
			const buildRow = (id, t, group) => {
				if (editingTaskId === id) return buildEditRow(id, t, categories);
				const row = el('div', { class: `task-row${t.done ? ' task-done' : ''}` });
				const { key, index, groupEntries } = group || {};
				if (group) {
					row.appendChild(el('span', { class: 'task-grip', title: 'Drag to reorder', 'aria-hidden': 'true', text: '⠿' }));
					row.draggable = true;
				}
				const box = el('input', { type: 'checkbox', 'aria-label': 'Done' });
				box.checked = t.done;
				box.addEventListener('change', () => patchTask(id, { done: box.checked, completedAt: box.checked ? Date.now() : null }));
				row.appendChild(box);
				// Done tasks lose their category's section, so the category rides along.
				const label = t.done && t.category ? `${t.text} (${t.category})` : t.text;
				const textSpan = el('span', { class: 'task-text', text: label, role: 'button', tabindex: '0', title: 'Click to edit' });
				const edit = () => { editingTaskId = id; refreshTasksCard(); };
				textSpan.addEventListener('click', edit);
				textSpan.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); edit(); } });
				row.appendChild(textSpan);
				if (group) {
					// Touch screens fire no drag events, so these are the only way to reorder there.
					const up = el('button', { type: 'button', class: 'task-move-btn', title: 'Move up', 'aria-label': 'Move up', text: '↑' });
					const down = el('button', { type: 'button', class: 'task-move-btn', title: 'Move down', 'aria-label': 'Move down', text: '↓' });
					up.disabled = index === 0;
					down.disabled = index === groupEntries.length - 1;
					up.addEventListener('click', () => moveTaskWithinCategory(key, index, index - 1));
					down.addEventListener('click', () => moveTaskWithinCategory(key, index, index + 1));
					row.appendChild(el('div', { class: 'task-move' }, [up, down]));
				}
				const remove = el('button', { type: 'button', class: 'task-icon-btn', title: 'Delete task', 'aria-label': 'Delete task', text: '✕' });
				remove.addEventListener('click', () => commitTasks({ [id]: null }));
				row.appendChild(remove);

				if (group) {
					const after = (e) => { const r = row.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; };
					const clear = () => row.classList.remove('drop-before', 'drop-after');
					row.addEventListener('dragstart', (e) => {
						dragFrom = { key, index };
						e.dataTransfer.effectAllowed = 'move';
						e.dataTransfer.setData('text/plain', String(index));
						setTimeout(() => row.classList.add('dragging'), 0);
					});
					row.addEventListener('dragend', () => { dragFrom = null; row.classList.remove('dragging'); clear(); });
					row.addEventListener('dragover', (e) => {
						if (!dragFrom || dragFrom.key !== key || dragFrom.index === index) return;
						e.preventDefault();
						e.dataTransfer.dropEffect = 'move';
						row.classList.toggle('drop-after', after(e));
						row.classList.toggle('drop-before', !after(e));
					});
					row.addEventListener('dragleave', clear);
					row.addEventListener('drop', (e) => {
						if (!dragFrom || dragFrom.key !== key) return;
						e.preventDefault();
						const from = dragFrom.index;
						dragFrom = null;
						clear();
						// Insertion point in the pre-removal array, less the hole the dragged row leaves.
						let insertAt = index + (after(e) ? 1 : 0);
						if (from < insertAt) insertAt--;
						moveTaskWithinCategory(key, from, insertAt);
					});
				}
				return row;
			};

			const open = entries.filter(([, t]) => !t.done);
			const done = entries.filter(([, t]) => t.done).sort((a, b) => (b[1].completedAt || 0) - (a[1].completedAt || 0));
			const keys = [...new Set(open.map(([, t]) => t.category))].sort((a, b) => categoryTier(a) - categoryTier(b) || (categoryTier(a) === 4 ? a.localeCompare(b) : 0));
			if (open.length) {
				for (const key of keys) {
					const groupEntries = openTaskIdsByCategory(key).map((id) => [id, tasks[id]]);
					const details = el('details', { class: 'task-section' }, [el('summary', { text: `${key} (${groupEntries.length})` })]);
					trackTaskSection(details, `cat:${key}`, true);
					groupEntries.forEach(([id, t], index) => details.appendChild(buildRow(id, t, { key, index, groupEntries })));
					card.appendChild(details);
				}
			} else {
				card.appendChild(el('div', { class: 'task-empty', text: 'Nothing open — nice.' }));
			}
			if (done.length) {
				const details = el('details', { class: 'task-section' }, [el('summary', { text: `Completed (${done.length})` })]);
				trackTaskSection(details, 'completed', false);
				for (const [id, t] of done) details.appendChild(buildRow(id, t));
				card.appendChild(details);
			}
			return card;
		}

		// Edit a task in place: text and category are the only fields that can't
		// change any other way. Moving category sends the task to the end of the
		// new one, since an index from the old category means nothing there.
		function buildEditRow(id, t, categories) {
			const row = el('div', { class: 'task-row editing' });
			const text = el('input', { type: 'text', class: 'task-input', value: t.text, autocomplete: 'off', maxlength: String(MAX_TASK_TEXT_LENGTH), 'aria-label': 'Task' });
			const category = el('input', { type: 'text', class: 'task-input', value: t.category || '', placeholder: 'Category', autocomplete: 'off', 'aria-label': 'Category' });
			const save = () => {
				const nextText = text.value.trim();
				const nextCategory = category.value.trim();
				if (!nextText || !nextCategory) return;
				editingTaskId = null;
				const updates = { text: nextText, category: nextCategory };
				if (nextCategory !== (t.category || '')) updates.order = Date.now();
				patchTask(id, updates);
			};
			const cancel = () => { editingTaskId = null; refreshTasksCard(); };
			const keydown = (e) => { if (e.key === 'Enter') save(); else if (e.key === 'Escape') cancel(); };
			text.addEventListener('keydown', keydown);
			category.addEventListener('keydown', keydown);
			const saveBtn = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Save', 'aria-label': 'Save', text: '✓' });
			saveBtn.addEventListener('click', save);
			const cancelBtn = el('button', { type: 'button', class: 'task-icon-btn', title: 'Cancel', 'aria-label': 'Cancel', text: '✕' });
			cancelBtn.addEventListener('click', cancel);
			row.append(text, attachTaskCharCounter(text), attachCategorySuggestions(category, () => categories), saveBtn, cancelBtn);
			setTimeout(() => { text.focus(); text.setSelectionRange(text.value.length, text.value.length); }, 0);
			return row;
		}

		function adminView() {
			tasksCardEl = buildTasksCard();
			loadTasks(); // first load, or a quiet refresh when the tab is reopened
			qlDraft = null; // a fresh copy of what is saved each time the tab opens
			qlErrors = [];
			qlCardEl = buildQuickLinksCard();
			draft = null;
			adminErrors = [];
			cardEl = buildAdminCard();
			return [tasksCardEl, qlCardEl, cardEl];
		}

		// Coming back to the page (switching apps on a phone or iPad, or restoring
		// it from the back/forward cache) refreshes the task list too.
		function refreshTasksIfVisible() {
			if (tab === 'admin' && isLoggedIn() && document.visibilityState === 'visible') loadTasks();
		}
		document.addEventListener('visibilitychange', refreshTasksIfVisible);
		window.addEventListener('pageshow', refreshTasksIfVisible);

		// ---- Shell ---------------------------------------------------------------
		function setTab(next) {
			tab = next;
			try { localStorage.setItem(TAB_KEY, tab); } catch (e) { /* the tab still switches */ }
			setStatus('');
			editingTaskId = null;
			renderAll();
		}

		function renderTabs() {
			const nav = document.getElementById('tabs');
			nav.textContent = '';
			// The Admin tab exists only while logged in; logging out removes it.
			const tabs = [['winners', 'Winners'], ['nominees', 'Nominees'], ...(isLoggedIn() ? [['admin', 'Admin']] : [])];
			for (const [id, label] of tabs) {
				const btn = el('button', { type: 'button', class: `tab-btn${tab === id ? ' active' : ''}`, role: 'tab', 'aria-selected': String(tab === id), text: label });
				btn.addEventListener('click', () => setTab(id));
				nav.appendChild(btn);
			}
		}

		function renderAll() {
			if (tab === 'admin' && !isLoggedIn()) tab = 'winners';
			renderLogin();
			renderTabs();
			renderQuickLinks();
			const view = document.getElementById('view');
			view.textContent = '';
			cardEl = null;
			tasksCardEl = null;
			qlCardEl = null;
			if (loadState === 'loading') { view.appendChild(message('Loading…')); return; }
			if (loadState === 'failed' && tab !== 'admin') { view.appendChild(message(`Couldn’t load the list (${loadError}). Reload to try again.`, 'error')); return; }
			const cards = tab === 'nominees' ? nomineesView() : tab === 'admin' ? adminView() : winnersView();
			cards.forEach((c) => view.appendChild(c));
		}

		// git's object id for a file: SHA-1 over "blob <length>\0" + the bytes, the
		// same value GitHub reports as the file's `sha`. Needs a secure context;
		// without one it rejects and the save simply goes unchecked.
		async function gitBlobSha(bytes) {
			const header = new TextEncoder().encode(`blob ${bytes.length}\0`);
			const buf = new Uint8Array(header.length + bytes.length);
			buf.set(header);
			buf.set(bytes, header.length);
			const digest = await crypto.subtle.digest('SHA-1', buf);
			return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, '0')).join('');
		}

		async function load() {
			renderLogin();
			renderTabs();
			// Not awaited with the list: the bar fills in when it arrives, and a failure
			// just leaves it hidden.
			fetch(`${BANGERS_URL}?resource=quicklinks`, { cache: 'no-store' })
				.then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
				.then((body) => { quickLinks = Array.isArray(body.links) ? body.links : []; renderQuickLinks(); })
				.catch(() => { /* no toolbar */ });
			try {
				// Cache-bust: Pages' CDN will happily serve the pre-save copy otherwise.
				const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				// Hashed from the raw bytes, not a re-serialization, so it matches the
				// sha GitHub holds for the file Pages served.
				const bytes = new Uint8Array(await res.arrayBuffer());
				const doc = JSON.parse(new TextDecoder().decode(bytes));
				if (!doc || !Array.isArray(doc.years)) throw new Error('unexpected file contents');
				bangers = copyYears(doc.years);
				baseSha = await gitBlobSha(bytes).catch(() => null);
				loadState = 'ready';
			} catch (err) {
				loadState = 'failed';
				loadError = err.message;
			}
			renderAll();
		}

		load();
	</script>
</body>
</html>
