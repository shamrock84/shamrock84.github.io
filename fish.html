<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>myFish</title>
	<script src="/site-switcher.js" data-site="fish"></script>
	<meta property="og:title" content="myFish"/>
	<meta property="og:image" content="https://melbostads.com/images/fishlogo_large.png"/>
	<link rel="apple-touch-icon" href="/fishicons/apple-touch-icon.png?v=1">
	<link rel="icon" type="image/png" sizes="32x32" href="/fishicons/favicon-32x32.png?v=1">
	<link rel="icon" type="image/png" sizes="16x16" href="/fishicons/favicon-16x16.png?v=1">
	<link rel="shortcut icon" href="/fishicons/favicon.ico?v=1">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F2683">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#140f1e">
	<style>
		/* Same palette and shell as bangers.html, vikings.html and myffl.html
		   (purple = primary accent, gold = "notable"); only the tokens this page
		   uses are copied. Keep them in step if myffl.html's palette changes.
		   famlogo.svg is black line art on a transparent background so the
		   dark-mode invert filter works on it: keep it black. */
		:root {
			--bg: #f5f3f9;
			--card-bg: #ffffff;
			--text: #1b1425;
			--muted: #6b6478;
			--border: #e3daf0;
			--accent: #4F2683;
			--on-accent: #ffffff; /* text on a solid --accent fill: --accent turns light in dark mode */
			--chip-bg: #ede3f8;
			--ir-text: #991b1b;
			--ir-bg: #fef2f2;
			--gain-text: #166534;
			--gold: #FFC62F;
			--gold-chip-bg: #fff3d1;
			--gold-chip-text: #7a5c00;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #140f1e;
				--card-bg: #1e1730;
				--text: #ede9f5;
				--muted: #a79bc2;
				--border: #362a4a;
				--accent: #b48ee0;
				--on-accent: #140f1e;
				--chip-bg: #2c2145;
				--ir-text: #fca5a5;
				--ir-bg: #341313;
				--gain-text: #86efac;
				--gold-chip-bg: #3d2e05;
				--gold-chip-text: #f0c33e;
			}
		}
		body::before {
			content: '';
			display: block;
			height: 4px;
			background: linear-gradient(90deg, var(--accent), var(--gold));
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}
		.hidden { display: none !important; }
		main { max-width: 62rem; margin: 0 auto; padding: 1.2rem 1rem; }
		/* Centered masthead, same treatment as myffl.html's .site-logo. */
		header {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 0.4rem;
			text-align: center;
			margin-bottom: 0.8rem;
		}
		h1 { margin: 0; }
		/* "X fish caught over Y trips since Z and counting", under the logo (same
		   look as vikings.html's and bangers.html's .subtitle, including the
		   wide-screen bump in the min-width block below). Hidden until the trips
		   have loaded. */
		.subtitle { font-size: 0.8rem; color: var(--muted); }
		.site-title { display: flex; align-items: center; justify-content: center; }
		.site-logo-prefix {
			font-family: Georgia, 'Times New Roman', serif;
			font-weight: 400;
			font-size: 1.85rem;
			line-height: 1;
			color: var(--text);
			margin-right: 0.15rem;
			margin-top: 0.75rem;
		}
		.site-logo { height: 64px; width: auto; display: block; }
		@media (prefers-color-scheme: dark) { .site-logo { filter: invert(1); } }

		/* Login control: same look as vikings.html's. */
		.login { font-size: 0.8rem; }
		.login-toggle { background: none; border: none; color: var(--accent); font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 0; }
		.login-toggle:hover { text-decoration: underline; }
		.login-form { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; justify-content: center; }
		.login-form input[type="password"] {
			flex: 1; min-width: 8rem; padding: 0.4rem 0.6rem; border-radius: 6px;
			border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
			font-size: 16px; /* under 16px, iOS Safari zooms in on focus */
		}
		.login-form button[type="submit"] {
			border: 1px solid var(--accent); background: var(--accent); color: #fff;
			padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
		}
		.login-form button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
		.login-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.login-status { font-size: 0.78rem; color: var(--ir-text); }

		/* Pill tabs, same look as myffl.html's .tab-btn. */
		.tabs { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
		.tab-btn {
			border: 1px solid var(--border); background: var(--card-bg); color: var(--muted);
			padding: 0.45rem 1rem; border-radius: 999px; font: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer;
		}
		.tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
		.tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

		.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; }
		.card-heading { margin: 0 0 0.6rem; font-size: 1.05rem; color: var(--accent); }
		.card-heading.collapsible { position: relative; padding-right: 2.3rem; cursor: pointer; }
		.card-collapse-toggle {
			position: absolute; top: 50%; right: 0; transform: translateY(-50%);
			background: none; border: none; padding: 0.15rem 0.3rem; margin: 0;
			color: var(--muted); cursor: pointer; font-size: 1.5rem; line-height: 1; transition: transform 0.15s ease;
		}
		.card-collapse-toggle:hover { color: var(--text); }
		.card.card-collapsed .card-collapse-toggle { transform: translateY(-50%) rotate(-90deg); }
		.card.card-collapsed > *:not(.card-heading) { display: none; }
		.card.card-collapsed > .card-heading { margin-bottom: 0; }
		.message { padding: 1rem 0.2rem; color: var(--muted); }
		.message.error { color: var(--ir-text); }
		.status-bar { position: sticky; bottom: 0; background: var(--bg); padding: 0.2rem 0; }
		.status { min-height: 1.2em; margin-top: 0.4rem; font-size: 0.8rem; color: var(--muted); text-align: center; }
		.status.error { color: var(--ir-text); }
		.status.ok { color: var(--gain-text); }

		/* ---- Admin ------------------------------------------------------------ */
		#view > * + * { margin-top: 0.8rem; }
		.task-input {
			font: inherit;
			font-size: 16px;
			padding: 0.35rem 0.55rem;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: var(--card-bg);
			color: inherit;
			min-width: 0;
		}
		.task-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.task-add-btn {
			font: inherit; font-size: 0.85rem; color: var(--accent); background: transparent;
			border: 1px solid var(--accent); border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer;
		}
		.task-add-btn:disabled { opacity: 0.5; cursor: default; }
		.task-icon-btn {
			font: inherit; font-size: 0.8rem; line-height: 1; color: var(--ir-text); background: var(--ir-bg);
			border: 1px solid var(--border); border-radius: 4px; padding: 0.3rem 0.4rem; cursor: pointer; flex-shrink: 0;
		}
		.task-icon-btn:disabled { opacity: 0.35; cursor: default; }
		.task-empty { color: var(--muted); font-size: 0.85rem; margin: 0.4rem 0; }

		/* ---- Quick links toolbar and Tasks card: ported from vikings.html; keep in step. ---- */
		/* Header quick-link toolbar: the same look as myffl.html's. Empty means
		   no bar at all (:empty also drops the padding and border). */
		#quicklinks {
			position: sticky; top: 0; z-index: 30;
			display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.4rem;
			background: var(--card-bg);
		}
		#quicklinks:not(:empty) { padding: 0.4rem 1rem; border-bottom: 1px solid var(--border); }
		#quicklinks a { color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600; padding: 0.15rem 0; white-space: nowrap; }
		#quicklinks a:hover, #quicklinks a:focus-visible { color: var(--accent); }
		#quicklinks a::after { content: ''; display: inline-block; width: 1px; height: 0.7rem; background: var(--border); margin-left: 0.4rem; vertical-align: middle; }
		#quicklinks a:last-child::after { display: none; }
		#quicklinks a.quicklink-gold, #quicklinks a.quicklink-purple { padding: 0; }
		#quicklinks a.quicklink-gold .quicklink-pill { background: var(--gold-chip-bg); color: var(--gold-chip-text); }
		#quicklinks a.quicklink-purple .quicklink-pill { background: var(--chip-bg); color: var(--accent); }
		#quicklinks a.quicklink-gold .quicklink-pill, #quicklinks a.quicklink-purple .quicklink-pill { display: inline-block; border-radius: 999px; padding: 0.15rem 0.55rem; }
		#quicklinks a.quicklink-gold:hover .quicklink-pill, #quicklinks a.quicklink-gold:focus-visible .quicklink-pill,
		#quicklinks a.quicklink-purple:hover .quicklink-pill, #quicklinks a.quicklink-purple:focus-visible .quicklink-pill { color: var(--text); }
		/* A group: one button whose menu holds its links. */
		#quicklinks .quicklink-combo { position: relative; display: inline-flex; align-items: center; }
		#quicklinks .quicklink-combo:not(:last-child)::after { content: ''; display: inline-block; width: 1px; height: 0.7rem; background: var(--border); margin-left: 0.4rem; }
		#quicklinks .quicklink-combo-btn { font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 0.15rem 0.55rem; cursor: pointer; }
		#quicklinks .quicklink-combo-btn.quicklink-combo-gold { color: var(--gold-chip-text); background: var(--gold-chip-bg); }
		#quicklinks .quicklink-combo-btn.quicklink-combo-purple { color: var(--accent); background: var(--chip-bg); }
		#quicklinks .quicklink-combo-btn:hover, #quicklinks .quicklink-combo-btn:focus-visible, #quicklinks .quicklink-combo.open .quicklink-combo-btn { color: var(--text); }
		#quicklinks .quicklink-combo-menu { display: none; position: absolute; top: calc(100% + 0.35rem); left: 0; z-index: 31; flex-direction: column; align-items: flex-start; gap: 0.35rem; background: transparent; padding: 0; }
		#quicklinks .quicklink-combo.align-right .quicklink-combo-menu { left: auto; right: 0; }
		#quicklinks .quicklink-combo.open .quicklink-combo-menu { display: flex; }
		#quicklinks .quicklink-combo-menu a::after { display: none; }
		/* Admin > Quick Links rows. */
		.ql-list { display: flex; flex-direction: column; gap: 0.7rem; }
		.ql-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.4rem 0.5rem; padding: 0.6rem; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; background: var(--bg); }
		.ql-field { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
		.ql-field span { font-size: 0.7rem; color: var(--muted); }
		.ql-link { flex: 2 1 14rem; }
		.ql-nick, .ql-group { flex: 1 1 7rem; }
		.ql-style { flex: 0 0 auto; }
		.ql-row .task-input { width: 100%; min-width: 0; box-sizing: border-box; }
		.ql-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.8rem; }
		.ql-errors { color: var(--ir-text); font-size: 0.85rem; margin: 0.5rem 0 0; padding-left: 1.1rem; }
		.ql-note { color: var(--muted); font-size: 0.8rem; margin: 0.6rem 0 0; }
		/* Tasks card: the same look as myffl.html's, under its own names. */
		.task-add-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.6rem 0 0.8rem; }
		.task-add-row .task-input:first-child { flex: 2 1 12rem; }
		.task-add-row .suggest-wrap { flex: 1 1 8rem; }
		.suggest-wrap { position: relative; min-width: 0; }
		.suggest-wrap .task-input { width: 100%; }
		.suggest-list {
			position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin-top: 2px;
			max-height: 9rem; overflow-y: auto;
			background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
		}
		.suggest-item { padding: 0.3rem 0.55rem; font-size: 0.85rem; cursor: pointer; }
		.suggest-item:hover { background: var(--chip-bg); }
		.task-save-btn { color: var(--accent); background: var(--chip-bg); }
		.task-counter { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
		.task-counter.limit { color: var(--ir-text); }
		.task-sync-status { color: var(--ir-text); background: var(--ir-bg); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.85rem; margin: 0.4rem 0 0; }
		.task-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
		.task-row.editing { flex-wrap: wrap; }
		.task-row.editing .task-input:first-of-type { flex: 2 1 12rem; }
		.task-text { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
		.task-done .task-text { color: var(--muted); text-decoration: line-through; }
		.task-grip { color: var(--muted); cursor: grab; line-height: 1; flex-shrink: 0; }
		.task-row:active .task-grip { cursor: grabbing; }
		@media (hover: none) { .task-grip { display: none; } }
		.task-move { display: flex; gap: 0.2rem; flex-shrink: 0; }
		.task-move-btn {
			font: inherit; font-size: 0.8rem; line-height: 1; color: var(--accent); background: var(--chip-bg);
			border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.35rem; cursor: pointer; flex-shrink: 0;
		}
		.task-move-btn:disabled { opacity: 0.35; cursor: default; }
		.task-row.dragging { opacity: 0.4; }
		.task-row.drop-before { box-shadow: inset 0 3px 0 0 var(--accent); }
		.task-row.drop-after { box-shadow: inset 0 -3px 0 0 var(--accent); }
		.task-section { margin-top: 0.7rem; }
		.task-section summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }

		@media (min-width: 48.01rem) {
			main { padding: 1.5rem 1rem; }
			.subtitle { font-size: 0.95rem; }
			.card { padding: 1.2rem 1.4rem; }
		}
		@media (max-width: 40rem) {
			main { padding: 0.6rem; }
		}

		/* ---- Ice Fishing and Trips ---------------------------------------------- */
		.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 0.5rem; margin-bottom: 0.8rem; }
		.tile { padding: 0.55rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
		.tile-value { font-size: 1.35rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
		.tile-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
		.tile-sub { font-size: 0.78rem; color: var(--muted); }
		.fish-scroll { overflow-x: auto; }
		.fish-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
		.fish-table th, .fish-table td { padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
		.fish-table th:first-child, .fish-table td:first-child { text-align: left; }
		.fish-table thead th { color: var(--muted); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
		.fish-table thead tr:first-child th { border-bottom: 0; color: var(--text); }
		.fish-table thead th[colspan] { text-align: center; }
		.fish-table .fish-split { border-left: 1px solid var(--border); }
		.fish-table th.sortable { cursor: pointer; user-select: none; -webkit-user-select: none; }
		.fish-table th.sortable:hover, .fish-table th.sortable:focus-visible { color: var(--text); }
		.fish-table th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
		.sort-arrow { font-size: 0.85em; opacity: 0.85; }
		.fish-table tbody tr:last-child td, .fish-table tfoot td { border-bottom: 0; }
		.fish-table tfoot td { font-weight: 700; border-top: 2px solid var(--border); }
		.fish-table .fish-total { font-weight: 700; }
		.fish-dim { color: var(--muted); }
		.fish-days { margin: 0.7rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.88rem; }
		.fish-days li { padding-left: 0.6rem; border-left: 3px solid var(--accent); }
		.fish-days b { color: var(--accent); }
		.fish-badge { display: inline-block; margin-right: 0.4rem; padding: 0 0.4rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; line-height: 1.5; vertical-align: 1px; }
		.fish-first { background: var(--chip-bg); color: var(--accent); }
		.fish-big { background: var(--gold-chip-bg); color: var(--gold-chip-text); }
		.fish-chip { display: inline-block; margin-left: 0.4rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--gold-chip-bg); color: var(--gold-chip-text); font-size: 0.7rem; font-weight: 700; vertical-align: middle; }
		.fish-where { color: var(--muted); font-weight: 400; }
		.fish-note { color: var(--muted); font-size: 0.8rem; margin: 0.6rem 0 0; }
		/* Trips editor */
		.trip-edit { border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; background: var(--bg); padding: 0.4rem 0.7rem; margin-bottom: 0.6rem; }
		.trip-edit > summary { cursor: pointer; font-weight: 700; padding: 0.2rem 0; }
		.trip-fields { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
		.trip-fields .ql-field { flex: 1 1 8rem; }
		.trip-fields .task-input, .trip-day .task-input { width: 100%; }
		/* iOS/iPadOS Safari draws a native date control that ignores the page's input
		   sizing: taller than its neighbours, value centred, and wider than its flex
		   cell, so it spills over the next field. Dropping the native appearance and
		   pinning the width and height to a text input's puts it back in line; the
		   picker still opens on tap. */
		.task-input[type="date"] {
			-webkit-appearance: none;
			appearance: none;
			display: block;
			width: 100%;
			max-width: 100%;
			min-width: 0;
			line-height: 1.25;
			height: calc(1.25em + 0.7rem + 2px);
			text-align: left;
			color-scheme: light dark; /* the calendar icon follows the page's light/dark mode */
		}
		.task-input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.25em; margin: 0; padding: 0; }
		.task-input[type="date"]::-webkit-datetime-edit { padding: 0; }
		.trip-sub { margin: 0.8rem 0 0.3rem; font-size: 0.85rem; font-weight: 700; color: var(--accent); }
		.trip-day { padding: 0.5rem; margin-bottom: 0.4rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); }
		.trip-day-title { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.3rem; }
		.trip-species { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.4rem; }
		.trip-species .task-input { width: 8rem; }
		.trip-species .trip-count { width: 4.5rem; }
		.trip-grid { border-collapse: collapse; font-size: 0.85rem; }
		.trip-grid th { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-align: left; padding: 0 0.3rem; }
		.trip-grid td { padding: 0.15rem 0.3rem; }
		.trip-grid .task-input { width: 4.2rem; }
		.trip-grid .trip-name { width: 8rem; }
		.trip-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; align-items: center; }
		/* Photos tab: thumbnail grid plus a simple full-size viewer (copied from index.html). */
		.photo-controls { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
		.photo-select { max-width: 100%; padding: 0.25rem 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text); font: inherit; font-size: 0.8rem; }
		.photo-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 0.4rem; }
		.photo-thumb { padding: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--card-bg); cursor: pointer; aspect-ratio: 1; }
		.photo-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
		.photo-thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.photo-meta { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; color: var(--muted); font-size: 0.8rem; }
		.photo-meta-msg { color: var(--ir-text); }
		.photo-pager { display: inline-flex; align-items: center; gap: 0.5rem; }
		.photo-pager-btn { padding: 0.2rem 0.65rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text); font: inherit; font-size: 0.8rem; cursor: pointer; }
		.photo-pager-btn:disabled { opacity: 0.4; cursor: default; }
		.photo-pager-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.photo-refresh-btn { margin-left: auto; padding: 0.2rem 0.65rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text); font: inherit; font-size: 0.8rem; cursor: pointer; }
		.photo-refresh-btn:disabled { opacity: 0.5; cursor: default; }
		.photo-refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.photo-viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; padding: 1rem; background: rgba(0, 0, 0, 0.88); }
		.photo-viewer img { max-width: 100%; max-height: calc(100vh - 6rem); object-fit: contain; }
		.photo-viewer-caption { color: #fff; font-size: 0.85rem; text-align: center; }
		.photo-viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 2.6rem; height: 3.4rem; border: 0; border-radius: 8px; background: rgba(255, 255, 255, 0.14); color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; }
		.photo-viewer-nav:disabled { opacity: 0.25; cursor: default; }
		.photo-viewer-prev { left: 0.6rem; }
		.photo-viewer-next { right: 0.6rem; }
		.photo-viewer-close { position: absolute; top: 0.6rem; right: 0.8rem; background: none; border: 0; color: #fff; font-size: 1.8rem; line-height: 1; cursor: pointer; }
		.lure-table th, .lure-table td { text-align: left; white-space: normal; }
		.lure-table th:first-child, .lure-table td:first-child { white-space: nowrap; }
		.lure-name { font-weight: 700; }
		.lure-name-cell { display: flex; align-items: center; gap: 0.5rem; }
		.lure-thumb { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; background: var(--card-bg); }
		.lure-photo-edit { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin: 0.5rem 0; }
		.lure-photo-edit input[type=file] { max-width: 100%; font-size: 0.8rem; }
		.lure-notes { min-width: 10rem; color: var(--muted); }
		/* On a phone the six columns don't fit, so each lure becomes its own block: name and
		   photo on top, then label: value lines (empty ones left out). No sideways scroll. */
		@media (max-width: 40rem) {
			.lure-table, .lure-table tbody, .lure-table tr, .lure-table td { display: block; width: 100%; }
			.lure-table thead { display: none; }
			.lure-table tr { padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
			.lure-table tbody tr:last-child { border-bottom: 0; }
			.lure-table td { padding: 0.1rem 0; border: 0; white-space: normal; }
			.lure-table td:empty { display: none; }
			.lure-table td[data-label]::before { content: attr(data-label) ': '; color: var(--muted); font-size: 0.8rem; }
			.lure-table td.lure-name { margin-bottom: 0.2rem; font-size: 1rem; }
			.lure-table .lure-notes { min-width: 0; }
		}
	</style>
</head>
<body>
	<div id="quicklinks" aria-label="Quick links"></div>
	<main>
		<header>
			<h1 id="title" class="site-title">
				<span class="site-logo-prefix">my</span>
				<img src="images/fishlogo.png" alt="Fish — Ice Fishing" class="site-logo">
			</h1>
			<div class="subtitle hidden" id="fish-count"></div>
			<div class="login" id="login"></div>
		</header>
		<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
		<div id="view"></div>
		<div class="status-bar"><div class="status" id="status" role="status" aria-live="polite"></div></div>
	</main>

	<script>
		// melbostads.com/fish — myFish, the Melbostad ice-fishing page. Tabs:
		// Ice Fishing (everyone: all-time stats and one card per trip), Photos (its own
		// shared iCloud album), Equipment (the favourite Lures card) and, only
		// while logged in (same password and token as myFFL, myVST, myBangers and
		// myFAM, same localStorage key), Admin: the same Tasks and Quick Links cards
		// as the other small sites, plus a Trips card that edits what the Ice
		// Fishing tab shows and a Lures card that edits the Equipment tab. The Quick Links card fills the toolbar at the top for
		// everyone.
		//
		// Everything is stored in the Upstash store behind api/fam.js, not in the
		// repo: `?resource=fishtrips` (public GET, login-gated POST, answers with the
		// seed trips from api/_lib/fishtrips.mjs until the first Save),
		// `fishlures` (same rules), `fishquicklinks` (public GET) and `fishtasks` (login-gated both ways).
		// fam.js hosts them because the Hobby cap of 12 functions is spent. The
		// Quick Links and Tasks code below is copied from index.html, so a fix to
		// one belongs in both.

		const API_URL = 'https://shamrock84-github-io.vercel.app/api/fam';
		const LOGIN_URL = 'https://shamrock84-github-io.vercel.app/api/login';
		const AUTH_TOKEN_KEY = 'mflAuthToken';
		const TAB_KEY = 'fishTab';

		function el(tag, attrs = {}, children = []) {
			const node = document.createElement(tag);
			for (const [k, v] of Object.entries(attrs)) {
				if (k === 'text') node.textContent = v;
				else node.setAttribute(k, v);
			}
			for (const c of [].concat(children)) if (c) node.appendChild(c);
			return node;
		}

		// Collapsed cards are remembered per device, phone and desktop kept apart
		// (same 600px cutoff and key shape as myffl.html). Absence means expanded.
		const collapseKey = (key) => `fishCardCollapsed:${window.matchMedia('(max-width: 600px)').matches ? 'mobile' : 'desktop'}:${key}`;
		function isCardCollapsed(key) {
			try { return localStorage.getItem(collapseKey(key)) === '1'; } catch (e) { return false; }
		}
		function setCardCollapsed(key, collapsed) {
			try {
				if (collapsed) localStorage.setItem(collapseKey(key), '1'); else localStorage.removeItem(collapseKey(key));
			} catch (e) { /* the toggle still works for this render */ }
		}
		// The key is fixed per card, not per render: the card is rebuilt on every
		// structural edit and the new node has to remember what the old one was doing.
		function makeCollapsible(card, heading, key) {
			const collapsed = isCardCollapsed(key);
			card.classList.toggle('card-collapsed', collapsed);
			heading.classList.add('collapsible');
			const toggle = el('button', { type: 'button', class: 'card-collapse-toggle', 'aria-expanded': String(!collapsed), title: collapsed ? 'Expand' : 'Collapse', 'aria-label': collapsed ? 'Expand' : 'Collapse', text: '▾' });
			const flip = () => {
				const next = !card.classList.contains('card-collapsed');
				card.classList.toggle('card-collapsed', next);
				toggle.setAttribute('aria-expanded', String(!next));
				toggle.title = next ? 'Expand' : 'Collapse';
				toggle.setAttribute('aria-label', next ? 'Expand' : 'Collapse');
				setCardCollapsed(key, next);
			};
			toggle.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
			heading.appendChild(toggle);
			heading.addEventListener('click', flip);
		}

		// ---- State ---------------------------------------------------------------
		let authToken = null;
		try { authToken = localStorage.getItem(AUTH_TOKEN_KEY) || null; } catch (e) { /* storage blocked: stay logged out */ }
		const isLoggedIn = () => !!authToken;

		const TABS = [['fishing', 'Ice Fishing', false], ['photos', 'Photos', false], ['equipment', 'Equipment', false], ['admin', 'Admin', true]];
		let tab = 'fishing';
		try { const saved = localStorage.getItem(TAB_KEY); if (TABS.some(([id]) => id === saved)) tab = saved; } catch (e) { /* default tab */ }

		const statusEl = document.getElementById('status');
		function setStatus(text, kind) {
			statusEl.textContent = text || '';
			statusEl.className = `status${kind ? ' ' + kind : ''}`;
		}

		// ---- Login ----------------------------------------------------------------
		async function doLogin(password) {
			const res = await fetch(LOGIN_URL, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ password }),
			});
			const body = await res.json().catch(() => ({}));
			if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
			authToken = body.token;
			try { localStorage.setItem(AUTH_TOKEN_KEY, authToken); } catch (e) { /* works for this visit */ }
		}

		// Both ways out of a session forget the tasks as well: they are private,
		// so they must not stay in memory once the token is gone.
		function forgetSession() {
			authToken = null;
			tasks = {};
			tasksState = 'idle';
			try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) { /* ignore */ }
		}

		function doLogout() {
			forgetSession();
			setStatus('');
			renderAll();
		}

		function expireSession() {
			forgetSession();
			renderAll();
			setStatus('Your session expired — log in again to save.', 'error');
		}

		function renderLogin() {
			const wrap = document.getElementById('login');
			wrap.textContent = '';
			if (isLoggedIn()) {
				const out = el('button', { type: 'button', class: 'login-toggle', text: 'Log out' });
				out.addEventListener('click', doLogout);
				wrap.appendChild(out);
				return;
			}
			const toggle = el('button', { type: 'button', class: 'login-toggle', text: 'Log in' });
			const form = el('form', { class: 'login-form hidden' });
			const input = el('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password', 'aria-label': 'Password' });
			const submit = el('button', { type: 'submit', text: 'Log in' });
			const msg = el('span', { class: 'login-status' });
			form.append(input, submit, msg);
			toggle.addEventListener('click', () => {
				toggle.classList.add('hidden');
				form.classList.remove('hidden');
				input.focus();
			});
			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				if (!input.value) return;
				msg.textContent = 'Logging in…';
				submit.disabled = true;
				try {
					await doLogin(input.value);
					renderAll();
				} catch (err) {
					msg.textContent = err.message;
					submit.disabled = false;
				}
			});
			wrap.append(toggle, form);
		}

		// ---- Remembered view state ------------------------------------------------
		// Which Tasks sections (a category, or Completed) are open, kept on this
		// device so a rebuilt card reopens as it was left.
		const VIEW_KEY = 'fishView';
		const taskOpen = {};
		function trackTaskSection(details, key, openByDefault) {
			details.open = key in taskOpen ? !!taskOpen[key] : openByDefault;
			details.addEventListener('toggle', () => {
				if (details.open === (key in taskOpen ? !!taskOpen[key] : openByDefault)) return;
				taskOpen[key] = details.open;
				saveView();
			});
		}
		function saveView() {
			try { localStorage.setItem(VIEW_KEY, JSON.stringify({ taskOpen })); } catch (e) { /* works for this visit */ }
		}
		(function restoreView() {
			let saved = null;
			try { saved = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (e) { /* none */ }
			const open = saved && saved.taskOpen;
			if (open && typeof open === 'object' && !Array.isArray(open)) Object.assign(taskOpen, open);
		})();

		// ---- Quick links ----------------------------------------------------------
		// The header toolbar, same behaviour as myffl.html's: plain, gold or
		// purple entries, and links sharing a Group fold into one dropdown. The
		// list is public (the GET needs no login) and edited from the Admin tab's
		// Quick Links card. With no links the bar is empty and CSS hides it.
		let quickLinks = [];

		function closeQuickLinkCombos() {
			for (const open of document.querySelectorAll('.quicklink-combo.open')) {
				open.classList.remove('open');
				const b = open.querySelector('.quicklink-combo-btn');
				if (b) b.setAttribute('aria-expanded', 'false');
			}
		}
		// Registered once: renderQuickLinks rebuilds the bar and must not stack these.
		document.addEventListener('click', (e) => { if (!e.target.closest || !e.target.closest('.quicklink-combo')) closeQuickLinkCombos(); });
		document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeQuickLinkCombos(); });

		function appendQuickLink(bar, { url, label, style }) {
			const cls = style === 'gold' ? 'quicklink-gold' : style === 'purple' ? 'quicklink-purple' : '';
			const link = el('a', { href: url, target: '_blank', rel: 'noopener', ...(cls ? { class: cls } : {}) });
			if (cls) link.appendChild(el('span', { class: 'quicklink-pill', text: label }));
			else link.textContent = label;
			bar.appendChild(link);
		}

		function renderQuickLinks() {
			const bar = document.getElementById('quicklinks');
			bar.textContent = '';
			const groups = new Map();
			for (const link of quickLinks) {
				if (link.visibility === 'never' || (link.visibility === 'loggedin' && !authToken)) continue;
				const opts = { url: link.url, label: link.nickname, style: link.style };
				const name = typeof link.group === 'string' ? link.group.trim() : '';
				if (!name) { appendQuickLink(bar, opts); continue; }
				const key = name.toLowerCase();
				let menu = groups.get(key);
				if (!menu) {
					const wrap = el('div', { class: 'quicklink-combo' });
					const btn = el('button', {
						type: 'button',
						class: `quicklink-combo-btn${link.style === 'gold' ? ' quicklink-combo-gold' : link.style === 'purple' ? ' quicklink-combo-purple' : ''}`,
						'aria-haspopup': 'true',
						'aria-expanded': 'false',
						text: `${name} ▾`,
					});
					menu = el('div', { class: 'quicklink-combo-menu' });
					btn.addEventListener('click', () => {
						const opening = !wrap.classList.contains('open');
						closeQuickLinkCombos();
						if (!opening) return;
						wrap.classList.add('open');
						btn.setAttribute('aria-expanded', 'true');
						wrap.classList.remove('align-right');
						if (btn.getBoundingClientRect().left + menu.offsetWidth > window.innerWidth - 8) wrap.classList.add('align-right');
					});
					wrap.append(btn, menu);
					bar.appendChild(wrap);
					groups.set(key, menu);
				}
				appendQuickLink(menu, opts);
			}
		}

		// Admin > Quick Links. Edits go into a draft and nothing is saved until
		// Save, like myFFL's card; the whole ordered list is replaced in one write.
		let qlDraft = null;
		let qlErrors = [];
		let qlSaving = false;
		let qlCardEl = null;
		const qlCopy = (list) => list.map((l) => ({ url: l.url || '', nickname: l.nickname || '', style: l.style || '', visibility: l.visibility || '', group: l.group || '' }));
		const qlDirty = () => JSON.stringify(qlCopy(qlDraft)) !== JSON.stringify(qlCopy(quickLinks));

		function refreshQuickLinksCard() {
			if (!qlCardEl) return;
			const next = buildQuickLinksCard();
			qlCardEl.replaceWith(next);
			qlCardEl = next;
		}

		async function saveQuickLinks() {
			qlErrors = [];
			// Same rules as the server, so a mistake is named before the round trip.
			const draft = qlCopy(qlDraft).map((l) => ({ ...l, url: l.url.trim(), nickname: l.nickname.trim(), group: l.group.trim() }));
			draft.forEach((l, i) => {
				if (!l.nickname) qlErrors.push(`Link ${i + 1}: nickname is required.`);
				if (!/^https?:\/\/\S+$/i.test(l.url)) qlErrors.push(`Link ${i + 1}: link must start with http:// or https://.`);
			});
			if (qlErrors.length) { refreshQuickLinksCard(); return; }
			qlSaving = true;
			refreshQuickLinksCard();
			setStatus('Saving…');
			try {
				const res = await fetch(API_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
					body: JSON.stringify({ resource: 'fishquicklinks', links: draft }),
				});
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { qlSaving = false; expireSession(); return; }
				if (!res.ok) throw new Error((body.details && body.details.join('; ')) || body.error || `HTTP ${res.status}`);
				quickLinks = body.links || [];
				qlDraft = qlCopy(quickLinks);
				renderQuickLinks();
				setStatus('Saved', 'ok');
			} catch (err) {
				qlErrors = [`Not saved: ${err.message}`];
				setStatus('');
			}
			qlSaving = false;
			refreshQuickLinksCard();
		}

		function buildQuickLinksCard() {
			if (!qlDraft) qlDraft = qlCopy(quickLinks);
			const qlHead = el('h2', { class: 'card-heading', text: `Quick Links (${qlDraft.length})` });
			const card = el('div', { class: 'card' }, [qlHead]);
			makeCollapsible(card, qlHead, 'quicklinks');
			const list = el('div', { class: 'ql-list' });
			const field = (cls, label, input) => el('label', { class: `ql-field ${cls}` }, [el('span', { text: label }), input]);
			const text = (link, key, placeholder, type) => {
				const input = el('input', { type: 'text', class: 'task-input', value: link[key], placeholder, autocomplete: 'off', ...(type === 'url' ? { inputmode: 'url', maxlength: '500' } : { maxlength: '40' }) });
				input.addEventListener('input', () => { link[key] = input.value; });
				return input;
			};
			qlDraft.forEach((link, i) => {
				const style = el('select', { class: 'task-input' }, [['', 'Plain'], ['gold', 'Gold'], ['purple', 'Purple']].map(([v, t]) => {
					const o = el('option', { value: v, text: t });
					if ((link.style || '') === v) o.selected = true;
					return o;
				}));
				style.addEventListener('change', () => { link.style = style.value; });
				const visibility = el('select', { class: 'task-input' }, [['', 'Always'], ['loggedin', 'Logged in'], ['never', 'Never']].map(([v, t]) => {
					const o = el('option', { value: v, text: t });
					if ((link.visibility || '') === v) o.selected = true;
					return o;
				}));
				visibility.addEventListener('change', () => { link.visibility = visibility.value; });
				const move = (to) => { qlDraft.splice(to, 0, qlDraft.splice(i, 1)[0]); refreshQuickLinksCard(); };
				const up = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Move up', 'aria-label': 'Move up', text: '↑' });
				const down = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Move down', 'aria-label': 'Move down', text: '↓' });
				up.disabled = i === 0;
				down.disabled = i === qlDraft.length - 1;
				up.addEventListener('click', () => move(i - 1));
				down.addEventListener('click', () => move(i + 1));
				const remove = el('button', { type: 'button', class: 'task-icon-btn', title: 'Remove this link', 'aria-label': 'Remove this link', text: '✕' });
				remove.addEventListener('click', () => { qlDraft.splice(i, 1); refreshQuickLinksCard(); });
				list.appendChild(el('div', { class: 'ql-row' }, [
					field('ql-link', 'Link', text(link, 'url', 'https://…', 'url')),
					field('ql-nick', 'Nickname', text(link, 'nickname', 'e.g. Playlist')),
					field('ql-group', 'Group', text(link, 'group', 'optional')),
					field('ql-style', 'Style', style),
					field('ql-style', 'Visibility', visibility),
					up, down, remove,
				]));
			});
			if (!qlDraft.length) card.appendChild(el('div', { class: 'task-empty', text: 'No links yet. With none, the toolbar stays hidden.' }));
			card.appendChild(list);
			const add = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add a link' });
			add.addEventListener('click', () => {
				qlDraft.push({ url: '', nickname: '', style: '', visibility: '', group: '' });
				refreshQuickLinksCard();
				const rows = qlCardEl.querySelectorAll('.ql-row');
				const last = rows[rows.length - 1];
				if (last) last.querySelector('input').focus();
			});
			const save = el('button', { type: 'button', class: 'task-add-btn', text: qlSaving ? 'Saving…' : 'Save' });
			save.disabled = qlSaving;
			save.addEventListener('click', saveQuickLinks);
			const discard = el('button', { type: 'button', class: 'task-add-btn', text: 'Discard changes' });
			discard.disabled = qlSaving || !qlDirty();
			discard.addEventListener('click', () => { qlDraft = qlCopy(quickLinks); qlErrors = []; refreshQuickLinksCard(); });
			card.appendChild(el('div', { class: 'ql-actions' }, [add, save, discard]));
			if (qlErrors.length) card.appendChild(el('ul', { class: 'ql-errors' }, qlErrors.map((t) => el('li', { text: t }))));
			card.appendChild(el('div', { class: 'ql-note', text: 'Shown in the header toolbar, in this order. Links sharing a Group name fold into one dropdown with that name. Both a link and a nickname are required.' }));
			return card;
		}

		// ---- Tasks card ---------------------------------------------------------
		// The same list as myffl.html's Tasks card, but its own: stored under its
		// own key by api/fam.js (`?resource=fishtasks`, login-gated both ways), not
		// in the plans document. Each change goes up as a per-task patch
		// ({ id: task | null }), queued one at a time so two quick edits can't race
		// each other's read-modify-write on the server. The list is fetched when the
		// Admin tab opens and whenever the page returns to the foreground, so a task
		// added on another device shows up without a reload.

		const MAX_TASK_TEXT_LENGTH = 2000;
		const TASK_COUNTER_THRESHOLD = MAX_TASK_TEXT_LENGTH - 400;
		let tasks = {};
		let tasksState = 'idle'; // idle | loading | ready | error
		let tasksError = '';
		let tasksSyncError = '';
		let editingTaskId = null;
		let tasksCardEl = null;
		let pushChain = Promise.resolve();
		// Changes the server hasn't confirmed yet, id -> task | null. They stay
		// here until a save succeeds (so a failed save is retried with the next
		// one, never silently dropped), and the list is not refetched over them.
		const unsaved = {};
		let saving = false;

		// First load shows "Loading…"; later calls (opening the tab, coming back to
		// the page) refetch quietly, because another device may have changed the
		// list since this page loaded. Never over unsaved edits, an edit in
		// progress or text typed into the add row.
		async function loadTasks() {
			if (tasksState === 'loading') return;
			const quiet = tasksState === 'ready';
			if (quiet) {
				const typing = tasksCardEl && [...tasksCardEl.querySelectorAll('.task-input')].some((i) => i.value);
				if (saving || Object.keys(unsaved).length || editingTaskId || typing) return;
			} else {
				tasksState = 'loading';
			}
			try {
				const res = await fetch(`${API_URL}?resource=fishtasks`, { headers: { Authorization: `Bearer ${authToken}` }, cache: 'no-store' });
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { tasksState = 'idle'; expireSession(); return; }
				if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
				// A save or edit may have started while this was in flight; don't clobber it.
				if (quiet && (saving || Object.keys(unsaved).length || editingTaskId)) return;
				tasks = body.tasks || {};
				tasksState = 'ready';
			} catch (err) {
				if (quiet) return; // a failed background refresh keeps what is on screen
				tasksState = 'error';
				tasksError = err.message;
			}
			refreshTasksCard();
		}

		// Send every unconfirmed change. One at a time, so two quick edits can't
		// race each other's read-modify-write on the server.
		function flushTasks() {
			pushChain = pushChain.then(async () => {
				const sent = { ...unsaved };
				if (!Object.keys(sent).length) return;
				saving = true;
				try {
					const res = await fetch(API_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
						body: JSON.stringify({ resource: 'fishtasks', tasks: sent }),
					});
					const body = await res.json().catch(() => ({}));
					if (res.status === 401) { saving = false; expireSession(); return; }
					if (!res.ok) throw new Error((body.details && body.details.join('; ')) || body.error || `HTTP ${res.status}`);
					// Keep anything edited again while this was in flight.
					for (const id of Object.keys(sent)) if (unsaved[id] === sent[id]) delete unsaved[id];
					tasksSyncError = '';
				} catch (err) {
					tasksSyncError = err.message;
				}
				saving = false;
				refreshTasksCard();
			});
		}

		// Apply a { id: task | null } change locally, show it, and send it.
		function commitTasks(changed) {
			for (const [id, t] of Object.entries(changed)) {
				if (t === null) delete tasks[id]; else tasks[id] = t;
			}
			Object.assign(unsaved, changed);
			refreshTasksCard();
			flushTasks();
		}

		const makeTaskId = () => `t${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
		const taskOrderValue = (t) => (typeof t.order === 'number' ? t.order : t.createdAt);
		function openTaskIdsByCategory(category) {
			return Object.entries(tasks)
				.filter(([, t]) => !t.done && t.category === category)
				.sort((a, b) => taskOrderValue(a[1]) - taskOrderValue(b[1]))
				.map(([id]) => id);
		}
		// Stamps `order` on every task in the category, not just the one moved: a
		// task nobody has reordered has no `order` and would sort back to the front.
		function moveTaskWithinCategory(category, from, to) {
			const ids = openTaskIdsByCategory(category);
			if (from === to || from < 0 || from >= ids.length || to < 0 || to >= ids.length) return;
			const [moved] = ids.splice(from, 1);
			ids.splice(to, 0, moved);
			const changed = {};
			ids.forEach((id, order) => { changed[id] = { ...tasks[id], order }; });
			commitTasks(changed);
		}
		function addTask(text, category) {
			const now = Date.now();
			commitTasks({ [makeTaskId()]: { text, category, done: false, order: now, createdAt: now, completedAt: null } });
		}
		const patchTask = (id, updates) => { if (tasks[id]) commitTasks({ [id]: { ...tasks[id], ...updates } }); };

		// A hand-rolled stand-in for <datalist>, which iOS handles badly.
		function attachCategorySuggestions(input, getCategories) {
			const wrap = el('div', { class: 'suggest-wrap' });
			wrap.appendChild(input);
			const list = el('div', { class: 'suggest-list hidden' });
			wrap.appendChild(list);
			function render() {
				const q = input.value.trim().toLowerCase();
				const matches = getCategories().filter((c) => c.toLowerCase().includes(q) && c.toLowerCase() !== q);
				list.textContent = '';
				if (!matches.length) { list.classList.add('hidden'); return; }
				for (const c of matches) {
					const item = el('div', { class: 'suggest-item', text: c });
					// mousedown, not click: it lands before the input's blur hides the list.
					item.addEventListener('mousedown', (e) => {
						e.preventDefault();
						input.value = c;
						list.classList.add('hidden');
						input.focus();
					});
					list.appendChild(item);
				}
				list.classList.remove('hidden');
			}
			input.addEventListener('focus', render);
			input.addEventListener('input', render);
			input.addEventListener('blur', () => list.classList.add('hidden'));
			return wrap;
		}

		// Only shown once text nears the limit; most tasks are a line.
		function attachTaskCharCounter(input) {
			const counter = el('span', { class: 'task-counter hidden' });
			const update = () => {
				const len = input.value.length;
				counter.classList.toggle('hidden', len < TASK_COUNTER_THRESHOLD);
				counter.classList.toggle('limit', len >= MAX_TASK_TEXT_LENGTH);
				counter.textContent = `${len}/${MAX_TASK_TEXT_LENGTH}`;
			};
			input.addEventListener('input', update);
			update();
			return counter;
		}

		// Bug first, then the manager's fixed buckets, anything new alphabetically,
		// Backlog last.
		const categoryTier = (key) => (key === 'Bug' ? 0 : key === 'Manual Task' ? 2 : key === 'Site Enhancement' ? 3 : key === 'Backlog' ? 5 : 4);

		function refreshTasksCard() {
			if (!tasksCardEl || !tasksCardEl.isConnected) return;
			const next = buildTasksCard();
			tasksCardEl.replaceWith(next);
			tasksCardEl = next;
		}

		function buildTasksCard() {
			const card = el('div', { class: 'card' });
			if (tasksState !== 'ready') {
				const loadingHead = el('h2', { class: 'card-heading', text: 'Tasks' });
				card.appendChild(loadingHead);
				makeCollapsible(card, loadingHead, 'tasks');
				card.appendChild(el('div', { class: `message${tasksState === 'error' ? ' error' : ''}`, text: tasksState === 'error' ? `Couldn’t load tasks (${tasksError}). Reload to try again.` : 'Loading…' }));
				return card;
			}
			const entries = Object.entries(tasks);
			const tasksHead = el('h2', { class: 'card-heading', text: `Tasks (${entries.filter(([, t]) => !t.done).length})` });
			card.appendChild(tasksHead);
			makeCollapsible(card, tasksHead, 'tasks');
			// Stays up until the unsaved changes go through; Retry resends them.
			if (tasksSyncError && Object.keys(unsaved).length) {
				const warn = el('div', { class: 'task-sync-status' }, [document.createTextNode(`⚠ Not saved yet (${tasksSyncError}). `)]);
				const retry = el('button', { type: 'button', class: 'task-add-btn', text: 'Retry' });
				retry.addEventListener('click', flushTasks);
				warn.appendChild(retry);
				card.appendChild(warn);
			}

			const categories = [...new Set(entries.map(([, t]) => t.category).filter(Boolean))].sort();
			const addRow = el('div', { class: 'task-add-row' });
			const textInput = el('input', { type: 'text', class: 'task-input', placeholder: 'New task…', autocomplete: 'off', maxlength: String(MAX_TASK_TEXT_LENGTH) });
			const categoryInput = el('input', { type: 'text', class: 'task-input', placeholder: 'Category', autocomplete: 'off' });
			const addBtn = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add' });
			// Both fields are required, so every open task sits under a real category.
			const submit = () => {
				const text = textInput.value.trim();
				const category = categoryInput.value.trim();
				if (!text || !category) return;
				addTask(text, category);
			};
			addBtn.addEventListener('click', submit);
			textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
			addRow.append(textInput, attachTaskCharCounter(textInput), attachCategorySuggestions(categoryInput, () => categories), addBtn);
			card.appendChild(addRow);

			if (!entries.length) {
				card.appendChild(el('div', { class: 'task-empty', text: 'No tasks yet.' }));
				return card;
			}

			let dragFrom = null;
			const buildRow = (id, t, group) => {
				if (editingTaskId === id) return buildEditRow(id, t, categories);
				const row = el('div', { class: `task-row${t.done ? ' task-done' : ''}` });
				const { key, index, groupEntries } = group || {};
				if (group) {
					row.appendChild(el('span', { class: 'task-grip', title: 'Drag to reorder', 'aria-hidden': 'true', text: '⠿' }));
					row.draggable = true;
				}
				const box = el('input', { type: 'checkbox', 'aria-label': 'Done' });
				box.checked = t.done;
				box.addEventListener('change', () => patchTask(id, { done: box.checked, completedAt: box.checked ? Date.now() : null }));
				row.appendChild(box);
				// Done tasks lose their category's section, so the category rides along.
				const label = t.done && t.category ? `${t.text} (${t.category})` : t.text;
				const textSpan = el('span', { class: 'task-text', text: label, role: 'button', tabindex: '0', title: 'Click to edit' });
				const edit = () => { editingTaskId = id; refreshTasksCard(); };
				textSpan.addEventListener('click', edit);
				textSpan.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); edit(); } });
				row.appendChild(textSpan);
				if (group) {
					// Touch screens fire no drag events, so these are the only way to reorder there.
					const up = el('button', { type: 'button', class: 'task-move-btn', title: 'Move up', 'aria-label': 'Move up', text: '↑' });
					const down = el('button', { type: 'button', class: 'task-move-btn', title: 'Move down', 'aria-label': 'Move down', text: '↓' });
					up.disabled = index === 0;
					down.disabled = index === groupEntries.length - 1;
					up.addEventListener('click', () => moveTaskWithinCategory(key, index, index - 1));
					down.addEventListener('click', () => moveTaskWithinCategory(key, index, index + 1));
					row.appendChild(el('div', { class: 'task-move' }, [up, down]));
				}
				const remove = el('button', { type: 'button', class: 'task-icon-btn', title: 'Delete task', 'aria-label': 'Delete task', text: '✕' });
				remove.addEventListener('click', () => commitTasks({ [id]: null }));
				row.appendChild(remove);

				if (group) {
					const after = (e) => { const r = row.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; };
					const clear = () => row.classList.remove('drop-before', 'drop-after');
					row.addEventListener('dragstart', (e) => {
						dragFrom = { key, index };
						e.dataTransfer.effectAllowed = 'move';
						e.dataTransfer.setData('text/plain', String(index));
						setTimeout(() => row.classList.add('dragging'), 0);
					});
					row.addEventListener('dragend', () => { dragFrom = null; row.classList.remove('dragging'); clear(); });
					row.addEventListener('dragover', (e) => {
						if (!dragFrom || dragFrom.key !== key || dragFrom.index === index) return;
						e.preventDefault();
						e.dataTransfer.dropEffect = 'move';
						row.classList.toggle('drop-after', after(e));
						row.classList.toggle('drop-before', !after(e));
					});
					row.addEventListener('dragleave', clear);
					row.addEventListener('drop', (e) => {
						if (!dragFrom || dragFrom.key !== key) return;
						e.preventDefault();
						const from = dragFrom.index;
						dragFrom = null;
						clear();
						// Insertion point in the pre-removal array, less the hole the dragged row leaves.
						let insertAt = index + (after(e) ? 1 : 0);
						if (from < insertAt) insertAt--;
						moveTaskWithinCategory(key, from, insertAt);
					});
				}
				return row;
			};

			const open = entries.filter(([, t]) => !t.done);
			const done = entries.filter(([, t]) => t.done).sort((a, b) => (b[1].completedAt || 0) - (a[1].completedAt || 0));
			const keys = [...new Set(open.map(([, t]) => t.category))].sort((a, b) => categoryTier(a) - categoryTier(b) || (categoryTier(a) === 4 ? a.localeCompare(b) : 0));
			if (open.length) {
				for (const key of keys) {
					const groupEntries = openTaskIdsByCategory(key).map((id) => [id, tasks[id]]);
					const details = el('details', { class: 'task-section' }, [el('summary', { text: `${key} (${groupEntries.length})` })]);
					trackTaskSection(details, `cat:${key}`, true);
					groupEntries.forEach(([id, t], index) => details.appendChild(buildRow(id, t, { key, index, groupEntries })));
					card.appendChild(details);
				}
			} else {
				card.appendChild(el('div', { class: 'task-empty', text: 'Nothing open — nice.' }));
			}
			if (done.length) {
				const details = el('details', { class: 'task-section' }, [el('summary', { text: `Completed (${done.length})` })]);
				trackTaskSection(details, 'completed', false);
				for (const [id, t] of done) details.appendChild(buildRow(id, t));
				card.appendChild(details);
			}
			return card;
		}

		// Edit a task in place: text and category are the only fields that can't
		// change any other way. Moving category sends the task to the end of the
		// new one, since an index from the old category means nothing there.
		function buildEditRow(id, t, categories) {
			const row = el('div', { class: 'task-row editing' });
			const text = el('input', { type: 'text', class: 'task-input', value: t.text, autocomplete: 'off', maxlength: String(MAX_TASK_TEXT_LENGTH), 'aria-label': 'Task' });
			const category = el('input', { type: 'text', class: 'task-input', value: t.category || '', placeholder: 'Category', autocomplete: 'off', 'aria-label': 'Category' });
			const save = () => {
				const nextText = text.value.trim();
				const nextCategory = category.value.trim();
				if (!nextText || !nextCategory) return;
				editingTaskId = null;
				const updates = { text: nextText, category: nextCategory };
				if (nextCategory !== (t.category || '')) updates.order = Date.now();
				patchTask(id, updates);
			};
			const cancel = () => { editingTaskId = null; refreshTasksCard(); };
			const keydown = (e) => { if (e.key === 'Enter') save(); else if (e.key === 'Escape') cancel(); };
			text.addEventListener('keydown', keydown);
			category.addEventListener('keydown', keydown);
			const saveBtn = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Save', 'aria-label': 'Save', text: '✓' });
			saveBtn.addEventListener('click', save);
			const cancelBtn = el('button', { type: 'button', class: 'task-icon-btn', title: 'Cancel', 'aria-label': 'Cancel', text: '✕' });
			cancelBtn.addEventListener('click', cancel);
			row.append(text, attachTaskCharCounter(text), attachCategorySuggestions(category, () => categories), saveBtn, cancelBtn);
			setTimeout(() => { text.focus(); text.setSelectionRange(text.value.length, text.value.length); }, 0);
			return row;
		}

		// Admin: Tasks first, then Quick Links, as on the other sites.
		function adminView() {
			tasksCardEl = buildTasksCard();
			loadTasks(); // first load, or a quiet refresh when the tab is reopened
			qlDraft = null; // a fresh copy of what is saved each time the tab opens
			qlErrors = [];
			qlCardEl = buildQuickLinksCard();
			return [tasksCardEl, qlCardEl];
		}

		// ---- Trip data and stats -----------------------------------------------
		// null is "not recorded" and is never counted as 0 (see api/_lib/fishtrips.mjs).
		let trips = null; // null until the first read
		let tripsState = 'loading'; // loading | ready | error
		let tripsError = '';
		let tripsSeeded = false;

		const sumOf = (list) => (list.every((v) => v == null) ? null : list.reduce((a, v) => a + (v ?? 0), 0));
		const fmt = (v) => (v == null ? '–' : String(v));
		const inchesText = (n) => `${n}"`;
		const sameName = (a, b) => !!a && !!b && a.trim().toLowerCase() === b.trim().toLowerCase();

		function tripTotals(t) {
			const anglers = t.anglers.map((a) => ({
				name: a.name,
				days: a.days,
				caught: sumOf(a.days.map((d) => d.caught)),
				kept: sumOf(a.days.map((d) => d.kept)),
			}));
			const days = t.days.map((_, j) => ({
				caught: sumOf(t.anglers.map((a) => a.days[j].caught)),
				kept: sumOf(t.anglers.map((a) => a.days[j].kept)),
			}));
			return { anglers, days, caught: sumOf(days.map((d) => d.caught)), kept: sumOf(days.map((d) => d.kept)) };
		}
		// What a trip has, so a year shows whatever was captured for it. A trip with
		// nothing filled in at all hasn't happened yet ("Upcoming"); one with only
		// a biggest fish, say, is shown with just that. Fish counts (caught/kept)
		// are what the table, the totals and every average are built from, so a
		// trip without them is shown but never counted in those.
		const hasCounts = (t) => { const tot = tripTotals(t); return tot.caught != null || tot.kept != null; };
		const hasDayFacts = (t) => t.days.some((d) => d.first || d.biggest || d.biggestInches != null || (d.species || []).some((x) => x.count != null));
		// Played or upcoming. A trip with a date is Upcoming while that date is ahead
		// and played from the day it arrives, whether or not stats were kept (some
		// old trips were never recorded). Without a date, the year decides: a past
		// year was played, a future year is upcoming, and this year's trip is
		// upcoming until something is filled in. `today` is injectable for testing.
		const localToday = () => {
			const d = new Date();
			return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
		};
		function tripStatus(t, today = localToday()) {
			if (t.date) return t.date > today ? 'upcoming' : 'played';
			const thisYear = Number(today.slice(0, 4));
			if (t.year < thisYear) return 'played';
			if (t.year > thisYear) return 'upcoming';
			return hasCounts(t) || hasDayFacts(t) ? 'played' : 'upcoming';
		}
		const isUpcoming = (t) => tripStatus(t) === 'upcoming';

		// "Feb 14" for a one-day trip, "Feb 14–15" or "Feb 28 – Mar 1" for longer
		// ones (the days are consecutive from the start date). UTC throughout, so
		// the viewer's timezone can't shift the day.
		function formatTripDates(date, days) {
			const [y, m, d] = date.split('-').map(Number);
			const start = new Date(Date.UTC(y, m - 1, d));
			const end = new Date(Date.UTC(y, m - 1, d + Math.max(1, days) - 1));
			const f = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
			if (days <= 1) return f.format(start);
			return start.getUTCMonth() === end.getUTCMonth() ? `${f.format(start)}–${end.getUTCDate()}` : `${f.format(start)} – ${f.format(end)}`;
		}

		function allTimeStats(list) {
			const done = list.filter((t) => !isUpcoming(t));
			const counted = done.filter(hasCounts);
			const people = new Map();
			const person = (name) => {
				const key = name.toLowerCase();
				if (!people.has(key)) people.set(key, { name, trips: 0, countedTrips: 0, caught: 0, kept: 0, bestDay: null, first: 0, biggest: 0 });
				return people.get(key);
			};
			const stats = { trips: done.length, countedTrips: counted.length, caught: 0, kept: 0, bestTrip: null, bestDay: null, biggest: null };
			for (const t of done) {
				const tot = tripTotals(t);
				// Fish counts come only from trips that recorded some; first and
				// biggest fish below come from every trip that has them.
				if (hasCounts(t)) stats.caught += tot.caught ?? 0;
				if (hasCounts(t)) stats.kept += tot.kept ?? 0;
				if (tot.caught != null && (!stats.bestTrip || tot.caught > stats.bestTrip.caught)) stats.bestTrip = { caught: tot.caught, year: t.year };
				for (const a of tot.anglers) {
					// Every angler on a played trip counts it, stats or not; only
					// trips where they have counts feed their per-trip average.
					const p = person(a.name);
					p.trips++;
					if (a.caught == null && a.kept == null) continue;
					p.countedTrips++;
					p.caught += a.caught ?? 0;
					p.kept += a.kept ?? 0;
					a.days.forEach((d, j) => {
						if (d.caught != null && (!p.bestDay || d.caught > p.bestDay.caught)) p.bestDay = { caught: d.caught, year: t.year, day: j + 1 };
						if (d.caught != null && (!stats.bestDay || d.caught > stats.bestDay.caught)) stats.bestDay = { caught: d.caught, name: a.name, year: t.year, day: j + 1 };
					});
				}
				t.days.forEach((d) => {
					if (d.first) person(d.first).first++;
					if (d.biggest) person(d.biggest).biggest++;
					if (d.biggestInches != null && (!stats.biggest || d.biggestInches > stats.biggest.inches)) stats.biggest = { inches: d.biggestInches, name: d.biggest, year: t.year };
				});
			}
			stats.people = [...people.values()].sort((a, b) => b.caught - a.caught || a.name.localeCompare(b.name));
			return stats;
		}

		// "412 fish caught over 5 trips since 2022 and counting": the same numbers
		// as the All-time stats tiles (X = fish caught, Y = played trips), and Z is
		// the earliest played trip's year. Hidden until the trips have loaded, and
		// whenever there is nothing to count.
		function renderFishCount() {
			const node = document.getElementById('fish-count');
			if (!node) return;
			const s = trips && tripsState === 'ready' ? allTimeStats(trips) : null;
			const years = s ? trips.filter((t) => !isUpcoming(t)).map((t) => t.year).filter(Boolean) : [];
			const ok = !!(s && s.trips && s.caught && years.length);
			node.classList.toggle('hidden', !ok);
			if (!ok) return;
			node.textContent = `${s.caught} fish caught over ${s.trips} ${s.trips === 1 ? 'trip' : 'trips'} since ${Math.min(...years)} and counting`;
		}

		// Click-to-sort for a small table, the same behaviour as myffl.html's
		// makeTableSort (read its comment for why): each header cycles its natural
		// direction, the reverse, then back to the default order; ties fall back to
		// the default order; `missingLast` keeps a null at the bottom in both
		// directions; nothing is saved. Keep the two in step.
		function makeTableSort(rows, SORTS, onChange) {
			const defaultIndex = new Map(rows.map((r, i) => [r, i]));
			let sortKey = null;
			let sortDir = 0;
			function sortedRows() {
				if (!sortKey) return rows;
				const { value, missingLast } = SORTS[sortKey];
				const byDefault = (a, b) => defaultIndex.get(a) - defaultIndex.get(b);
				return [...rows].sort((a, b) => {
					const av = value(a);
					const bv = value(b);
					if (missingLast && (av == null || bv == null)) {
						if (av == null && bv == null) return byDefault(a, b);
						return av == null ? 1 : -1;
					}
					return (av === bv ? 0 : av < bv ? -1 : 1) * sortDir || byDefault(a, b);
				});
			}
			function cycleSort(key) {
				if (sortKey !== key) { sortKey = key; sortDir = SORTS[key].dir; }
				else if (sortDir === SORTS[key].dir) sortDir = -sortDir;
				else { sortKey = null; sortDir = 0; }
				onChange();
			}
			function sortableHeader(label, key, extraClass = '', title = `Sort by ${label}`) {
				const th = el('th', { class: `${extraClass} sortable`.trim(), tabindex: '0', title, 'aria-sort': sortKey === key ? (sortDir === 1 ? 'ascending' : 'descending') : 'none', text: label });
				if (sortKey === key) th.appendChild(el('span', { class: 'sort-arrow', text: sortDir === 1 ? ' ▲' : ' ▼' }));
				th.addEventListener('click', () => cycleSort(key));
				th.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycleSort(key); } });
				return th;
			}
			return { sortedRows, cycleSort, sortableHeader };
		}

		function tile(value, label, sub) {
			return el('div', { class: 'tile' }, [el('div', { class: 'tile-value', text: value }), el('div', { class: 'tile-label', text: label }), sub ? el('div', { class: 'tile-sub', text: sub }) : null]);
		}

		function buildStatsCard(list) {
			const s = allTimeStats(list);
			const head = el('h2', { class: 'card-heading', text: 'All-time stats' });
			const card = el('div', { class: 'card' }, [head]);
			makeCollapsible(card, head, 'stats');
			if (!s.trips) { card.appendChild(el('div', { class: 'task-empty', text: 'No finished trips yet.' })); return card; }
			const keep = s.caught ? `${Math.round((s.kept / s.caught) * 100)}% kept` : '';
			card.appendChild(el('div', { class: 'tiles' }, [
				tile(String(s.trips), s.trips === 1 ? 'Trip' : 'Trips'),
				s.countedTrips ? tile(String(s.caught), 'Fish caught', `${(s.caught / s.countedTrips).toFixed(1)} per trip`) : null,
				s.countedTrips ? tile(String(s.kept), 'Fish kept', keep) : null,
				s.biggest ? tile(inchesText(s.biggest.inches), 'Biggest fish', `${s.biggest.name || 'Unknown'} · ${s.biggest.year}`) : null,
				s.bestTrip ? tile(String(s.bestTrip.caught), 'Best trip', `${s.bestTrip.year}, whole group`) : null,
				s.bestDay ? tile(String(s.bestDay.caught), 'Best day', `${s.bestDay.name} · ${s.bestDay.year} day ${s.bestDay.day}`) : null,
			]));
			// Click a heading to sort: its natural direction, then the reverse, then
			// back to the default order (most caught first). Same behaviour as
			// myffl.html's makeTableSort, whose comment explains the rules: ties keep
			// the default order, a missing value stays last in both directions, and
			// the choice is per visit, never saved.
			const rows = s.people.filter((p) => p.trips);
			const SORTS = {
				name: { dir: 1, value: (p) => p.name.toLowerCase() },
				trips: { dir: -1, value: (p) => p.trips },
				caught: { dir: -1, value: (p) => p.caught },
				kept: { dir: -1, value: (p) => p.kept },
				perTrip: { dir: -1, value: (p) => (p.countedTrips ? p.caught / p.countedTrips : null), missingLast: true },
				bestDay: { dir: -1, value: (p) => (p.bestDay ? p.bestDay.caught : null), missingLast: true },
				first: { dir: -1, value: (p) => p.first },
				biggest: { dir: -1, value: (p) => p.biggest },
			};
			const COLUMNS = [['name', 'Fisherman'], ['trips', 'Trips'], ['caught', 'Caught'], ['kept', 'Kept'], ['perTrip', 'Per trip'], ['bestDay', 'Best day'], ['first', 'First fish'], ['biggest', 'Biggest']];
			const table = el('table', { class: 'fish-table' });
			const { sortedRows, sortableHeader } = makeTableSort(rows, SORTS, () => renderTable());
			function renderTable() {
				const headRow = el('tr', {}, COLUMNS.map(([key, label]) => sortableHeader(label, key)));
				const body = el('tbody');
				for (const p of sortedRows()) {
					body.appendChild(el('tr', {}, [
						el('td', { text: p.name }), el('td', { text: String(p.trips) }),
						el('td', { class: 'fish-total', text: String(p.caught) }), el('td', { text: String(p.kept) }),
						el('td', { text: p.countedTrips ? (p.caught / p.countedTrips).toFixed(1) : '–' }), el('td', { text: p.bestDay ? String(p.bestDay.caught) : '–' }),
						el('td', { text: String(p.first) }), el('td', { text: String(p.biggest) }),
					]));
				}
				table.replaceChildren(el('thead', {}, [headRow]), body);
			}
			renderTable();
			if (rows.length) card.appendChild(el('div', { class: 'fish-scroll' }, [table]));
			return card;
		}

		// The caught/kept table with its Total row, badges and sort hint, for a trip
		// that recorded fish counts. Added to `card`.
		function appendCountsTable(card, t) {
			const tot = tripTotals(t);
			// Whether any day's first or biggest fish belongs to someone in the table
			// (decides the legend), worked out up front so a sort can't change it.
			const anyBadge = t.days.some((d) => t.anglers.some((a) => sameName(d.first, a.name) || sameName(d.biggest, a.name)));

			// Click a heading in the second row to sort the fishermen (the Total row
			// stays put underneath). Same rules as the stats table and myffl.html's
			// makeTableSort: natural direction, reverse, then the order they were
			// entered; ties keep that order; a blank count stays last either way.
			const multi = t.days.length > 1;
			const SORTS = { name: { dir: 1, value: (a) => a.name.toLowerCase() } };
			t.days.forEach((_, j) => {
				SORTS[`c${j}`] = { dir: -1, value: (a) => a.days[j].caught, missingLast: true };
				SORTS[`k${j}`] = { dir: -1, value: (a) => a.days[j].kept, missingLast: true };
			});
			SORTS.cT = { dir: -1, value: (a) => a.caught, missingLast: true };
			SORTS.kT = { dir: -1, value: (a) => a.kept, missingLast: true };

			const table = el('table', { class: 'fish-table' });
			const { sortedRows, sortableHeader } = makeTableSort(tot.anglers, SORTS, () => renderTable());
			const top = el('tr', {}, [el('th', { text: '' })]);
			t.days.forEach((_, j) => top.appendChild(el('th', { colspan: '2', class: 'fish-split', text: `Day ${j + 1}` })));
			if (multi) top.appendChild(el('th', { colspan: '2', class: 'fish-split', text: 'Total' }));
			const foot = el('tr', {}, [el('td', { text: 'Total' })]);
			tot.days.forEach((d) => { foot.appendChild(el('td', { class: 'fish-split', text: fmt(d.caught) })); foot.appendChild(el('td', { text: fmt(d.kept) })); });
			if (multi) { foot.appendChild(el('td', { class: 'fish-split', text: fmt(tot.caught) })); foot.appendChild(el('td', { text: fmt(tot.kept) })); }
			const tfoot = el('tfoot', {}, [foot]);

			function renderTable() {
				const sub = el('tr', {}, [sortableHeader('Fisherman', 'name')]);
				const pair = (ck, kk, which) => { sub.appendChild(sortableHeader('Caught', ck, 'fish-split', `Sort by ${which} caught`)); sub.appendChild(sortableHeader('Kept', kk, '', `Sort by ${which} kept`)); };
				t.days.forEach((_, j) => pair(`c${j}`, `k${j}`, `day ${j + 1}`));
				if (multi) pair('cT', 'kT', 'total');
				const body = el('tbody');
				for (const a of sortedRows()) {
					const row = el('tr', {}, [el('td', { text: a.name })]);
					a.days.forEach((d, j) => {
						// First and biggest fish of the day sit on the row of whoever landed them.
						const day = t.days[j];
						const badges = [];
						if (sameName(day.first, a.name)) badges.push(el('span', { class: 'fish-badge fish-first', title: 'First fish of the day', text: '1st' }));
						if (sameName(day.biggest, a.name)) badges.push(el('span', { class: 'fish-badge fish-big', title: 'Biggest fish of the day', text: day.biggestInches != null ? `★ ${inchesText(day.biggestInches)}` : '★' }));
						row.appendChild(el('td', { class: 'fish-split' }, [...badges, document.createTextNode(fmt(d.caught))]));
						row.appendChild(el('td', { text: fmt(d.kept) }));
					});
					if (multi) { row.appendChild(el('td', { class: 'fish-split fish-total', text: fmt(a.caught) })); row.appendChild(el('td', { class: 'fish-total', text: fmt(a.kept) })); }
					body.appendChild(row);
				}
				table.replaceChildren(el('thead', {}, [top, sub]), body, tfoot);
			}
			renderTable();
			card.appendChild(el('div', { class: 'fish-scroll' }, [table]));
			card.appendChild(el('div', { class: 'fish-note', text: `${anyBadge ? '1st = first fish of the day · ★ = biggest fish of the day (length) · ' : ''}Click a heading to sort.` }));
		}

		function buildTripCard(t) {
			const upcoming = isUpcoming(t);
			const head = el('h2', { class: 'card-heading' }, [
				document.createTextNode(String(t.year)),
				t.location || t.date ? el('span', { class: 'fish-where', text: ` · ${[t.location, t.date ? formatTripDates(t.date, t.days.length) : ''].filter(Boolean).join(' · ')}` }) : null,
				upcoming ? el('span', { class: 'fish-chip', text: 'Upcoming' }) : null,
			]);
			const card = el('div', { class: 'card' }, [head]);
			makeCollapsible(card, head, `trip:${t.id}`);
			if (upcoming) {
				card.appendChild(el('div', { class: 'task-empty', text: t.anglers.length ? `Fishing: ${t.anglers.map((a) => a.name).join(', ')}. Counts will show up here after the trip.` : 'Counts will show up here after the trip.' }));
				return card;
			}
			if (hasCounts(t)) appendCountsTable(card, t);

			// Anything the table doesn't show: a first or biggest fish credited to
			// someone who isn't a row on this trip, and the species kept. A trip with
			// no fish counts has no table, so everything it has is listed here.
			const listed = (name) => hasCounts(t) && t.anglers.some((a) => sameName(a.name, name));
			const facts = el('ul', { class: 'fish-days' });
			t.days.forEach((d, j) => {
				const bits = [];
				if (d.first && !listed(d.first)) bits.push(`First fish: ${d.first}`);
				if ((d.biggest || d.biggestInches != null) && !(d.biggest && listed(d.biggest))) bits.push(`Biggest fish: ${[d.biggest, d.biggestInches != null ? `(${inchesText(d.biggestInches)})` : ''].filter(Boolean).join(' ')}`);
				const kept = (d.species || []).filter((s) => s.count != null).map((s) => `${s.name} ${s.count}`);
				if (kept.length) bits.push(`Kept: ${kept.join(', ')}`);
				if (bits.length) facts.appendChild(el('li', {}, [el('b', { text: `Day ${j + 1} ` }), document.createTextNode(bits.join(' · '))]));
			});
			if (facts.children.length) card.appendChild(facts);
			// Played, but nothing was kept for it: say so rather than show an empty card.
			if (!hasCounts(t) && !facts.children.length) card.appendChild(el('div', { class: 'task-empty', text: 'No stats were recorded for this trip.' }));
			return card;
		}

		function fishingView() {
			if (tripsState === 'loading') return [el('div', { class: 'card' }, [el('div', { class: 'message', text: 'Loading…' })])];
			if (tripsState === 'error') {
				const retry = el('button', { type: 'button', class: 'task-add-btn', text: 'Try again' });
				retry.addEventListener('click', () => { loadTrips(); renderAll(); });
				return [el('div', { class: 'card' }, [el('div', { class: 'message error', text: `Couldn’t load the trips (${tripsError}).` }), retry])];
			}
			if (!trips.length) return [el('div', { class: 'card' }, [el('div', { class: 'message', text: 'No trips yet.' })])];
			return [buildStatsCard(trips), ...trips.map(buildTripCard)];
		}

		async function loadTrips() {
			tripsState = 'loading';
			try {
				const res = await fetch(`${API_URL}?resource=fishtrips`, { cache: 'no-store' });
				const body = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
				if (!Array.isArray(body.trips)) throw new Error('unexpected response');
				trips = body.trips;
				tripsSeeded = !!body.seeded;
				tripsState = 'ready';
			} catch (err) {
				tripsState = 'error';
				tripsError = err.message;
			}
			renderFishCount();
			if (tab === 'fishing') renderAll();
			else if (tab === 'admin' && tripsCardEl && tripsCardEl.isConnected && !tripsDraft) {
				// The Admin tab opened before the read finished: swap the placeholder
				// card only, so Tasks and Quick Links edits in progress are left alone.
				const old = tripsCardEl;
				tripsAdminCard();
				old.replaceWith(tripsCardEl);
			}
		}

		// ---- Trips card on the Admin tab (login only) ---------------------------------------------
		// Edits go into a draft and nothing is saved until Save; the whole list is
		// replaced in one write, like Quick Links. Typing updates the draft in place
		// (no re-render, which would steal focus); only structural changes (add or
		// remove a trip, day, angler or species, reorder) rebuild the card.
		let tripsDraft = null;
		let tripsErrors = [];
		let tripsSaving = false;
		let tripsCardEl = null;
		const tripOpen = {};
		const copyTrips = (list) => JSON.parse(JSON.stringify(list));
		const tripsDirty = () => JSON.stringify(tripsDraft) !== JSON.stringify(trips);
		const newTripId = () => `t${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;

		function refreshTripsCard() {
			if (!tripsCardEl) return;
			const next = buildTripsCard();
			tripsCardEl.replaceWith(next);
			tripsCardEl = next;
		}

		async function saveTrips() {
			tripsErrors = [];
			tripsSaving = true;
			refreshTripsCard();
			setStatus('Saving…');
			try {
				const res = await fetch(API_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
					body: JSON.stringify({ resource: 'fishtrips', trips: tripsDraft }),
				});
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { tripsSaving = false; expireSession(); return; }
				if (!res.ok) throw new Error((body.details && body.details.join(' ')) || body.error || `HTTP ${res.status}`);
				trips = body.trips;
				tripsSeeded = false;
				tripsDraft = copyTrips(trips);
				renderFishCount();
				setStatus('Saved', 'ok');
			} catch (err) {
				tripsErrors = [`Not saved: ${err.message}`];
				setStatus('');
			}
			tripsSaving = false;
			refreshTripsCard();
		}

		// A count box: blank is null ("not recorded"), never 0.
		function countInput(obj, key, { float = false, label } = {}) {
			const input = el('input', { type: 'number', class: 'task-input', min: '0', step: float ? '0.25' : '1', inputmode: float ? 'decimal' : 'numeric', value: obj[key] == null ? '' : String(obj[key]), 'aria-label': label || key });
			input.addEventListener('input', () => {
				const v = input.value.trim();
				const n = float ? parseFloat(v) : parseInt(v, 10);
				obj[key] = v === '' || !Number.isFinite(n) ? null : n;
			});
			return input;
		}
		function textField(obj, key, placeholder, label, maxlength = '60') {
			const input = el('input', { type: 'text', class: 'task-input', value: obj[key] || '', placeholder: placeholder || '', autocomplete: 'off', maxlength, 'aria-label': label || key });
			input.addEventListener('input', () => { obj[key] = input.value; });
			return input;
		}
		const labelled = (label, input) => el('label', { class: 'ql-field' }, [el('span', { text: label }), input]);
		const smallBtn = (text, title, onClick, cls = 'task-icon-btn task-save-btn') => {
			const b = el('button', { type: 'button', class: cls, title, 'aria-label': title, text });
			b.addEventListener('click', onClick);
			return b;
		};

		function buildTripEditor(t, i) {
