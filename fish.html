					year: Math.max(new Date().getFullYear(), ...(tripsDraft.map((x) => x.year || 0))) + (tripsDraft.some((x) => x.year === new Date().getFullYear()) ? 1 : 0),
					location: last ? last.location : '',
					days,
					anglers: last ? last.anglers.map((a) => ({ name: a.name, days: days.map(() => ({ caught: null, kept: null })) })) : [],
				});
				refreshTripsCard();
			});
			const save = el('button', { type: 'button', class: 'task-add-btn', text: tripsSaving ? 'Saving…' : 'Save' });
			save.disabled = tripsSaving;
			save.addEventListener('click', saveTrips);
			const discard = el('button', { type: 'button', class: 'task-add-btn', text: 'Discard changes' });
			discard.disabled = tripsSaving || !tripsDirty();
			discard.addEventListener('click', () => { tripsDraft = copyTrips(trips); tripsErrors = []; refreshTripsCard(); });
			card.appendChild(el('div', { class: 'ql-actions' }, [add, save, discard]));
			if (tripsErrors.length) card.appendChild(el('ul', { class: 'ql-errors' }, tripsErrors.map((t) => el('li', { text: t }))));
			card.appendChild(el('div', { class: 'ql-note', text: 'Newest first, as shown on the Ice Fishing tab. Leave a count blank if it was not recorded (a blank is not a zero). Species counts are fish kept. A trip with a date is Upcoming until that day and played from then on, even with no stats. Without a date, a past year counts as played, a future year as upcoming, and this year as upcoming until something is filled in. A played trip shows whatever was captured for it.' }));
			return card;
		}

		// The Trips card, or a placeholder until the trip read comes back. It is
		// rebuilt from the saved list each time the Admin tab opens.
		function tripsAdminCard() {
			if (tripsState !== 'ready') {
				const head = el('h2', { class: 'card-heading', text: 'Trips' });
				const card = el('div', { class: 'card' }, [head]);
				if (tripsState === 'error') {
					const retry = el('button', { type: 'button', class: 'task-add-btn', text: 'Try again' });
					retry.addEventListener('click', loadTrips);
					card.append(el('div', { class: 'message error', text: `Couldn’t load the trips (${tripsError}).` }), retry);
				} else {
					card.appendChild(el('div', { class: 'message', text: 'Loading…' }));
				}
				tripsCardEl = card;
				return card;
			}
			tripsDraft = null;
			tripsErrors = [];
			tripsCardEl = buildTripsCard();
			return tripsCardEl;
		}

		// Coming back to the page (switching apps on a phone or iPad, or restoring
		// it from the back/forward cache) refreshes the task list too.
		function refreshTasksIfVisible() {
			if (tab === 'admin' && isLoggedIn() && document.visibilityState === 'visible') loadTasks();
		}
		document.addEventListener('visibilitychange', refreshTasksIfVisible);
		window.addEventListener('pageshow', refreshTasksIfVisible);

		// ---- Shell ---------------------------------------------------------------
		function setTab(next) {
			tab = next;
			try { localStorage.setItem(TAB_KEY, tab); } catch (e) { /* the tab still switches */ }
			setStatus('');
			editingTaskId = null;
			renderAll();
		}

		function renderTabs() {
			const nav = document.getElementById('tabs');
			nav.textContent = '';
			// Admin exists only while logged in; logging out removes it.
			for (const [id, label, loginOnly] of TABS) {
				if (loginOnly && !isLoggedIn()) continue;
				const btn = el('button', { type: 'button', class: `tab-btn${tab === id ? ' active' : ''}`, role: 'tab', 'aria-selected': String(tab === id), text: label });
				btn.addEventListener('click', () => setTab(id));
				nav.appendChild(btn);
			}
		}

		function renderAll() {
			if (!isLoggedIn() && tab !== 'fishing') tab = 'fishing';
			renderLogin();
			renderTabs();
			renderQuickLinks();
			const view = document.getElementById('view');
			view.textContent = '';
			tasksCardEl = null;
			qlCardEl = null;
			tripsCardEl = null;
			const cards = tab === 'admin' ? [...adminView(), tripsAdminCard()] : fishingView();
			cards.forEach((c) => view.appendChild(c));
		}

		function load() {
			renderAll();
			loadTrips();
			// Not awaited: the bar fills in when it arrives, and a failure just
			// leaves it hidden.
			fetch(`${API_URL}?resource=fishquicklinks`, { cache: 'no-store' })
				.then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
				.then((body) => { quickLinks = Array.isArray(body.links) ? body.links : []; renderQuickLinks(); })
				.catch(() => { /* no toolbar */ });
		}

		load();
	</script>
</body>
</html>
