			const details = el('details', { class: 'trip-edit' }, [el('summary', { text: `${t.year || '?'}${t.location ? ` · ${t.location}` : ''}` })]);
			details.open = !!tripOpen[t.id];
			details.addEventListener('toggle', () => { tripOpen[t.id] = details.open; });

			// The date is the first day. Setting it also sets the year (the server
			// refuses a date whose year differs from the trip's).
			const yearInput = countInput(t, 'year', { label: 'Year' });
			const dateInput = el('input', { type: 'date', class: 'task-input', value: t.date || '', 'aria-label': 'Date of the first day' });
			dateInput.addEventListener('input', () => {
				t.date = dateInput.value || null;
				if (t.date) { t.year = Number(t.date.slice(0, 4)); yearInput.value = String(t.year); }
			});
			details.appendChild(el('div', { class: 'trip-fields' }, [labelled('Year', yearInput), labelled('Date (first day)', dateInput), labelled('Location', textField(t, 'location', 'e.g. River Bend', 'Location'))]));

			details.appendChild(el('div', { class: 'trip-sub', text: 'Fish caught and kept' }));
			const grid = el('table', { class: 'trip-grid' });
			const headRow = el('tr', {}, [el('th', { text: 'Fisherman' })]);
			t.days.forEach((_, j) => { headRow.appendChild(el('th', { text: `D${j + 1} caught` })); headRow.appendChild(el('th', { text: `D${j + 1} kept` })); });
			headRow.appendChild(el('th'));
			grid.appendChild(el('thead', {}, [headRow]));
			const gbody = el('tbody');
			t.anglers.forEach((a, k) => {
				const row = el('tr', {}, [el('td', {}, [(() => { const n = textField(a, 'name', 'Name', 'Fisherman', '30'); n.classList.add('trip-name'); return n; })()])]);
				a.days.forEach((d, j) => {
					row.appendChild(el('td', {}, [countInput(d, 'caught', { label: `${a.name || 'Fisherman'} day ${j + 1} caught` })]));
					row.appendChild(el('td', {}, [countInput(d, 'kept', { label: `${a.name || 'Fisherman'} day ${j + 1} kept` })]));
				});
				row.appendChild(el('td', {}, [smallBtn('✕', 'Remove this fisherman', () => { t.anglers.splice(k, 1); refreshTripsCard(); }, 'task-icon-btn')]));
				gbody.appendChild(row);
			});
			grid.appendChild(gbody);
			details.appendChild(el('div', { class: 'fish-scroll' }, [grid]));
			details.appendChild(el('div', { class: 'trip-actions' }, [
				smallBtn('+ Fisherman', 'Add a fisherman', () => { t.anglers.push({ name: '', days: t.days.map(() => ({ caught: null, kept: null })) }); refreshTripsCard(); }, 'task-add-btn'),
				smallBtn('+ Day', 'Add a day', () => {
					if (t.days.length >= 6) return;
					t.days.push({ first: '', biggest: '', biggestInches: null });
					for (const a of t.anglers) a.days.push({ caught: null, kept: null });
					refreshTripsCard();
				}, 'task-add-btn'),
				smallBtn('− Last day', 'Remove the last day', () => {
					if (t.days.length <= 1) return;
					t.days.pop();
					for (const a of t.anglers) a.days.pop();
					refreshTripsCard();
				}, 'task-add-btn'),
			]));

			t.days.forEach((d, j) => {
				const box = el('div', { class: 'trip-day' }, [el('div', { class: 'trip-day-title', text: `Day ${j + 1}` })]);
				box.appendChild(el('div', { class: 'trip-fields' }, [
					labelled('First fish', textField(d, 'first', 'Who', `Day ${j + 1} first fish`)),
					labelled('Biggest fish (who)', textField(d, 'biggest', 'Who', `Day ${j + 1} biggest fish`)),
					labelled('Inches', countInput(d, 'biggestInches', { float: true, label: `Day ${j + 1} biggest fish inches` })),
				]));
				d.species = d.species || [];
				const sp = el('div', { class: 'trip-species' }, [el('span', { class: 'fish-dim', text: 'Fish kept by species:' })]);
				d.species.forEach((s, m) => {
					sp.appendChild(textField(s, 'name', 'Species', 'Species', '30'));
					const c = countInput(s, 'count', { label: `${s.name || 'Species'} kept` });
					c.classList.add('trip-count');
					sp.appendChild(c);
					sp.appendChild(smallBtn('✕', 'Remove this species', () => { d.species.splice(m, 1); refreshTripsCard(); }, 'task-icon-btn'));
				});
				sp.appendChild(smallBtn('+ Species', 'Add a species', () => { d.species.push({ name: '', count: null }); refreshTripsCard(); }, 'task-add-btn'));
				box.appendChild(sp);
				details.appendChild(box);
			});

			const move = (to) => { tripsDraft.splice(to, 0, tripsDraft.splice(i, 1)[0]); refreshTripsCard(); };
			const up = smallBtn('↑', 'Move up', () => move(i - 1));
			const down = smallBtn('↓', 'Move down', () => move(i + 1));
			up.disabled = i === 0;
			down.disabled = i === tripsDraft.length - 1;
			details.appendChild(el('div', { class: 'trip-actions' }, [up, down, smallBtn('Remove trip', 'Remove this trip', () => {
				if (!confirm(`Remove the ${t.year || ''} trip? It is gone for good once you Save.`)) return;
				tripsDraft.splice(i, 1);
				refreshTripsCard();
			}, 'task-add-btn')]));
			return details;
		}

		function buildTripsCard() {
			if (!tripsDraft) tripsDraft = copyTrips(trips || []);
			const head = el('h2', { class: 'card-heading', text: `Trips (${tripsDraft.length})` });
			const card = el('div', { class: 'card' }, [head]);
			makeCollapsible(card, head, 'tripsEditor');
			if (tripsSeeded) card.appendChild(el('div', { class: 'ql-note', text: 'These are the trips from the original spreadsheet. Nothing is stored yet; your first Save stores the list.' }));
			for (let i = 0; i < tripsDraft.length; i++) card.appendChild(buildTripEditor(tripsDraft[i], i));
			if (!tripsDraft.length) card.appendChild(el('div', { class: 'task-empty', text: 'No trips yet.' }));
			const add = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add a trip' });
			add.addEventListener('click', () => {
				// Starts from the latest trip's crew and species, with every count blank.
				const last = tripsDraft[0];
				const days = last ? last.days.map((d) => ({ first: '', biggest: '', biggestInches: null, species: (d.species || []).map((s) => ({ name: s.name, count: null })) })) : [{ first: '', biggest: '', biggestInches: null }, { first: '', biggest: '', biggestInches: null }];
				const id = newTripId();
				tripOpen[id] = true;
				tripsDraft.unshift({
					id,
					date: null,
					year: Math.max(new Date().getFullYear(), ...(tripsDraft.map((x) => x.year || 0))) + (tripsDraft.some((x) => x.year === new Date().getFullYear()) ? 1 : 0),
					location: last ? last.location : '',
					days,
					anglers: last ? last.anglers.map((a) => ({ name: a.name, days: days.map(() => ({ caught: null, kept: null })) })) : [],
				});
				refreshTripsCard();
			});
			const save = el('button', { type: 'button', class: 'task-add-btn', text: tripsSaving ? 'Saving…' : 'Save' });
			save.disabled = tripsSaving;
			save.addEventListener('click', saveTrips);
			const discard = el('button', { type: 'button', class: 'task-add-btn', text: 'Discard changes' });
			discard.disabled = tripsSaving || !tripsDirty();
			discard.addEventListener('click', () => { tripsDraft = copyTrips(trips); tripsErrors = []; refreshTripsCard(); });
			card.appendChild(el('div', { class: 'ql-actions' }, [add, save, discard]));
			if (tripsErrors.length) card.appendChild(el('ul', { class: 'ql-errors' }, tripsErrors.map((t) => el('li', { text: t }))));

		// Photos tab: myFish's own public iCloud Shared Album (the same solution as

		const PHOTO_SORTS = [['newest', 'Newest first'], ['oldest', 'Oldest first'], ['added', 'Recently added']];
		const PHOTO_PREFS_KEY = 'fishPhotosView';
		function loadPhotoPrefs() {

			return { sort: PHOTO_SORTS.some(([v]) => v === saved.sort) ? saved.sort : 'newest', who: typeof saved.who === 'string' ? saved.who : '', year: typeof saved.year === 'string' ? saved.year : '' };

		let photoPrefs = loadPhotoPrefs();

		const photoYear = (p) => { const t = photoTaken(p); return t ? String(new Date(t).getFullYear()) : ''; };

				const y = photoYear(p);

			const year = facets.years.some(([y]) => y === photoPrefs.year) ? photoPrefs.year : '';

				newest: (a, b) => photoTaken(b).localeCompare(photoTaken(a)),
				oldest: (a, b) => photoTaken(a).localeCompare(photoTaken(b)),

		// The full-size viewer over a list of photo ids (the current sort and filter),

		// Each step goes through currentPhotos(), so a link that has expired meanwhile
		// is renewed first.
		function openPhotoViewer(ids, index) {
			let current = index, latest = 0;
			const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
			const img = el('img', { alt: 'Photo' });

				next.disabled = current === ids.length - 1;

					if (ticket !== latest || !overlay.isConnected) return;
					const photo = album && album.photos.find((p) => p.id === ids[current]);
					if (!photo) { close(); return; }
					img.src = photo.full;
					img.alt = photo.caption || 'Photo';

				else if (e.key === 'ArrowRight') { e.preventDefault(); show(current + 1); }

		// One read of the album. `refresh` makes the server skip its cache (which lasts
		// until Apple's image links are near expiry) and is login-only: the Refresh
		// button below exists only when logged in. `expires` is when the earliest of
		// the signed image links in the response dies.
		function fetchPhotos(refresh) {
			const init = { cache: 'no-store' };
			if (refresh) init.headers = { Authorization: `Bearer ${authToken}` };
			return fetch(`${API_URL}?resource=fishphotos${refresh ? '&refresh=1' : ''}`, init)
				.then((r) => (r.ok ? r.json() : r.json().catch(() => ({})).then((b) => Promise.reject(new Error(b.error || `HTTP ${r.status}`)))))
				.then((album) => ({ photos: Array.isArray(album.photos) ? album.photos : [], expires: album.expires || null }));
		}
		// The grid shows PHOTO_ROWS_PER_PAGE rows, however many columns fit: 6 across on
		// a desktop is 18 a page, 2 across on a phone is 6. The column count is read
		// back from the grid itself (CSS decides it), so the two can't disagree.
		const PHOTO_ROWS_PER_PAGE = 3;
		let photosView = null; // { body, album, start, cols } for the card on screen; cols is null when it was only estimated
		function photoColumns(grid) {

			return tracks.length && tracks.every((t) => /^[\d.]+px$/.test(t)) ? tracks.length : null;
		}
		// Apple's image links expire ~20 minutes after they are issued, and a page of
		// thumbnails (or a full-size photo) is only requested when it is shown. So in a
		// card left open a while, paging could hit dead links: when the links are within
		// a minute of expiring, read the album again first (the server has fresh ones by
		// then). If that read fails, carry on with what is held.
		function currentPhotos() {
			const view = photosView;
			if (!view) return Promise.resolve(null);
			const exp = Date.parse(view.album.expires);
			if (!Number.isFinite(exp) || Date.now() < exp - 60 * 1000) return Promise.resolve(view.album);

		}
		// Prev/Next under the grid when there is more than one page, and a Refresh
		// button when logged in.
		function appendPhotosFooter(body, pager) {
			const footer = el('div', { class: 'photo-meta' });
			if (pager) {
				const { start, size, total } = pager;
				const go = (to) => currentPhotos().then((album) => { if (album && body.isConnected) renderPhotos(body, album, to); });
				const prev = el('button', { type: 'button', class: 'photo-pager-btn', 'aria-label': 'Previous photos', text: '‹' });
				const next = el('button', { type: 'button', class: 'photo-pager-btn', 'aria-label': 'Next photos', text: '›' });
				prev.disabled = start === 0;
				next.disabled = start + size >= total;
				prev.addEventListener('click', () => go(start - size));
				next.addEventListener('click', () => go(start + size));
				footer.appendChild(el('span', { class: 'photo-pager' }, [prev, el('span', { text: `${start + 1}–${Math.min(start + size, total)} of ${total}` }), next]));
			}
			if (isLoggedIn()) {
				const msg = el('span', { class: 'photo-meta-msg', role: 'status' });
				const btn = el('button', { type: 'button', class: 'photo-refresh-btn', text: 'Refresh' });
				btn.addEventListener('click', () => {
					btn.disabled = true; btn.textContent = 'Refreshing…'; msg.textContent = '';
					fetchPhotos(true)
						.then((album) => { if (body.isConnected) renderPhotos(body, album); })
						.catch((err) => { btn.disabled = false; btn.textContent = 'Refresh'; msg.textContent = `Couldn't refresh. ${err.message}`; });
				});

		}
		// Sort and filter selects above the grid. A filter that could change nothing (one
		// contributor, one year) is left out; so is the sort for a single photo.
		function appendPhotoControls(body, total, facets, applied) {
			const row = el('div', { class: 'photo-controls' });
			const addSelect = (label, options, value, onChange) => {
				const sel = el('select', { class: 'photo-select', 'aria-label': label });
				for (const [v, text] of options) {
					const opt = el('option', { value: v, text });
					opt.selected = v === value;
					sel.appendChild(opt);
				}
				sel.addEventListener('change', () => {
					onChange(sel.value);
					savePhotoPrefs();
					const view = photosView;
					if (view && view.body === body) {
						renderPhotos(body, view.album, 0); // a new view starts on page 1
						const again = body.querySelector(`.photo-select[aria-label="${label}"]`);
						if (again) again.focus(); // the re-render replaced the select; keep keyboard focus on it
					}
				});
				row.appendChild(sel);
			};
			if (total > 1) addSelect('Sort photos', PHOTO_SORTS, photoPrefs.sort, (v) => { photoPrefs.sort = v; });
			if (facets.who.length > 1) addSelect('Filter by who added it', [['', `Everyone (${total})`], ...facets.who.map(([n, c]) => [n, `${n} (${c})`])], applied.who, (v) => { photoPrefs.who = v; });
			if (facets.years.length > 1) addSelect('Filter by year', [['', 'All years'], ...facets.years.map(([y, c]) => [y, `${y} (${c})`])], applied.year, (v) => { photoPrefs.year = v; });
			if (row.childNodes.length) body.appendChild(row);
		}
		function renderPhotos(body, album, start = 0) {
			body.textContent = '';
			if (!album.photos.length) {
				photosView = null;
				body.appendChild(el('p', { class: 'task-empty', text: 'No photos yet.' }));
				appendPhotosFooter(body, null);
				return;
			}
			const facets = photoFacets(album.photos);
			const { list: photos, who, year } = visiblePhotos(album.photos, facets);
			appendPhotoControls(body, album.photos.length, facets, { who, year });
			if (!photos.length) {
				// Two filters can each be valid and still match nothing together; the selects above stay to change them.
				photosView = { body, album, start: 0, cols: null };
				body.appendChild(el('p', { class: 'task-empty', text: 'No photos match these filters.' }));
				appendPhotosFooter(body, null);
				return;
			}
			const grid = el('div', { class: 'photo-grid' });
			body.appendChild(grid); // in the DOM first, so the column count the CSS resolves can be read
			// A collapsed card can't be measured; estimate from the window and let the
			// observer in buildPhotosCard redo it with the real count once it opens.
			const measured = photoColumns(grid);
			const cols = measured || Math.max(1, Math.floor((Math.min(window.innerWidth, 900) - 64 + 6.4) / (120 + 6.4)));
			const size = cols * PHOTO_ROWS_PER_PAGE;
			start = Math.min(Math.floor(start / size) * size, Math.floor((photos.length - 1) / size) * size);
			photosView = { body, album, start, cols: measured };
			const ids = photos.map((p) => p.id);
			photos.slice(start, start + size).forEach((photo, k) => {
				const btn = el('button', { type: 'button', class: 'photo-thumb', title: photo.caption || '', 'aria-label': photo.caption || 'Open photo' }, [
					el('img', { src: photo.thumb, alt: '', loading: 'lazy' }),
				]);

				grid.appendChild(btn);
			});

		}
		// The column count changes when the window resizes or the card is expanded;
		// either way the page size changes with it, so redraw the page that holds the
		// first photo now showing.
		function onPhotosBodyResize(body) {

			if (!view || view.body !== body || !body.isConnected) return;
			const grid = body.querySelector('.photo-grid');
			const cols = grid && photoColumns(grid);
			if (cols && cols !== view.cols) renderPhotos(body, view.album, view.start);
		}
		function loadPhotos(body) {
			fetchPhotos(false)
				.then((album) => { if (body.isConnected) renderPhotos(body, album); })
				.catch((err) => {
					if (!body.isConnected) return;
					body.textContent = '';
					body.appendChild(el('p', { class: 'task-empty', text: `Couldn't load photos. ${err.message}` }));
					appendPhotosFooter(body); // logged in, Refresh doubles as "try again"

		function buildPhotosCard() {
			const head = el('h2', { class: 'card-heading', text: 'Photos' });
			photosBodyEl = el('div', {}, [el('p', { class: 'task-empty', text: 'Loading…' })]);
			const card = el('div', { class: 'card' }, [head, photosBodyEl]);
			makeCollapsible(card, head, 'photos');
			loadPhotos(photosBodyEl);

					if (!body.isConnected) { observer.disconnect(); return; }
					requestAnimationFrame(() => onPhotosBodyResize(body));

		// ---- Equipment tab: Lures ------------------------------------------------
		// Favourite lures, each filed under a type of fishing, a body of water and a
		// location (api/_lib/fishlures.mjs, `?resource=fishlures`, public GET). The
		// card filters on whatever values the saved list holds; edits are made in the
		// Lures card on the Admin tab.
		const FISHING_TYPES = ['Ice', 'Open water', 'Fly', 'Other'];
		let lures = null; // null until the first read
		let luresState = 'loading'; // loading | ready | error
		let luresError = '';
		const lureFilter = { fishingType: '', waterBody: '', location: '', lureType: '' };
		const LURE_FACETS = [['fishingType', 'Type of fishing', 'All fishing'], ['waterBody', 'Body of water', 'All waters'], ['location', 'Location', 'All locations'], ['lureType', 'Lure type', 'All lure types']];

		function lureFacetValues(key) {
			const set = new Set();
			for (const l of lures) if (l[key]) set.add(l[key]);
			return [...set].sort((a, b) => a.localeCompare(b));
		}

		// The picture is a separate request per lure (never part of the lures list);
		// the URL carries the version token, so a changed photo is a new URL.
		const lurePhotoUrl = (l) => `${API_URL}?resource=fishlurephoto&id=${encodeURIComponent(l.id)}&v=${encodeURIComponent(l.photo)}`;
		function lurePhotoImg(l, extra = {}) {
			if (!l.photo) return null;
			return el('img', { class: 'lure-thumb', src: l.dataUrl || lurePhotoUrl(l), alt: `${l.name || 'Lure'} photo`, loading: 'lazy', ...extra });
		}
		// Shrinks a chosen picture in the browser to a small JPEG (longest side 240px,
		// about 10-20KB), so nothing large is ever uploaded or stored.
		function shrinkToJpeg(file) {
			return new Promise((resolve, reject) => {
				const url = URL.createObjectURL(file);
				const img = new Image();
				img.onload = () => {
					const scale = Math.min(1, 240 / Math.max(img.naturalWidth, img.naturalHeight));
					const canvas = document.createElement('canvas');
					canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
					canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
					const ctx = canvas.getContext('2d');
					ctx.fillStyle = '#fff'; // a transparent PNG would otherwise go black as a JPEG
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
					URL.revokeObjectURL(url);
					resolve(canvas.toDataURL('image/jpeg', 0.8));
				};
				img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file could not be read as a picture.')); };
				img.src = url;
			});
		}

		function buildLuresCard() {

						el('td', { class: 'lure-name' }, [el('div', { class: 'lure-name-cell' }, [lurePhotoImg(l), document.createTextNode(l.name)])]), el('td', { 'data-label': 'Fishing', text: l.fishingType }), el('td', { 'data-label': 'Lure type', text: l.lureType || '' }),
						el('td', { 'data-label': 'Body of water', text: l.waterBody || '' }), el('td', { 'data-label': 'Location', text: l.location || '' }), el('td', { class: 'lure-notes', 'data-label': 'Notes', text: l.notes || '' }),
					]));

			draw();

		function equipmentView() { return [buildLuresCard()]; }

		async function loadLures() {
			luresState = 'loading';
			try {
				const res = await fetch(`${API_URL}?resource=fishlures`, { cache: 'no-store' });
				const body = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
				if (!Array.isArray(body.lures)) throw new Error('unexpected response');

				luresState = 'ready';

				luresState = 'error';

				const old = luresCardEl;
				luresAdminCard();

			}

		// ---- Lures card on the Admin tab (login only) -------------------------------
		// Same draft-then-Save pattern as the Trips card: typing updates the draft in

		// whole list in one write.
		let luresDraft = null;
		let luresErrors = [];
		let luresSaving = false;
		let luresCardEl = null;
		const lureOpen = {};
		const copyLures = (list) => JSON.parse(JSON.stringify(list));
		const luresDirty = () => JSON.stringify(luresDraft.map(({ dataUrl, ...rest }) => rest)) !== JSON.stringify(lures.map((l) => ({ ...l, photo: l.photo || '' })));
		const newLureId = () => `l${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;

		function refreshLuresCard() {
			if (!luresCardEl) return;
			const next = buildLuresAdminCard();
			luresCardEl.replaceWith(next);
			luresCardEl = next;
		}

		async function saveLures() {
			luresErrors = [];
			luresSaving = true;
			refreshLuresCard();
			setStatus('Saving…');
			try {
				const res = await fetch(API_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
					body: JSON.stringify({ resource: 'fishlures', lures: luresDraft.map(({ dataUrl, ...rest }) => rest) }),
				});
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { luresSaving = false; expireSession(); return; }
				if (!res.ok) throw new Error((body.details && body.details.join(' ')) || body.error || `HTTP ${res.status}`);
				lures = body.lures;
				luresDraft = copyLures(lures);
				setStatus('Saved', 'ok');
			} catch (err) {
				luresErrors = [`Not saved: ${err.message}`];
				setStatus('');
			}
			luresSaving = false;
			refreshLuresCard();
		}

		function buildLureEditor(l, i) {
			const details = el('details', { class: 'trip-edit' }, [el('summary', { text: `${l.name || 'New lure'}${l.waterBody ? ` · ${l.waterBody}` : ''}${l.fishingType ? ` · ${l.fishingType}` : ''}` })]);
			details.open = !!lureOpen[l.id];
			details.addEventListener('toggle', () => { lureOpen[l.id] = details.open; });
			const typeSel = el('select', { class: 'task-input', 'aria-label': 'Type of fishing' });
			for (const t of FISHING_TYPES) { const o = el('option', { value: t, text: t }); o.selected = l.fishingType === t; typeSel.appendChild(o); }
			typeSel.addEventListener('change', () => { l.fishingType = typeSel.value; });
			// Existing values are offered as suggestions so the same lake isn't spelled three ways.
			const suggest = (key, listId) => {
				const dl = el('datalist', { id: listId });
				const seen = new Set();
				for (const x of luresDraft) if (x[key] && !seen.has(x[key])) { seen.add(x[key]); dl.appendChild(el('option', { value: x[key] })); }
				return dl;
			};
			const withList = (input, listId) => { input.setAttribute('list', listId); return input; };
			details.appendChild(el('div', { class: 'trip-fields' }, [
				labelled('Lure', textField(l, 'name', 'e.g. Jigging Rap, chartreuse', 'Lure')),
				labelled('Type of fishing', typeSel),
				labelled('Lure type', withList(textField(l, 'lureType', 'e.g. Jigging spoon', 'Lure type'), 'lure-types')),
			]));
			details.appendChild(el('div', { class: 'trip-fields' }, [
				labelled('Body of water', withList(textField(l, 'waterBody', 'e.g. Lake of the Woods', 'Body of water'), 'lure-waters')),
				labelled('Location', withList(textField(l, 'location', 'e.g. Baudette, MN', 'Location'), 'lure-locations')),
			]));
			details.appendChild(labelled('Notes', textField(l, 'notes', 'Depth, colour, how to work it…', 'Notes', '300')));
			// Photo: uploads the moment a file is chosen (login required, like every write
			// here), but the lure only points at it once the list is saved. Remove is
			// part of the draft too: the stored picture goes when the list is saved.
			const photoRow = el('div', { class: 'lure-photo-edit' });
			const msg = el('span', { class: 'fish-dim', role: 'status' });
			const file = el('input', { type: 'file', accept: 'image/*', 'aria-label': 'Lure photo' });
			file.addEventListener('change', async () => {
				const chosen = file.files && file.files[0];
				if (!chosen) return;
				msg.textContent = 'Uploading…';
				try {
					const image = await shrinkToJpeg(chosen);
					const res = await fetch(API_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
						body: JSON.stringify({ resource: 'fishlurephoto', id: l.id, image }),
					});
					const body = await res.json().catch(() => ({}));
					if (res.status === 401) { expireSession(); return; }
					if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
					l.photo = body.photo;
					l.dataUrl = image; // preview only; stripped before Save
					lureOpen[l.id] = true;
					refreshLuresCard();
				} catch (err) {
					msg.textContent = `Not uploaded: ${err.message}`;
				}
			});
			const preview = lurePhotoImg(l);
			if (preview) photoRow.appendChild(preview);
			photoRow.append(file);
			if (l.photo) photoRow.appendChild(smallBtn('Remove photo', 'Remove this lure\u2019s photo', () => { l.photo = ''; delete l.dataUrl; lureOpen[l.id] = true; refreshLuresCard(); }, 'task-add-btn'));
			photoRow.appendChild(msg);
			details.appendChild(photoRow);
			details.append(suggest('lureType', 'lure-types'), suggest('waterBody', 'lure-waters'), suggest('location', 'lure-locations'));
			const up = smallBtn('↑', 'Move up', () => { luresDraft.splice(i - 1, 0, luresDraft.splice(i, 1)[0]); refreshLuresCard(); });
			const down = smallBtn('↓', 'Move down', () => { luresDraft.splice(i + 1, 0, luresDraft.splice(i, 1)[0]); refreshLuresCard(); });
			up.disabled = i === 0;
			down.disabled = i === luresDraft.length - 1;
			details.appendChild(el('div', { class: 'trip-actions' }, [up, down, smallBtn('Remove lure', 'Remove this lure', () => {
				if (!confirm(`Remove ${l.name || 'this lure'}? It is gone for good once you Save.`)) return;
				luresDraft.splice(i, 1);
				refreshLuresCard();
			}, 'task-add-btn')]));
			return details;
		}

		function buildLuresAdminCard() {
			if (!luresDraft) luresDraft = copyLures(lures || []);
			const head = el('h2', { class: 'card-heading', text: `Lures (${luresDraft.length})` });
			const card = el('div', { class: 'card' }, [head]);
			makeCollapsible(card, head, 'luresEditor');
			for (let i = 0; i < luresDraft.length; i++) card.appendChild(buildLureEditor(luresDraft[i], i));
			if (!luresDraft.length) card.appendChild(el('div', { class: 'task-empty', text: 'No lures yet.' }));
			const add = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add a lure' });
			add.addEventListener('click', () => {
				// Starts from the newest lure's type, water and location, the usual run of entries.
				const last = luresDraft[0];
				const id = newLureId();
				lureOpen[id] = true;
				luresDraft.unshift({ id, name: '', fishingType: last ? last.fishingType : 'Ice', lureType: '', waterBody: last ? last.waterBody : '', location: last ? last.location : '', notes: '', photo: '' });
				refreshLuresCard();
			});
			const save = el('button', { type: 'button', class: 'task-add-btn', text: luresSaving ? 'Saving…' : 'Save' });
			save.disabled = luresSaving;
			save.addEventListener('click', saveLures);
			const discard = el('button', { type: 'button', class: 'task-add-btn', text: 'Discard changes' });
			discard.disabled = luresSaving || !luresDirty();
			discard.addEventListener('click', () => { luresDraft = copyLures(lures); luresErrors = []; refreshLuresCard(); });
			card.appendChild(el('div', { class: 'ql-actions' }, [add, save, discard]));
			if (luresErrors.length) card.appendChild(el('ul', { class: 'ql-errors' }, luresErrors.map((t) => el('li', { text: t }))));
			card.appendChild(el('div', { class: 'ql-note', text: 'Shown on the Equipment tab, which filters by type of fishing, body of water, location and lure type. Only the name and type of fishing are required. A photo is shrunk in your browser and uploads as soon as you choose it, but it shows on the Equipment tab only after you Save.' }));
			return card;
		}

		function luresAdminCard() {
			if (luresState !== 'ready') {
				const head = el('h2', { class: 'card-heading', text: 'Lures' });
				const card = el('div', { class: 'card' }, [head]);
				if (luresState === 'error') {
					const retry = el('button', { type: 'button', class: 'task-add-btn', text: 'Try again' });
					retry.addEventListener('click', loadLures);
					card.append(el('div', { class: 'message error', text: `Couldn’t load the lures (${luresError}).` }), retry);
				} else {
					card.appendChild(el('div', { class: 'message', text: 'Loading…' }));
				}
				luresCardEl = card;
				return card;
			}
			luresDraft = null;
			luresErrors = [];
			luresCardEl = buildLuresAdminCard();
			return luresCardEl;
		}

		// ---- Shell ---------------------------------------------------------------
		function setTab(next) {
			tab = next;
			try { localStorage.setItem(TAB_KEY, tab); } catch (e) { /* the tab still switches */ }
			setStatus('');
			editingTaskId = null;
			renderAll();
		}

		function renderTabs() {
			const nav = document.getElementById('tabs');
			nav.textContent = '';
			// Admin exists only while logged in; logging out removes it.
			for (const [id, label, loginOnly] of TABS) {
				if (loginOnly && !isLoggedIn()) continue;
				const btn = el('button', { type: 'button', class: `tab-btn${tab === id ? ' active' : ''}`, role: 'tab', 'aria-selected': String(tab === id), text: label });
				btn.addEventListener('click', () => setTab(id));
				nav.appendChild(btn);
			}
		}

		function renderAll() {
			if (!isLoggedIn() && tab === 'admin') tab = 'fishing';
			renderLogin();
			renderTabs();
			renderQuickLinks();
			const view = document.getElementById('view');
			view.textContent = '';
			tasksCardEl = null;
			qlCardEl = null;
			tripsCardEl = null;
			luresCardEl = null;
			const cards = tab === 'admin' ? [...adminView(), tripsAdminCard(), luresAdminCard()]
				: tab === 'photos' ? [buildPhotosCard()]
				: tab === 'equipment' ? equipmentView()
				: fishingView();
			cards.forEach((c) => view.appendChild(c));
		}

		function load() {
			renderAll();
			loadTrips();
			loadLures();
			// Not awaited: the bar fills in when it arrives, and a failure just
			// leaves it hidden.
			fetch(`${API_URL}?resource=fishquicklinks`, { cache: 'no-store' })
				.then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
				.then((body) => { quickLinks = Array.isArray(body.links) ? body.links : []; renderQuickLinks(); })
				.catch(() => { /* no toolbar */ });
		}

		load();
	</script>
</body>
</html>
