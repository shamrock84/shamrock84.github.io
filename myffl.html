<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>myFFL</title>
	<link rel="icon" type="image/png" sizes="32x32" href="https://shamrock84.github.io/fflicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="https://shamrock84.github.io/fflicons/favicon-16x16.png">
	<link rel="manifest" href="https://shamrock84.github.io/fflicons/site.webmanifest">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F2683">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#140f1e">
	<style>
		/* Minnesota Vikings palette: purple as the primary accent everywhere,
		   gold reserved specifically for highlighting the user's own team. */
		:root {
			--bg: #f5f3f9;
			--card-bg: #ffffff;
			--text: #1b1425;
			--muted: #6b6478;
			--border: #e3daf0;
			--accent: #4F2683;
			--chip-bg: #ede3f8;
			--taxi-bg: #eff6ff;
			--taxi-text: #1e40af;
			--ir-bg: #fef2f2;
			--ir-text: #991b1b;
			--gold: #FFC62F;
			--gold-text: #5c4300;
			--gold-chip-bg: #fff3d1;
			--gold-chip-text: #7a5c00;
			--stale-chip-bg: #000000;
			--stale-chip-text: #ffffff;
			--stale-chip-ring: transparent;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #140f1e;
				--card-bg: #1e1730;
				--text: #ede9f5;
				--muted: #a79bc2;
				--border: #362a4a;
				--accent: #b48ee0;
				--chip-bg: #2c2145;
				--taxi-bg: #0e2340;
				--taxi-text: #93c5fd;
				--ir-bg: #341313;
				--ir-text: #fca5a5;
				--gold: #FFC62F;
				--gold-text: #3d2e00;
				--gold-chip-bg: #3d2e05;
				--gold-chip-text: #f0c33e;
				/* Inverted against light: a black chip on a #1e1730 card reads as
				   a hole rather than a mark, so the season a league is stuck on
				   is the one white thing on a dark page. The ring keeps its
				   bottom edge from dissolving into the card. */
				--stale-chip-bg: #ffffff;
				--stale-chip-text: #000000;
				--stale-chip-ring: #000000;
			}
		}
		body::before {
			content: '';
			display: block;
			height: 4px;
			background: linear-gradient(90deg, var(--accent), var(--gold));
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}
		header {
			padding: 1.5rem 1rem 1rem;
			text-align: center;
		}
		header h1 {
			margin: 0 0 0.25rem;
		}
		.site-title {
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.site-logo {
			height: 64px;
			width: auto;
			display: block;
		}
		.site-logo-prefix {
			font-family: Georgia, 'Times New Roman', serif;
			font-weight: 400;
			font-size: 1.85rem;
			line-height: 1;
			color: var(--text);
			margin-right: 0.15rem;
			margin-top: 0.75rem;
		}
		@media (prefers-color-scheme: dark) {
			.site-logo {
				filter: invert(1);
			}
		}
		.updated-row {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.3rem;
		}
		#updated {
			color: var(--muted);
			font-size: 0.85rem;
		}
		.auth-control {
			display: flex;
			justify-content: center;
			margin-top: 0.4rem;
		}
		.auth-control:empty {
			margin-top: 0;
		}
		.auth-control .lineup-login {
			margin-top: 0;
		}
		.auth-status-text {
			font-size: 0.8rem;
			color: var(--muted);
			margin-right: 0.4rem;
		}
		.auth-logout-btn {
			background: none;
			border: none;
			color: var(--muted);
			font-size: 0.78rem;
			cursor: pointer;
			padding: 0;
			text-decoration: underline;
		}
		#sync-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 1.4rem;
			height: 1.4rem;
			padding: 0;
			border: none;
			border-radius: 50%;
			background: none;
			color: var(--muted);
			cursor: pointer;
		}
		#sync-btn:hover:not(:disabled) {
			background: var(--chip-bg);
			color: var(--accent);
		}
		#sync-btn:disabled {
			cursor: default;
			opacity: 0.6;
		}
		#sync-btn.spinning svg {
			animation: sync-spin 0.9s linear infinite;
		}
		@keyframes sync-spin {
			to { transform: rotate(360deg); }
		}
		#live-status {
			text-align: center;
			font-size: 0.78rem;
			margin-top: 0.5rem;
			color: var(--muted);
		}
		#live-status.live-error {
			color: var(--ir-text);
		}
		.tabs {
			display: flex;
			justify-content: center;
			gap: 0.5rem;
			margin-top: 1.25rem;
			flex-wrap: wrap;
			padding: 0 1rem;
		}
		.tab-btn {
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--muted);
			padding: 0.45rem 1rem;
			border-radius: 999px;
			font-size: 0.88rem;
			font-weight: 600;
			cursor: pointer;
		}
		.tab-btn.active {
			background: var(--accent);
			border-color: var(--accent);
			color: #fff;
		}
		.subtabs {
			margin-top: 0.6rem;
		}
		.subtabs .tab-btn {
			padding: 0.3rem 0.8rem;
			font-size: 0.78rem;
			background: transparent;
		}
		.subtabs .tab-btn.active {
			background: var(--chip-bg);
			border-color: var(--accent);
			color: var(--accent);
		}
		.controls {
			max-width: 480px;
			margin: 1rem auto 0;
			padding: 0 1rem;
		}
		.search-wrap {
			position: relative;
		}
		#search {
			width: 100%;
			padding: 0.6rem 2.2rem 0.6rem 0.9rem;
			border-radius: 999px;
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--text);
			font-size: 1rem;
		}
		/* Custom clear button replaces the inconsistent native one (Firefox
		   doesn't show one at all for type=search; WebKit's is hard to style). */
		#search::-webkit-search-cancel-button {
			display: none;
		}
		#search-clear {
			position: absolute;
			right: 0.5rem;
			top: 50%;
			transform: translateY(-50%);
			width: 1.5rem;
			height: 1.5rem;
			border: none;
			border-radius: 50%;
			background: transparent;
			color: var(--muted);
			font-size: 1.2rem;
			line-height: 1;
			cursor: pointer;
			padding: 0;
		}
		#search-clear:hover {
			background: var(--chip-bg);
			color: var(--text);
		}
		main {
			max-width: 1400px;
			margin: 0 auto;
			padding: 0.5rem 1rem 3rem;
		}
		#status {
			text-align: center;
			color: var(--muted);
			padding: 0;
		}
		#status:not(:empty) {
			padding: 2rem 0;
		}
		/* 440 rather than 400 because of the salary-cap cards: they carry two
		   extra columns (Salary, Yrs) plus ECR when logged in, and their table
		   bottoms out around 437px of content. Below that the Yrs dropdown gets
		   sliced off the right edge and player names start wrapping. A 400px
		   floor let iPad landscape (1366) fit a 3rd column at 434px, landing
		   squarely in that dead zone; 440 drops it to 2 columns instead. Costs
		   nothing at 1440/1920, which still fit 3. */
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr));
			gap: 1rem;
		}
		.card {
			background: var(--card-bg);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 1rem 1.1rem 1.2rem;
			display: flex;
			flex-direction: column;
		}
		.card-head {
			display: flex;
			flex-wrap: nowrap;
			align-items: flex-start;
			justify-content: space-between;
			gap: 0.4rem 0.5rem;
		}
		.card h2 {
			margin: 0;
			font-size: 1.15rem;
			overflow-wrap: break-word;
		}
		/* Take the width the badge strip beside it doesn't need — but only in
		   the head row. The card itself is a flex *column*, so applying this to
		   every h2 made a heading that's a direct child of the card (the two
		   analytics cards, Admin's "Leagues") absorb the card's leftover height
		   whenever the grid stretched it to match a taller neighbour, leaving a
		   gap under the title that grew with the neighbour. */
		.card-head h2 {
			min-width: 0;
			flex: 1 1 auto;
		}
		.card h2 a {
			color: var(--text);
			text-decoration: none;
		}
		.card h2 a:hover {
			color: var(--accent);
			text-decoration: underline;
		}
		.card h2 .rules-link {
			margin-left: 0.4rem;
			font-size: 0.85em;
			text-decoration: none;
			opacity: 0.75;
		}
		.card h2 .rules-link:hover {
			opacity: 1;
			text-decoration: none;
		}
		.badges {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 0.3rem;
			flex-shrink: 0;
		}
		/* More than 2 badges gets cramped on one line, especially on narrow
		   cards — cap the row width so a 3rd+ badge wraps to a second line
		   instead of squeezing the title or overflowing. */
		.badges.badges-wrap {
			max-width: 12.5rem;
		}
		.badge {
			display: inline-block;
			background: var(--chip-bg);
			color: var(--accent);
			border-radius: 999px;
			padding: 0.15rem 0.55rem;
			font-size: 0.68rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.03em;
			white-space: nowrap;
		}
		/* Gold is for the two facts about a league that aren't about the league
		   itself — where it's hosted and which season is being shown. Both sit
		   ahead of the purple chips, which describe the league's own format. */
		.badge-provider, .badge-season {
			background: var(--gold-chip-bg);
			color: var(--gold-chip-text);
		}
		/* A league still sitting on last season — its new league year isn't up
		   at the provider yet, so the whole card is a season behind the rest.
		   Gold-on-gold made that chip read as just another one of eighteen;
		   black-and-white is the only pairing on the page not already spoken
		   for, so the odd one out is visible without having to compare four
		   digits card by card. Which way round it runs is per theme, above.
		   The ring is an inset shadow rather than a border on purpose: .badges is
		   a flex row that stretches its chips to the tallest, so a real 1px
		   border would grow this chip and top-align the text in every chip
		   beside it. */
		.badge-season-stale {
			background: var(--stale-chip-bg);
			color: var(--stale-chip-text);
			box-shadow: inset 0 0 0 1px var(--stale-chip-ring);
		}
		/* Badges always stay to the right of the title (card-head is nowrap,
		   never drops badges to their own row) — the title just shrinks and
		   wraps onto more lines to make room, via min-width:0 +
		   overflow-wrap:break-word above. On narrow screens a long title and
		   its badges get tight, so wrap more aggressively there: cap the
		   badges row tighter so it takes less width, leaving more for the
		   title to wrap into. */
		@media (max-width: 600px) {
			.badges,
			.badges.badges-wrap {
				max-width: 6.5rem;
			}
		}
		.card .team {
			color: var(--muted);
			font-size: 0.85rem;
			margin: 0.15rem 0 0.75rem;
		}
		/* Roster cards get their breathing room for free — the team-name line
		   sits between the title/badges and the table. Standings and scoring
		   cards have no such line and run straight from the badges into a dense
		   table, which reads as cramped, so give their heads the gap directly. */
		.card[data-view="standings"] .card-head,
		.card[data-view="scoring"] .card-head {
			margin-bottom: 0.9rem;
		}
		/* The scoring card's week line is the one thing that does follow the
		   head; drop its own top margin so it doesn't stack on top of the gap. */
		.card[data-view="scoring"] .card-head + .team {
			margin-top: 0;
		}
		.error-box {
			background: var(--ir-bg);
			color: var(--ir-text);
			border-radius: 8px;
			padding: 0.6rem 0.75rem;
			font-size: 0.85rem;
		}
		/* Cross-league problems digest — the strip above the grid collecting
		   everything that needs attention, so eighteen leagues don't have to
		   be walked one by one to find the card that's on fire. Absent
		   entirely when there's nothing to say: an all-clear banner would
		   train the eye to skip the one spot where real problems appear. */
		.problems-digest {
			/* Same light gold as the Provider/Year badges (--gold-chip-*,
			   see .badge-provider/.badge-season) rather than the plain card
			   background — the strip reads as "flagged" the moment you see
			   it, the same visual language the badges already use for
			   "metadata worth noticing," instead of needing the left border
			   alone to carry that. */
			background: var(--gold-chip-bg);
			border: 1px solid var(--border);
			border-left: 4px solid var(--gold);
			border-radius: 12px;
			padding: 0.65rem 0.9rem;
			margin-bottom: 1rem;
		}
		.digest-head {
			font-size: 0.78rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--gold-chip-text);
			margin-bottom: 0.3rem;
		}
		.digest-row {
			display: flex;
			align-items: baseline;
			gap: 0.5rem;
			width: 100%;
			background: none;
			border: none;
			text-align: left;
			padding: 0.22rem 0;
			font-size: 0.85rem;
			font-family: inherit;
			color: var(--text);
			cursor: pointer;
		}
		.digest-row:hover .digest-label { text-decoration: underline; }
		.digest-dot {
			flex: none;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--gold);
			position: relative;
			top: -1px;
		}
		.digest-alert .digest-dot { background: var(--ir-text); }
		.digest-league {
			flex: none;
			font-weight: 600;
			color: var(--accent);
		}
		.digest-player { font-weight: 600; }
		/* A power rank that can't be computed yet — an offseason with no
		   projections published, mostly. Muted so a column of them reads as
		   "not yet" rather than competing with the ranks beside it. */
		.power-tbd {
			color: var(--muted);
			font-size: 0.8rem;
		}
		/* Team count, riding with the league name so the rank columns can be
		   bare numbers. Muted and smaller — it identifies the row rather than
		   competing with the ranks. */
		.power-size {
			color: var(--muted);
			font-weight: 400;
			font-size: 0.85em;
		}
		/* The summary column: the one number to read if you read one. */
		.power-avg { font-weight: 600; }
		/* "Studs" and "Sleepers" sub-lines under a league's name (see
		   powerPlayersLine) — same treatment as the exposure cards' leagueLine
		   under a player's name (.exposure-leagues), just under a different
		   kind of row, and shared by both lines the same way that class is
		   shared by "Free in"/"Own in". */
		.power-players {
			color: var(--muted);
			font-size: 0.72rem;
			margin-top: 0.1rem;
		}
		.power-players-label {
			opacity: 0.7;
			text-transform: uppercase;
			font-size: 0.62rem;
			letter-spacing: 0.03em;
		}
		.group-label {
			font-size: 0.72rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
			margin: 0.75rem 0 0.35rem;
		}
		.group-label:first-of-type { margin-top: 0; }
		.lineup-login {
			margin-top: 0.6rem;
		}
		.lineup-login-toggle {
			background: none;
			border: none;
			color: var(--accent);
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
			padding: 0;
		}
		.lineup-login-toggle:hover {
			text-decoration: underline;
		}
		.lineup-login-form {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-top: 0.4rem;
			flex-wrap: wrap;
		}
		.lineup-login-form input[type="password"] {
			flex: 1;
			min-width: 0;
			padding: 0.4rem 0.6rem;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--text);
			font-size: 0.85rem;
		}
		.lineup-login-form button[type="submit"] {
			border: 1px solid var(--accent);
			background: var(--accent);
			color: #fff;
			padding: 0.4rem 0.8rem;
			border-radius: 6px;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
		}
		.lineup-login-form button[type="submit"]:disabled {
			opacity: 0.6;
			cursor: default;
		}
		.lineup-login-status {
			font-size: 0.78rem;
			color: var(--ir-text);
		}
		.lineup-editor-actions {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			margin-top: 0.6rem;
			flex-wrap: wrap;
		}
		.lineup-save-btn {
			border: 1px solid var(--accent);
			background: var(--accent);
			color: #fff;
			padding: 0.4rem 0.9rem;
			border-radius: 999px;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
		}
		.lineup-save-btn:disabled {
			opacity: 0.6;
			cursor: default;
		}
		.lineup-logout-btn {
			background: none;
			border: none;
			color: var(--muted);
			font-size: 0.78rem;
			cursor: pointer;
			padding: 0;
			text-decoration: underline;
		}
		.lineup-editor-status {
			font-size: 0.8rem;
			color: var(--muted);
		}
		.lineup-requirements {
			font-size: 0.78rem;
			color: var(--muted);
		}
		.lineup-editor-note {
			margin-top: 0.6rem;
			font-size: 0.78rem;
			color: var(--muted);
		}
		/* Only when the checkbox column exists at all — logged out, it's
		   omitted entirely (see buildLineupEditor's `visible` gate), so the
		   first column is the position chip and shouldn't be squeezed to
		   checkbox width. */
		table.lineup-editor-table:not(.read-only) td:first-child {
			width: 1.6rem;
		}
		table.lineup-editor-table input[type="checkbox"] {
			width: 1.05rem;
			height: 1.05rem;
			cursor: pointer;
		}
		table.roster {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		/* Salary-cap tables only (see buildRosterTable). A table can't lay out
		   narrower than its own min-content, so on a card too narrow for eight
		   columns it simply overflowed and the Yrs dropdown was cut off with no
		   way to reach it. Scrolling the overflow is the only honest option at
		   that width. No min-width: any fixed number here would force a scroll
		   on cards that fit fine, which is exactly what the table's intrinsic
		   minimum already expresses. */
		.roster-scroll {
			overflow-x: auto;
		}
		table.roster tr.player-row td {
			padding: 0.3rem 0.2rem;
			border-bottom: 1px solid var(--border);
		}
		table.roster tr.player-row:last-child td {
			border-bottom: none;
		}
		table.roster tr.player-row.pos-boundary td {
			border-top: 2px solid color-mix(in srgb, var(--accent) 70%, var(--border));
			padding-top: 0.4rem;
		}
		table.salary-summary {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.85rem;
			margin-top: 0.4rem;
		}
		table.salary-summary td {
			padding: 0.3rem 0.2rem;
			border-top: 1px solid var(--border);
		}
		table.salary-summary td:first-child {
			color: var(--muted);
		}
		table.salary-summary td:last-child {
			text-align: right;
			font-variant-numeric: tabular-nums;
			font-weight: 600;
		}
		table.salary-summary tr.salary-total td {
			font-weight: 600;
			color: var(--text);
		}
		table.salary-summary tr.salary-cap-room td {
			font-weight: 700;
			color: var(--accent);
		}
		table.salary-summary tr.salary-cap-room.salary-negative td {
			color: var(--ir-text);
		}
		/* Total/Cap Room when they include at least one locally-planned salary
		   standing in for a real one — dashed underline on the dollar figure
		   itself flags "this number isn't fully official yet" without
		   demoting its visual weight the way italics would. Hover for why. */
		table.salary-summary tr.salary-has-plan td:last-child {
			text-decoration: underline dashed;
			text-underline-offset: 0.15rem;
		}
		.pos-chip {
			display: inline-block;
			min-width: 2rem;
			text-align: center;
			background: var(--chip-bg);
			color: var(--accent);
			border-radius: 6px;
			padding: 0.1rem 0.35rem;
			font-size: 0.72rem;
			font-weight: 600;
		}
		.player-name {
			font-weight: 500;
		}
		/* A name that links to FantasyPros still has to read as a name first —
		   a roster of blue underlines would be unreadable — so it takes the
		   surrounding colour and only underlines on hover, the same treatment
		   the league-name link in a card head gets. */
		.player-link {
			color: inherit;
			text-decoration: none;
		}
		.player-link:hover {
			text-decoration: underline;
		}
		.injury-badge {
			color: var(--ir-text);
			font-weight: 600;
			margin-left: 0.35rem;
			font-size: 0.78rem;
		}
		/* The NFL team, on every table that names a player — rosters, lineups and
		   all three analytics cards (see appendTeamSuffix). None of them spend a
		   column on it. Muted and lighter than the name so the eye still reads
		   the name first. nowrap keeps the code together; the space before it, in
		   the DOM, is what lets the line break there. */
		.team-suffix {
			color: var(--muted);
			font-weight: 400;
			font-size: 0.78em;
			white-space: nowrap;
		}
		/* Phone widths, salary-cap tables only — two steps, because how much has
		   to give depends on how much width there is.

		   Step one: tighter cell padding, type untouched. With Team folded into
		   the name (see appendTeamSuffix) that alone brings the table to 340px,
		   which fits every large iPhone — Pro Max, Plus — at full size. Those
		   phones were only ever a pixel or two short, so shrinking their type
		   would be spending readability on nothing. */
		@media (max-width: 480px) {
			table.roster-auction tr.player-row td {
				padding: 0.3rem 0.1rem;
			}
			table.roster-auction tr.roster-head th {
				padding: 0 0.1rem 0.3rem;
			}
		}
		/* Step two: below ~410px there is no longer room for full-size type —
		   a 393px iPhone is 38px short and no amount of padding closes that —
		   so shrink here and only here. The cutoff is where step one stops
		   fitting: 340px of table needs about 409px of viewport. */
		@media (max-width: 409px) {
			table.roster-auction {
				font-size: 0.7rem;
			}
			/* td, not the bare class: those classes sit on the header cells too,
			   and 0.66rem is fractionally larger than the 0.65rem headers
			   already use — so an unscoped rule would grow the headers at the
			   exact width where everything else shrinks. */
			table.roster-auction td.salary-cell,
			table.roster-auction td.years-cell,
			table.roster-auction td.bye-cell,
			table.roster-auction td.ecr-cell,
			table.roster-auction td.pts-cell {
				font-size: 0.66rem;
			}
			table.roster-auction tr.player-row td {
				padding: 0.26rem 0.1rem;
			}
			table.roster-auction select {
				font-size: 0.66rem;
			}
			table.roster-auction .pos-chip {
				font-size: 0.58rem;
				padding: 0.1rem 0.28rem;
			}
		}
		tr.roster-head th {
			text-align: left;
			font-size: 0.65rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			padding: 0 0.2rem 0.3rem;
			font-weight: 600;
		}
		.salary-cell,
		.years-cell,
		.bye-cell,
		.ecr-cell,
		.pts-cell {
			text-align: right;
			font-variant-numeric: tabular-nums;
			font-size: 0.82rem;
			color: var(--muted);
		}
		tr.roster-head th.salary-cell,
		tr.roster-head th.years-cell,
		tr.roster-head th.bye-cell,
		tr.roster-head th.ecr-cell,
		tr.roster-head th.pts-cell {
			text-align: right;
		}
		.pts-cell.pts-prior-year {
			font-style: italic;
		}
		/* Yrs cell when standing in for a not-yet-official MFL contract length —
		   a compact select, styled like a chip so it reads as "editable/
		   unofficial" rather than a plain data value like the rest of the row. */
		.years-select {
			font: inherit;
			font-size: 0.82rem;
			color: var(--accent);
			background: var(--chip-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 0.05rem 0.15rem;
			text-align: right;
		}
		/* No length planned yet: carry the same gold as the card's
		   contract-due banner and the ⚠ icon beside it, so every part of that
		   one outstanding task reads as the same colour. Picking a length
		   switches it back to the purple chip above — the treatment every
		   other editable value on the row uses — which is what makes the
		   remaining gold ones scannable. */
		.years-select.years-select-unset {
			color: var(--gold-chip-text);
			background: var(--gold-chip-bg);
			border-color: color-mix(in srgb, var(--gold-chip-text) 35%, var(--border));
		}
		/* Salary cell's own not-yet-official planning dropdown — visually the
		   same treatment as .years-select but kept as a separate rule so the
		   two can diverge independently later. */
		.salary-select {
			font: inherit;
			font-size: 0.82rem;
			color: var(--accent);
			background: var(--chip-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 0.05rem 0.15rem;
			text-align: right;
		}
		/* Top-24 overall gets the accent treatment so the studs on a roster
		   stand out at a glance without having to read every row. */
		.ecr-cell.ecr-elite {
			color: var(--accent);
			font-weight: 600;
		}
		.rankings-note {
			margin-top: 0.6rem;
			font-size: 0.7rem;
			color: var(--muted);
		}
		tr.status-taxi_squad .pos-chip,
		tr.status-injured_reserve .pos-chip {
			opacity: 0.9;
		}
		.status-taxi_squad { background: var(--taxi-bg); }
		.status-injured_reserve { background: var(--ir-bg); }
		.contract-warn-icon {
			color: var(--gold-chip-text);
			margin-right: 0.25rem;
			cursor: help;
		}
		/* Follows the dropdown beside it (see .years-select-unset): once a
		   length is planned the whole cell reads purple, so the gold still on
		   screen is exactly what's left to do. */
		.contract-warn-icon.contract-warn-planned {
			color: var(--accent);
		}
		.needs-contract-banner {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.6rem;
			margin-bottom: 0.5rem;
			padding: 0.4rem 0.6rem;
			border-radius: 8px;
			background: var(--gold-chip-bg);
			color: var(--gold-chip-text);
			font-size: 0.8rem;
			font-weight: 600;
		}
		/* Every length planned: the banner stops being a task and becomes a
		   status line, so it takes the purple chip the planned rows already
		   wear. Gold anywhere on the card then means work outstanding, with no
		   exceptions to read past. */
		.needs-contract-banner.contract-banner-planned {
			background: var(--chip-bg);
			color: var(--accent);
		}
		/* Stays gold even when the banner around it goes purple. Planning a
		   length here and emailing the commissioner are different acts, and
		   nothing on this page can tell whether the mail was ever sent — so
		   the link keeps calling for action rather than joining a done state
		   it has no evidence for. */
		.contract-email-link {
			flex-shrink: 0;
			color: var(--gold-chip-text);
			text-decoration: underline;
			white-space: nowrap;
		}
		table.standings {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		table.standings th {
			text-align: left;
			font-size: 0.68rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			padding: 0 0.2rem 0.4rem;
		}
		table.standings td {
			padding: 0.3rem 0.2rem;
			border-bottom: 1px solid var(--border);
		}
		table.standings tr:last-child td { border-bottom: none; }
		table.standings th:not(:first-child),
		table.standings td:not(:first-child) {
			text-align: right;
		}
		/* Sortable analytics headers. The arrow is the only affordance a header
		   gets until you hover, since three of these tables sit on one tab and a
		   permanent marker on every sortable column is more noise than signal —
		   the columns that sort are the short numeric ones, which is learnable in
		   one click. */
		th.sortable {
			cursor: pointer;
			user-select: none;
			-webkit-user-select: none;
		}
		th.sortable:hover {
			color: var(--text);
		}
		.sort-arrow {
			font-size: 0.85em;
			opacity: 0.85;
		}
		tr.me-row td {
			font-weight: 700;
			/* Same light yellow as the Provider/Year badges (--gold-chip-*)
			   rather than the full-strength --gold used for warning states
			   (the contract banner, the problems digest) — a highlighted
			   row isn't a warning, and sharing the badge tokens keeps the
			   two "this is mine" and "this is metadata" yellows visually
			   related instead of one reading as an alert. */
			background: var(--gold-chip-bg);
			color: var(--gold-chip-text);
		}
		.exposure-leagues {
			color: var(--muted);
			font-size: 0.72rem;
			margin-top: 0.1rem;
		}
		/* Top Available carries two sub-lines — the leagues a free agent is
		   free in, and the ones you already hold him in — so each needs naming.
		   Dimmer than the names it introduces, since it's the smaller half of
		   the line. */
		.exposure-leagues-label {
			opacity: 0.7;
			text-transform: uppercase;
			font-size: 0.62rem;
			letter-spacing: 0.03em;
		}
		/* What the injury actually is, under the name rather than in a column of
		   its own. The table already carries six columns on Top Available and a
		   seventh of variable-length prose is the first thing to break on a
		   phone — and this is the same call the NFL team makes when it rides as
		   a suffix instead of a column. Sits between the name and the league
		   line, both of which are about the player rather than the injury.

		   Red rather than the grey the league line below it uses, and the same
		   --ir-text the Status column and the roster IR badge already carry, so
		   the injury reads as one thing across the row instead of a red code
		   beside a grey explanation of it. That variable is defined in both the
		   light and dark blocks (#991b1b against #fca5a5) — a literal here would
		   be unreadable in one of them. */
		.injury-detail {
			color: var(--ir-text);
			font-size: 0.72rem;
			margin-top: 0.1rem;
		}
		/* Injury Exposure's Status column. Same red as the badge beside a name
		   on a roster card, since it's the same designation — here it's a column
		   of its own rather than a badge, so no parentheses. */
		.injury-status-cell {
			color: var(--ir-text);
			font-weight: 600;
		}
		.pager {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.75rem;
			margin-top: 0.75rem;
		}
		.pager-btn {
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--accent);
			padding: 0.3rem 0.8rem;
			border-radius: 999px;
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
		}
		.pager-btn:disabled {
			opacity: 0.4;
			cursor: default;
		}
		.pager-label {
			font-size: 0.78rem;
			color: var(--muted);
		}
		.hidden { display: none !important; }
		/* Admin tab. The grid is a responsive multi-column layout, but this
		   card holds the full league list — let it span every column instead of
		   being squeezed into one. */
		.admin-card {
			grid-column: 1 / -1;
		}
		.admin-note {
			font-size: 0.85rem;
			color: var(--muted);
			margin-top: 0.5rem;
		}
		/* Every explanatory line in one block below the buttons: read once, then
		   ignored, so it shouldn't sit between you and the thing you came to edit.
		   Ruled off rather than merely spaced, since it follows the Save row and
		   would otherwise read as a caption for it. */
		.admin-legend {
			font-size: 0.75rem;
			color: var(--muted);
			line-height: 1.45;
			margin-top: 1.1rem;
			padding-top: 0.7rem;
			border-top: 1px solid var(--border);
		}
		.admin-legend h3 {
			margin: 0 0 0.35rem;
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			font-weight: 600;
			color: var(--accent);
		}
		.admin-legend ul {
			margin: 0;
			padding-left: 1.1rem;
		}
		.admin-legend li {
			margin-bottom: 0.25rem;
		}
		/* One collapsible card per league, replacing a thirteen-column table
		   that only fitted by scrolling sideways — which on a phone scrolled the
		   league's own name out of view before you reached the field you were
		   editing. */
		.admin-list {
			display: flex;
			flex-direction: column;
			gap: 0.45rem;
		}
		.admin-league {
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 0.5rem 0.6rem;
		}
		.admin-league.admin-open {
			border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
		}
		.admin-league-head {
			display: flex;
			align-items: center;
			gap: 0.4rem;
		}
		.admin-grip {
			color: var(--muted);
			cursor: grab;
			line-height: 1;
			flex-shrink: 0;
		}
		.admin-league-head:active .admin-grip {
			cursor: grabbing;
		}
		/* The whole head is the disclosure target, so a mis-aimed tap still
		   opens the card rather than doing nothing. */
		.admin-disclosure {
			display: flex;
			align-items: center;
			gap: 0.35rem;
			flex: 1;
			min-width: 0;
			font: inherit;
			text-align: left;
			color: var(--text);
			background: none;
			border: 0;
			padding: 0.1rem 0;
			cursor: pointer;
		}
		/* Sized up from 0.7rem, where next to a bold title it read as a bullet
		   rather than a control you can press. Fixed width and centred because ▸
		   and ▾ have different advance widths, which would otherwise shift the
		   league name sideways every time a card opened. */
		.admin-caret {
			color: var(--accent);
			font-size: 1.15rem;
			line-height: 1;
			width: 0.95rem;
			text-align: center;
			flex-shrink: 0;
		}
		.admin-league-name {
			font-weight: 600;
			font-size: 0.9rem;
			min-width: 0;
			overflow-wrap: break-word;
		}
		/* Deliberately its own flex row rather than the shared .badges: that
		   caps its width at 6.5rem under 600px to protect a card title, which
		   here would stack four badges into a column. */
		.admin-badges {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 0.25rem;
			flex-shrink: 0;
			max-width: 45%;
		}
		/* Narrow screens: give the league name the full width and let the badges
		   drop to their own line, rather than wrapping a three-word name into
		   three lines to keep four chips beside it. */
		@media (max-width: 600px) {
			.admin-league-head {
				flex-wrap: wrap;
			}
			.admin-badges {
				order: 3;
				flex-basis: 100%;
				max-width: 100%;
				justify-content: flex-start;
				margin-left: 1.8rem;
			}
		}
		/* Touch devices don't fire HTML5 drag events at all, so don't show a grip
		   advertising a gesture that cannot work there — ↑/↓ is the way to
		   reorder on a phone. */
		@media (hover: none) {
			.admin-grip {
				display: none;
			}
		}
		.admin-blurb {
			color: var(--muted);
			font-size: 0.75rem;
			line-height: 1.4;
			margin: 0.15rem 0 0 1.8rem;
		}
		/* However many columns fit, one on a phone. This is the bit that removes
		   the horizontal scrolling, so don't pin it to a fixed column count. */
		.admin-fields {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
			gap: 0.5rem 0.6rem;
			margin-top: 0.6rem;
			padding-top: 0.6rem;
			border-top: 1px solid var(--border);
		}
		.admin-field {
			display: flex;
			flex-direction: column;
			gap: 0.2rem;
			min-width: 0;
		}
		/* 1 / -1 rather than span 2: with auto-fit down to a single column, a
		   2-column span would conjure an implicit second column and reintroduce
		   the sideways scroll this whole layout exists to remove. */
		.admin-field-wide {
			grid-column: 1 / -1;
		}
		.admin-field-check {
			flex-direction: row;
			align-items: center;
			gap: 0.4rem;
			cursor: pointer;
		}
		.admin-field-label {
			font-size: 0.68rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			font-weight: 600;
		}
		/* Per-league notices. The Admin tab shows config values while every other
		   tab shows synced values, and nothing used to say when the two disagreed —
		   which made a wrong team ID look like a save that silently reverted. */
		.admin-notice {
			font-size: 0.72rem;
			line-height: 1.4;
			margin: 0.3rem 0 0 1.8rem;
			padding: 0.25rem 0.5rem;
			border-radius: 5px;
			background: var(--chip-bg);
			color: var(--accent);
		}
		.admin-notice-error {
			background: var(--ir-bg);
			color: var(--ir-text);
		}
		.admin-league-actions {
			display: flex;
			justify-content: flex-end;
			margin-top: 0.5rem;
		}
		/* Drag feedback. Insets rather than borders so showing where a card will
		   land doesn't nudge every card below it by a pixel. */
		.admin-league.admin-dragging {
			opacity: 0.4;
		}
		.admin-league.admin-drop-before {
			box-shadow: inset 0 3px 0 0 var(--accent);
		}
		.admin-league.admin-drop-after {
			box-shadow: inset 0 -3px 0 0 var(--accent);
		}
		.admin-name-pending {
			color: var(--muted);
			font-style: italic;
		}
		.admin-move {
			display: flex;
			gap: 0.2rem;
			flex-shrink: 0;
		}
		.admin-icon-btn {
			font: inherit;
			font-size: 0.8rem;
			line-height: 1;
			color: var(--accent);
			background: var(--chip-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 0.2rem 0.35rem;
			cursor: pointer;
		}
		.admin-icon-btn:disabled {
			opacity: 0.35;
			cursor: default;
		}
		.admin-remove-btn {
			color: var(--ir-text);
			background: var(--ir-bg);
		}
		.admin-add-row {
			margin-top: 0.7rem;
		}
		.admin-add-btn, .admin-revert-btn {
			font: inherit;
			font-size: 0.85rem;
			color: var(--accent);
			background: transparent;
			border: 1px solid var(--accent);
			border-radius: 999px;
			padding: 0.35rem 0.9rem;
			cursor: pointer;
		}
		.admin-revert-btn:disabled {
			opacity: 0.5;
			cursor: default;
		}
		/* Server-side validation failures, one per line — these are the only
		   thing standing between a typo and a silently broken sync, so they get
		   the error treatment rather than a muted note. */
		.admin-problems {
			margin: 0.6rem 0 0;
			padding: 0.6rem 0.75rem 0.6rem 1.6rem;
			background: var(--ir-bg);
			color: var(--ir-text);
			border-radius: 8px;
			font-size: 0.82rem;
			line-height: 1.5;
		}
		footer {
			text-align: center;
			color: var(--muted);
			font-size: 0.8rem;
			padding-bottom: 2rem;
		}
		footer a { color: var(--accent); }
	</style>
</head>
<body>
	<header>
		<h1 class="site-title">
			<span class="site-logo-prefix">my</span>
			<img src="images/ffl_black.gif" alt="FFL" class="site-logo">
		</h1>
		<div class="updated-row">
			<span id="updated">Loading&hellip;</span>
			<button type="button" id="sync-btn" aria-label="Sync now" title="Sync now">
				<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="23 4 23 10 17 10"></polyline>
					<polyline points="1 20 1 14 7 14"></polyline>
					<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
				</svg>
			</button>
		</div>
		<div id="auth-control" class="auth-control"></div>
	</header>
	<div class="tabs" id="tabs" role="tablist"></div>
	<div class="tabs subtabs" id="subtabs" role="tablist"></div>
	<div id="live-status" class="hidden"></div>
	<div class="controls">
		<div class="search-wrap">
			<input type="search" id="search" placeholder="Filter by player name&hellip;" autocomplete="off">
			<button type="button" id="search-clear" class="hidden" aria-label="Clear search">&times;</button>
		</div>
	</div>
	<main>
		<div id="digest" class="problems-digest hidden"></div>
		<div id="status"></div>
		<div id="grid" class="grid"></div>
	</main>
	<footer>
		Data pulled from <a href="https://www.myfantasyleague.com" target="_blank" rel="noopener">MyFantasyLeague</a>, <a href="https://www.espn.com/fantasy/football/" target="_blank" rel="noopener">ESPN</a>, and/or <a href="https://sleeper.com" target="_blank" rel="noopener">Sleeper</a> via a scheduled sync.
	</footer>

	<script>
		const STATUS_GROUPS = [
			{ key: 'ROSTER', label: 'Active Roster' },
			{ key: 'TAXI_SQUAD', label: 'Taxi Squad' },
			{ key: 'PRACTICE_SQUAD', label: 'Practice Squad' },
			{ key: 'INJURED_RESERVE', label: 'Injured Reserve' },
		];

		function timeAgo(iso) {
			if (!iso) return 'never';
			const diffMs = Date.now() - new Date(iso).getTime();
			const mins = Math.round(diffMs / 60000);

		const PLAN_PENDING_KEY = 'myfflPlanPending';

		}

			const out = emptyPlanEdits();
			for (const kind of PLAN_KINDS) {

		// everywhere else on the page — but within each group, best overall
		// ECR sorts first. Unranked players (FantasyPros doesn't cover every
		// deep-bench/taxi stash) fall to the end of their position group in
		// whatever order they arrived in, which is already position-then-name
		// from the sync (see providers.mjs), rather than scattering randomly.
		function sortByPositionThenEcr(players) {
			return [...players].sort(
				(a, b) => positionRank(a.position) - positionRank(b.position) || (a.ecr?.rank ?? Infinity) - (b.ecr?.rank ?? Infinity)
			);
		}

		// Yrs cell for an auction/salary-cap roster row. A real contract length
		// from MFL always wins; only when MFL hasn't set one yet (blank OR a
		// literal 0 — MFL sends this field as a string, so "0" is truthy and
		// needs an explicit numeric check, not just `if (p.contractYear)`)
		// does this fall back to a local planning dropdown (1/2/3 years) so a
		// manager can pencil in how long they intend to keep a player before
		// it's official.
		//
		// The dropdown and whatever's been planned are only shown while
		// logged in — this page has no per-viewer access control, so anyone
		// with the URL sees it logged out, including league mates. A planned
		// contract length is exactly the kind of strategy that shouldn't leak
		// to them; logged out, an unset value renders as a plain "—", the
		// same thing the API itself actually returned.
		function buildYearsCell(p, leagueId, onContractChange) {
			if (Number(p.contractYear) > 0) {
				return el('td', { class: 'years-cell', text: String(p.contractYear) });
			}
			// Contracts are due every offseason in early September — flag it
			// with an icon (and see the card-level banner in renderCard)
			// rather than leaving it as just another blank dash to spot.
			const warnIcon = el('span', {
				class: 'contract-warn-icon',
				title: 'Contract length not set yet — due early September',
				text: '⚠',
			});
			if (!isLoggedIn()) {
				return el('td', { class: 'years-cell' }, [warnIcon, el('span', { text: '—' })]);
			}
			const td = el('td', { class: 'years-cell years-cell-plan' }, [warnIcon]);
			const select = el('select', { class: 'years-select', title: 'Plan a contract length — not official until MFL sets one' });
			for (const value of ['', '1', '2', '3']) {
				select.appendChild(el('option', { value, text: value || '—' }));
			}
			select.value = getContractPlan(leagueId, p.id);
			// Gold while the length is still unplanned, purple once it's set —
			// see .years-select-unset. The icon tracks the control rather than
			// keeping its own colour, so a planned row goes purple as a whole
			// and the gold left on screen is exactly the work outstanding.
			// Re-synced on change rather than set once, so clearing a plan back
			// to "—" returns both to gold.
			// A plain ✓/⚠ rather than ✅/⚠️: the emoji forms carry their own
			// colour and would ignore the gold/purple the rest of the cell is
			// switching between.
			const syncPlanState = () => {
				const planned = !!select.value;
				select.classList.toggle('years-select-unset', !planned);
				warnIcon.classList.toggle('contract-warn-planned', planned);
				warnIcon.textContent = planned ? '✓' : '⚠';
				warnIcon.title = planned
					? 'Contract length planned — not official until MFL sets one'
					: 'Contract length not set yet — due early September';
			};
			syncPlanState();
			select.addEventListener('change', () => {
				setContractPlan(leagueId, p.id, select.value);
				syncPlanState();
				if (onContractChange) onContractChange();
			});
			td.appendChild(select);
			return td;
		}

		// Salary cell for an auction/salary-cap roster row. Same shape as
		// buildYearsCell (a real value from MFL always wins; blank OR a
		// literal 0 falls back to a local planning dropdown), gated by its own
		// independent condition and storage — see SALARY_PLAN_STORAGE_KEY.
		// $200 is the top of MFL's own salary UI, so the dropdown spans 1-200.
		// onSalaryChange (optional) fires after every save so the cap summary
		// — which folds this plan into Total/Cap Room, see effectiveSalary —
		// can rebuild itself immediately instead of going stale until reload.
		//
		// Same login gate as buildYearsCell, same reason: a planned salary is
		// strategy, and this page has no viewer-level access control — logged
		// out, an unset value renders as a plain "—" instead of the dropdown.
		function buildSalaryCell(p, leagueId, onSalaryChange) {
			if (Number(p.salary) > 0) {
				return el('td', { class: 'salary-cell', text: `$${Number(p.salary).toFixed(2)}` });
			}
			if (!isLoggedIn()) {
				return el('td', { class: 'salary-cell', text: '—' });
			}
			const td = el('td', { class: 'salary-cell salary-cell-plan' });
			const select = el('select', { class: 'salary-select', title: 'Plan a salary — not official until MFL sets one' });
			select.appendChild(el('option', { value: '', text: '—' }));
			for (let dollars = 1; dollars <= 200; dollars++) {
				select.appendChild(el('option', { value: String(dollars), text: `$${dollars.toFixed(2)}` }));
			}
			select.value = getSalaryPlan(leagueId, p.id);
			select.addEventListener('change', () => {
				setSalaryPlan(leagueId, p.id, select.value);
				onSalaryChange?.();
			});
			td.appendChild(select);
			return td;
		}

		// The NFL team rides on the name cell rather than holding a column of its
		// own — it reads fine as a suffix, and giving the width back to the name
		// is what stops long names wrapping. Every table that names a player uses
		// this, so a name reads the same on the Rosters, lineup and Analytics
		// tabs; the analytics caller is the only one that can be handed an
		// unknown, and it checks for that itself rather than making this print
		// 'FA' over a missing field.
		//
		// The leading space is load-bearing: without a break opportunity the
		// name's last word and the code fuse into one unbreakable token, and the
		// column's minimum width goes *up* instead of down (measured: 12px saved
		// with no space, 37px with one).
		function appendTeamSuffix(nameCell, team) {
			nameCell.appendChild(document.createTextNode(' '));
			nameCell.appendChild(el('span', { class: 'team-suffix', text: team || 'FA' }));
		}

		// A player's name, linked to their FantasyPros profile when the sync
		// captured a URL for them, plain text when it didn't.
		//
		// The URL is FantasyPros' own, carried through data/rosters.json from the
		// rankings response — never built here from the name. See playerPageUrl
		// in scripts/lib/fantasypros.mjs for why: two players can share a name,
		// and a link to the wrong one looks exactly like a link to the right one.
		// So the link is an extra that appears where it can be trusted. Anyone
		// FantasyPros doesn't rank, or the name match didn't resolve, keeps a
		// perfectly readable plain name — as does every roster synced before this
		// shipped, until the next sync fills the field in.
		function playerNameNode(p) {
			const url = p.ecr?.url;
			if (!url) return document.createTextNode(p.name);
			return el('a', {
				href: url,
				target: '_blank',
				rel: 'noopener',
				class: 'player-link',
				title: `${p.name} on FantasyPros`,
				text: p.name,
			});
		}

		function buildRosterTable(players, isAuction, statusKey, leagueId, onSalaryChange, onContractChange) {
			// roster-auction is about width, not about the team suffix: only the
			// salary-cap tables carry Salary/Yrs, and only they need the phone
			// type shrink that class drives.
			const table = el('table', { class: `roster${isAuction ? ' roster-auction' : ''}` });
			const headRow = el('tr', { class: 'roster-head' });
			headRow.appendChild(el('th', {}));
			headRow.appendChild(el('th', { text: 'Player' }));
			headRow.appendChild(el('th', { class: 'bye-cell', text: 'Bye' }));
			if (isLoggedIn()) headRow.appendChild(el('th', { class: 'ecr-cell', text: 'ECR' }));
			headRow.appendChild(el('th', { class: 'pts-cell', text: 'Pts' }));
			if (isAuction) {
				headRow.appendChild(el('th', { class: 'salary-cell', text: 'Sal' }));
				headRow.appendChild(el('th', { class: 'years-cell', text: 'Yrs' }));
			}
			table.appendChild(headRow);
			let prevPosition = null;
			for (const p of sortByPositionThenEcr(players)) {
				const posBoundary = prevPosition !== null && p.position !== prevPosition;
				prevPosition = p.position;
				const rowClass = `player-row status-${statusKey}${posBoundary ? ' pos-boundary' : ''}`;
				const row = el('tr', { class: rowClass, 'data-name': p.name.toLowerCase() });
				row.appendChild(el('td', {}, [el('span', { class: 'pos-chip', text: p.position || '-' })]));
				const nameCell = el('td', { class: 'player-name' }, [playerNameNode(p)]);
				appendTeamSuffix(nameCell, p.team);
				const injuryBadge = buildInjuryBadge(p);
				if (injuryBadge) nameCell.appendChild(injuryBadge);
				row.appendChild(nameCell);
				row.appendChild(el('td', { class: 'bye-cell', text: p.bye ? String(p.bye) : '—' }));
				if (isLoggedIn()) row.appendChild(buildEcrCell(p));
				const usingPriorYear = !(p.pts > 0) && p.priorYearPts > 0;
				const ptsValue = usingPriorYear ? p.priorYearPts : p.pts;
				const ptsAttrs = { class: `pts-cell${usingPriorYear ? ' pts-prior-year' : ''}`, text: ptsValue != null ? Number(ptsValue).toFixed(2) : '—' };
				if (usingPriorYear) ptsAttrs.title = `${(pageData?.year ?? new Date().getFullYear()) - 1} season total \u2014 current season hasn't started yet`;
				row.appendChild(el('td', ptsAttrs));
				if (isAuction) {
					row.appendChild(buildSalaryCell(p, leagueId, onSalaryChange));
					row.appendChild(buildYearsCell(p, leagueId, onContractChange));
				}
				table.appendChild(row);
			}
			// A phone is narrower than the salary-cap table's own minimum, so
			// there is no width for the grid to hand it — the Yrs dropdown just
			// gets clipped off the right edge. Let it scroll sideways there
			// instead. Only the auction tables need this; the six-column ones
			// fit everywhere, and wrapping the rest would add a scroll container
			// that can never scroll.
			if (isAuction) {
				const scroller = el('div', { class: 'roster-scroll' });
				scroller.appendChild(table);
				return scroller;
			}
			return table;
		}

		// The manager's own locally-planned salary for a still-unset roster
		// spot, or null if there isn't one — or the viewer isn't logged in.
		// A plan is exactly the kind of strategy that shouldn't leak to a
		// league mate who just has the URL, so it's withheld from cap math
		// here too, not just from what the Salary cell itself renders.
		function plannedSalary(league, p) {
			if (!isLoggedIn()) return null;
			const planned = Number(getSalaryPlan(league.id, p.id));
			return planned > 0 ? planned : null;
		}

		// Best-known salary for cap-math purposes: MFL's real number if it's
		// set, otherwise the manager's own locally-planned value (see
		// plannedSalary), otherwise $0. Doesn't affect what the Salary cell
		// itself renders — that stays strictly real-vs-dropdown so the
		// dropdown never disappears just because a plan was saved.
		function effectiveSalary(league, p) {
			const real = Number(p.salary);
			if (real > 0) return real;
			return plannedSalary(league, p) ?? 0;
		}

		// Auction/salary-cap leagues only, shown right after the Active Roster
		// group — mirrors the Salary Adjustments/Total/Salary Cap/Cap Room
		// Available rows MFL's own roster page shows. Total = this season's
		// Active Roster salaries (rosterPlayers, falling back to a locally-
		// planned salary for anyone MFL hasn't priced yet — see
		// effectiveSalary) + Salary Adjustments (drops, carry-overs, etc.,
		// summed server-side from MFL's adjustment history).
		function buildSalarySummary(league, rosterPlayers) {
			if (league.salaryCap == null) return null;
			let plannedCount = 0;
			const rosterSalaryTotal = rosterPlayers.reduce((sum, p) => {
				if (!(Number(p.salary) > 0) && plannedSalary(league, p) != null) plannedCount++;
				return sum + effectiveSalary(league, p);
			}, 0);
			const adjustments = Number(league.salaryAdjustments) || 0;
			const total = rosterSalaryTotal + adjustments;
			const capRoom = league.salaryCap - total;
			// Total/Cap Room mix in unofficial numbers whenever a planned salary
			// stood in for a real one — flagged rather than left to look like a
			// hard, all-official figure.
			const plannedNote = plannedCount > 0
				? `Includes ${plannedCount} locally-planned ${plannedCount === 1 ? 'salary' : 'salaries'}, not yet official`
				: null;

			const table = el('table', { class: 'salary-summary' });
			const row = (label, value, cls, title) => {
				const tr = el('tr', cls ? { class: cls } : {});
				tr.appendChild(el('td', { text: label }));
				const valueAttrs = { text: `$${value.toFixed(2)}` };
				if (title) valueAttrs.title = title;
				tr.appendChild(el('td', valueAttrs));
				table.appendChild(tr);
			};
			row('Salary Adjustments', adjustments);
			row('Total', total, `salary-total${plannedNote ? ' salary-has-plan' : ''}`, plannedNote);
			row('Salary Cap', league.salaryCap);
			row('Cap Room Available', capRoom, `salary-cap-room${capRoom < 0 ? ' salary-negative' : ''}${plannedNote ? ' salary-has-plan' : ''}`, plannedNote);
			return table;
		}

		function buildLoginPrompt() {
			const wrap = el('div', { class: 'lineup-login' });
			const toggleBtn = el('button', { type: 'button', class: 'lineup-login-toggle', text: 'Log in for advanced features' });
			const form = el('form', { class: 'lineup-login-form hidden' });
			const input = el('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
			const submitBtn = el('button', { type: 'submit', text: 'Log in' });
			const statusEl = el('span', { class: 'lineup-login-status' });
			form.appendChild(input);
			form.appendChild(submitBtn);
			form.appendChild(statusEl);

			toggleBtn.addEventListener('click', () => {
				toggleBtn.classList.add('hidden');
				form.classList.remove('hidden');
				input.focus();
			});

			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				if (!input.value) return;
				statusEl.textContent = 'Logging in…';
				submitBtn.disabled = true;
				try {
					await doLogin(input.value);
					renderGrid();
				} catch (err) {
					statusEl.textContent = err.message;
					submitBtn.disabled = false;
				}
			});

			wrap.appendChild(toggleBtn);
			wrap.appendChild(form);
			return wrap;
		}

		// Pilot lineup editor: a single table with a checkbox column instead of
		// separate Starters/Bench sections — check the players you want to
		// start, then Submit Lineup sends the checked ids to MFL via TYPE=lineup.
		//
		// This page has no viewer-level access control — anyone with the URL
		// sees it logged out, including league mates — so who's starting is
		// exactly the kind of thing that shouldn't leak to them ahead of
		// game time. Logged out, the checkbox column isn't just disabled,
		// it's omitted entirely: nothing on the page reveals starter/bench
		// status, only the Submit Lineup button and its actions disappear.
		//
		// `visible` (login) and `writable` (login AND a provider that can
		// actually accept a write) are separate gates, not one. Sleeper
		// leagues can carry lineupPilot too, but Sleeper's public API has no
		// lineup-write endpoint at all — visible when logged in (same privacy
		// gate as MFL), but permanently read-only: checkboxes render disabled,
		// for reference, and no Submit control ever appears regardless of
		// login state.
		function buildLineupEditor(league, players, starterIdSet) {
			const visible = isLoggedIn();
			const writable = visible && (!league.provider || league.provider === 'mfl');
			// This table has no Salary/Yrs of its own, so it never runs out of
			// room — but it shares a card with the tables that do, and the phone
			// shrink is keyed off the same class for that reason.
			const isAuction = league.type === 'salarycap';
			const wrap = el('div', { class: 'lineup-editor' });
			const table = el('table', { class: `roster lineup-editor-table${isAuction ? ' roster-auction' : ''}${visible ? '' : ' read-only'}` });
			const headRow = el('tr', { class: 'roster-head' });
			if (visible) headRow.appendChild(el('th', {}));
			headRow.appendChild(el('th', {}));
			headRow.appendChild(el('th', { text: 'Player' }));
			headRow.appendChild(el('th', { class: 'bye-cell', text: 'Bye' }));
			if (visible) headRow.appendChild(el('th', { class: 'ecr-cell', text: 'ECR' }));
			headRow.appendChild(el('th', { class: 'pts-cell', text: 'Pts' }));
			table.appendChild(headRow);

			const checkboxes = [];
			let prevPosition = null;
			for (const p of sortByPositionThenEcr(players)) {
				const posBoundary = prevPosition !== null && p.position !== prevPosition;
				prevPosition = p.position;
				const row = el('tr', { class: `player-row${posBoundary ? ' pos-boundary' : ''}`, 'data-name': p.name.toLowerCase() });

				if (visible) {
					const checkbox = el('input', { type: 'checkbox' });
					checkbox.checked = starterIdSet.has(p.id);
					checkbox.disabled = !writable;
					checkbox.dataset.playerId = p.id;
					checkboxes.push(checkbox);
					row.appendChild(el('td', {}, [checkbox]));
				}

				row.appendChild(el('td', {}, [el('span', { class: 'pos-chip', text: p.position || '-' })]));
				const nameCell = el('td', { class: 'player-name' }, [playerNameNode(p)]);
				appendTeamSuffix(nameCell, p.team);
				const injuryBadge = buildInjuryBadge(p);
				if (injuryBadge) nameCell.appendChild(injuryBadge);
				row.appendChild(nameCell);
				row.appendChild(el('td', { class: 'bye-cell', text: p.bye ? String(p.bye) : '—' }));
				if (visible) row.appendChild(buildEcrCell(p));
				const usingPriorYear = !(p.pts > 0) && p.priorYearPts > 0;
				const ptsValue = usingPriorYear ? p.priorYearPts : p.pts;
				const ptsAttrs = { class: `pts-cell${usingPriorYear ? ' pts-prior-year' : ''}`, text: ptsValue != null ? Number(ptsValue).toFixed(2) : '—' };
				row.appendChild(el('td', ptsAttrs));

				table.appendChild(row);
			}
			wrap.appendChild(table);

			// Logging in/out is handled once, globally (see renderAuthControl) —
			// nothing to show per-card when the checkbox column itself is hidden.
			if (!visible) {
				return wrap;
			}

			if (!writable) {
				wrap.appendChild(el('div', {
					class: 'lineup-editor-note',
					text: "Sleeper doesn't support setting lineups through their API — set this one directly in the Sleeper app.",
				}));
				return wrap;
			}

			const actions = el('div', { class: 'lineup-editor-actions' });
			const saveBtn = el('button', { type: 'button', class: 'lineup-save-btn', text: 'Submit Lineup' });
			const statusEl = el('span', { class: 'lineup-editor-status' });
			actions.appendChild(saveBtn);
			// league.startingLineup (e.g. "1 QB, 2-3 RB, 2-3 WR, 1-2 TE, 1 PK, 1
			// Def") comes pre-formatted from MFL's own starting-lineup slot
			// requirements — see formatStartingLineupRequirement in
			// providers.mjs. Missing rather than blank for leagues where MFL's
			// export didn't parse cleanly, so there's nothing to render then.
			if (league.startingLineup) {
				actions.appendChild(el('span', { class: 'lineup-requirements', text: league.startingLineup }));
			}
			actions.appendChild(statusEl);
			wrap.appendChild(actions);

			saveBtn.addEventListener('click', async () => {
				const starterIds = checkboxes.filter((cb) => cb.checked).map((cb) => cb.dataset.playerId);
				if (starterIds.length === 0) {
					statusEl.textContent = 'Select at least one starter.';
					return;
				}
				saveBtn.disabled = true;
				statusEl.textContent = 'Submitting…';
				try {
					const res = await fetch(SUBMIT_LINEUP_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
						body: JSON.stringify({ leagueId: league.id, starterIds }),
					});
					const body = await res.json().catch(() => ({}));
					if (res.status === 401) {
						doLogout();
						return;
					}
					if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
					league.starters = starterIds;
					statusEl.textContent = 'Submitted.';
					setTimeout(renderGrid, 800);
				} catch (err) {
					statusEl.textContent = `Couldn't submit: ${err.message}`;
					saveBtn.disabled = false;
				}
			});

			return wrap;
		}

		// Single site-wide login/logout control (header) — MFL uses one login
		// for all leagues, so each pilot league's card no longer duplicates it.
		function renderAuthControl() {
			const container = document.getElementById('auth-control');
			if (!container) return;
			container.innerHTML = '';

			// Previously gated on there being at least one lineup-editable
			// league, since login unlocked nothing else. Logging in now also
			// reveals the Admin tab, and gating on league data would be a trap:
			// switching lineups off for every league would hide the login
			// control, which would hide the Admin tab, which is where you'd go
			// to switch them back on.
			if (isLoggedIn()) {
				container.appendChild(el('span', { class: 'auth-status-text', text: 'Logged in for advanced features' }));
				const logoutBtn = el('button', { type: 'button', class: 'auth-logout-btn', text: 'Log out' });
				logoutBtn.addEventListener('click', doLogout);
				container.appendChild(logoutBtn);
			} else {
				container.appendChild(buildLoginPrompt());
			}
		}

		// "Send via Email" link for the needs-contract banner — a mailto:
		// pre-filled with every player this manager has actually pencilled in
		// a length for (not just every player still missing one; once a real
		// contractYear lands from a sync, that player drops out here too,
		// same as they drop out of the banner count and stop showing the
		// dropdown at all). Returns null (renders nothing) if there's nothing
		// to send yet, or if logged out — the planned lengths themselves are
		// exactly the private data the dropdown is already gated on, so the
		// email summarizing them needs the same gate.
		function buildContractEmailLink(league) {
			if (!isLoggedIn()) return null;
			// No address, no link — deliberately, and not only as a safety net.
			// Clearing commishEmail is how you switch this off for a league whose
			// commissioner wants to be contacted some other way. It also removes
			// the failure this used to have: a mailto to a placeholder opens
			// looking entirely normal and reaches nobody.
			if (!league.commishEmail) return null;
			const plans = (league.players || [])
				.filter((p) => !(Number(p.contractYear) > 0))
				.map((p) => ({ name: p.name, years: getContractPlan(league.id, p.id) }))
				.filter((p) => p.years);
			if (plans.length === 0) return null;

			// That league's own season — during the rollover window it can
			// legitimately differ from the rest of the site's.
			const year = league.season ?? pageData?.year ?? new Date().getFullYear();
			// .trim() — MFL's own league-name export has a stray trailing
			// space on at least one league, invisible everywhere else on the
			// page since HTML collapses whitespace, but not in a raw subject.
			const leagueName = (league.leagueName || league.name).trim();
			const teamName = (league.teamName || league.name).trim();
			const subject = `${year} ${leagueName} Contract Lengths for ${teamName}`;
			const body = plans.map((p) => `${p.name}: ${p.years} year${p.years === '1' ? '' : 's'}`).join('\n');

			return el('a', {
				href: `mailto:${encodeURIComponent(league.commishEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,
				class: 'contract-email-link',
				text: '✉ Send via Email',
			});
		}

		// League name link, shared by the Rosters/Standings/Scoring cards.
		// Optionally followed by a small document-icon link straight to the
		// league's actual rules page (config/leagues.json's rulesUrl) — one
		// click from wherever the league already shows up, instead of
		// wherever MFL/ESPN/Sleeper each bury their own rules page. Omitted
		// entirely for leagues without a rulesUrl set, same as every other
		// optional per-league field on this page.
		function buildLeagueHeading(league) {
			const heading = el('h2');
			heading.appendChild(el('a', { href: league.url, target: '_blank', rel: 'noopener', text: league.leagueName || league.name }));
			if (league.rulesUrl) {
				heading.appendChild(el('a', {
					href: league.rulesUrl,
					target: '_blank',
					rel: 'noopener',
					class: 'rules-link',
					title: 'League rules',
					text: '📝',
				}));
			}
			return heading;
		}

		// Every league has exactly one hosting provider — MFL is the default
		// when `provider` is unset (see config/leagues.json), matching every
		// other provider-branch in this file.
		function providerBadgeLabel(league) {
			if (league.provider === 'espn') return 'ESPN';
			if (league.provider === 'sleeper') return 'Sleeper';
			return 'MFL';
		}

		// Card-head row shared by Rosters/Standings/Scoring: the league name
		// heading plus a badge strip. The provider badge (MFL/ESPN/Sleeper)
		// always leads the strip and is styled gold instead of the usual
		// purple, so which site actually hosts a league reads at a glance
		// instead of blending in with Superflex/Best Ball/etc.
		//
		// All three card types pass the same `extraLabels`. Standings and Scoring
		// used to get the provider badge alone, on the reasoning that format is a
		// Rosters concern — but several tags name a scoring system outright (Best
		// Ball) or change how points arrive (Superflex), which is exactly the
		// context you want when reading a scoring table or a standings column.
		// The purple chips: what kind of league this is and how it's scored.
		// Type is derived from data we already have; anything else (Superflex,
		// Best Ball, ...) is the manual `tags` array in config/leagues.json, since
		// no provider exposes it in a reliable form.
		//
		// The type label already reads "Salary Cap" for exactly the leagues that
		// used to get a second badge from the auction check, so no separate
		// salary-cap badge is needed.
		function formatBadgeLabels(league) {
			const labels = [];
			if (LEAGUE_TYPE_LABELS[league.type]) labels.push(LEAGUE_TYPE_LABELS[league.type]);
			if (Array.isArray(league.tags)) labels.push(...league.tags);
			return labels;
		}

		// Which season this card is showing. Normally the same for every league,
		// but through the spring they roll over one at a time, so a card can
		// legitimately be a season behind the rest — and a stale roster renders
		// exactly like a fresh one. Stating it outright on every card is what
		// makes the odd one out obvious without having to know to look.
		function seasonBadgeLabel(league) {
			const season = league.season ?? pageData?.year;
			return season == null ? null : String(season);
		}

		// Whether that season is behind the one the file as a whole is on, i.e.
		// the league's new year isn't up at the provider yet and `resolveSeason`
		// left it where it was. Not type-gated the way `awaitingRollover` is:
		// that one decides whether a league's free-agent list is *wrong*, which
		// only applies to leagues that redraft, whereas this is only saying the
		// card is a season behind — equally true, and equally worth seeing, for a
		// dynasty league that hasn't rolled over. Both halves have to be numbers:
		// a rosters.json written before leagues carried their own `season` yields
		// NaN < year, which is false, so nothing is marked on missing data.
		function seasonIsBehind(season) {
			return Number(season) < Number(pageData?.year);
		}

		function buildCardHead(league, extraLabels = []) {
			const cardHead = el('div', { class: 'card-head' });
			cardHead.appendChild(buildLeagueHeading(league));
			const season = seasonBadgeLabel(league);
			// Gold leads: where it's hosted, then which season. The purple chips
			// after them describe the league's own format.
			const labels = [
				{ text: providerBadgeLabel(league), gold: true },
				...(season ? [{ text: season, gold: true, season: true, stale: seasonIsBehind(season) }] : []),
				...extraLabels.map((text) => ({ text })),
			];
			const badgesEl = el('div', { class: `badges${labels.length > 2 ? ' badges-wrap' : ''}` });
			for (const label of labels) {
				const cls = label.season ? `badge badge-season${label.stale ? ' badge-season-stale' : ''}` : label.gold ? 'badge badge-provider' : 'badge';
				badgesEl.appendChild(el('span', { class: cls, text: label.text }));
			}
			cardHead.appendChild(badgesEl);
			return cardHead;
		}

		function renderCard(league) {
			// data-league-id is how a problems-digest row scrolls to this card.
			const card = el('div', { class: 'card', 'data-view': 'rosters', 'data-league-type': subtabType(league) || '', 'data-league-id': league.id });

			// Salary-cap leagues are the auction leagues — the two were tracked
			// separately via a `format` field that always agreed with `type`, so
			// the type alone now drives the salary/contract UI and `format` is
			// gone entirely.
			const isAuction = league.type === 'salarycap';

			// Contracts are due every offseason in early September — surface a
			// count at the very top of the card, above the league name and
			// badges, so it's the first thing seen without scrolling into the
			// roster to spot individual flagged players (see the icon in
			// buildYearsCell).
			//
			// Two numbers, because they move for different reasons and only one
			// of them is the manager's job: the denominator is everyone MFL
			// hasn't returned a contract for, which only the commissioner can
			// change, and the numerator is how many of those you've set a length
			// for. So the fraction counts *up* to a full house while the total
			// holds steady. It used to count down — the numerator was the work
			// remaining — which made the same sentence mean opposite things at
			// the two ends: "5/5" was everything left to do, and now it's
			// everything done.
			const contractsMissing = () => (league.players || []).filter((p) => !(Number(p.contractYear) > 0));
			const contractCounts = () => {
				const missing = contractsMissing();
				return {
					total: missing.length,
					unplanned: missing.filter((p) => !getContractPlan(league.id, p.id)).length,
				};
			};
			let contractBannerEl = null;
			let contractBannerTextEl = null;
			// Setting a length has to move the count immediately — the banner
			// sits above the table, so a stale number is visible at the same
			// time as the row that just changed. The colour moves with it, for
			// the same reason the icon and dropdown do: gold is work left, and
			// once nothing is left the banner is a status line, not a task.
			const refreshContractBanner = () => {
				if (!contractBannerTextEl) return;
				const { total, unplanned } = contractCounts();
				const set = total - unplanned;
				// One sentence in both states, so the number is the only thing
				// that moves as you work down the roster. The done state adds the
				// next move, which is yours: the commissioner has no way of
				// knowing these lengths until you send them, which is what the
				// mail link below the text is for.
				contractBannerTextEl.textContent = unplanned === 0
					? `✓ ${set}/${total} contract${total === 1 ? '' : 's'} set — remember to notify commish`
					: `⚠ ${set}/${total} contract${total === 1 ? '' : 's'} set`;
				contractBannerEl.classList.toggle('contract-banner-planned', unplanned === 0);
				// Rebuilt, not built once: the link doesn't exist at all until
				// some length is planned, and its mail body is a snapshot of the
				// plans at the moment it was made. Built at render it would be
				// missing for the whole session the plans were made in, and once
				// present would keep mailing the plans as they stood on load.
				contractBannerEl.querySelector('.contract-email-link')?.remove();
				const emailLink = buildContractEmailLink(league);
				if (emailLink) contractBannerEl.appendChild(emailLink);
			};

			// Logged out this is hidden outright rather than shown with plans
			// uncounted: the planning dropdowns aren't rendered either (a plan
			// is strategy — same gate as plannedSalary), so the banner would be
			// a to-do list with no way to act on it, counting work a viewer
			// can't see and can't do.
			if (isAuction && isLoggedIn() && contractsMissing().length > 0) {
				const banner = el('div', { class: 'needs-contract-banner' });
				contractBannerEl = banner;
				contractBannerTextEl = el('span', {});
				banner.appendChild(contractBannerTextEl);
				card.appendChild(banner);
				// Text, colour and the mail link all come from the same path as
				// every later update, so the first render can't drift from them.
				refreshContractBanner();
			}

			card.appendChild(buildCardHead(league, formatBadgeLabels(league)));
			card.appendChild(el('div', { class: 'team', text: league.teamName || '' }));

			if (league.error && (!league.players || league.players.length === 0)) {
				card.appendChild(el('div', { class: 'error-box', text: `Couldn't load this league: ${league.error}` }));
				return card;
			}

			if (league.error) {
				const warn = el('div', { class: 'error-box', text: `Showing data from ${timeAgo(league.updatedAt)} — last sync failed: ${league.error}` });
				card.appendChild(warn);
			}

			const byStatus = {};
			for (const p of league.players || []) {
				const status = (p.status || 'ROSTER').toUpperCase();
				(byStatus[status] = byStatus[status] || []).push(p);
			}

			// Pilot: leagues with a fetched starters list split Active Roster into
			// Starters/Bench instead of one flat table. Everything else (and any
			// league where the lineup fetch failed/hasn't run) falls back to the
			// plain grouping below, unchanged.
			const starterIdSet = Array.isArray(league.starters) ? new Set(league.starters) : null;

			for (const group of STATUS_GROUPS) {
				const players = byStatus[group.key];
				if (!players || players.length === 0) continue;

				card.appendChild(el('div', { class: 'group-label', text: `${group.label} (${players.length})` }));

				// The cap summary reads these players' salaries, so a planned-
				// salary pick inside the table needs to rebuild it live rather
				// than leaving a stale Total/Cap Room on screen until reload.
				const needsCapSummary = group.key === 'ROSTER' && isAuction && league.salaryCap != null;
				let summaryEl = needsCapSummary ? buildSalarySummary(league, players) : null;

				if (group.key === 'ROSTER' && starterIdSet) {
					card.appendChild(buildLineupEditor(league, players, starterIdSet));
				} else {
					const onSalaryChange = needsCapSummary
						? () => {
							const fresh = buildSalarySummary(league, players);
							if (summaryEl && fresh) summaryEl.replaceWith(fresh);
							summaryEl = fresh;
						}
						: undefined;
					card.appendChild(buildRosterTable(players, isAuction, group.key.toLowerCase(), league.id, onSalaryChange, refreshContractBanner));
				}

				if (summaryEl) card.appendChild(summaryEl);
			}

			if (!league.players || league.players.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No players found on this roster.' }));
			}

			// Which FantasyPros ranking set the ECR column is showing. Worth
			// stating outright: dynasty and draft rankings disagree sharply on
			// the same player, so an unlabelled rank invites misreading.
			// Logged out, the column itself isn't rendered (see
			// buildRosterTable/buildLineupEditor) — an "advanced feature" like
			// everything else login unlocks — so this footnote about it would
			// be a dangling reference to a column that isn't there.
			if (isLoggedIn() && league.rankings) {
				const r = league.rankings;
				const parts = [`${ECR_TYPE_LABELS[r.type] || r.type} ${r.scoring} rankings`];
				if (r.totalExperts) parts.push(`${r.totalExperts} experts`);
				if (r.lastUpdated) parts.push(`updated ${r.lastUpdated}`);
				card.appendChild(el('div', { class: 'rankings-note', text: `ECR: ${parts.join(' · ')}` }));
			}

			return card;
		}

		// Power ranks for one league, from the sync-computed power scores (each
		// franchise's best legal starting lineup valued by FantasyPros season
		// projections, plus the projected points of everyone the lineup could
		// not seat — see computeLeaguePower in scripts/lib/fantasypros.mjs).
		// Three separate orderings of the same teams: starters (the lineup
		// value), depth (the bench value), and overall (their sum — the whole
		// roster). Returns null when the snapshot carries no power data for
		// this league — synced before this shipped, mid-draft, or the daily
		// roster read failed — which is what keeps the league off the Power
		// Rankings card rather than on it with dashes.
		//
		// Ties share a rank (standard competition ranking: two teams at 1, the
		// next at 3) because inventing an order between equal scores would
		// print a distinction the data doesn't contain. Depth is ranked only
		// when every team carries the number, so half a league on an older
		// power object can't be ranked against the other half's real values.
		//
		// Deliberately rendered on the Analytics tab and NOT as a column on
		// the Standings cards, where this first shipped: standings are a
		// record of what happened, and a projection column there reads as the
		// site second-guessing the season. The scores themselves never render
		// anywhere — points compare only within a league, and the rank ordinal
		// is the part that survives being read across cards.
		function competitionRanks(entries) {
			const sorted = [...entries].sort((a, b) => b.value - a.value);
			const ranks = new Map();
			let rank = 0;
			let prev = null;
			sorted.forEach((e, i) => {
				if (e.value !== prev) {
					rank = i + 1;
					prev = e.value;
				}
				ranks.set(e.key, rank);
			});
			return ranks;
		}

		// One basis at a time — 'projections' or 'ecr'. Each is ranked entirely
		// on its own numbers: the same franchises, ordered twice, so a team can
		// legitimately be 2nd by projected points and 7th by consensus rank.
		// That gap is the point of showing both, not a discrepancy to reconcile.
		function leaguePowerRanks(league, basis) {
			const block = league.power ? league.power[basis] : null;
			const teams = block && Array.isArray(block.teams) ? block.teams : [];
			if (teams.length === 0) return null;
			const keyed = teams.map((t) => ({ key: String(t.franchiseId), score: Number(t.score) || 0, depth: t.depth == null ? null : Number(t.depth) }));
			const hasDepth = keyed.every((t) => t.depth != null && Number.isFinite(t.depth));
			const starters = competitionRanks(keyed.map((t) => ({ key: t.key, value: t.score })));
			const depth = hasDepth ? competitionRanks(keyed.map((t) => ({ key: t.key, value: t.depth }))) : null;
			const overall = hasDepth
				? competitionRanks(keyed.map((t) => ({ key: t.key, value: t.score + t.depth })))
				: starters;
			const byFranchise = new Map();
			for (const t of keyed) {
				byFranchise.set(t.key, {
					overall: overall.get(t.key),
					starters: starters.get(t.key),
					depth: depth ? depth.get(t.key) : null,
				});
			}
			return { size: keyed.length, byFranchise, source: block.source || null };
		}

		// One row per league we hold a team in, ranked inside that league. The
		// same awaitingRollover gate Top Available applies: a redraft league
		// still on last season would rank a roster that no longer exists.
		// Mid-draft leagues never reach here — the sync clears their power the
		// way it clears their wire. Rows come back in reading order: best
		// overall rank first, starters rank breaking ties, config order
		// breaking what's left (Array.prototype.sort is stable).
		// Why a league has no ranks at all, for the tooltip on its TBD cells.
		// A row of TBDs with no explanation reads as a bug; these are the three
		// states that actually produce one, and they want different responses
		// — wait, look at the league, or wait for the next sync.
		// `trailing` leads because it is the only one of these where ranks were
		// suppressed rather than missing: the league has data, it is just about
		// a season that has ended.
		function powerUnrankedReason(league, trailing) {
			if (trailing) return 'Still on last season — ranks resume when the league rolls over';
			if (league.draftInProgress === true) return 'Draft in progress — ranks resume once it finishes';
			// Before the empty-roster check on purpose: a league that errored
			// falls back to its previous entry, which can itself be empty, so
			// an error would otherwise be reported as "hasn't drafted".
