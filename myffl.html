<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>myFFL</title>
	<link rel="icon" type="image/png" sizes="32x32" href="https://shamrock84.github.io/fflicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="https://shamrock84.github.io/fflicons/favicon-16x16.png">
	<link rel="manifest" href="https://shamrock84.github.io/fflicons/site.webmanifest">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F2683">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#140f1e">
	<style>
		/* Minnesota Vikings palette: purple as the primary accent everywhere,
		   gold reserved specifically for highlighting the user's own team. */
		:root {
			--bg: #f5f3f9;
			--card-bg: #ffffff;
			--text: #1b1425;
			--muted: #6b6478;
			--border: #e3daf0;
			--accent: #4F2683;
			--chip-bg: #ede3f8;
			--taxi-bg: #eff6ff;
			--taxi-text: #1e40af;
			--ir-bg: #fef2f2;
			--ir-text: #991b1b;
			--gold: #FFC62F;
			--gold-text: #5c4300;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #140f1e;
				--card-bg: #1e1730;
				--text: #ede9f5;
				--muted: #a79bc2;
				--border: #362a4a;
				--accent: #b48ee0;
				--chip-bg: #2c2145;
				--taxi-bg: #0e2340;
				--taxi-text: #93c5fd;
				--ir-bg: #341313;
				--ir-text: #fca5a5;
				--gold: #FFC62F;
				--gold-text: #3d2e00;
			}
		}
		body::before {
			content: '';
			display: block;
			height: 4px;
			background: linear-gradient(90deg, var(--accent), var(--gold));
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}
		header {
			padding: 1.5rem 1rem 1rem;
			text-align: center;
		}
		header h1 {
			margin: 0 0 0.25rem;
		}
		.site-logo {
			height: 64px;
			width: auto;
			display: block;
			margin: 0 auto;
		}
		@media (prefers-color-scheme: dark) {
			.site-logo {
				filter: invert(1);
			}
		}
		#updated {
			color: var(--muted);
			font-size: 0.85rem;
		}
		#live-status {
			text-align: center;
			font-size: 0.78rem;
			margin-top: 0.5rem;
			color: var(--muted);
		}
		#live-status.live-error {
			color: var(--ir-text);
		}
		.tabs {
			display: flex;
			justify-content: center;
			gap: 0.5rem;
			margin-top: 1.25rem;
			flex-wrap: wrap;
			padding: 0 1rem;
		}
		.tab-btn {
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--muted);
			padding: 0.45rem 1rem;
			border-radius: 999px;
			font-size: 0.88rem;
			font-weight: 600;
			cursor: pointer;
		}
		.tab-btn.active {
			background: var(--accent);
			border-color: var(--accent);
			color: #fff;
		}
		.subtabs {
			margin-top: 0.6rem;
		}
		.subtabs .tab-btn {
			padding: 0.3rem 0.8rem;
			font-size: 0.78rem;
			background: transparent;
		}
		.subtabs .tab-btn.active {
			background: var(--chip-bg);
			border-color: var(--accent);
			color: var(--accent);
		}
		.controls {
			max-width: 480px;
			margin: 1rem auto 0;
			padding: 0 1rem;
		}
		#search {
			width: 100%;
			padding: 0.6rem 0.9rem;
			border-radius: 999px;
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--text);
			font-size: 1rem;
		}
		main {
			max-width: 1400px;
			margin: 0 auto;
			padding: 0.5rem 1rem 3rem;
		}
		#status {
			text-align: center;
			color: var(--muted);
			padding: 0;
		}
		#status:not(:empty) {
			padding: 2rem 0;
		}
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
			gap: 1rem;
		}
		.card {
			background: var(--card-bg);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 1rem 1.1rem 1.2rem;
			display: flex;
			flex-direction: column;
		}
		.card h2 {
			margin: 0;
			font-size: 1.15rem;
		}
		.card h2 a {
			color: var(--text);
			text-decoration: none;
		}
		.card h2 a:hover {
			color: var(--accent);
			text-decoration: underline;
		}
		.card .team {
			color: var(--muted);
			font-size: 0.85rem;
			margin: 0.15rem 0 0.75rem;
		}
		.error-box {
			background: var(--ir-bg);
			color: var(--ir-text);
			border-radius: 8px;
			padding: 0.6rem 0.75rem;
			font-size: 0.85rem;
		}
		.group-label {
			font-size: 0.72rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
			margin: 0.75rem 0 0.35rem;
		}
		.group-label:first-of-type { margin-top: 0; }
		table.roster {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		table.roster tr.player-row td {
			padding: 0.3rem 0.2rem;
			border-bottom: 1px solid var(--border);
		}
		table.roster tr.player-row:last-child td {
			border-bottom: none;
		}
		table.roster tr.player-row.pos-boundary td {
			border-top: 2px solid color-mix(in srgb, var(--accent) 70%, var(--border));
			padding-top: 0.4rem;
		}
		.pos-chip {
			display: inline-block;
			min-width: 2rem;
			text-align: center;
			background: var(--chip-bg);
			color: var(--accent);
			border-radius: 6px;
			padding: 0.1rem 0.35rem;
			font-size: 0.72rem;
			font-weight: 600;
		}
		.nfl-team {
			color: var(--muted);
			font-size: 0.78rem;
		}
		.player-name {
			font-weight: 500;
		}
		tr.roster-head th {
			text-align: left;
			font-size: 0.65rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			padding: 0 0.2rem 0.3rem;
			font-weight: 600;
		}
		.salary-cell,
		.years-cell,
		.bye-cell,
		.pts-cell {
			text-align: right;
			font-variant-numeric: tabular-nums;
			font-size: 0.82rem;
			color: var(--muted);
		}
		tr.roster-head th.salary-cell,
		tr.roster-head th.years-cell,
		tr.roster-head th.bye-cell,
		tr.roster-head th.pts-cell {
			text-align: right;
		}
		.pts-cell.pts-prior-year {
			font-style: italic;
		}
		tr.status-taxi_squad .pos-chip,
		tr.status-injured_reserve .pos-chip {
			opacity: 0.9;
		}
		.status-taxi_squad { background: var(--taxi-bg); }
		.status-injured_reserve { background: var(--ir-bg); }
		table.standings {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		table.standings th {
			text-align: left;
			font-size: 0.68rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			padding: 0 0.2rem 0.4rem;
		}
		table.standings td {
			padding: 0.3rem 0.2rem;
			border-bottom: 1px solid var(--border);
		}
		table.standings tr:last-child td { border-bottom: none; }
		table.standings th:not(:first-child),
		table.standings td:not(:first-child) {
			text-align: right;
		}
		tr.me-row td {
			font-weight: 700;
			background: var(--gold);
			color: var(--gold-text);
		}
		.hidden { display: none !important; }
		footer {
			text-align: center;
			color: var(--muted);
			font-size: 0.8rem;
			padding-bottom: 2rem;
		}
		footer a { color: var(--accent); }
	</style>
</head>
<body>
	<header>
		<h1><img src="images/ffl_black.gif" alt="myFFL" class="site-logo"></h1>
		<div id="updated">Loading&hellip;</div>
	</header>
	<div class="tabs" id="tabs" role="tablist"></div>
	<div class="tabs subtabs" id="subtabs" role="tablist"></div>
	<div id="live-status" class="hidden"></div>
	<div class="controls">
		<input type="search" id="search" placeholder="Filter by player name&hellip;" autocomplete="off">
	</div>
	<main>
		<div id="status"></div>
		<div id="grid" class="grid"></div>
	</main>
	<footer>
		Data pulled from <a href="https://www.myfantasyleague.com" target="_blank" rel="noopener">MyFantasyLeague</a> and/or <a href="https://www.espn.com/fantasy/football/" target="_blank" rel="noopener">ESPN</a> via a scheduled sync.
	</footer>

	<script>
		const STATUS_GROUPS = [
			{ key: 'ROSTER', label: 'Active Roster' },
			{ key: 'TAXI_SQUAD', label: 'Taxi Squad' },
			{ key: 'PRACTICE_SQUAD', label: 'Practice Squad' },
			{ key: 'INJURED_RESERVE', label: 'Injured Reserve' },
		];

		function timeAgo(iso) {
			if (!iso) return 'never';
			const diffMs = Date.now() - new Date(iso).getTime();
			const mins = Math.round(diffMs / 60000);
			if (mins < 1) return 'just now';
			if (mins < 60) return `${mins} min ago`;
			const hrs = Math.round(mins / 60);
			if (hrs < 24) return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
			const days = Math.round(hrs / 24);
			return `${days} day${days === 1 ? '' : 's'} ago`;
		}

		function el(tag, attrs = {}, children = []) {
			const node = document.createElement(tag);
			for (const [k, v] of Object.entries(attrs)) {
				if (k === 'class') node.className = v;
				else if (k === 'text') node.textContent = v;
				else node.setAttribute(k, v);
			}
			for (const child of children) node.appendChild(child);
			return node;
		}

		const VIEW_LABELS = { rosters: 'Rosters', standings: 'Standings', scoring: 'Scoring' };
		const VIEW_ORDER = ['rosters', 'scoring', 'standings'];
		const LEAGUE_TYPE_LABELS = { dynasty: 'Dynasty', bestball: 'Best Ball', redraft: 'Redraft' };
		const LEAGUE_TYPE_ORDER = ['dynasty', 'bestball', 'redraft'];
		let currentView = 'rosters';
		let currentLeagueType = null;
		let pageData = null;
		let liveScoringTimer = null;

		// Live-scoring proxy (Vercel), separate from the 4-hour GitHub Actions
		// sync — polled only while the Scoring tab is open. Filled in once
		// deployed; polling is a no-op while this is empty.
		const LIVE_SCORING_URL = 'https://shamrock84-github-io.vercel.app/api/live-scoring';
		const LIVE_SCORING_POLL_MS = 30000;

		function buildRosterTable(players, isAuction, statusKey) {
			const table = el('table', { class: 'roster' });
			const headRow = el('tr', { class: 'roster-head' });
			headRow.appendChild(el('th', {}));
			headRow.appendChild(el('th', { text: 'Player' }));
			headRow.appendChild(el('th', { text: 'Team' }));
			headRow.appendChild(el('th', { class: 'bye-cell', text: 'Bye' }));
			headRow.appendChild(el('th', { class: 'pts-cell', text: 'Pts' }));
			if (isAuction) {
				headRow.appendChild(el('th', { class: 'salary-cell', text: 'Salary' }));
				headRow.appendChild(el('th', { class: 'years-cell', text: 'Yrs' }));
			}
			table.appendChild(headRow);
			let prevPosition = null;
			for (const p of players) {
				const posBoundary = prevPosition !== null && p.position !== prevPosition;
				prevPosition = p.position;
				const rowClass = `player-row status-${statusKey}${posBoundary ? ' pos-boundary' : ''}`;
				const row = el('tr', { class: rowClass, 'data-name': p.name.toLowerCase() });
				row.appendChild(el('td', {}, [el('span', { class: 'pos-chip', text: p.position || '-' })]));
				row.appendChild(el('td', { class: 'player-name', text: p.name }));
				row.appendChild(el('td', { class: 'nfl-team', text: p.team || 'FA' }));
				row.appendChild(el('td', { class: 'bye-cell', text: p.bye ? String(p.bye) : '—' }));
				const usingPriorYear = !(p.pts > 0) && p.priorYearPts > 0;
				const ptsValue = usingPriorYear ? p.priorYearPts : p.pts;
				const ptsAttrs = { class: `pts-cell${usingPriorYear ? ' pts-prior-year' : ''}`, text: ptsValue != null ? Number(ptsValue).toFixed(2) : '—' };
				if (usingPriorYear) ptsAttrs.title = `${(pageData?.year ?? new Date().getFullYear()) - 1} season total \u2014 current season hasn't started yet`;
				row.appendChild(el('td', ptsAttrs));
				if (isAuction) {
					row.appendChild(el('td', { class: 'salary-cell', text: p.salary ? `$${p.salary}` : '—' }));
					row.appendChild(el('td', { class: 'years-cell', text: p.contractYear ? String(p.contractYear) : '—' }));
				}
				table.appendChild(row);
			}
			return table;
		}

		function renderCard(league) {
			const card = el('div', { class: 'card', 'data-view': 'rosters', 'data-league-type': league.type || '' });
			const heading = el('h2');
			const link = el('a', { href: league.url, target: '_blank', rel: 'noopener', text: league.leagueName || league.name });
			heading.appendChild(link);
			card.appendChild(heading);
			card.appendChild(el('div', { class: 'team', text: league.teamName || '' }));

			if (league.error && (!league.players || league.players.length === 0)) {
				card.appendChild(el('div', { class: 'error-box', text: `Couldn't load this league: ${league.error}` }));
				return card;
			}

			if (league.error) {
				const warn = el('div', { class: 'error-box', text: `Showing data from ${timeAgo(league.updatedAt)} — last sync failed: ${league.error}` });
				card.appendChild(warn);
			}

			const byStatus = {};
			for (const p of league.players || []) {
				const status = (p.status || 'ROSTER').toUpperCase();
				(byStatus[status] = byStatus[status] || []).push(p);
			}

			const isAuction = league.format === 'auction';
			// Pilot: leagues with a fetched starters list split Active Roster into
			// Starters/Bench instead of one flat table. Everything else (and any
			// league where the lineup fetch failed/hasn't run) falls back to the
			// plain grouping below, unchanged.
			const starterIdSet = Array.isArray(league.starters) ? new Set(league.starters) : null;

			for (const group of STATUS_GROUPS) {
				const players = byStatus[group.key];
				if (!players || players.length === 0) continue;

				if (group.key === 'ROSTER' && starterIdSet) {
					const starters = players.filter((p) => starterIdSet.has(p.id));
					const bench = players.filter((p) => !starterIdSet.has(p.id));
					if (starters.length > 0) {
						card.appendChild(el('div', { class: 'group-label', text: `Starters (${starters.length})` }));
						card.appendChild(buildRosterTable(starters, isAuction, 'starter'));
					}
					if (bench.length > 0) {
						card.appendChild(el('div', { class: 'group-label', text: `Bench (${bench.length})` }));
						card.appendChild(buildRosterTable(bench, isAuction, 'bench'));
					}
					continue;
				}

				card.appendChild(el('div', { class: 'group-label', text: `${group.label} (${players.length})` }));
				card.appendChild(buildRosterTable(players, isAuction, group.key.toLowerCase()));
			}

			if (!league.players || league.players.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No players found on this roster.' }));
			}

			return card;
		}

		function renderStandingsCard(league) {
			const card = el('div', { class: 'card', 'data-view': 'standings', 'data-league-type': league.type || '' });
			const heading = el('h2');
			const link = el('a', { href: league.url, target: '_blank', rel: 'noopener', text: league.leagueName || league.name });
			heading.appendChild(link);
			card.appendChild(heading);

			if (league.standingsError && (!league.standings || league.standings.length === 0)) {
				card.appendChild(el('div', { class: 'error-box', text: `Couldn't load standings: ${league.standingsError}` }));
				return card;
			}

			if (league.standingsError) {
				card.appendChild(el('div', { class: 'error-box', text: `Showing standings from a previous sync — last update failed: ${league.standingsError}` }));
			}

			const rows = league.standings || [];
			if (rows.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No standings available yet.' }));
				return card;
			}

			const table = el('table', { class: 'standings' });
			const headRow = el('tr');
			['#', 'Team', 'W-L-T', 'PF', 'PA'].forEach((h) => headRow.appendChild(el('th', { text: h })));
			table.appendChild(headRow);

			rows.forEach((r, i) => {
				const row = el('tr', { class: r.isMe ? 'me-row' : '' });
				row.appendChild(el('td', { text: String(i + 1) }));
				row.appendChild(el('td', { text: r.teamName }));
				row.appendChild(el('td', { text: `${r.wins}-${r.losses}${r.ties ? '-' + r.ties : ''}` }));
				row.appendChild(el('td', { text: r.pointsFor }));
				row.appendChild(el('td', { text: r.pointsAgainst }));
				table.appendChild(row);
			});
			card.appendChild(table);
			return card;
		}

		function renderScoringCard(league) {
			const card = el('div', { class: 'card', 'data-view': 'scoring', 'data-league-type': league.type || '' });
			const heading = el('h2');
			const link = el('a', { href: league.url, target: '_blank', rel: 'noopener', text: league.leagueName || league.name });
			heading.appendChild(link);
			card.appendChild(heading);

			const teams = league.scoring?.teams || [];

			if (league.scoringError && teams.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: `No live scoring yet: ${league.scoringError}` }));
				return card;
			}

			if (league.scoringError) {
				card.appendChild(el('div', { class: 'error-box', text: `Showing scores from a previous sync — last update failed: ${league.scoringError}` }));
			}

			if (teams.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No live scoring available yet.' }));
				return card;
			}

			if (league.scoring?.week) {
				card.appendChild(el('div', { class: 'team', text: `Week ${league.scoring.week}` }));
			}

			const table = el('table', { class: 'standings' });
			const headRow = el('tr');
			['#', 'Team', 'Score'].forEach((h) => headRow.appendChild(el('th', { text: h })));
			table.appendChild(headRow);

			teams.forEach((t, i) => {
				const row = el('tr', { class: t.isMe ? 'me-row' : '' });
				row.appendChild(el('td', { text: String(i + 1) }));
				row.appendChild(el('td', { text: t.teamName }));
				row.appendChild(el('td', { text: t.score }));
				table.appendChild(row);
			});
			card.appendChild(table);
			return card;
		}

		function updateVisibility() {
			const q = document.getElementById('search').value.trim().toLowerCase();
			document.querySelectorAll('.card').forEach((card) => {
				const viewMatch = card.dataset.view === currentView;
				const typeMatch = !currentLeagueType || card.dataset.leagueType === currentLeagueType;
				const rows = card.querySelectorAll('tr.player-row');
				let searchMatch = true;
				if (q && rows.length > 0) {
					let anyVisible = false;
					rows.forEach((row) => {
						const match = row.dataset.name.includes(q);
						row.classList.toggle('hidden', !match);
						if (match) anyVisible = true;
					});
					searchMatch = anyVisible;
				} else {
					rows.forEach((row) => row.classList.remove('hidden'));
				}
				card.classList.toggle('hidden', !viewMatch || !typeMatch || !searchMatch);
			});
		}

		// Sub-tabs (Dynasty / Best Ball) are scoped to whichever top-level view is active,
		// so they're recomputed every time the view changes rather than once up front.
		function renderSubTabs() {
			const subtabsEl = document.getElementById('subtabs');
			subtabsEl.innerHTML = '';

			const typesInView = new Set(
				[...document.querySelectorAll(`.card[data-view="${currentView}"]`)]
					.map((c) => c.dataset.leagueType)
					.filter(Boolean)
			);
			const present = LEAGUE_TYPE_ORDER.filter((t) => typesInView.has(t)).concat(
				[...typesInView].filter((t) => !LEAGUE_TYPE_ORDER.includes(t))
			);

			if (present.length <= 1) {
				subtabsEl.classList.add('hidden');
				currentLeagueType = present[0] || null;
				return;
			}

			subtabsEl.classList.remove('hidden');
			if (!currentLeagueType || !present.includes(currentLeagueType)) {
				currentLeagueType = present[0];
			}
			for (const type of present) {
				const btn = el('button', {
					class: `tab-btn${type === currentLeagueType ? ' active' : ''}`,
					type: 'button',
					role: 'tab',
					text: LEAGUE_TYPE_LABELS[type] || type,
				});
				btn.addEventListener('click', () => {
					currentLeagueType = type;
					subtabsEl.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
					updateVisibility();
				});
				subtabsEl.appendChild(btn);
			}
		}

		function updateSearchVisibility() {
			document.querySelector('.controls').classList.toggle('hidden', currentView !== 'rosters');
		}

		function setLiveStatus(text, isError) {
			const el = document.getElementById('live-status');
			el.textContent = text;
			el.classList.toggle('live-error', !!isError);
		}

		async function refreshLiveScoring() {
			if (!LIVE_SCORING_URL || !pageData) return;
			try {
				const res = await fetch(`${LIVE_SCORING_URL}?t=${Date.now()}`, { cache: 'no-store' });
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				const live = await res.json();
				const byId = new Map((live.leagues || []).map((l) => [l.id, l]));

				for (const league of pageData.leagues) {
					const update = byId.get(league.id);
					if (!update) continue;
					league.scoring = update.scoring;
					league.scoringError = update.scoringError;
				}

				const gridEl = document.getElementById('grid');
				gridEl.querySelectorAll('.card[data-view="scoring"]').forEach((c) => c.remove());
				for (const league of pageData.leagues) {
					if (league.scoring !== undefined || league.scoringError) {
						gridEl.appendChild(renderScoringCard(league));
					}
				}
				updateVisibility();
				setLiveStatus(`Live updates on — last refreshed ${timeAgo(live.generatedAt)}`, false);
			} catch (err) {
				console.warn(`Live scoring refresh failed: ${err.message}`);
				setLiveStatus(`Live update failed: ${err.message}`, true);
			}
		}

		function startLiveScoringPolling() {
			if (!LIVE_SCORING_URL) return;
			document.getElementById('live-status').classList.remove('hidden');
			if (liveScoringTimer) return;
			refreshLiveScoring();
			liveScoringTimer = setInterval(refreshLiveScoring, LIVE_SCORING_POLL_MS);
		}

		function stopLiveScoringPolling() {
			document.getElementById('live-status').classList.add('hidden');
			if (liveScoringTimer) {
				clearInterval(liveScoringTimer);
				liveScoringTimer = null;
			}
		}

		function renderViewTabs(views) {
			const tabsEl = document.getElementById('tabs');
			tabsEl.innerHTML = '';
			const present = VIEW_ORDER.filter((v) => views.has(v)).concat(
				[...views].filter((v) => !VIEW_ORDER.includes(v))
			);
			if (present.length === 0) return;
			if (!present.includes(currentView)) currentView = present[0];

			if (present.length > 1) {
				tabsEl.classList.remove('hidden');
				for (const view of present) {
					const btn = el('button', {
						class: `tab-btn${view === currentView ? ' active' : ''}`,
						type: 'button',
						role: 'tab',
						text: VIEW_LABELS[view] || view,
					});
					btn.addEventListener('click', () => {
						currentView = view;
						tabsEl.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
						renderSubTabs();
						updateSearchVisibility();
						updateVisibility();
						if (currentView === 'scoring') {
							startLiveScoringPolling();
						} else {
							stopLiveScoringPolling();
						}
					});
					tabsEl.appendChild(btn);
				}
			} else {
				tabsEl.classList.add('hidden');
			}

			renderSubTabs();
			updateSearchVisibility();
		}

		async function init() {
			const statusEl = document.getElementById('status');
			const gridEl = document.getElementById('grid');
			const updatedEl = document.getElementById('updated');

			try {
				// Cache-bust so GitHub Pages' CDN can't serve a stale snapshot after a sync.
				const res = await fetch(`data/rosters.json?t=${Date.now()}`, { cache: 'no-store' });
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				const data = await res.json();
				pageData = data;

				updatedEl.textContent = data.generatedAt
					? `Last synced ${timeAgo(data.generatedAt)}`
					: 'Not yet synced — run the "Sync MFL Rosters" GitHub Action.';

				if (!data.leagues || data.leagues.length === 0) {
					statusEl.textContent = 'No leagues configured yet.';
					return;
				}

				for (const league of data.leagues) {
					gridEl.appendChild(renderCard(league));
					if (league.standings !== undefined || league.standingsError) {
						gridEl.appendChild(renderStandingsCard(league));
					}
					if (league.scoring !== undefined || league.scoringError) {
						gridEl.appendChild(renderScoringCard(league));
					}
				}

				const presentViews = new Set([...gridEl.querySelectorAll('.card')].map((c) => c.dataset.view).filter(Boolean));
				renderViewTabs(presentViews);
				updateVisibility();
				if (currentView === 'scoring') {
					startLiveScoringPolling();
				}
			} catch (err) {
				statusEl.textContent = `Couldn't load roster data: ${err.message}`;
				updatedEl.textContent = '';
			}
		}

		document.getElementById('search').addEventListener('input', updateVisibility);
		init();
	</script>
</body>
</html>
