<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>myFFL</title>
	<link rel="icon" type="image/png" sizes="32x32" href="https://shamrock84.github.io/fflicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="https://shamrock84.github.io/fflicons/favicon-16x16.png">
	<link rel="manifest" href="https://shamrock84.github.io/fflicons/site.webmanifest">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F2683">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#140f1e">
	<style>
		/* Minnesota Vikings palette: purple as the primary accent everywhere,
		   gold reserved specifically for highlighting the user's own team. */
		:root {
			--bg: #f5f3f9;
			--card-bg: #ffffff;
			--text: #1b1425;
			--muted: #6b6478;
			--border: #e3daf0;
			--accent: #4F2683;
			--chip-bg: #ede3f8;
			--taxi-bg: #eff6ff;
			--taxi-text: #1e40af;
			--ir-bg: #fef2f2;
			--ir-text: #991b1b;
			--gold: #FFC62F;
			--gold-text: #5c4300;
			--gold-chip-bg: #fff3d1;
			--gold-chip-text: #7a5c00;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #140f1e;
				--card-bg: #1e1730;
				--text: #ede9f5;
				--muted: #a79bc2;
				--border: #362a4a;
				--accent: #b48ee0;
				--chip-bg: #2c2145;
				--taxi-bg: #0e2340;
				--taxi-text: #93c5fd;
				--ir-bg: #341313;
				--ir-text: #fca5a5;
				--gold: #FFC62F;
				--gold-text: #3d2e00;
				--gold-chip-bg: #3d2e05;
				--gold-chip-text: #f0c33e;
			}
		}
		body::before {
			content: '';
			display: block;
			height: 4px;
			background: linear-gradient(90deg, var(--accent), var(--gold));
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}
		header {
			padding: 1.5rem 1rem 1rem;
			text-align: center;
		}
		header h1 {
			margin: 0 0 0.25rem;
		}
		.site-title {
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.site-logo {
			height: 64px;
			width: auto;
			display: block;
		}
		.site-logo-prefix {
			font-family: Georgia, 'Times New Roman', serif;
			font-weight: 400;
			font-size: 1.85rem;
			line-height: 1;
			color: var(--text);
			margin-right: 0.15rem;
			margin-top: 0.75rem;
		}
		@media (prefers-color-scheme: dark) {
			.site-logo {
				filter: invert(1);
			}
		}
		.updated-row {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.3rem;
		}
		#updated {
			color: var(--muted);
			font-size: 0.85rem;
		}
		.auth-control {
			display: flex;
			justify-content: center;
			margin-top: 0.4rem;
		}
		.auth-control:empty {
			margin-top: 0;
		}
		.auth-control .lineup-login {
			margin-top: 0;
		}
		.auth-status-text {
			font-size: 0.8rem;
			color: var(--muted);
			margin-right: 0.4rem;
		}
		.auth-logout-btn {
			background: none;
			border: none;
			color: var(--muted);
			font-size: 0.78rem;
			cursor: pointer;
			padding: 0;
			text-decoration: underline;
		}
		#sync-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 1.4rem;
			height: 1.4rem;
			padding: 0;
			border: none;
			border-radius: 50%;
			background: none;
			color: var(--muted);
			cursor: pointer;
		}
		#sync-btn:hover:not(:disabled) {
			background: var(--chip-bg);
			color: var(--accent);
		}
		#sync-btn:disabled {
			cursor: default;
			opacity: 0.6;
		}
		#sync-btn.spinning svg {
			animation: sync-spin 0.9s linear infinite;
		}
		@keyframes sync-spin {
			to { transform: rotate(360deg); }
		}
		#live-status {
			text-align: center;
			font-size: 0.78rem;
			margin-top: 0.5rem;
			color: var(--muted);
		}
		#live-status.live-error {
			color: var(--ir-text);
		}
		.tabs {
			display: flex;
			justify-content: center;
			gap: 0.5rem;
			margin-top: 1.25rem;
			flex-wrap: wrap;
			padding: 0 1rem;
		}
		.tab-btn {
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--muted);
			padding: 0.45rem 1rem;
			border-radius: 999px;
			font-size: 0.88rem;
			font-weight: 600;
			cursor: pointer;
		}
		.tab-btn.active {
			background: var(--accent);
			border-color: var(--accent);
			color: #fff;
		}
		.subtabs {
			margin-top: 0.6rem;
		}
		.subtabs .tab-btn {
			padding: 0.3rem 0.8rem;
			font-size: 0.78rem;
			background: transparent;
		}
		.subtabs .tab-btn.active {
			background: var(--chip-bg);
			border-color: var(--accent);
			color: var(--accent);
		}
		.controls {
			max-width: 480px;
			margin: 1rem auto 0;
			padding: 0 1rem;
		}
		.search-wrap {
			position: relative;
		}
		#search {
			width: 100%;
			padding: 0.6rem 2.2rem 0.6rem 0.9rem;
			border-radius: 999px;
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--text);
			font-size: 1rem;
		}
		/* Custom clear button replaces the inconsistent native one (Firefox
		   doesn't show one at all for type=search; WebKit's is hard to style). */
		#search::-webkit-search-cancel-button {
			display: none;
		}
		#search-clear {
			position: absolute;
			right: 0.5rem;
			top: 50%;
			transform: translateY(-50%);
			width: 1.5rem;
			height: 1.5rem;
			border: none;
			border-radius: 50%;
			background: transparent;
			color: var(--muted);
			font-size: 1.2rem;
			line-height: 1;
			cursor: pointer;
			padding: 0;
		}
		#search-clear:hover {
			background: var(--chip-bg);
			color: var(--text);
		}
		main {
			max-width: 1400px;
			margin: 0 auto;
			padding: 0.5rem 1rem 3rem;
		}
		#status {
			text-align: center;
			color: var(--muted);
			padding: 0;
		}
		#status:not(:empty) {
			padding: 2rem 0;
		}
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr));
			gap: 1rem;
		}
		.card {
			background: var(--card-bg);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 1rem 1.1rem 1.2rem;
			display: flex;
			flex-direction: column;
		}
		.card-head {
			display: flex;
			flex-wrap: nowrap;
			align-items: flex-start;
			justify-content: space-between;
			gap: 0.4rem 0.5rem;
		}
		.card h2 {
			margin: 0;
			font-size: 1.15rem;
			min-width: 0;
			flex: 1 1 auto;
			overflow-wrap: break-word;
		}
		.card h2 a {
			color: var(--text);
			text-decoration: none;
		}
		.card h2 a:hover {
			color: var(--accent);
			text-decoration: underline;
		}
		.card h2 .rules-link {
			margin-left: 0.4rem;
			font-size: 0.85em;
			text-decoration: none;
			opacity: 0.75;
		}
		.card h2 .rules-link:hover {
			opacity: 1;
			text-decoration: none;
		}
		.badges {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 0.3rem;
			flex-shrink: 0;
		}
		/* More than 2 badges gets cramped on one line, especially on narrow
		   cards — cap the row width so a 3rd+ badge wraps to a second line
		   instead of squeezing the title or overflowing. */
		.badges.badges-wrap {
			max-width: 12.5rem;
		}
		.badge {
			display: inline-block;
			background: var(--chip-bg);
			color: var(--accent);
			border-radius: 999px;
			padding: 0.15rem 0.55rem;
			font-size: 0.68rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.03em;
			white-space: nowrap;
		}
		.badge-provider {
			background: var(--gold-chip-bg);
			color: var(--gold-chip-text);
		}
		/* Badges always stay to the right of the title (card-head is nowrap,
		   never drops badges to their own row) — the title just shrinks and
		   wraps onto more lines to make room, via min-width:0 +
		   overflow-wrap:break-word above. On narrow screens a long title and
		   its badges get tight, so wrap more aggressively there: cap the
		   badges row tighter so it takes less width, leaving more for the
		   title to wrap into. */
		@media (max-width: 600px) {
			.badges,
			.badges.badges-wrap {
				max-width: 6.5rem;
			}
		}
		.card .team {
			color: var(--muted);
			font-size: 0.85rem;
			margin: 0.15rem 0 0.75rem;
		}
		.error-box {
			background: var(--ir-bg);
			color: var(--ir-text);
			border-radius: 8px;
			padding: 0.6rem 0.75rem;
			font-size: 0.85rem;
		}
		.group-label {
			font-size: 0.72rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
			margin: 0.75rem 0 0.35rem;
		}
		.group-label:first-of-type { margin-top: 0; }
		.lineup-login {
			margin-top: 0.6rem;
		}
		.lineup-login-toggle {
			background: none;
			border: none;
			color: var(--accent);
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
			padding: 0;
		}
		.lineup-login-toggle:hover {
			text-decoration: underline;
		}
		.lineup-login-form {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-top: 0.4rem;
			flex-wrap: wrap;
		}
		.lineup-login-form input[type="password"] {
			flex: 1;
			min-width: 0;
			padding: 0.4rem 0.6rem;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--text);
			font-size: 0.85rem;
		}
		.lineup-login-form button[type="submit"] {
			border: 1px solid var(--accent);
			background: var(--accent);
			color: #fff;
			padding: 0.4rem 0.8rem;
			border-radius: 6px;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
		}
		.lineup-login-form button[type="submit"]:disabled {
			opacity: 0.6;
			cursor: default;
		}
		.lineup-login-status {
			font-size: 0.78rem;
			color: var(--ir-text);
		}
		.lineup-editor-actions {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			margin-top: 0.6rem;
			flex-wrap: wrap;
		}
		.lineup-save-btn {
			border: 1px solid var(--accent);
			background: var(--accent);
			color: #fff;
			padding: 0.4rem 0.9rem;
			border-radius: 999px;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
		}
		.lineup-save-btn:disabled {
			opacity: 0.6;
			cursor: default;
		}
		.lineup-logout-btn {
			background: none;
			border: none;
			color: var(--muted);
			font-size: 0.78rem;
			cursor: pointer;
			padding: 0;
			text-decoration: underline;
		}
		.lineup-editor-status {
			font-size: 0.8rem;
			color: var(--muted);
		}
		.lineup-requirements {
			font-size: 0.78rem;
			color: var(--muted);
		}
		.lineup-editor-note {
			margin-top: 0.6rem;
			font-size: 0.78rem;
			color: var(--muted);
		}
		/* Only when the checkbox column exists at all — logged out, it's
		   omitted entirely (see buildLineupEditor's `visible` gate), so the
		   first column is the position chip and shouldn't be squeezed to
		   checkbox width. */
		table.lineup-editor-table:not(.read-only) td:first-child {
			width: 1.6rem;
		}
		table.lineup-editor-table input[type="checkbox"] {
			width: 1.05rem;
			height: 1.05rem;
			cursor: pointer;
		}
		table.roster {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		table.roster tr.player-row td {
			padding: 0.3rem 0.2rem;
			border-bottom: 1px solid var(--border);
		}
		table.roster tr.player-row:last-child td {
			border-bottom: none;
		}
		table.roster tr.player-row.pos-boundary td {
			border-top: 2px solid color-mix(in srgb, var(--accent) 70%, var(--border));
			padding-top: 0.4rem;
		}
		table.salary-summary {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.85rem;
			margin-top: 0.4rem;
		}
		table.salary-summary td {
			padding: 0.3rem 0.2rem;
			border-top: 1px solid var(--border);
		}
		table.salary-summary td:first-child {
			color: var(--muted);
		}
		table.salary-summary td:last-child {
			text-align: right;
			font-variant-numeric: tabular-nums;
			font-weight: 600;
		}
		table.salary-summary tr.salary-total td {
			font-weight: 600;
			color: var(--text);
		}
		table.salary-summary tr.salary-cap-room td {
			font-weight: 700;
			color: var(--accent);
		}
		table.salary-summary tr.salary-cap-room.salary-negative td {
			color: var(--ir-text);
		}
		/* Total/Cap Room when they include at least one locally-planned salary
		   standing in for a real one — dashed underline on the dollar figure
		   itself flags "this number isn't fully official yet" without
		   demoting its visual weight the way italics would. Hover for why. */
		table.salary-summary tr.salary-has-plan td:last-child {
			text-decoration: underline dashed;
			text-underline-offset: 0.15rem;
		}
		.pos-chip {
			display: inline-block;
			min-width: 2rem;
			text-align: center;
			background: var(--chip-bg);
			color: var(--accent);
			border-radius: 6px;
			padding: 0.1rem 0.35rem;
			font-size: 0.72rem;
			font-weight: 600;
		}
		.nfl-team {
			color: var(--muted);
			font-size: 0.78rem;
		}
		.player-name {
			font-weight: 500;
		}
		.injury-badge {
			color: var(--ir-text);
			font-weight: 600;
			margin-left: 0.35rem;
			font-size: 0.78rem;
		}
		tr.roster-head th {
			text-align: left;
			font-size: 0.65rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			padding: 0 0.2rem 0.3rem;
			font-weight: 600;
		}
		.salary-cell,
		.years-cell,
		.bye-cell,
		.ecr-cell,
		.pts-cell {
			text-align: right;
			font-variant-numeric: tabular-nums;
			font-size: 0.82rem;
			color: var(--muted);
		}
		tr.roster-head th.salary-cell,
		tr.roster-head th.years-cell,
		tr.roster-head th.bye-cell,
		tr.roster-head th.ecr-cell,
		tr.roster-head th.pts-cell {
			text-align: right;
		}
		.pts-cell.pts-prior-year {
			font-style: italic;
		}
		/* Yrs cell when standing in for a not-yet-official MFL contract length —
		   a compact select, styled like a chip so it reads as "editable/
		   unofficial" rather than a plain data value like the rest of the row. */
		.years-select {
			font: inherit;
			font-size: 0.82rem;
			color: var(--accent);
			background: var(--chip-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 0.05rem 0.15rem;
			text-align: right;
		}
		/* Salary cell's own not-yet-official planning dropdown — visually the
		   same treatment as .years-select but kept as a separate rule so the
		   two can diverge independently later. */
		.salary-select {
			font: inherit;
			font-size: 0.82rem;
			color: var(--accent);
			background: var(--chip-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 0.05rem 0.15rem;
			text-align: right;
		}
		/* Top-24 overall gets the accent treatment so the studs on a roster
		   stand out at a glance without having to read every row. */
		.ecr-cell.ecr-elite {
			color: var(--accent);
			font-weight: 600;
		}
		.rankings-note {
			margin-top: 0.6rem;
			font-size: 0.7rem;
			color: var(--muted);
		}
		tr.status-taxi_squad .pos-chip,
		tr.status-injured_reserve .pos-chip {
			opacity: 0.9;
		}
		.status-taxi_squad { background: var(--taxi-bg); }
		.status-injured_reserve { background: var(--ir-bg); }
		.contract-warn-icon {
			color: var(--gold-chip-text);
			margin-right: 0.25rem;
			cursor: help;
		}
		.needs-contract-banner {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.6rem;
			margin-bottom: 0.5rem;
			padding: 0.4rem 0.6rem;
			border-radius: 8px;
			background: var(--gold-chip-bg);
			color: var(--gold-chip-text);
			font-size: 0.8rem;
			font-weight: 600;
		}
		.contract-email-link {
			flex-shrink: 0;
			color: var(--gold-chip-text);
			text-decoration: underline;
			white-space: nowrap;
		}
		table.standings {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		table.standings th {
			text-align: left;
			font-size: 0.68rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			padding: 0 0.2rem 0.4rem;
		}
		table.standings td {
			padding: 0.3rem 0.2rem;
			border-bottom: 1px solid var(--border);
		}
		table.standings tr:last-child td { border-bottom: none; }
		table.standings th:not(:first-child),
		table.standings td:not(:first-child) {
			text-align: right;
		}
		tr.me-row td {
			font-weight: 700;
			background: var(--gold);
			color: var(--gold-text);
		}
		.exposure-leagues {
			color: var(--muted);
			font-size: 0.72rem;
			margin-top: 0.1rem;
		}
		.pager {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.75rem;
			margin-top: 0.75rem;
		}
		.pager-btn {
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--accent);
			padding: 0.3rem 0.8rem;
			border-radius: 999px;
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
		}
		.pager-btn:disabled {
			opacity: 0.4;
			cursor: default;
		}
		.pager-label {
			font-size: 0.78rem;
			color: var(--muted);
		}
		.hidden { display: none !important; }
		/* Admin tab. The grid is a responsive multi-column layout, but this
		   card holds the full league list — let it span every column instead of
		   being squeezed into one. */
		.admin-card {
			grid-column: 1 / -1;
		}
		.admin-note {
			font-size: 0.85rem;
			color: var(--muted);
			margin-top: 0.5rem;
		}
		/* Every explanatory line in one block below the buttons: read once, then
		   ignored, so it shouldn't sit between you and the thing you came to edit.
		   Ruled off rather than merely spaced, since it follows the Save row and
		   would otherwise read as a caption for it. */
		.admin-legend {
			font-size: 0.75rem;
			color: var(--muted);
			line-height: 1.45;
			margin-top: 1.1rem;
			padding-top: 0.7rem;
			border-top: 1px solid var(--border);
		}
		.admin-legend h3 {
			margin: 0 0 0.35rem;
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			font-weight: 600;
			color: var(--accent);
		}
		.admin-legend ul {
			margin: 0;
			padding-left: 1.1rem;
		}
		.admin-legend li {
			margin-bottom: 0.25rem;
		}
		/* One collapsible card per league, replacing a thirteen-column table
		   that only fitted by scrolling sideways — which on a phone scrolled the
		   league's own name out of view before you reached the field you were
		   editing. */
		.admin-list {
			display: flex;
			flex-direction: column;
			gap: 0.45rem;
		}
		.admin-league {
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 0.5rem 0.6rem;
		}
		.admin-league.admin-open {
			border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
		}
		.admin-league-head {
			display: flex;
			align-items: center;
			gap: 0.4rem;
		}
		.admin-grip {
			color: var(--muted);
			cursor: grab;
			line-height: 1;
			flex-shrink: 0;
		}
		.admin-league-head:active .admin-grip {
			cursor: grabbing;
		}
		/* The whole head is the disclosure target, so a mis-aimed tap still
		   opens the card rather than doing nothing. */
		.admin-disclosure {
			display: flex;
			align-items: center;
			gap: 0.35rem;
			flex: 1;
			min-width: 0;
			font: inherit;
			text-align: left;
			color: var(--text);
			background: none;
			border: 0;
			padding: 0.1rem 0;
			cursor: pointer;
		}
		/* Sized up from 0.7rem, where next to a bold title it read as a bullet
		   rather than a control you can press. Fixed width and centred because ▸
		   and ▾ have different advance widths, which would otherwise shift the
		   league name sideways every time a card opened. */
		.admin-caret {
			color: var(--accent);
			font-size: 1.15rem;
			line-height: 1;
			width: 0.95rem;
			text-align: center;
			flex-shrink: 0;
		}
		.admin-league-name {
			font-weight: 600;
			font-size: 0.9rem;
			min-width: 0;
			overflow-wrap: break-word;
		}
		/* Deliberately its own flex row rather than the shared .badges: that
		   caps its width at 6.5rem under 600px to protect a card title, which
		   here would stack four badges into a column. */
		.admin-badges {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 0.25rem;
			flex-shrink: 0;
			max-width: 45%;
		}
		/* Narrow screens: give the league name the full width and let the badges
		   drop to their own line, rather than wrapping a three-word name into
		   three lines to keep four chips beside it. */
		@media (max-width: 600px) {
			.admin-league-head {
				flex-wrap: wrap;
			}
			.admin-badges {
				order: 3;
				flex-basis: 100%;
				max-width: 100%;
				justify-content: flex-start;
				margin-left: 1.8rem;
			}
		}
		/* Touch devices don't fire HTML5 drag events at all, so don't show a grip
		   advertising a gesture that cannot work there — ↑/↓ is the way to
		   reorder on a phone. */
		@media (hover: none) {
			.admin-grip {
				display: none;
			}
		}
		.admin-blurb {
			color: var(--muted);
			font-size: 0.75rem;
			line-height: 1.4;
			margin: 0.15rem 0 0 1.8rem;
		}
		/* However many columns fit, one on a phone. This is the bit that removes
		   the horizontal scrolling, so don't pin it to a fixed column count. */
		.admin-fields {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
			gap: 0.5rem 0.6rem;
			margin-top: 0.6rem;
			padding-top: 0.6rem;
			border-top: 1px solid var(--border);
		}
		.admin-field {
			display: flex;
			flex-direction: column;
			gap: 0.2rem;
			min-width: 0;
		}
		/* 1 / -1 rather than span 2: with auto-fit down to a single column, a
		   2-column span would conjure an implicit second column and reintroduce
		   the sideways scroll this whole layout exists to remove. */
		.admin-field-wide {
			grid-column: 1 / -1;
		}
		.admin-field-check {
			flex-direction: row;
			align-items: center;
			gap: 0.4rem;
			cursor: pointer;
		}
		.admin-field-label {
			font-size: 0.68rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			font-weight: 600;
		}
		.admin-league-actions {
			display: flex;
			justify-content: flex-end;
			margin-top: 0.5rem;
		}
		/* Drag feedback. Insets rather than borders so showing where a card will
		   land doesn't nudge every card below it by a pixel. */
		.admin-league.admin-dragging {
			opacity: 0.4;
		}
		.admin-league.admin-drop-before {
			box-shadow: inset 0 3px 0 0 var(--accent);
		}
		.admin-league.admin-drop-after {
			box-shadow: inset 0 -3px 0 0 var(--accent);
		}
		.admin-name-pending {
			color: var(--muted);
			font-style: italic;
		}
		.admin-move {
			display: flex;
			gap: 0.2rem;
			flex-shrink: 0;
		}
		.admin-icon-btn {
			font: inherit;
			font-size: 0.8rem;
			line-height: 1;
			color: var(--accent);
			background: var(--chip-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 0.2rem 0.35rem;
			cursor: pointer;
		}
		.admin-icon-btn:disabled {
			opacity: 0.35;
			cursor: default;
		}
		.admin-remove-btn {
			color: var(--ir-text);
			background: var(--ir-bg);
		}
		.admin-add-row {
			margin-top: 0.7rem;
		}
		.admin-add-btn, .admin-revert-btn {
			font: inherit;
			font-size: 0.85rem;
			color: var(--accent);
			background: transparent;
			border: 1px solid var(--accent);
			border-radius: 999px;
			padding: 0.35rem 0.9rem;
			cursor: pointer;
		}
		.admin-revert-btn:disabled {
			opacity: 0.5;
			cursor: default;
		}
		/* Server-side validation failures, one per line — these are the only
		   thing standing between a typo and a silently broken sync, so they get
		   the error treatment rather than a muted note. */
		.admin-problems {
			margin: 0.6rem 0 0;
			padding: 0.6rem 0.75rem 0.6rem 1.6rem;
			background: var(--ir-bg);
			color: var(--ir-text);
			border-radius: 8px;
			font-size: 0.82rem;
			line-height: 1.5;
		}
		footer {
			text-align: center;
			color: var(--muted);
			font-size: 0.8rem;
			padding-bottom: 2rem;
		}
		footer a { color: var(--accent); }
	</style>
</head>
<body>
	<header>
		<h1 class="site-title">
			<span class="site-logo-prefix">my</span>
			<img src="images/ffl_black.gif" alt="FFL" class="site-logo">
		</h1>
		<div class="updated-row">
			<span id="updated">Loading&hellip;</span>
			<button type="button" id="sync-btn" aria-label="Sync now" title="Sync now">
				<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="23 4 23 10 17 10"></polyline>
					<polyline points="1 20 1 14 7 14"></polyline>
					<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
				</svg>
			</button>
		</div>
		<div id="auth-control" class="auth-control"></div>
	</header>
	<div class="tabs" id="tabs" role="tablist"></div>
	<div class="tabs subtabs" id="subtabs" role="tablist"></div>
	<div id="live-status" class="hidden"></div>
	<div class="controls">
		<div class="search-wrap">
			<input type="search" id="search" placeholder="Filter by player name&hellip;" autocomplete="off">
			<button type="button" id="search-clear" class="hidden" aria-label="Clear search">&times;</button>
		</div>
	</div>
	<main>
		<div id="status"></div>
		<div id="grid" class="grid"></div>
	</main>
	<footer>
		Data pulled from <a href="https://www.myfantasyleague.com" target="_blank" rel="noopener">MyFantasyLeague</a>, <a href="https://www.espn.com/fantasy/football/" target="_blank" rel="noopener">ESPN</a>, and/or <a href="https://sleeper.com" target="_blank" rel="noopener">Sleeper</a> via a scheduled sync.
	</footer>

	<script>
		const STATUS_GROUPS = [
			{ key: 'ROSTER', label: 'Active Roster' },
			{ key: 'TAXI_SQUAD', label: 'Taxi Squad' },
			{ key: 'PRACTICE_SQUAD', label: 'Practice Squad' },
			{ key: 'INJURED_RESERVE', label: 'Injured Reserve' },
		];

		function timeAgo(iso) {
			if (!iso) return 'never';
			const diffMs = Date.now() - new Date(iso).getTime();
			const mins = Math.round(diffMs / 60000);
			if (mins < 1) return 'just now';
			if (mins < 60) return `${mins} min ago`;
			const hrs = Math.round(mins / 60);
			if (hrs < 24) return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
			const days = Math.round(hrs / 24);
			return `${days} day${days === 1 ? '' : 's'} ago`;
		}

		function el(tag, attrs = {}, children = []) {
			const node = document.createElement(tag);
			for (const [k, v] of Object.entries(attrs)) {
				if (k === 'class') node.className = v;
				else if (k === 'text') node.textContent = v;
				else node.setAttribute(k, v);
			}
			for (const child of children) node.appendChild(child);
			return node;
		}

		// 'admin' is only ever in this set when logged in — renderGrid simply
		// doesn't build the card otherwise, and the tab list is derived from the
		// cards that exist, so logging out removes the tab with no extra work.
		const VIEW_LABELS = { rosters: 'Rosters', standings: 'Standings', scoring: 'Scoring', analytics: 'Analytics', admin: 'Admin' };
		const VIEW_ORDER = ['rosters', 'scoring', 'standings', 'analytics', 'admin'];
		// Per-league type — still what individual Rosters cards badge
		// themselves with (a Salary Cap league's card says "Salary Cap", not
		// "Dynasty/Salary Cap"), just no longer what any sub-tab is named
		// after. See SUBTAB_GROUP/SUBTAB_LABEL_OVERRIDES below for that.
		// The draft-only type is named for what it is. Best Ball is a scoring
		// system, not a league type — it's carried in `tags` (several salary-cap
		// leagues use best-ball scoring), so using it as a type name too made
		// the same words mean two different things. The stored value is
		// 'draftonly'; nothing in the UI or the config says "best ball" as a
		// type any more.
		const LEAGUE_TYPE_LABELS = { dynasty: 'Dynasty', salarycap: 'Salary Cap', draftonly: 'Draft Only', redraft: 'Redraft' };
		// FantasyPros' ranking-type codes, spelled out for the card footnote.
		const ECR_TYPE_LABELS = { DYNASTY: 'Dynasty', DRAFT: 'Draft', ROS: 'Rest-of-season', WEEKLY: 'Weekly', ADP: 'ADP' };
		// Which sub-tab a league's cards render under, in every view (Rosters,
		// Scoring, Standings, Analytics) — Dynasty and Salary Cap share one
		// sub-tab everywhere, since a salary-cap roster is still a
		// dynasty-style keeper roster; the other two are one-to-one with
		// their league type.
		const SUBTAB_GROUP = { dynasty: 'dynasty', salarycap: 'dynasty', draftonly: 'draftonly', redraft: 'redraft' };
		const SUBTAB_ORDER = ['dynasty', 'redraft', 'draftonly'];
		// Only where a sub-tab's name needs to differ from LEAGUE_TYPE_LABELS —
		// everything else falls through to that shared wording, so "Redraft"
		// isn't repeated here. bestball used to be overridden to "Draft Only"
		// for the sub-tab only; that wording is now the type label itself, so
		// the override would be a no-op and is gone.
		const SUBTAB_LABEL_OVERRIDES = { dynasty: 'Dynasty/Salary Cap' };

		function subtabType(league) {
			return SUBTAB_GROUP[league.type] || league.type;
		}

		// Reverse of SUBTAB_GROUP: every underlying league.type that folds
		// into a given sub-tab. Used by the Analytics exposure card to know
		// which leagues to combine into one group.
		function typesInSubtab(groupKey) {
			return Object.keys(SUBTAB_GROUP).filter((t) => SUBTAB_GROUP[t] === groupKey);
		}
		const POSITION_ORDER = ['QB', 'RB', 'WR', 'TE', 'PK', 'Def'];
		function positionRank(pos) {
			const idx = POSITION_ORDER.indexOf(pos);
			return idx === -1 ? POSITION_ORDER.length : idx;
		}
		// Remember the last tab/sub-tab a visitor picked across reloads. Only
		// written on an actual click (see renderViewTabs/renderSubTabs below),
		// never when a stored value gets silently corrected because this
		// session's data doesn't currently have that view/sub-tab — a
		// transient gap (e.g. one sync with an empty Redraft) shouldn't
		// overwrite a real saved preference.
		const VIEW_STORAGE_KEY = 'myfflView';
		const LEAGUE_TYPE_STORAGE_KEY = 'myfflLeagueType';
		let currentView = localStorage.getItem(VIEW_STORAGE_KEY) || 'rosters';
		let currentLeagueType = localStorage.getItem(LEAGUE_TYPE_STORAGE_KEY) || null;

		// Locally-planned contract length (1/2/3 years) for a Salary Cap roster
		// spot that doesn't have a real one from MFL yet — a personal planning
		// aid, never sent anywhere. Keyed by league id then player id, since
		// the same player can sit on rosters in more than one Salary Cap
		// league with a different plan in each. Once a real contractYear shows
		// up from a sync it always wins and the dropdown simply stops
		// rendering for that player — any leftover saved plan is harmless and
		// isn't proactively cleaned up.
		const CONTRACT_PLAN_STORAGE_KEY = 'myfflContractPlans';
		function loadContractPlans() {
			try {
				return JSON.parse(localStorage.getItem(CONTRACT_PLAN_STORAGE_KEY) || '{}');
			} catch {
				return {};
			}
		}
		function getContractPlan(leagueId, playerId) {
			return loadContractPlans()[leagueId]?.[playerId] || '';
		}
		function setContractPlan(leagueId, playerId, years) {
			const plans = loadContractPlans();
			if (!years) {
				delete plans[leagueId]?.[playerId];
				if (plans[leagueId] && Object.keys(plans[leagueId]).length === 0) delete plans[leagueId];
			} else {
				plans[leagueId] = plans[leagueId] || {};
				plans[leagueId][playerId] = years;
			}
			localStorage.setItem(CONTRACT_PLAN_STORAGE_KEY, JSON.stringify(plans));
		}

		// Where each Salary Cap league's contract-length summary email should
		// go — override per league by id here once the real address is known.
		// Falls back to a single placeholder until then (currently every
		// league, while this feature is still being verified).
		const CONTRACT_EMAIL_DEFAULT = 'melbosffl@gmail.com';
		const CONTRACT_EMAIL_OVERRIDES = {
			// '35217': 'commissioner@example.com', // The Iron Bank
		};
		function contractEmailFor(league) {
			return CONTRACT_EMAIL_OVERRIDES[league.id] || CONTRACT_EMAIL_DEFAULT;
		}

		// Locally-planned salary ($1-200, whole dollars) for a Salary Cap
		// roster spot that doesn't have a real one from MFL yet. Same shape
		// and purpose as the contract-length plan above, but deliberately its
		// own storage key and functions rather than a shared "plan" helper —
		// salary and contract length are different domains (money vs. term),
		// and keeping them independent means a change to one's rules (e.g.
		// what counts as "unset") can never accidentally leak into the other.
		const SALARY_PLAN_STORAGE_KEY = 'myfflSalaryPlans';
		function loadSalaryPlans() {
			try {
				return JSON.parse(localStorage.getItem(SALARY_PLAN_STORAGE_KEY) || '{}');
			} catch {
				return {};
			}
		}
		function getSalaryPlan(leagueId, playerId) {
			return loadSalaryPlans()[leagueId]?.[playerId] || '';
		}
		function setSalaryPlan(leagueId, playerId, salary) {
			const plans = loadSalaryPlans();
			if (!salary) {
				delete plans[leagueId]?.[playerId];
				if (plans[leagueId] && Object.keys(plans[leagueId]).length === 0) delete plans[leagueId];
			} else {
				plans[leagueId] = plans[leagueId] || {};
				plans[leagueId][playerId] = salary;
			}
			localStorage.setItem(SALARY_PLAN_STORAGE_KEY, JSON.stringify(plans));
		}
		let pageData = null;
		let liveScoringTimer = null;
		let syncPollTimer = null;

		// Live-scoring proxy (Vercel), separate from the 4-hour GitHub Actions
		// sync — polled only while the Scoring tab is open. Filled in once
		// deployed; polling is a no-op while this is empty.
		const LIVE_SCORING_URL = 'https://shamrock84-github-io.vercel.app/api/live-scoring';
		const LIVE_SCORING_POLL_MS = 30000;

		// Same Vercel deployment, different endpoint: kicks off a fresh GitHub
		// Actions sync run on demand instead of waiting up to 4 hours.
		const TRIGGER_SYNC_URL = 'https://shamrock84-github-io.vercel.app/api/trigger-sync';

		// Lineup-editing pilot: login exchanges the shared site password for a
		// signed token (stored in localStorage), sent as a Bearer token when
		// submitting a lineup. Only relevant for leagues with a starters list.
		const LOGIN_URL = 'https://shamrock84-github-io.vercel.app/api/login';
		const SUBMIT_LINEUP_URL = 'https://shamrock84-github-io.vercel.app/api/submit-lineup';
		const AUTH_TOKEN_KEY = 'mflAuthToken';

		// Admin tab: reads the live league config straight off the site (it's a
		// plain file in the repo, served by Pages like everything else) and
		// writes it back through Vercel, which validates before committing.
		const LEAGUES_CONFIG_URL = 'config/leagues.json';
		const SAVE_LEAGUES_URL = 'https://shamrock84-github-io.vercel.app/api/save-leagues';
		let leagueConfig = null;
		let leagueConfigError = null;
		let authToken = localStorage.getItem(AUTH_TOKEN_KEY) || null;

		function isLoggedIn() {
			return !!authToken;
		}

		async function doLogin(password) {
			const res = await fetch(LOGIN_URL, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ password }),
			});
			const body = await res.json().catch(() => ({}));
			if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
			authToken = body.token;
			localStorage.setItem(AUTH_TOKEN_KEY, authToken);
		}

		function doLogout() {
			authToken = null;
			localStorage.removeItem(AUTH_TOKEN_KEY);
			// Unsaved Admin edits belong to the session that made them — leaving
			// them in memory would hand them to whoever logs in next.
			adminDraft = null;
			adminExpanded.clear();
			renderGrid();
		}

		// NFL injury-report designation, already collapsed to a short badge
		// (Q/D/O/IR/...) server-side — see normalizeInjuryStatus in
		// providers.mjs. Mirrors how MFL's own roster page shows it: right
		// after the player's name, in parens. No visibility gate — unlike a
		// planned salary or contract length, an NFL team's own public injury
		// report isn't this manager's strategy to protect from league mates.
		function buildInjuryBadge(p) {
			if (!p.injuryStatus) return null;
			return el('span', { class: 'injury-badge', text: `(${p.injuryStatus})` });
		}

		// FantasyPros consensus rank, attached to players during the sync (see
		// scripts/lib/fantasypros.mjs). Shows the positional rank ("RB4") since
		// that's what's actionable at a glance, with the overall rank and tier
		// on hover. Players FantasyPros doesn't rank — deep-bench dynasty
		// stashes, mostly — fall through to an em dash like any other missing
		// value, and the whole column is empty when no API key is configured.
		function buildEcrCell(p) {
			const ecr = p.ecr;
			if (!ecr || (ecr.posRank == null && ecr.rank == null)) {
				return el('td', { class: 'ecr-cell', text: '—' });
			}
			const isElite = ecr.rank != null && ecr.rank <= 24;
			const details = [];
			if (ecr.rank != null) details.push(`Overall ECR ${ecr.rank}`);
			if (ecr.tier != null) details.push(`Tier ${ecr.tier}`);
			const attrs = {
				class: `ecr-cell${isElite ? ' ecr-elite' : ''}`,
				text: ecr.posRank || String(ecr.rank),
			};
			if (details.length > 0) attrs.title = details.join(' · ');
			return el('td', attrs);
		}

		// Position groups (QB, RB, WR, ...) stay intact — same order as
		// everywhere else on the page — but within each group, best overall
		// ECR sorts first. Unranked players (FantasyPros doesn't cover every
		// deep-bench/taxi stash) fall to the end of their position group in
		// whatever order they arrived in, which is already position-then-name
		// from the sync (see providers.mjs), rather than scattering randomly.
		function sortByPositionThenEcr(players) {
			return [...players].sort(
				(a, b) => positionRank(a.position) - positionRank(b.position) || (a.ecr?.rank ?? Infinity) - (b.ecr?.rank ?? Infinity)
			);
		}

		// Yrs cell for an auction/salary-cap roster row. A real contract length
		// from MFL always wins; only when MFL hasn't set one yet (blank OR a
		// literal 0 — MFL sends this field as a string, so "0" is truthy and
		// needs an explicit numeric check, not just `if (p.contractYear)`)
		// does this fall back to a local planning dropdown (1/2/3 years) so a
		// manager can pencil in how long they intend to keep a player before
		// it's official.
		//
		// The dropdown and whatever's been planned are only shown while
		// logged in — this page has no per-viewer access control, so anyone
		// with the URL sees it logged out, including league mates. A planned
		// contract length is exactly the kind of strategy that shouldn't leak
		// to them; logged out, an unset value renders as a plain "—", the
		// same thing the API itself actually returned.
		function buildYearsCell(p, leagueId) {
			if (Number(p.contractYear) > 0) {
				return el('td', { class: 'years-cell', text: String(p.contractYear) });
			}
			// Contracts are due every offseason in early September — flag it
			// with an icon (and see the card-level banner in renderCard)
			// rather than leaving it as just another blank dash to spot.
			const warnIcon = el('span', {
				class: 'contract-warn-icon',
				title: 'Contract length not set yet — due early September',
				text: '⚠',
			});
			if (!isLoggedIn()) {
				return el('td', { class: 'years-cell' }, [warnIcon, el('span', { text: '—' })]);
			}
			const td = el('td', { class: 'years-cell years-cell-plan' }, [warnIcon]);
			const select = el('select', { class: 'years-select', title: 'Plan a contract length — not official until MFL sets one' });
			for (const value of ['', '1', '2', '3']) {
				select.appendChild(el('option', { value, text: value || '—' }));
			}
			select.value = getContractPlan(leagueId, p.id);
			select.addEventListener('change', () => {
				setContractPlan(leagueId, p.id, select.value);
			});
			td.appendChild(select);
			return td;
		}

		// Salary cell for an auction/salary-cap roster row. Same shape as
		// buildYearsCell (a real value from MFL always wins; blank OR a
		// literal 0 falls back to a local planning dropdown), gated by its own
		// independent condition and storage — see SALARY_PLAN_STORAGE_KEY.
		// $200 is the top of MFL's own salary UI, so the dropdown spans 1-200.
		// onSalaryChange (optional) fires after every save so the cap summary
		// — which folds this plan into Total/Cap Room, see effectiveSalary —
		// can rebuild itself immediately instead of going stale until reload.
		//
		// Same login gate as buildYearsCell, same reason: a planned salary is
		// strategy, and this page has no viewer-level access control — logged
		// out, an unset value renders as a plain "—" instead of the dropdown.
		function buildSalaryCell(p, leagueId, onSalaryChange) {
			if (Number(p.salary) > 0) {
				return el('td', { class: 'salary-cell', text: `$${Number(p.salary).toFixed(2)}` });
			}
			if (!isLoggedIn()) {
				return el('td', { class: 'salary-cell', text: '—' });
			}
			const td = el('td', { class: 'salary-cell salary-cell-plan' });
			const select = el('select', { class: 'salary-select', title: 'Plan a salary — not official until MFL sets one' });
			select.appendChild(el('option', { value: '', text: '—' }));
			for (let dollars = 1; dollars <= 200; dollars++) {
				select.appendChild(el('option', { value: String(dollars), text: `$${dollars.toFixed(2)}` }));
			}
			select.value = getSalaryPlan(leagueId, p.id);
			select.addEventListener('change', () => {
				setSalaryPlan(leagueId, p.id, select.value);
				onSalaryChange?.();
			});
			td.appendChild(select);
			return td;
		}

		function buildRosterTable(players, isAuction, statusKey, leagueId, onSalaryChange) {
			const table = el('table', { class: 'roster' });
			const headRow = el('tr', { class: 'roster-head' });
			headRow.appendChild(el('th', {}));
			headRow.appendChild(el('th', { text: 'Player' }));
			headRow.appendChild(el('th', { text: 'Team' }));
			headRow.appendChild(el('th', { class: 'bye-cell', text: 'Bye' }));
			if (isLoggedIn()) headRow.appendChild(el('th', { class: 'ecr-cell', text: 'ECR' }));
			headRow.appendChild(el('th', { class: 'pts-cell', text: 'Pts' }));
			if (isAuction) {
				headRow.appendChild(el('th', { class: 'salary-cell', text: 'Salary' }));
				headRow.appendChild(el('th', { class: 'years-cell', text: 'Yrs' }));
			}
			table.appendChild(headRow);
			let prevPosition = null;
			for (const p of sortByPositionThenEcr(players)) {
				const posBoundary = prevPosition !== null && p.position !== prevPosition;
				prevPosition = p.position;
				const rowClass = `player-row status-${statusKey}${posBoundary ? ' pos-boundary' : ''}`;
				const row = el('tr', { class: rowClass, 'data-name': p.name.toLowerCase() });
				row.appendChild(el('td', {}, [el('span', { class: 'pos-chip', text: p.position || '-' })]));
				const nameCell = el('td', { class: 'player-name', text: p.name });
				const injuryBadge = buildInjuryBadge(p);
				if (injuryBadge) nameCell.appendChild(injuryBadge);
				row.appendChild(nameCell);
				row.appendChild(el('td', { class: 'nfl-team', text: p.team || 'FA' }));
				row.appendChild(el('td', { class: 'bye-cell', text: p.bye ? String(p.bye) : '—' }));
				if (isLoggedIn()) row.appendChild(buildEcrCell(p));
				const usingPriorYear = !(p.pts > 0) && p.priorYearPts > 0;
				const ptsValue = usingPriorYear ? p.priorYearPts : p.pts;
				const ptsAttrs = { class: `pts-cell${usingPriorYear ? ' pts-prior-year' : ''}`, text: ptsValue != null ? Number(ptsValue).toFixed(2) : '—' };
				if (usingPriorYear) ptsAttrs.title = `${(pageData?.year ?? new Date().getFullYear()) - 1} season total \u2014 current season hasn't started yet`;
				row.appendChild(el('td', ptsAttrs));
				if (isAuction) {
					row.appendChild(buildSalaryCell(p, leagueId, onSalaryChange));
					row.appendChild(buildYearsCell(p, leagueId));
				}
				table.appendChild(row);
			}
			return table;
		}

		// The manager's own locally-planned salary for a still-unset roster
		// spot, or null if there isn't one — or the viewer isn't logged in.
		// A plan is exactly the kind of strategy that shouldn't leak to a
		// league mate who just has the URL, so it's withheld from cap math
		// here too, not just from what the Salary cell itself renders.
		function plannedSalary(league, p) {
			if (!isLoggedIn()) return null;
			const planned = Number(getSalaryPlan(league.id, p.id));
			return planned > 0 ? planned : null;
		}

		// Best-known salary for cap-math purposes: MFL's real number if it's
		// set, otherwise the manager's own locally-planned value (see
		// plannedSalary), otherwise $0. Doesn't affect what the Salary cell
		// itself renders — that stays strictly real-vs-dropdown so the
		// dropdown never disappears just because a plan was saved.
		function effectiveSalary(league, p) {
			const real = Number(p.salary);
			if (real > 0) return real;
			return plannedSalary(league, p) ?? 0;
		}

		// Auction/salary-cap leagues only, shown right after the Active Roster
		// group — mirrors the Salary Adjustments/Total/Salary Cap/Cap Room
		// Available rows MFL's own roster page shows. Total = this season's
		// Active Roster salaries (rosterPlayers, falling back to a locally-
		// planned salary for anyone MFL hasn't priced yet — see
		// effectiveSalary) + Salary Adjustments (drops, carry-overs, etc.,
		// summed server-side from MFL's adjustment history).
		function buildSalarySummary(league, rosterPlayers) {
			if (league.salaryCap == null) return null;
			let plannedCount = 0;
			const rosterSalaryTotal = rosterPlayers.reduce((sum, p) => {
				if (!(Number(p.salary) > 0) && plannedSalary(league, p) != null) plannedCount++;
				return sum + effectiveSalary(league, p);
			}, 0);
			const adjustments = Number(league.salaryAdjustments) || 0;
			const total = rosterSalaryTotal + adjustments;
			const capRoom = league.salaryCap - total;
			// Total/Cap Room mix in unofficial numbers whenever a planned salary
			// stood in for a real one — flagged rather than left to look like a
			// hard, all-official figure.
			const plannedNote = plannedCount > 0
				? `Includes ${plannedCount} locally-planned ${plannedCount === 1 ? 'salary' : 'salaries'}, not yet official`
				: null;

			const table = el('table', { class: 'salary-summary' });
			const row = (label, value, cls, title) => {
				const tr = el('tr', cls ? { class: cls } : {});
				tr.appendChild(el('td', { text: label }));
				const valueAttrs = { text: `$${value.toFixed(2)}` };
				if (title) valueAttrs.title = title;
				tr.appendChild(el('td', valueAttrs));
				table.appendChild(tr);
			};
			row('Salary Adjustments', adjustments);
			row('Total', total, `salary-total${plannedNote ? ' salary-has-plan' : ''}`, plannedNote);
			row('Salary Cap', league.salaryCap);
			row('Cap Room Available', capRoom, `salary-cap-room${capRoom < 0 ? ' salary-negative' : ''}${plannedNote ? ' salary-has-plan' : ''}`, plannedNote);
			return table;
		}

		function buildLoginPrompt() {
			const wrap = el('div', { class: 'lineup-login' });
			const toggleBtn = el('button', { type: 'button', class: 'lineup-login-toggle', text: 'Log in for advanced features' });
			const form = el('form', { class: 'lineup-login-form hidden' });
			const input = el('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
			const submitBtn = el('button', { type: 'submit', text: 'Log in' });
			const statusEl = el('span', { class: 'lineup-login-status' });
			form.appendChild(input);
			form.appendChild(submitBtn);
			form.appendChild(statusEl);

			toggleBtn.addEventListener('click', () => {
				toggleBtn.classList.add('hidden');
				form.classList.remove('hidden');
				input.focus();
			});

			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				if (!input.value) return;
				statusEl.textContent = 'Logging in…';
				submitBtn.disabled = true;
				try {
					await doLogin(input.value);
					renderGrid();
				} catch (err) {
					statusEl.textContent = err.message;
					submitBtn.disabled = false;
				}
			});

			wrap.appendChild(toggleBtn);
			wrap.appendChild(form);
			return wrap;
		}

		// Pilot lineup editor: a single table with a checkbox column instead of
		// separate Starters/Bench sections — check the players you want to
		// start, then Submit Lineup sends the checked ids to MFL via TYPE=lineup.
		//
		// This page has no viewer-level access control — anyone with the URL
		// sees it logged out, including league mates — so who's starting is
		// exactly the kind of thing that shouldn't leak to them ahead of
		// game time. Logged out, the checkbox column isn't just disabled,
		// it's omitted entirely: nothing on the page reveals starter/bench
		// status, only the Submit Lineup button and its actions disappear.
		//
		// `visible` (login) and `writable` (login AND a provider that can
		// actually accept a write) are separate gates, not one. Sleeper
		// leagues can carry lineupPilot too, but Sleeper's public API has no
		// lineup-write endpoint at all — visible when logged in (same privacy
		// gate as MFL), but permanently read-only: checkboxes render disabled,
		// for reference, and no Submit control ever appears regardless of
		// login state.
		function buildLineupEditor(league, players, starterIdSet) {
			const visible = isLoggedIn();
			const writable = visible && (!league.provider || league.provider === 'mfl');
			const wrap = el('div', { class: 'lineup-editor' });
			const table = el('table', { class: `roster lineup-editor-table${visible ? '' : ' read-only'}` });
			const headRow = el('tr', { class: 'roster-head' });
			if (visible) headRow.appendChild(el('th', {}));
			headRow.appendChild(el('th', {}));
			headRow.appendChild(el('th', { text: 'Player' }));
			headRow.appendChild(el('th', { text: 'Team' }));
			headRow.appendChild(el('th', { class: 'bye-cell', text: 'Bye' }));
			if (visible) headRow.appendChild(el('th', { class: 'ecr-cell', text: 'ECR' }));
			headRow.appendChild(el('th', { class: 'pts-cell', text: 'Pts' }));
			table.appendChild(headRow);

			const checkboxes = [];
			let prevPosition = null;
			for (const p of sortByPositionThenEcr(players)) {
				const posBoundary = prevPosition !== null && p.position !== prevPosition;
				prevPosition = p.position;
				const row = el('tr', { class: `player-row${posBoundary ? ' pos-boundary' : ''}`, 'data-name': p.name.toLowerCase() });

				if (visible) {
					const checkbox = el('input', { type: 'checkbox' });
					checkbox.checked = starterIdSet.has(p.id);
					checkbox.disabled = !writable;
					checkbox.dataset.playerId = p.id;
					checkboxes.push(checkbox);
					row.appendChild(el('td', {}, [checkbox]));
				}

				row.appendChild(el('td', {}, [el('span', { class: 'pos-chip', text: p.position || '-' })]));
				const nameCell = el('td', { class: 'player-name', text: p.name });
				const injuryBadge = buildInjuryBadge(p);
				if (injuryBadge) nameCell.appendChild(injuryBadge);
				row.appendChild(nameCell);
				row.appendChild(el('td', { class: 'nfl-team', text: p.team || 'FA' }));
				row.appendChild(el('td', { class: 'bye-cell', text: p.bye ? String(p.bye) : '—' }));
				if (visible) row.appendChild(buildEcrCell(p));
				const usingPriorYear = !(p.pts > 0) && p.priorYearPts > 0;
				const ptsValue = usingPriorYear ? p.priorYearPts : p.pts;
				const ptsAttrs = { class: `pts-cell${usingPriorYear ? ' pts-prior-year' : ''}`, text: ptsValue != null ? Number(ptsValue).toFixed(2) : '—' };
				row.appendChild(el('td', ptsAttrs));

				table.appendChild(row);
			}
			wrap.appendChild(table);

			// Logging in/out is handled once, globally (see renderAuthControl) —
			// nothing to show per-card when the checkbox column itself is hidden.
			if (!visible) {
				return wrap;
			}

			if (!writable) {
				wrap.appendChild(el('div', {
					class: 'lineup-editor-note',
					text: "Sleeper doesn't support setting lineups through their API — set this one directly in the Sleeper app.",
				}));
				return wrap;
			}

			const actions = el('div', { class: 'lineup-editor-actions' });
			const saveBtn = el('button', { type: 'button', class: 'lineup-save-btn', text: 'Submit Lineup' });
			const statusEl = el('span', { class: 'lineup-editor-status' });
			actions.appendChild(saveBtn);
			// league.startingLineup (e.g. "1 QB, 2-3 RB, 2-3 WR, 1-2 TE, 1 PK, 1
			// Def") comes pre-formatted from MFL's own starting-lineup slot
			// requirements — see formatStartingLineupRequirement in
			// providers.mjs. Missing rather than blank for leagues where MFL's
			// export didn't parse cleanly, so there's nothing to render then.
			if (league.startingLineup) {
				actions.appendChild(el('span', { class: 'lineup-requirements', text: league.startingLineup }));
			}
			actions.appendChild(statusEl);
			wrap.appendChild(actions);

			saveBtn.addEventListener('click', async () => {
				const starterIds = checkboxes.filter((cb) => cb.checked).map((cb) => cb.dataset.playerId);
				if (starterIds.length === 0) {
					statusEl.textContent = 'Select at least one starter.';
					return;
				}
				saveBtn.disabled = true;
				statusEl.textContent = 'Submitting…';
				try {
					const res = await fetch(SUBMIT_LINEUP_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
						body: JSON.stringify({ leagueId: league.id, starterIds }),
					});
					const body = await res.json().catch(() => ({}));
					if (res.status === 401) {
						doLogout();
						return;
					}
					if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
					league.starters = starterIds;
					statusEl.textContent = 'Submitted.';
					setTimeout(renderGrid, 800);
				} catch (err) {
					statusEl.textContent = `Couldn't submit: ${err.message}`;
					saveBtn.disabled = false;
				}
			});

			return wrap;
		}

		// Single site-wide login/logout control (header) — MFL uses one login
		// for all leagues, so each pilot league's card no longer duplicates it.
		function renderAuthControl() {
			const container = document.getElementById('auth-control');
			if (!container) return;
			container.innerHTML = '';

			// Previously gated on there being at least one lineup-editable
			// league, since login unlocked nothing else. Logging in now also
			// reveals the Admin tab, and gating on league data would be a trap:
			// switching lineups off for every league would hide the login
			// control, which would hide the Admin tab, which is where you'd go
			// to switch them back on.
			if (isLoggedIn()) {
				container.appendChild(el('span', { class: 'auth-status-text', text: 'Logged in for advanced features' }));
				const logoutBtn = el('button', { type: 'button', class: 'auth-logout-btn', text: 'Log out' });
				logoutBtn.addEventListener('click', doLogout);
				container.appendChild(logoutBtn);
			} else {
				container.appendChild(buildLoginPrompt());
			}
		}

		// "Send via Email" link for the needs-contract banner — a mailto:
		// pre-filled with every player this manager has actually pencilled in
		// a length for (not just every player still missing one; once a real
		// contractYear lands from a sync, that player drops out here too,
		// same as they drop out of the banner count and stop showing the
		// dropdown at all). Returns null (renders nothing) if there's nothing
		// to send yet, or if logged out — the planned lengths themselves are
		// exactly the private data the dropdown is already gated on, so the
		// email summarizing them needs the same gate.
		function buildContractEmailLink(league) {
			if (!isLoggedIn()) return null;
			const plans = (league.players || [])
				.filter((p) => !(Number(p.contractYear) > 0))
				.map((p) => ({ name: p.name, years: getContractPlan(league.id, p.id) }))
				.filter((p) => p.years);
			if (plans.length === 0) return null;

			const year = pageData?.year ?? new Date().getFullYear();
			// .trim() — MFL's own league-name export has a stray trailing
			// space on at least one league, invisible everywhere else on the
			// page since HTML collapses whitespace, but not in a raw subject.
			const leagueName = (league.leagueName || league.name).trim();
			const teamName = (league.teamName || league.name).trim();
			const subject = `${year} ${leagueName} Contract Lengths for ${teamName}`;
			const body = plans.map((p) => `${p.name}: ${p.years} year${p.years === '1' ? '' : 's'}`).join('\n');
			const email = contractEmailFor(league);

			return el('a', {
				href: `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,
				class: 'contract-email-link',
				text: '✉ Send via Email',
			});
		}

		// League name link, shared by the Rosters/Standings/Scoring cards.
		// Optionally followed by a small document-icon link straight to the
		// league's actual rules page (config/leagues.json's rulesUrl) — one
		// click from wherever the league already shows up, instead of
		// wherever MFL/ESPN/Sleeper each bury their own rules page. Omitted
		// entirely for leagues without a rulesUrl set, same as every other
		// optional per-league field on this page.
		function buildLeagueHeading(league) {
			const heading = el('h2');
			heading.appendChild(el('a', { href: league.url, target: '_blank', rel: 'noopener', text: league.leagueName || league.name }));
			if (league.rulesUrl) {
				heading.appendChild(el('a', {
					href: league.rulesUrl,
					target: '_blank',
					rel: 'noopener',
					class: 'rules-link',
					title: 'League rules',
					text: '📝',
				}));
			}
			return heading;
		}

		// Every league has exactly one hosting provider — MFL is the default
		// when `provider` is unset (see config/leagues.json), matching every
		// other provider-branch in this file.
		function providerBadgeLabel(league) {
			if (league.provider === 'espn') return 'ESPN';
			if (league.provider === 'sleeper') return 'Sleeper';
			return 'MFL';
		}

		// Card-head row shared by Rosters/Standings/Scoring: the league name
		// heading plus a badge strip. The provider badge (MFL/ESPN/Sleeper)
		// always leads the strip and is styled gold instead of the usual
		// purple, so which site actually hosts a league reads at a glance
		// instead of blending in with Superflex/Best Ball/etc. `extraLabels`
		// (type, Salary Cap, tags) is Rosters-only — Standings/Scoring just
		// get the provider badge on its own.
		function buildCardHead(league, extraLabels = []) {
			const cardHead = el('div', { class: 'card-head' });
			cardHead.appendChild(buildLeagueHeading(league));
			const labels = [providerBadgeLabel(league), ...extraLabels];
			const badgesEl = el('div', { class: `badges${labels.length > 2 ? ' badges-wrap' : ''}` });
			labels.forEach((label, i) => {
				badgesEl.appendChild(el('span', { class: `badge${i === 0 ? ' badge-provider' : ''}`, text: label }));
			});
			cardHead.appendChild(badgesEl);
			return cardHead;
		}

		function renderCard(league) {
			const card = el('div', { class: 'card', 'data-view': 'rosters', 'data-league-type': subtabType(league) || '' });

			// Salary-cap leagues are the auction leagues — the two were tracked
			// separately via a `format` field that always agreed with `type`, so
			// the type alone now drives the salary/contract UI and `format` is
			// gone entirely.
			const isAuction = league.type === 'salarycap';

			// Contracts are due every offseason in early September — surface a
			// count at the very top of the card, above the league name and
			// badges, so it's the first thing seen without scrolling into the
			// roster to spot individual flagged players (see the icon in
			// buildYearsCell).
			if (isAuction) {
				const needsContractCount = (league.players || []).filter((p) => !(Number(p.contractYear) > 0)).length;
				if (needsContractCount > 0) {
					const banner = el('div', { class: 'needs-contract-banner' });
					banner.appendChild(el('span', {
						text: `⚠ ${needsContractCount} player${needsContractCount === 1 ? '' : 's'} need${needsContractCount === 1 ? 's' : ''} a contract length set`,
					}));
					const emailLink = buildContractEmailLink(league);
					if (emailLink) banner.appendChild(emailLink);
					card.appendChild(banner);
				}
			}

			// Badges: league type + salary cap are derived from data we already
			// have; anything else (Superflex, etc.) is a manual "tags" array in
			// config/leagues.json since MFL doesn't expose it in a reliable form.
			const badgeLabels = [];
			// The type label already reads "Salary Cap" for exactly the leagues
			// that used to get a second badge from the auction check, so no
			// separate salary-cap badge is needed any more.
			if (LEAGUE_TYPE_LABELS[league.type]) badgeLabels.push(LEAGUE_TYPE_LABELS[league.type]);
			if (Array.isArray(league.tags)) badgeLabels.push(...league.tags);

			card.appendChild(buildCardHead(league, badgeLabels));
			card.appendChild(el('div', { class: 'team', text: league.teamName || '' }));

			if (league.error && (!league.players || league.players.length === 0)) {
				card.appendChild(el('div', { class: 'error-box', text: `Couldn't load this league: ${league.error}` }));
				return card;
			}

			if (league.error) {
				const warn = el('div', { class: 'error-box', text: `Showing data from ${timeAgo(league.updatedAt)} — last sync failed: ${league.error}` });
				card.appendChild(warn);
			}

			const byStatus = {};
			for (const p of league.players || []) {
				const status = (p.status || 'ROSTER').toUpperCase();
				(byStatus[status] = byStatus[status] || []).push(p);
			}

			// Pilot: leagues with a fetched starters list split Active Roster into
			// Starters/Bench instead of one flat table. Everything else (and any
			// league where the lineup fetch failed/hasn't run) falls back to the
			// plain grouping below, unchanged.
			const starterIdSet = Array.isArray(league.starters) ? new Set(league.starters) : null;

			for (const group of STATUS_GROUPS) {
				const players = byStatus[group.key];
				if (!players || players.length === 0) continue;

				card.appendChild(el('div', { class: 'group-label', text: `${group.label} (${players.length})` }));

				// The cap summary reads these players' salaries, so a planned-
				// salary pick inside the table needs to rebuild it live rather
				// than leaving a stale Total/Cap Room on screen until reload.
				const needsCapSummary = group.key === 'ROSTER' && isAuction && league.salaryCap != null;
				let summaryEl = needsCapSummary ? buildSalarySummary(league, players) : null;

				if (group.key === 'ROSTER' && starterIdSet) {
					card.appendChild(buildLineupEditor(league, players, starterIdSet));
				} else {
					const onSalaryChange = needsCapSummary
						? () => {
							const fresh = buildSalarySummary(league, players);
							if (summaryEl && fresh) summaryEl.replaceWith(fresh);
							summaryEl = fresh;
						}
						: undefined;
					card.appendChild(buildRosterTable(players, isAuction, group.key.toLowerCase(), league.id, onSalaryChange));
				}

				if (summaryEl) card.appendChild(summaryEl);
			}

			if (!league.players || league.players.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No players found on this roster.' }));
			}

			// Which FantasyPros ranking set the ECR column is showing. Worth
			// stating outright: dynasty and draft rankings disagree sharply on
			// the same player, so an unlabelled rank invites misreading.
			// Logged out, the column itself isn't rendered (see
			// buildRosterTable/buildLineupEditor) — an "advanced feature" like
			// everything else login unlocks — so this footnote about it would
			// be a dangling reference to a column that isn't there.
			if (isLoggedIn() && league.rankings) {
				const r = league.rankings;
				const parts = [`${ECR_TYPE_LABELS[r.type] || r.type} ${r.scoring} rankings`];
				if (r.totalExperts) parts.push(`${r.totalExperts} experts`);
				if (r.lastUpdated) parts.push(`updated ${r.lastUpdated}`);
				card.appendChild(el('div', { class: 'rankings-note', text: `ECR: ${parts.join(' · ')}` }));
			}

			return card;
		}

		function renderStandingsCard(league) {

				row.appendChild(el('td', { text: r.pointsFor }));

		function renderScoringCard(league) {
			const card = el('div', { class: 'card', 'data-view': 'scoring', 'data-league-type': subtabType(league) || '' });
			card.appendChild(buildCardHead(league));

			const teams = league.scoring?.teams || [];

				card.appendChild(el('div', { class: 'error-box', text: `No live scoring yet: ${league.scoringError}` }));

			}
