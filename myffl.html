			if (league.error) return 'Roster sync is failing for this league';
			// The commonest unranked state by far, and the one that used to
			// fall through to the generic message below and read as a sync
			// fault: a league nobody has drafted yet holds nobody, so there is
			// no roster to value. It reaches here rather than through the
			// mid-draft branch because a draft that has not *started* is not a
			// draft in progress — MFL returns zero picks for a league with no
			// draft scheduled, which draftStatusFromResults deliberately calls
			// "couldn't tell" rather than "unfinished", and ESPN is exempt from
			// the draft check altogether. An empty roster is the one
			// observation that covers all of those without guessing at a cause.
			if (!(league.players || []).length) return 'No rosters yet — ranks resume once the league drafts';
			return 'No power data from the last sync yet';
		}

		// One row per league we hold a team in, carrying both bases — including
		// leagues with neither, which render as a row of TBDs rather than
		// vanishing. A league dropping off the card silently is the failure
		// this avoids: "we couldn't value this yet" and "this league isn't
		// here" are different statements, and only the first is ever true of a
		// league in the config.
		//
		// The one exclusion that remains is awaitingRollover, and it is a
		// different claim: a redraft league still on last season has not
		// started the season this card describes, so it is not unranked, it is
		// absent — the same reasoning Top Available uses, and type-gated the
		// same way, so a dynasty league trailing through the rollover window
		// still appears.
		//
		// Rows are ordered by the row average — the mean of ECR, Starters and
		// Depth, the number the card shows in its own column (see
		// powerRowAverage). Averaging is what makes the card treat the two
		// bases as equals: ordering by projections and using rankings only to
		// break ties reads as a projections card with a second column, and
		// quietly buries a roster that consensus rates highly. A row missing a
		// basis averages whatever it has rather than being pushed down by an
		// accident of arithmetic, so an offseason card, where nothing has
		// projections, comes out ordered on rankings alone.
		//
		// The consequence to know: no single column reads monotonically down
		// the page. That is the honest presentation of a composite order, and
		// the alternative is the one this replaces. Every column is clickable,
		// so a reader who wants one of them monotone can have it.
		//
		// Ties fall to the projections rank (the more concrete of the two
		// measures), then to config order, which is the display order every
		// other tab uses (Array.prototype.sort is stable).
		//
		// A row with neither basis sorts last, and there is nothing further to
		// fall back on for it — Starters and Depth are sub-metrics *of* these
		// two bases, not a third measure, so a row with both ranks missing has
		// a missing Starters too. Those rows keep config order among
		// themselves.
		//
		// Each row also carries `studs` and `sleepers` — the rostered players
		// who rank in the league's own top N by, respectively, FantasyPros
		// consensus rank (leagueStuds) and FantasyPros' separate "Sleepers"
		// list (leagueSleepers, p.sleeper — see attachSleepers in
		// scripts/lib/fantasypros.mjs). Rendered as sub-lines under the league
		// name, the same idiom the exposure cards already use under a
		// player's name (leagueLine) — just flipped: there the line under a
		// PLAYER names the leagues, here the line under a LEAGUE names the
		// players.
		//
		// Studs needs nothing new to stay "adjusted to ROS during the season":
		// p.ecr.rank is already the automaticRankingType-driven rank every
		// other ECR read on the page uses, computed once at sync time. Sleeper
		// rank has no such seasonal flip — FantasyPros' Sleepers list is one
		// list year-round, not a DRAFT/DYNASTY/ROS-style rotation, so
		// p.sleeper.rank means the same thing in March as it does in October.
		//
		// Whole roster, not just starters, for both — a taxi-squad stash worth
		// bragging about is exactly the kind of thing either line is meant to
		// surface, and it is why these read league.players directly rather
		// than the best-legal lineup computeLeaguePower already built for
		// Proj/ECR.
		const STUDS_RANK_THRESHOLD = 25;
		function leagueStuds(league) {
			return (league.players || [])
				.filter((p) => p.ecr && Number.isFinite(p.ecr.rank) && p.ecr.rank <= STUDS_RANK_THRESHOLD)
				.sort((a, b) => a.ecr.rank - b.ecr.rank);
		}
		const SLEEPER_RANK_THRESHOLD = 25;
		function leagueSleepers(league) {
			return (league.players || [])
				.filter((p) => p.sleeper && Number.isFinite(p.sleeper.rank) && p.sleeper.rank <= SLEEPER_RANK_THRESHOLD)
				.sort((a, b) => a.sleeper.rank - b.sleeper.rank);
		}

		function computeMyPowerRows(leagues, types, year) {
			const rows = [];
			for (const league of leagues || []) {
				if (!types.includes(league.type)) continue;
				// Suppressed, not skipped: a redraft league still on last
				// season generally *does* carry power data, computed from
				// last season's rosters, and that data is a correct answer
				// about a season that has ended — rendering it would state
				// last year's standings as this year's outlook. So the league
				// appears, as TBDs, saying what it is waiting for. Type-gated
				// by awaitingRollover, so a trailing dynasty league keeps its
				// real ranks: its roster carried over, so they still describe
				// something.
				const trailing = awaitingRollover(league, year);
				const key = String(league.franchiseId);
				const projRanks = trailing ? null : leaguePowerRanks(league, 'projections');
				const ecrRanks = trailing ? null : leaguePowerRanks(league, 'ecr');
				const proj = projRanks ? projRanks.byFranchise.get(key) || null : null;
				const ecr = ecrRanks ? ecrRanks.byFranchise.get(key) || null : null;
				rows.push({
					label: league.name || league.leagueName,
					// Identical across bases (both rank the same franchises),
					// so whichever answered is the league's size; null when
					// neither did, which is also when nothing prints it.
					size: projRanks ? projRanks.size : ecrRanks ? ecrRanks.size : null,
					proj,
					ecr,
					// Set only on a row with no ranks at all — the two bases
					// have their own explanations when just one is missing.
					reason: proj || ecr ? null : powerUnrankedReason(league, trailing),
					// What each side was computed from — the projections slot
					// and phase, or the ranking list. Which is in play is the
					// difference between a rank moving because a roster
					// changed and one moving because the measure did.
					projSource: projRanks ? projRanks.source : null,
					ecrSource: ecrRanks ? ecrRanks.source : null,
					// Suppressed the same as proj/ecr: a league with neither
					// basis has nothing to say about this season yet, whether
					// that's a trailing roster or one that hasn't drafted, so
					// it gets no studs/sleepers line either.
					studs: proj || ecr ? leagueStuds(league) : [],
					sleepers: proj || ecr ? leagueSleepers(league) : [],
				});
			}
			// Each row's summary average, and the card's default order. Stamped
			// here rather than in the render so the ordering the card opens on
			// stays a property of a pure function — and so the sort machinery
			// has one column it does not have to recompute.
			const detailBasis = powerDetailBasis(rows);
			for (const r of rows) r.avg = powerRowAverage(r, detailBasis);
			const avgKey = (r) => (r.avg == null ? Infinity : r.avg);
			const tieBreak = (r) => (r.proj ? r.proj.overall : r.ecr ? r.ecr.overall : Infinity);
			// Compared rather than subtracted so an Infinity on both sides is a
			// tie instead of the NaN that would scramble the whole sort.
			const cmp = (x, y) => (x === y ? 0 : x < y ? -1 : 1);
			rows.sort((a, b) => cmp(avgKey(a), avgKey(b)) || cmp(tieBreak(a), tieBreak(b)));
			return rows;
		}

		// Whether these ranks rest on *preseason* projections during the season
		// itself — the one way this card can be quietly, badly wrong.
		//
		// The sync asks FantasyPros for week=0, the preseason projection slot.
		// What that serves once games are played is not yet known (see
		// fetchProjections, and probe-fantasypros-power-rank.yml, which is
		// meant to be re-run after kickoff); if it keeps serving August
		// numbers, every rank here is computed from projections that predate
		// every injury and breakout of the season, and nothing else on screen
		// would say so — the ranks stay plausible small integers.
		//
		// Deliberately not a freshness date: the projections endpoint carries
		// no `last_updated` at all, unlike consensus-rankings, so a date-based
		// check would never fire while looking like a working guard. The sync
		// stamps the phase and the slot it asked for instead, which answers the
		// same question deterministically and stops being true as soon as the
		// week argument changes.
		function powerUsesPreseasonProjections(rows) {
			return (rows || []).some(
				(r) => r.projSource && r.projSource.inSeason === true && String(r.projSource.week) === '0'
			);
		}

		// Whether a *basis* is missing, as opposed to a league being unranked.
		// Worth one line under the table because a column of TBDs otherwise
		// reads as a bug rather than as a season of the year: FantasyPros
		// publishes projections per season, so every offseason spends months
		// with none to ask for.
		//
		// The test is deliberately "ranked on one basis but not the other",
		// not "missing this basis". A league with no ranks at all is missing
		// both, and counting it here would announce that projections aren't
		// published on the strength of a single mid-draft league — during a
		// season when they are published and every other league is using them.
		// That row explains itself through its own tooltip instead.
		function powerMissingBasis(rows) {
			return {
				projections: (rows || []).some((r) => r.ecr && !r.proj),
				ecr: (rows || []).some((r) => r.proj && !r.ecr),
			};
		}

		// Which basis the Starters and Depth columns describe. Both bases split
		// a roster the same way — best legal lineup against everyone left over
		// — so there are two of each, and showing four would put seven columns
		// on a table that has to survive a phone. Projections win when the card
		// has them, because that is the split a reader is asking about ("who
		// starts this week"); the rankings split is what remains in the
		// offseason, when it is also the only one available.
		//
		// Card-wide rather than per row, so two rows never quietly describe
		// different things in the same column.
		function powerDetailBasis(rows) {
			return (rows || []).some((r) => r.proj) ? 'projections' : 'ecr';
		}

		// The row's summary number: the mean of ECR, Starters and Depth.
		//
		// Proj is deliberately *not* in it, which is worth stating because the
		// obvious reading of an "average" column is "the average of the numbers
		// beside it". Starters and Depth are the two halves of the projections
		// basis decomposed, and Proj is those same two halves recombined — so
		// including it would let projections outvote consensus three to one in
		// a number meant to summarise both. Leaving it out still leaves
		// projections ahead two to one, which is the honest cost of having the
		// detail columns follow one basis; it is simply less lopsided.
		//
		// Averages whatever the row actually has, so a league missing a basis
		// still gets a number rather than being pushed to the bottom by an
		// accident of arithmetic. Null only when there is nothing at all —
		// which is exactly the TBD rows, and they sort last by design.
		function powerRowAverage(row, detailBasis) {
			const detail = detailBasis === 'projections' ? row.proj : row.ecr;
			const parts = [];
			if (row.ecr) parts.push(row.ecr.overall);
			if (detail) {
				parts.push(detail.starters);
				if (detail.depth != null) parts.push(detail.depth);
			}
			if (parts.length === 0) return null;
			return parts.reduce((sum, v) => sum + v, 0) / parts.length;
		}

		function renderStandingsCard(league) {
			const card = el('div', { class: 'card', 'data-view': 'standings', 'data-league-type': subtabType(league) || '' });
			card.appendChild(buildCardHead(league, formatBadgeLabels(league)));

			if (league.standingsError && (!league.standings || league.standings.length === 0)) {
				card.appendChild(el('div', { class: 'error-box', text: `Couldn't load standings: ${league.standingsError}` }));
				return card;
			}

			if (league.standingsError) {
				card.appendChild(el('div', { class: 'error-box', text: `Showing standings from a previous sync — last update failed: ${league.standingsError}` }));
			}

			const rows = league.standings || [];
			if (rows.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No standings available yet.' }));
				return card;
			}

			const table = el('table', { class: 'standings' });
			const headRow = el('tr');
			['#', 'Team', 'W-L-T', 'PF', 'PA'].forEach((h) => headRow.appendChild(el('th', { text: h })));
			table.appendChild(headRow);

			rows.forEach((r, i) => {
				const row = el('tr', { class: r.isMe ? 'me-row' : '' });
				row.appendChild(el('td', { text: String(i + 1) }));
				row.appendChild(el('td', { text: r.teamName }));
				row.appendChild(el('td', { text: `${r.wins}-${r.losses}${r.ties ? '-' + r.ties : ''}` }));
				row.appendChild(el('td', { text: r.pointsFor }));
				row.appendChild(el('td', { text: r.pointsAgainst }));
				table.appendChild(row);
			});
			card.appendChild(table);
			return card;
		}

		function renderScoringCard(league) {
			const card = el('div', { class: 'card', 'data-view': 'scoring', 'data-league-type': subtabType(league) || '' });
			card.appendChild(buildCardHead(league, formatBadgeLabels(league)));

			const teams = league.scoring?.teams || [];

			if (league.scoringError && teams.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: `No live scoring yet: ${league.scoringError}` }));
				return card;
			}

			if (league.scoringError) {
				card.appendChild(el('div', { class: 'error-box', text: `Showing scores from a previous sync — last update failed: ${league.scoringError}` }));
			}

			if (teams.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No live scoring available yet.' }));
				return card;
			}

			if (league.scoring?.week) {
				card.appendChild(el('div', { class: 'team', text: `Week ${league.scoring.week}` }));
			}

			const table = el('table', { class: 'standings' });
			const headRow = el('tr');
			['#', 'Team', 'Score'].forEach((h) => headRow.appendChild(el('th', { text: h })));
			table.appendChild(headRow);

			teams.forEach((t, i) => {
				const row = el('tr', { class: t.isMe ? 'me-row' : '' });
				row.appendChild(el('td', { text: String(i + 1) }));
				row.appendChild(el('td', { text: t.teamName }));
				row.appendChild(el('td', { text: t.score }));
				table.appendChild(row);
			});
			card.appendChild(table);
			return card;
		}

		// Exposure: how many of your leagues (within this one group — exposure
		// across leagues you actively manage and exposure across draft-and-leave
		// leagues aren't the same question) roster a given player, as a share of
		// every league in that group with usable roster data. Matched by player
		// name since MFL/ESPN/Sleeper each use their own player ids — names are
		// the one thing that lines up. `types` is an array because a group spans
		// several league types: dynasty and salary-cap share one sub-tab — see
		// SUBTAB_GROUP.
		// A player's ECR can legitimately differ between two leagues in the same
		// group: a dynasty league and a salary-cap league sit side by side here and
		// draw from different FantasyPros lists, and their scoring formats can differ
		// too. The median is the representative one — robust to a single league
		// ranking a player far from the rest, which a mean is not.
		function medianRank(ranks) {
			if (!ranks || ranks.length === 0) return null;
			const sorted = [...ranks].sort((a, b) => a - b);
			const mid = Math.floor(sorted.length / 2);
			return sorted.length % 2 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
		}

		// A finite sentinel, not Infinity: Infinity - Infinity is NaN, and a NaN
		// comparator silently corrupts the sort order rather than failing.
		const rankOrLast = (v) => (v == null ? Number.MAX_SAFE_INTEGER : v);

		// The leagues an exposure card combines: everything in this sub-tab's
		// group that actually came back with a roster. Shared by both analytics
		// cards so the denominator — and therefore the percentage — means the
		// same thing on each.
		function exposureLeagues(leagues, types) {
			return leagues.filter((l) => types.includes(l.type) && Array.isArray(l.players) && l.players.length > 0);
		}

		// The league types whose rosters do not survive the offseason. Everyone is
		// released and redrafted, so a roster carried over from last season says
		// nothing about who will be on it this one.
		//
		// 'salarycap' is deliberately not here even though those leagues re-auction
		// annually: contracts and taxi squads do carry players across, so a cap
		// league sitting on last season is showing something partly true rather
		// than something wiped.
		const REDRAFTING_TYPES = ['redraft', 'draftonly'];

		// A league still on a season earlier than the one the sync is aiming at —
		// its new season doesn't exist at the provider yet, so resolveSeason left
		// it where it was rather than moving it to an empty league (see
		// fetch-rosters.mjs). Everything it carries is last season's.
		//
		// For a dynasty or salary-cap league that is merely stale: rosters carry
		// over, so last season's answer is approximately this season's, and during
		// the rollover window — MFL leagues reopen anywhere from February to April
		// — excluding them would empty the card for weeks over nothing.
		//
		// For a league that redrafts it is wrong rather than stale, and wrong in
		// the same direction the mid-draft exclusion guards against: the handful of
		// names left unrostered at the end of last season are not this season's
		// wire, because this season's wire is *everybody* until the draft runs.
		// Showing those few as "free in 1 league" states a true fact about a league
		// year that has ended and reads as a claim about the one ahead.
		//
		// Both halves of the comparison have to be present to mean anything: a
		// rosters.json written before leagues carried their own `season` has no
		// answer here, and NaN < year is false, so those leagues stay included.
		function awaitingRollover(league, year) {
			if (!REDRAFTING_TYPES.includes(league.type)) return false;
			return Number(league.season) < Number(year);
		}

		// Both exposure cards key a player by his *normalized* name, not the one
		// the provider spelled. The providers disagree about suffixes and
		// punctuation routinely — MFL's "Michael Penix Jr." is Sleeper's "Michael
		// Penix" — and keying on the raw string made him two rows at half the
		// exposure each, on a pair of cards whose entire job is counting how many
		// leagues hold one player. Nothing on screen said so: two plausible rows,
		// each carrying a correct-looking fraction.
		//
		// It is the same `normalizeName` Top Available already uses to decide
		// whether a pool player is one of ours, which is why the two agree about
		// who is who.
		//
		// The cost is the mirror image, and it is worth stating plainly: two
		// *different* players whose names normalize alike would merge into one row,
		// claiming exposure to somebody you don't hold. That is the hazard
		// `playerPageUrl` exists to avoid on the sync side, where josh-allen.php is
		// the quarterback and josh-allen-lb.php the linebacker. It cannot happen
		// with these leagues: the collision needs two same-named players on *our
		// own* rosters, and nothing in config/leagues.json rosters IDP — every
		// position across every provider is QB/RB/WR/TE/PK/Def. Adding an IDP
		// league is what would bring the linebacker back, and this is the comment
		// to revisit when one appears.
		//
		// Position is deliberately not part of the key. It would guard that
		// collision, but it would reintroduce the exact failure this fixes: MFL
		// spells a kicker PK where Sleeper spells him K, so a kicker held in both
		// would split the way Penix did. Team is worse still — the providers
		// disagree there too, LVR against LV.
		function computePlayerExposure(leagues, types) {
			const eligible = exposureLeagues(leagues, types);
			const byPlayer = new Map();

			for (const league of eligible) {
				const label = league.leagueName || league.name;
				const seen = new Set();
				for (const p of league.players || []) {
					const key = normalizeName(p.name);
					if (seen.has(key)) continue;
					seen.add(key);
					if (!byPlayer.has(key)) {
						// The display name settles with the first league to carry
						// him, the same way team and position do below — one of the
						// spellings has to win, and none of them is more correct
						// than another.
						//
						// Team settles the same way. The providers spell a few of
						// them differently (MFL says LVR where ESPN says LV), so
						// which league got there first can change the code shown —
						// the same way it already can on the Rosters tab, where the
						// two leagues sit in different cards.
						byPlayer.set(key, { name: p.name, position: p.position, team: p.team, leagues: [], ranks: [], url: null });
					}
					const entry = byPlayer.get(key);
					entry.leagues.push(label);
					if (p.ecr && Number.isFinite(p.ecr.rank)) entry.ranks.push(p.ecr.rank);
					// One profile per player, so the first league to carry a URL
					// settles it — a league whose rankings failed, or which didn't
					// match this player, simply doesn't get a say.
					if (!entry.url && p.ecr?.url) entry.url = p.ecr.url;
				}
			}

			const total = eligible.length;
			const rows = [...byPlayer.values()]
				.map((info) => ({
					name: info.name,
					position: info.position,
					team: info.team,
					leagues: info.leagues,
					count: info.leagues.length,
					exposure: total > 0 ? (info.leagues.length / total) * 100 : 0,
					ecr: medianRank(info.ranks),
					url: info.url,
				}))
				.filter((r) => r.count > 1)
				// Exposure first, then best player. Position was the old
				// tiebreaker, but it only grouped the list — it said nothing about
				// which of two players at the same exposure matters more, which is
				// the actual question this card is asked. Unranked players sort
				// last rather than first, hence the sentinel.
				.sort((a, b) =>
					b.exposure - a.exposure ||
					b.count - a.count ||
					rankOrLast(a.ecr) - rankOrLast(b.ecr) ||
					a.name.localeCompare(b.name)
				);

			return { total, rows };
		}

		// Severity order, least to most. Two jobs, and it is worth knowing it does
		// both, because a change here moves rows *and* changes which designation a
		// player is shown as carrying.
		//
		// First: picking one designation when a player carries different ones in
		// different leagues. That happens legitimately rather than being a bug to
		// fix — each provider publishes its own injury feed on its own clock, so
		// an MFL league can already say Out while an ESPN league still says
		// Questionable. The worse of the two is the one worth showing.
		//
		// Second: ordering the Injury Exposure card, worst first. See the sort in
		// computeInjuryExposure for why that outranks exposure there.
		//
		// HOL is a holdout — a contract dispute, not an injury. It arrives from
		// MFL as an unmapped passthrough (normalizeInjuryStatus keeps short codes
		// it doesn't recognise) rather than through INJURY_STATUS_MAP, so it is
		// ranked here by hand. Above Out because a holdout is open-ended where Out
		// is one week, below a suspension because a suspension has a known end
		// date and a holdout ends whenever somebody signs.
		//
		// Anything still unrecognised ranks below everything known: indexOf gives
		// it -1, one under 'P'. That is deliberate in both directions — a code we
		// can't read must never mask a real IR when picking the worst, and must
		// never lead the card when sorting. The cost is that a genuinely serious
		// new code sits at the bottom until it is added here, which is the trade
		// against inventing a rank for a string nobody has looked at.
		const INJURY_SEVERITY = ['P', 'DTD', 'Q', 'D', 'O', 'COVID', 'HOL', 'SUSP', 'NFI', 'PUP', 'IR'];

		const injurySeverityRank = (status) => INJURY_SEVERITY.indexOf(status);

		// Designations that are settled rather than developing: they are decided
		// for months, and once you have absorbed one there is nothing to do about
		// it again until it ends. Severity says how bad a designation is; this
		// says whether it is still a question.
		//
		// It exists because severity alone made the card go stale. A one-league IR
		// on a fringe player outranked everything by construction, so it took the
		// top row in August and would have held it into February — Chris Brazzell
		// II, IR, ECR 287, leading a card above three leagues' worth of
		// Questionable on players who actually start. Two of the six rows on the
		// Dynasty card's first page were that, before a game had been played, and
		// IR designations only pile up once the season starts.
		//
		// Deliberately *not* a re-ranking of INJURY_SEVERITY, which still has to
		// mean severity: it is the other half of picking which designation to show
		// when two providers disagree, and there a real IR must still beat a
		// Questionable. Two questions, two lists.
		//
		// An unrecognised code is deliberately absent, which lands it in the live
		// tier ranked -1 — the bottom of the half that is still developing. It
		// neither leads the card nor gets quietly filed as season-ending on the
		// strength of a string nobody has read.
		const INJURY_SETTLED = ['IR', 'PUP', 'NFI', 'SUSP', 'HOL', 'RET'];

		const injurySettledRank = (status) => (INJURY_SETTLED.includes(status) ? 1 : 0);

		// The designation to treat a player as carrying. Normally the NFL injury
		// report's, exactly as the roster cards badge it — but a player parked on
		// a league's IR slot is injured whether or not the feed has caught up, so
		// the roster slot stands in when there's no designation.
		function injuryDesignation(p) {
			if (p.injuryStatus) return p.injuryStatus;
			return String(p.status || '').toUpperCase() === 'INJURED_RESERVE' ? 'IR' : null;
		}

		// How far out an expected return date is still worth printing. MFL fills
		// exp_return on every row of its injury report, but only 17 distinct dates
		// covered 325 rows when probe-injury-detail.yml looked: the far ones are a
		// season-end sentinel doing duty for retired and season-ending cases, not a
		// forecast. "Back Feb 15" under a name in August claims a precision the
		// feed doesn't have, and it isn't triage information either — the
		// designation beside it already says IR. So a date only shows if it lands
		// inside the window where knowing the day changes what you do this week.
		const INJURY_RETURN_HORIZON_DAYS = 45;

		// The one-line description of an injury: body part, expected return, or
		// both. Returns null when there is nothing worth a line, which is what a
		// roster synced before this shipped renders — the same rule the ECR link
		// and the team suffix follow, where absent means "not asked" rather than
		// "nothing wrong".
		function injuryDetailLine(detail, now = Date.now()) {
			if (!detail) return null;
			const parts = [];
			if (detail.part) parts.push(detail.part);
			if (detail.until) {
				const when = new Date(detail.until);
				const days = (when.getTime() - now) / 86400000;
				// A date already past is the feed lagging rather than news, and NaN
				// is a format nobody has looked at — neither belongs on the card.
				if (Number.isFinite(days) && days > -1 && days <= INJURY_RETURN_HORIZON_DAYS) {
					// "Aug 15, 2026" -> "Aug 15": the year is noise inside a
					// 45-day window, and it is the widest part of the string.
					parts.push(`back ${detail.until.replace(/,\s*\d{4}\s*$/, '')}`);
				}
			}
			return parts.length ? parts.join(' · ') : null;
		}

		// ---- Cross-league problems digest --------------------------------
		// The strip above the grid: everything across every league that needs
		// a human, so finding the one card that's on fire doesn't mean walking
		// eighteen of them. Computed here on the page from data the snapshot
		// already carries — the sync ships nothing new for this.
		//
		// The bar for a row is "would change what you do", which is why most
		// of the fields that *look* like problems are deliberately excluded:
		//   - scoringError/standingsError are almost always benign — "No live
		//     scoring available yet" is the normal preseason state on nearly
		//     every league, and MFL 429s are transient and healed by the next
		//     sync. Each already renders on its own card; a digest that opens
		//     with fourteen rows of that noise buries the row that matters.
		//   - lineupError is the same shape: transient, retried in 4 hours,
		//     and shown on the card it belongs to.
		//   - Questionable starters are excluded on the same reasoning — a Q
		//     is normal fantasy life, and seven Q rows would drown the one O.
		//     The floor is DIGEST_INJURY_FLOOR (Doubtful), plus everything in
		//     INJURY_SETTLED (which catches RET, absent from the severity
		//     list on purpose — see its comment). An unrecognised designation
		//     ranks -1 and lands under the floor, so a string nobody has read
		//     can't put a healthy-in-truth player on the strip.
		// The roster-level `error` *is* included: it means the league's whole
		// card is stale fallback data, which is the one sync failure that
		// misrenders as health — and it's also how a dead ESPN cookie, whose
		// every read fails quietly, finally surfaces somewhere visible.
		const DIGEST_INJURY_FLOOR = 'D';

		// Roster statuses a starter may legally carry. Anything else in the
		// lineup — taxi squad, practice squad, a league IR slot — is flagged
		// whether or not the player is hurt: it's the slot that's the problem.
		const DIGEST_STARTABLE_STATUSES = ['ROSTER'];

		// Minimum starters implied by MFL's requirement string ("1 QB, 2-3 RB,
		// 2-3 WR, 1-2 TE, 1 PK, 1 Def" → 8): the sum of each slot's lower
		// bound. An underestimate whenever flex slots exist — that lineup
		// actually starts 9 — and deliberately used only as a floor, so the
		// check can miss a one-short lineup but can't cry wolf about a legal
		// one. Best-ball strings like "0-2 QB, 0-8 RB, ..." sum to 0 and so
		// never fire, which is correct: there's no lineup to set. Returns
		// null (no check at all) when the string is missing or unparseable.
		function parseLineupMinimums(requirement) {
			if (!requirement) return null;
			let total = 0;
			let matched = false;
			for (const m of String(requirement).matchAll(/(\d+)(?:\s*-\s*\d+)?\s+[A-Za-z]/g)) {
				total += Number(m[1]);
				matched = true;
			}
			return matched ? total : null;
		}

		// Whether a roster sits over any of MFL's own limits — total roster
		// size, taxi squad, injured reserve, or a per-position cap — computed
		// from raw counts against the raw limits scripts/lib/providers.mjs
		// parses off TYPE=league (parseRosterLimits), never from a verdict MFL
		// hands over already judged. There isn't one: probe-roster-validity.yml
		// dumped every key on both TYPE=league and TYPE=rosters for a league
		// confirmed to be over its limit at the time (OSD, August 2026 —
		// rosterSize 28, actually carrying 29) and found nothing shaped like
		// invalid/violation/warn anywhere. MFL evidently enforces these at
		// specific deadlines (a post-draft cutdown, the day after a trade
		// window closes) rather than blocking the roster move itself, so a
		// trade or waiver claim can leave a franchise legitimately over a limit
		// for a while — that's the gap this fills. `league.rosterLimits` is
		// absent for Sleeper and ESPN, both of which enforce their limits at
		// the moment a roster move is made, so there is nothing to check there
		// and the caller's truthiness check is the whole gate.
		//
		// A roster can be over more than one limit at once (stashed a third IR
		// player *and* too many WRs) — each is a separate, separately
		// actionable fact, so every limit actually exceeded gets its own row
		// rather than collapsing to one summary line.
		function rosterLimitProblems(league) {
			const problems = [];
			const counts = new Map();
			const byPosition = new Map();
			for (const p of league.players || []) {
				counts.set(p.status, (counts.get(p.status) || 0) + 1);
				if (p.status === 'ROSTER') byPosition.set(p.position, (byPosition.get(p.position) || 0) + 1);
			}
			const { size, taxi, ir, position } = league.rosterLimits;

			const rosterCount = counts.get('ROSTER') || 0;
			if (size != null && rosterCount > size) {
				problems.push({ kind: 'roster-limit', player: null, label: `Roster carries ${rosterCount} players — ${rosterCount - size} over the ${size} limit` });
			}
			const taxiCount = counts.get('TAXI_SQUAD') || 0;
			if (taxi != null && taxiCount > taxi) {
				problems.push({ kind: 'roster-limit', player: null, label: `Taxi squad carries ${taxiCount} players — ${taxiCount - taxi} over the ${taxi} limit` });
			}
			const irCount = counts.get('INJURED_RESERVE') || 0;
			if (ir != null && irCount > ir) {
				problems.push({ kind: 'roster-limit', player: null, label: `Injured Reserve carries ${irCount} players — ${irCount - ir} over the ${ir} limit` });
			}
			for (const slot of position || []) {
				const have = byPosition.get(slot.position) || 0;
				if (slot.max != null && have > slot.max) {
					problems.push({ kind: 'roster-limit', player: null, label: `Roster carries ${have} ${slot.position} — ${have - slot.max} over the ${slot.max} limit` });
				}
			}
			return problems;
		}

		// One league's problems, as { kind, player, label } rows — player is
		// null for league-level rows, and the label deliberately excludes the
		// player's name so the renderer can lead with it and hang the team
		// suffix off it, same as every table on the page.
		//
		// Roster-limit checks run wherever `rosterLimits` is present, which is
		// independent of whether this league has a lineup pilot — a salary-cap
		// or draft-only league with no lineup editor still has a roster that
		// can go over its limits. They share the lineup checks' two
		// noise-avoidance gates rather than their lineup-data gate: skip
		// mid-draft (a roster being built from zero hasn't gone over anything,
		// and a rookie draft landing on top of a full veteran roster is
		// expected to go over until the post-draft cutdown, not urgent the
		// moment a pick lands) and skip a league still on last season (see
		// below — NaN < year is false, so a pre-`season` snapshot still gets
		// checked).
		//
		// Lineup checks run only where lineup data exists (starters is an
		// array AND lineupWeek is set — for every other league the absence of
		// data must read as "not asked", never as an empty lineup), and are
		// suppressed for two states where a true answer would still be noise:
		// a league mid-draft (its week-1 lineup is nonsense until the roster
		// exists) and a league still on last season (its lineup is for a week
		// that has already been played — same season comparison as
		// awaitingRollover, but not type-gated: a stale lineup is stale
		// whatever the league type does with rosters). Both halves of that
		// comparison must be present to mean anything; NaN < year is false,
		// so a pre-`season` snapshot keeps its checks.
		//
		// Each starter gets at most one row, worst problem first: an IR-slot
		// player who is also on the injury report is one problem (the slot),
		// not two, and an Out player on bye is the injury row alone. A
		// starter id that doesn't resolve to a rostered player is skipped
		// silently — a same-sync race between the two MFL exports, and there
		// is nothing useful to say about a player we can't name.
		function computeLeagueProblems(league, year) {
			const problems = [];
			if (league.error) {
				problems.push({ kind: 'sync', player: null, label: `Roster sync failing — showing older data (${league.error})` });
			}

			const notMidDraftOrTrailing = league.draftInProgress !== true && !(Number(league.season) < Number(year));
			if (league.rosterLimits && notMidDraftOrTrailing) {
				problems.push(...rosterLimitProblems(league));
			}

			if (!Array.isArray(league.starters) || league.lineupWeek == null) return problems;
			if (league.draftInProgress === true) return problems;
			if (Number(league.season) < Number(year)) return problems;

			const wk = league.lineupWeek;
			const byId = new Map((league.players || []).map((p) => [String(p.id), p]));
			for (const id of league.starters) {
				const p = byId.get(String(id));
				if (!p) continue;
				if (p.status && !DIGEST_STARTABLE_STATUSES.includes(p.status)) {
					const slot = (STATUS_GROUPS.find((g) => g.key === p.status) || {}).label || p.status;
					problems.push({ kind: 'ineligible', player: p, label: `in the week ${wk} lineup but on the ${slot}` });
					continue;
				}
				const inj = p.injuryStatus;
				if (inj && (INJURY_SETTLED.includes(inj) || injurySeverityRank(inj) >= injurySeverityRank(DIGEST_INJURY_FLOOR))) {
					const part = p.injuryDetail && p.injuryDetail.part ? ` — ${p.injuryDetail.part}` : '';
					problems.push({ kind: 'injury', player: p, label: `in the week ${wk} lineup but listed ${inj}${part}` });
					continue;
				}
				if (Number(p.bye) > 0 && Number(p.bye) === Number(wk)) {
					problems.push({ kind: 'bye', player: p, label: `in the week ${wk} lineup but on bye` });
				}
			}

			if (league.starters.length === 0) {
				problems.push({ kind: 'empty', player: null, label: `No starters set for week ${wk}` });
			} else {
				const min = parseLineupMinimums(league.startingLineup);
				if (min != null && league.starters.length < min) {
					problems.push({ kind: 'short', player: null, label: `Only ${league.starters.length} of at least ${min} starters set for week ${wk}` });
				}
			}
			return problems;
		}

		// Every league's problems, in config order — the same display order as
		// every tab, so the digest reads in the order the cards sit below it.
		// Leagues with nothing wrong simply don't appear.
		function computeProblemsDigest(leagues, year) {
			const entries = [];
			for (const league of leagues || []) {
				const problems = computeLeagueProblems(league, year);
				if (problems.length > 0) entries.push({ league, problems });
			}
			return entries;
		}

		// Red dot: the lineup or the data is broken. Gold dot: a player needs
		// a decision. The distinction is what to fix versus what to weigh.
		// A roster-limit violation is squarely the first kind — it isn't a
		// judgment call, MFL's own deadline will force the drop eventually.
		const DIGEST_ALERT_KINDS = ['sync', 'ineligible', 'empty', 'short', 'roster-limit'];

		function renderProblemsDigest() {
			const digestEl = document.getElementById('digest');
			if (!digestEl) return;
			digestEl.innerHTML = '';
			const entries = pageData ? computeProblemsDigest(pageData.leagues, pageData.year) : [];
			const count = entries.reduce((n, e) => n + e.problems.length, 0);
			if (count === 0) {
				digestEl.classList.add('hidden');
				return;
			}
			digestEl.classList.remove('hidden');
			const leagueCount = entries.length;
			digestEl.appendChild(el('div', {
				class: 'digest-head',
				text: `⚠ ${count} thing${count === 1 ? '' : 's'} need${count === 1 ? 's' : ''} attention across ${leagueCount} league${leagueCount === 1 ? '' : 's'}`,
			}));
			for (const { league, problems } of entries) {
				for (const problem of problems) {
					const row = el('button', {
						type: 'button',
						class: `digest-row${DIGEST_ALERT_KINDS.includes(problem.kind) ? ' digest-alert' : ''}`,
						title: 'Go to this league',
					});
					row.appendChild(el('span', { class: 'digest-dot' }));
					row.appendChild(el('span', { class: 'digest-league', text: league.name || league.leagueName || league.id }));
					const labelEl = el('span', { class: 'digest-label' });
					if (problem.player) {
						const nameEl = el('span', { class: 'digest-player', text: problem.player.name });
						if (problem.player.team) appendTeamSuffix(nameEl, problem.player.team);
						labelEl.appendChild(nameEl);
						labelEl.appendChild(document.createTextNode(` ${problem.label}`));
					} else {
						labelEl.textContent = problem.label;
					}
					row.appendChild(labelEl);
					row.addEventListener('click', () => jumpToLeagueCard(league));
					digestEl.appendChild(row);
				}
			}
		}

		// A digest row lands on the league's Rosters card: that card carries
		// the lineup editor, which is where every lineup-shaped problem is
		// actually fixed. Re-rendering the grid (rather than poking classes)
		// is what keeps the tab strips' active states honest, and it's the
		// same full rebuild login/logout already does.
		function jumpToLeagueCard(league) {
			if (currentView === 'scoring') stopLiveScoringPolling();
			currentView = 'rosters';
			localStorage.setItem(VIEW_STORAGE_KEY, currentView);
			const group = subtabType(league);
			if (group) {
				currentLeagueType = group;
				localStorage.setItem(LEAGUE_TYPE_STORAGE_KEY, currentLeagueType);
			}
			renderGrid();
			const card = document.querySelector(`.card[data-view="rosters"][data-league-id="${league.id}"]`);
			if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
		}

		// Injury exposure: the same question as player exposure, asked only of
		// the players currently carrying an injury designation. The denominator
		// is deliberately the same set of leagues, so "3/9" means the same thing
		// on both cards and the two can be read side by side.
		//
		// Two differences from the player card, both deliberate. A player flagged
		// in one league but not another still counts in every league that rosters
		// him: the exposure is to the player, and it's the same body whichever
		// provider's feed noticed first. And singletons are kept rather than
		// filtered to count > 1, because an injury on your only share of a player
		// is still an injury you own — the > 1 filter exists on the player card to
		// answer "where am I concentrated", which isn't the question here.
		function computeInjuryExposure(leagues, types) {
			const eligible = exposureLeagues(leagues, types);
			const byPlayer = new Map();

			for (const league of eligible) {
				const label = league.leagueName || league.name;
				const seen = new Set();
				for (const p of league.players || []) {
					const key = normalizeName(p.name);
					if (seen.has(key)) continue;
					seen.add(key);
					if (!byPlayer.has(key)) {
						byPlayer.set(key, { name: p.name, position: p.position, team: p.team, leagues: [], ranks: [], statuses: [], url: null, detail: null });
					}
					const entry = byPlayer.get(key);
					entry.leagues.push(label);
					if (p.ecr && Number.isFinite(p.ecr.rank)) entry.ranks.push(p.ecr.rank);
					if (!entry.url && p.ecr?.url) entry.url = p.ecr.url;
					// First league to carry one settles it, the same way team and
					// position do. Unlike the designation there is nothing to
					// reconcile: every copy of this came from one global MFL report,
					// whether by player id or by name, so the leagues cannot disagree
					// about the body part the way they routinely do about severity.
					if (!entry.detail && p.injuryDetail) entry.detail = p.injuryDetail;
					const status = injuryDesignation(p);
					if (status) entry.statuses.push(status);
				}
			}

			const total = eligible.length;
			const rows = [...byPlayer.values()]
				.filter((info) => info.statuses.length > 0)
				.map((info) => ({
					name: info.name,
					position: info.position,
					team: info.team,
					leagues: info.leagues,
					count: info.leagues.length,
					exposure: total > 0 ? (info.leagues.length / total) * 100 : 0,
					ecr: medianRank(info.ranks),
					url: info.url,
					detail: info.detail,
					status: info.statuses.reduce((worst, s) =>
						injurySeverityRank(s) > injurySeverityRank(worst) ? s : worst
					),
				}))
				// Still developing first, settled below — then worst news first
				// inside each half. Both keys matter, and the order between them
				// is the whole design of this card.
				//
				// Severity alone used to lead, on the reasoning that a card headed
				// "Injury Exposure" is triage and an IR outranks a Questionable
				// however many leagues the Q spans. That reasoning has a hole in
				// it, and a season of watching found it: an IR is triage *once*.
				// The week it lands you drop somebody and move on, and every week
				// after that it is a fact about a roster slot you already settled,
				// still holding the top row. In August the Dynasty card opened
				// with a one-league IR on a fringe player and a holdout — two of
				// six rows spoken for before a game was played, and it would have
				// been the same two in February. A sort nothing can displace has
				// stopped sorting.
				//
				// So the first key is whether the designation is still a question
				// (see INJURY_SETTLED). A Questionable on three rosters is what
				// you act on this week; the IR is a standing note, and it keeps
				// its place at the bottom rather than being hidden — a *newly*
				// placed IR is real news, and dropping settled rows entirely would
				// mean it never appeared at all.
				//
				// Within each half the old ordering is untouched: severity, then
				// exposure, then the better player. Which means the cost of the
				// old design survives in miniature and is worth knowing — inside
				// the settled half a one-league IR still tops a five-league
				// suspension, on the same reasoning that was wrong at the top of
				// the card and is harmless at the bottom of it.
				//
				// `count` used to sit between exposure and ECR. It could never
				// break a tie: exposure is count/total and total is fixed for the
				// whole card, so equal exposure is equal count by construction.
				.sort((a, b) =>
					injurySettledRank(a.status) - injurySettledRank(b.status) ||
					injurySeverityRank(b.status) - injurySeverityRank(a.status) ||
					b.exposure - a.exposure ||
					rankOrLast(a.ecr) - rankOrLast(b.ecr) ||
					a.name.localeCompare(b.name)
				);

			return { total, rows };
		}

		// ---- Ranking cards: Top Players and Top Available ----
		//
		// Both are driven by `rankingPools` in data/rosters.json — the top of each
		// FantasyPros list the sync actually used, kept whole rather than only as
		// the ECR numbers stamped onto our own players. Where the exposure cards
		// look at rosters and ask what's on them, these two look at the rankings
		// and ask where our rosters sit against them.
		//
		// Both cards degrade to nothing at all: a rosters.json synced before the
		// pools existed simply has no `rankingPools`, and the cards don't render.

		// Must agree with normalizePlayerName in scripts/lib/fantasypros.mjs —
		// this is the join between a pool entry and a rostered player, and the two
		// halves live on opposite sides of the sync boundary. Deliberately a
		// second copy rather than a shared module: the page has no build step and
		// no imports, so the only alternative would be shipping the name of every
		// player twice in data/rosters.json. scripts/test-top-players.mjs runs
		// both implementations over the same corpus so they can't drift apart
		// unnoticed — a drift here doesn't break anything visibly, it just quietly
		// stops recognising a player you own.
		const NAME_SUFFIX = /\s+(jr|sr|ii|iii|iv|v)$/;

		function normalizeName(raw) {
			if (!raw) return '';
			let s = String(raw)
				.normalize('NFD')
				.replace(/[\u0300-\u036f]/g, '') // strip accents: Ekelér -> Ekeler
				.toLowerCase()
				.replace(/[.'’`]/g, '')
				.replace(/[^a-z0-9]+/g, ' ')
				.replace(/\s+/g, ' ')
				.trim();
			while (NAME_SUFFIX.test(s)) s = s.replace(NAME_SUFFIX, '');
			return s;
		}

		// Pool entry URLs are stored site-relative to keep data/rosters.json from
		// carrying the same origin a few hundred times. Reversing that is a string
		// prefix and nothing more — in particular it is never reconstructed from
		// the player's name, which would link Josh Allen the linebacker to Josh
		// Allen the quarterback. See playerPageUrl in lib/fantasypros.mjs.
		const FANTASYPROS_SITE = 'https://www.fantasypros.com';

		function poolPlayerUrl(url) {
			if (!url) return null;
			return url.startsWith('/') ? `${FANTASYPROS_SITE}${url}` : url;
		}

		// The ranking list a league's ECR column was drawn from. The three parts of
		// the key are exactly what the sync recorded on `league.rankings`, so a
		// league whose rankings failed has nothing to look up and contributes
		// nothing — see rankingPoolKey in lib/fantasypros.mjs.
		function rankingPoolFor(league, pools) {
			const r = league.rankings;
			if (!r || !pools) return null;
			const pool = pools[`${r.type}|${r.scoring}|${r.position}`];
			return pool && Array.isArray(pool.players) && pool.players.length > 0 ? pool : null;
		}

		// Top Available: the ranking lists filtered to players nobody in the
		// league rosters. The sync works out who that is — it's the one side that
		// can see every franchise's roster — and records the names per league; all
		// that's left here is to look each one back up in the pool for its rank and
		// link, and to collect where the player stands in each league.
		//
		// Each row answers two questions, because on a wire the second one changes
		// what you do about the first: he's free in these leagues, and you already
		// hold him in those. A player free in three leagues you don't own him in is
		// a different proposition from one you're already three-deep on.
		//
		// Both counts share one denominator — the leagues that could answer the
		// availability question at all. That is what makes the pair readable: of
		// the N leagues we could check, he is free in X and yours in Y, and the
		// remainder is somebody else's. Counting ownership over a wider set would
		// be more complete and would print two fractions with different bottoms on
		// one line, which reads as an error even when both are right.
		//
		// The set is narrower than the exposure cards' for a reason: ESPN's
		// league-wide roster read is best-effort, and a league whose rankings
		// failed has no pool to filter, so counting those in would report a free
		// agent as available in 1 of 2 leagues when the second was never asked.
		//
		// Ranks are medianed over the leagues he's free in rather than all of them,
		// since that's the set the row is actually about. A group can span two
		// ranking lists even inside one sub-tab — Dynasty/Salary Cap holds dynasty
		// leagues reading DYNASTY beside cap leagues reading DRAFT, deliberately;
		// see automaticRankingType — so the median is the representative rank for
		// the same reason it is on the exposure cards.
		function computeTopAvailable(leagues, types, pools, year) {
			const inGroup = exposureLeagues(leagues, types);
			// Counted separately so the card can say a league is missing on
			// purpose. A league mid-draft has its `available` cleared by the
			// sync, so it drops out of `eligible` on its own — but dropping out
			// silently is what makes a denominator quietly wrong, and "6 leagues"
			// with no explanation is exactly the kind of thing nobody notices.
			//
			// A league that hasn't rolled over yet is left out too, and needs its
			// own check: unlike a drafting league its `available` is a perfectly
			// real list, just an answer about a season that is already over — see
			// awaitingRollover. The two are counted separately because the reader
			// can act on the difference. A draft finishes within days; a rollover
			// waits on a commissioner who hasn't opened next season yet.
			const awaitingSet = new Set(inGroup.filter((l) => awaitingRollover(l, year)));
			const awaiting = awaitingSet.size;
			// Mutually exclusive with the count above, so the two notes partition
			// the excluded leagues rather than double-counting one. Rollover wins:
			// a draft flag on a league that hasn't rolled over describes last
			// season's draft, which says nothing about the one still to come.
			const drafting = inGroup.filter((l) => l.draftInProgress === true && !awaitingSet.has(l)).length;
			const eligible = inGroup
				.filter((l) => !awaitingSet.has(l) && Array.isArray(l.available) && rankingPoolFor(l, pools));
			const byPlayer = new Map();

			function entryFor(key, poolPlayer) {
				if (!byPlayer.has(key)) {
					byPlayer.set(key, {
						name: poolPlayer.name,
						position: poolPlayer.position,
						// Off the pool entry, never off a roster: a row here is a
						// player nobody holds, so in the general case there is no
						// roster copy to read. Absent — not 'FA' — on a
						// rosters.json synced before buildRankingList carried it,
						// which is the one state the renderer treats as unknown.
						team: poolPlayer.team,
						url: poolPlayerUrl(poolPlayer.url),
						ranks: [],
						leagues: [],
						ownedLeagues: [],
					});
				}
				return byPlayer.get(key);
			}

			for (const league of eligible) {
				const pool = rankingPoolFor(league, pools);
				const poolByName = new Map();
				for (const p of pool.players) {
					const key = normalizeName(p.name);
					if (key && !poolByName.has(key)) poolByName.set(key, p);
				}

				const label = league.leagueName || league.name;

				const seenFree = new Set();
				for (const name of league.available) {
					const key = normalizeName(name);
					const p = poolByName.get(key);
					if (!p || seenFree.has(key)) continue;
					seenFree.add(key);
					const entry = entryFor(key, p);
					entry.ranks.push(p.rank);
					entry.leagues.push(label);
				}

				// Our own roster, against the same pool. Only players already in
				// byPlayer get an owned line: this card lists free agents, so a
				// player nobody has left unrostered anywhere isn't a row here no
				// matter how many of our teams he's on — that's the exposure card's
				// question. A player can never be both free and owned in the *same*
				// league, since the sync built `available` by removing every
				// rostered name.
				const seenOwned = new Set();
				for (const p of league.players || []) {
					const key = normalizeName(p.name);
					if (!key || seenOwned.has(key) || !byPlayer.has(key)) continue;
					seenOwned.add(key);
					byPlayer.get(key).ownedLeagues.push(label);
				}
			}

			const total = eligible.length;
			const rows = [...byPlayer.values()]
				.map((info) => ({
					name: info.name,
					position: info.position,
					team: info.team,
					leagues: info.leagues,
					count: info.leagues.length,
					ownedLeagues: info.ownedLeagues,
					ownedCount: info.ownedLeagues.length,
					ecr: medianRank(info.ranks),
					url: info.url,
				}))
				.sort((a, b) => rankOrLast(a.ecr) - rankOrLast(b.ecr) || a.name.localeCompare(b.name));

			// The card used to date itself here, off the oldest `availableAt`
			// among the contributing leagues — it is the one card that isn't as
			// fresh as the sync, since the free agent read runs once a day rather
			// than once a sync. That subtitle is gone by request: the lag is a
			// property of the data whether or not it's printed, and a line of
			// small print explaining it every visit costs more room than it
			// bought. `availableAt` is still written and still drives the
			// once-a-day rule in fetch-rosters.mjs; nothing on screen reads it.
			return { total, rows, drafting, awaiting };
		}

		// Six rather than ten: two of these cards now sit side by side, and a
		// ten-row table pushed the pager below the fold on a phone — you had to
		// scroll to reach the control that saves you scrolling. Six keeps the
		// pager reachable without scrolling on the shortest phone screens.
		//
		// This is Injury Exposure's size, and the default for anything added
		// later. Player Exposure overrides it below.
		const ANALYTICS_PAGE_SIZE = 6;

		// Player Exposure shows eight, and the difference from the six above is
		// the point rather than an inconsistency to tidy away.
		//
		// The two cards sit side by side on desktop, and their rows are not the
		// same height. An Injury Exposure row carries three lines — the name, the
		// injury under it, then the leagues — where a Player Exposure row carries
		// two, having no injury to describe. So six of the taller rows stand about
		// as tall as eight of the shorter ones (18 lines against 16), and the two
		// cards come out roughly level instead of one trailing a third of a table
		// below the other.
		//
		// That makes these two numbers a pair. Anything that changes how many
		// lines a row of either card takes — dropping the injury detail line,
		// adding a sub-line to the player card — has to move them together, or
		// the alignment they exist for quietly goes away.
		const PLAYER_EXPOSURE_PAGE_SIZE = 8;

		const RANKING_PAGE_SIZE = 8;

		// The table half of all three analytics cards, pager and all. They differ
		// only in which columns are present and how the sub-lines read, so this is
		// one implementation with flags rather than three near-identical copies
		// free to drift apart.
		//
		//   showStatus   — Injury Exposure's designation column
		//   showExposure — the percentage column; Top Available counts leagues,
		//                  but a percentage of them means nothing
		//   countHeader  — what the n/total column is counting
		//   showOwned    — Top Available's second count and second sub-line: the
		//                  leagues you already hold this free agent in. Both
		//                  sub-lines get a label once there are two of them,
		//                  since two identical grey lines would be a guess.
		function appendAnalyticsTable(card, rows, total, {
			showStatus = false,
			showExposure = true,
			countHeader = 'Own In',
			showOwned = false,
			pageSize = ANALYTICS_PAGE_SIZE,
		} = {}) {
			const table = el('table', { class: 'standings' });
			card.appendChild(table);

			// Click-to-sort on every column but the player's name. The card's own
			// order is a fourth state rather than something you lose on the first
			// click: each header cycles through its natural direction, the
			// reverse, and then back to the default. That matters most on Injury
			// Exposure, whose default order encodes the live/settled split — a
			// two-state toggle would strand you in a sort with no way back except
			// reloading the page.
			//
			// Sorting is per card and per visit: no localStorage, since the
			// default order is the considered one and a sort you set last Tuesday
			// silently overriding it is worse than clicking again.
			//
			// Ties fall back to the card's own order rather than to nothing, which
			// is what keeps a Pos sort from scrambling players within a position —
			// under it they stay in exposure order, or wire order, or whatever
			// that card sorted by.
			const defaultIndex = new Map(rows.map((r, i) => [r, i]));
			const SORTS = {
				// Fantasy order (QB, RB, WR, TE, PK, Def), not alphabetical, which
				// would open with Def and bury the quarterbacks in the middle.
				pos: { dir: 1, value: (r) => positionRank(r.position) },
				// Ascending: rank 1 is the best player, so the natural first click
				// is best-first. `missingLast` is what keeps an unranked player at
				// the bottom in *both* directions — the obvious `rankOrLast`
				// treatment ranks him worse than everybody, which reads correctly
				// ascending and then hands him the top row on the reverse click.
				// No ECR means the rankings didn't have him, not that he is the
				// worst player in the league.
				ecr: { dir: 1, value: (r) => r.ecr, missingLast: true },
				// Descending: most exposed first is what anybody clicking a column
				// called Pct is asking for.
				pct: { dir: -1, value: (r) => r.exposure },
				// The n/total columns, descending for the same reason. On the two
				// exposure cards this is the same ordering as Pct — exposure is
				// count/total and total is fixed for the whole card — and it is
				// still worth having, because the reader clicking the number they
				// can see shouldn't have to know that. On Top Available it is the
				// only way to sort by reach, since that card has no Pct column.
				count: { dir: -1, value: (r) => r.count },
				// Top Available's second count, and the one place the two differ:
				// how many leagues you already hold a free agent in.
				owned: { dir: -1, value: (r) => r.ownedCount },
			};
			let sortKey = null;
			let sortDir = 0;

			function sortedRows() {
				if (!sortKey) return rows;
				const { value, missingLast } = SORTS[sortKey];
				const byDefault = (a, b) => defaultIndex.get(a) - defaultIndex.get(b);
				return [...rows].sort((a, b) => {
					const av = value(a);
					const bv = value(b);
					if (missingLast && (av == null || bv == null)) {
						if (av == null && bv == null) return byDefault(a, b);
						return av == null ? 1 : -1;
					}
					return (av === bv ? 0 : av < bv ? -1 : 1) * sortDir || byDefault(a, b);
				});
			}

			// Natural direction, then its reverse, then back to the card's order.
			function cycleSort(key) {
				if (sortKey !== key) {
					sortKey = key;
					sortDir = SORTS[key].dir;
				} else if (sortDir === SORTS[key].dir) {
					sortDir = -sortDir;
				} else {
					sortKey = null;
					sortDir = 0;
				}
				page = 0;
				renderPage();
			}

			function sortableHeader(label, key, attrs = {}) {
				const th = el('th', { ...attrs, class: `${attrs.class || ''} sortable`.trim(), text: label });
				if (sortKey === key) {
					th.appendChild(el('span', { class: 'sort-arrow', text: sortDir === 1 ? ' ▲' : ' ▼' }));
				}
				th.addEventListener('click', () => cycleSort(key));
				return th;
			}

			const pageCount = Math.ceil(rows.length / pageSize);
			let page = 0;
			let pager = null;
			let prevBtn = null;
			let nextBtn = null;
			let pageLabel = null;
			if (pageCount > 1) {
				pager = el('div', { class: 'pager' });
				prevBtn = el('button', { type: 'button', class: 'pager-btn', text: 'Prev' });
				pageLabel = el('span', { class: 'pager-label' });
				nextBtn = el('button', { type: 'button', class: 'pager-btn', text: 'Next' });
				pager.appendChild(prevBtn);
				pager.appendChild(pageLabel);
				pager.appendChild(nextBtn);
				card.appendChild(pager);
			}

			function renderPage() {
				table.innerHTML = '';
				const headRow = el('tr');
				// ECR follows the roster cards: logged-out visitors don't get the
				// column. The sort uses it either way — best-player-first is the
				// right order whether or not the number is on screen.
				const showEcr = isLoggedIn();
				headRow.appendChild(el('th', { text: 'Player' }));
				headRow.appendChild(sortableHeader('Pos', 'pos'));
				if (showStatus) headRow.appendChild(el('th', { text: 'Status' }));
				// Only sortable where it is on screen. A logged-out visitor has no
				// ECR column to click, though the default order still uses the
				// number underneath it.
				if (showEcr) headRow.appendChild(sortableHeader('ECR', 'ecr', { class: 'ecr-cell' }));
				headRow.appendChild(sortableHeader(countHeader, 'count'));
				if (showOwned) headRow.appendChild(sortableHeader('Own In', 'owned'));
				// Top Available has no Pct column — a percentage of leagues means
				// nothing there — so it gets Pos and ECR only.
				if (showExposure) headRow.appendChild(sortableHeader('Pct', 'pct'));
				table.appendChild(headRow);

				// One grey line of league names needs no label. Two do, and the
				// labels have to survive the line wrapping onto a phone, so they
				// live inside the line rather than in a column of their own.
				function leagueLine(label, names) {
					if (!names || names.length === 0) return null;
					const line = el('div', { class: 'exposure-leagues' });
					if (label) line.appendChild(el('span', { class: 'exposure-leagues-label', text: `${label} ` }));
					line.appendChild(document.createTextNode(names.join(', ')));
					return line;
				}

				const start = page * pageSize;
				for (const r of sortedRows().slice(start, start + pageSize)) {
					const row = el('tr');
					const nameCell = el('td');
					// Same link as the roster cards, from the same captured URL —
					// see playerNameNode, which this mirrors on a row that has no
					// player object behind it, only the aggregate.
					const nameLine = el('div', {}, [playerNameNode({ name: r.name, ecr: { url: r.url } })]);
					// The same NFL-team suffix the roster and lineup tables carry,
					// so a name reads identically wherever it appears. `undefined`
					// is the one value that prints nothing: every provider and the
					// ranking pool both normalise "no NFL team" to 'FA', so the
					// field is only missing on a rosters.json synced before this
					// shipped — and 'FA' against an unknown would be a claim, not a
					// blank. Same rule the FantasyPros link already follows.
					if (r.team !== undefined) appendTeamSuffix(nameLine, r.team);
					nameCell.appendChild(nameLine);
					// Injury Exposure only — the other two cards never set `detail`,
					// so this needs no flag of its own. Above the league line: what
					// is wrong with him is the reason to read the row, and where you
					// hold him is the consequence.
					const detailText = injuryDetailLine(r.detail);
					if (detailText) nameCell.appendChild(el('div', { class: 'injury-detail', text: detailText }));
					const freeLine = leagueLine(showOwned ? 'Free in' : null, r.leagues);
					if (freeLine) nameCell.appendChild(freeLine);
					if (showOwned) {
						const ownedLine = leagueLine('Own in', r.ownedLeagues);
						if (ownedLine) nameCell.appendChild(ownedLine);
					}
					row.appendChild(nameCell);
					row.appendChild(el('td', { text: r.position || '-' }));
					if (showStatus) row.appendChild(el('td', { class: 'injury-status-cell', text: r.status || '—' }));
					if (showEcr) {
						// Overall rank, not positional: this table mixes positions, so
						// the overall number is the one the ordering is actually by.
						const elite = r.ecr != null && r.ecr <= 24;
						row.appendChild(el('td', {
							class: `ecr-cell${elite ? ' ecr-elite' : ''}`,
							text: r.ecr == null ? '—' : String(r.ecr),
						}));
					}
					row.appendChild(el('td', { text: `${r.count}/${total}` }));
					if (showOwned) row.appendChild(el('td', { text: `${r.ownedCount}/${total}` }));
					if (showExposure) row.appendChild(el('td', { text: `${Math.round(r.exposure)}%` }));
					table.appendChild(row);
				}

				if (pager) {
					pageLabel.textContent = `Page ${page + 1} of ${pageCount}`;
					prevBtn.disabled = page === 0;
					nextBtn.disabled = page >= pageCount - 1;
				}
			}

			if (pager) {
				prevBtn.addEventListener('click', () => {
					if (page > 0) { page--; renderPage(); }
				});
				nextBtn.addEventListener('click', () => {
					if (page < pageCount - 1) { page++; renderPage(); }
				});
			}

			renderPage();
		}

		// "1 leagues" was unreachable while Analytics folded dynasty, salary-cap
		// and redraft into one tab — a group that small couldn't happen. Splitting
		// Redraft back out made it an ordinary state: a redraft group holds one
		// drafted league all preseason while the others wait on their drafts.
		function leagueCount(n) {
			return `${n} league${n === 1 ? '' : 's'}`;
		}

		// Neither analytics card carries a footnote. Both used to explain their own
		// workings under the table — the median ECR being drawn from leagues that
		// can rank off different FantasyPros lists, and where an injury designation
		// comes from — but side by side that was three grey paragraphs of small
		// print under two short tables, and the numbers stand up without them. The
		// reasoning still lives in the comments above computePlayerExposure and
		// computeInjuryExposure, which is where anyone changing them will be.
		function renderAnalyticsCard(groupKey, types, leagues) {
			const card = el('div', { class: 'card', 'data-view': 'analytics', 'data-league-type': groupKey });
			card.appendChild(el('h2', { text: 'Player Exposure' }));

			const { total, rows } = computePlayerExposure(leagues, types);

			if (total < 2) {
				// Not a fault, and it reads like one if worded as a requirement:
				// a redraft group holds a single drafted league for most of the
				// preseason while the rest wait on their drafts. Exposure needs
				// two rosters to be a ratio of anything, so the card says what it
				// is waiting for rather than what is missing.
				card.appendChild(el('div', {
					class: 'error-box',
					text: total === 1
						? 'Only one league here has rosters so far — exposure needs at least two to compare.'
						: 'No leagues here have roster data yet.',
				}));
				return card;
			}

			card.appendChild(el('div', { class: 'team', text: `Across ${leagueCount(total)}` }));

			if (rows.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'No players owned in more than one league yet.' }));
				return card;
			}

			appendAnalyticsTable(card, rows, total, { pageSize: PLAYER_EXPOSURE_PAGE_SIZE });
			return card;
		}

		// Used to return null rather than a card carrying the "need at least 2
		// leagues" message, on the theory that the Player Exposure card sitting
		// beside it already says so. That reasoning doesn't survive a group
		// small enough to trip this at all: Redraft can hold a single drafted
		// league for most of the preseason, Player Exposure is the only
		// Analytics card left standing in that state, and Injury Exposure simply
		// isn't in the grid — nothing on screen says it exists, let alone why
		// it's missing. A card that vanishes reads as broken; a card that says
		// what it's waiting for reads as a state. Same message as Player
		// Exposure on purpose, since it's the same condition on the same
		// leagues.
		function renderInjuryExposureCard(groupKey, types, leagues) {
			const { total, rows } = computeInjuryExposure(leagues, types);

			const card = el('div', { class: 'card', 'data-view': 'analytics', 'data-league-type': groupKey });
			card.appendChild(el('h2', { text: 'Injury Exposure' }));

			if (total < 2) {
				card.appendChild(el('div', {
					class: 'error-box',
					text: total === 1
						? 'Only one league here has rosters so far — exposure needs at least two to compare.'
						: 'No leagues here have roster data yet.',
				}));
				return card;
			}

			card.appendChild(el('div', { class: 'team', text: `Across ${leagueCount(total)}` }));

			if (rows.length === 0) {
				card.appendChild(el('div', { class: 'error-box', text: 'Nobody on these rosters is carrying an injury designation right now.' }));
				return card;
			}

			appendAnalyticsTable(card, rows, total, { showStatus: true });
			return card;
		}

		// This one returns null rather than an explanatory box when it has
		// nothing to work from — a data/rosters.json written before
		// rankingPools existed, or by a sync with no FantasyPros key. That
		// isn't a state the reader can act on. An empty *wire*, on the other
		// hand, is an answer, and gets said out loud below.
		//
		// There was a Top Players card here too, listing the pool itself with
		// the players we own called out. It's gone: knowing who the best players
		// in football are is what the rankings are for, and a card that mostly
		// says "0/7" next to names you can't do anything about isn't worth the
		// room beside a wire you can act on. The pool it needed is still fetched
		// — Top Available filters the same list.
		// One row per team we hold in this group, best roster first — the
		// portfolio question the exposure cards ask, pointed at whole teams.
		// Power is the overall rank (starters plus bench, the full roster's
		// projected value); Starters and Depth are the same teams ranked on
		// each half alone, which is what tells a 3rd-overall roster whether it
		// is a contender with no bench or a farm system with no lineup.
		//
		// Returns null rather than an explanation when nothing here has power
		// data — a snapshot from before the feature, or a group entirely
		// mid-draft — the same rule the Injury Exposure card follows: not a
		// state the reader can act on.
		//
		// The ranks are per-league ordinals ("3/12"), never scores, so the
		// dynasty and salary-cap leagues sharing this sub-tab compare fine
		// even though their scores are computed under different slot shapes
		// and scoring formats — the cross-list hazard that keeps Analytics on
		// one grouping (see SUBTAB_GROUP) doesn't reach an ordinal.
		// Mirrors leagueLine on the exposure cards, flipped: there the grey
		// line under a PLAYER's name lists the leagues; here it's under a
		// LEAGUE's name and lists the players. Each name carries its overall
		// ECR rank as a tooltip, the same "Overall ECR N" wording buildEcrCell
		// already uses for the per-player ECR column on the Rosters tab.
		// Shared by the Studs and Sleepers sub-lines — same idea as leagueLine
		// on the exposure cards being reused for both "Free in" and "Own in"
		// rather than two near-identical functions. `rankLabel(p)` supplies the
		// tooltip text since the two lines read the rank off different fields
		// (p.ecr.rank vs p.sleeper.rank).
		function powerPlayersLine(label, players, rankLabel) {
			if (!players || players.length === 0) return null;
			const line = el('div', { class: 'power-players' });
			line.appendChild(el('span', { class: 'power-players-label', text: `${label} ` }));
			players.forEach((p, i) => {
				if (i > 0) line.appendChild(document.createTextNode(', '));
				const entry = el('span', { title: rankLabel(p) });
				entry.appendChild(document.createTextNode(p.name));
				appendTeamSuffix(entry, p.team);
				line.appendChild(entry);
			});
			return line;
		}

		function renderPowerRankCard(groupKey, types, leagues, year) {
			const rows = computeMyPowerRows(leagues, types, year);
			// A card where nothing at all could be ranked is not a card. The
			// distinction it preserves is worth the extra condition: an absent
			// card means the sync has produced no power data for this group,
			// while a TBD row means this league in particular couldn't be
			// ranked — which is only legible when something beside it was.
			// Without this, a snapshot from before power ranks existed would
			// render a full card of TBDs saying nothing.
			if (!rows.some((r) => r.proj || r.ecr)) return null;

			const card = el('div', { class: 'card', 'data-view': 'analytics', 'data-league-type': groupKey });
			card.appendChild(el('h2', { text: 'Power Rankings' }));
			// Word for word what the other three cards say, same reasoning.
			card.appendChild(el('div', { class: 'team', text: `Across ${leagueCount(rows.length)}` }));

			// Conditional, and deliberately so: the four Analytics cards carry
			// one identical subtitle and nothing else, because a standing
			// explanation costs room on every visit. This is not an
			// explanation — it appears only when the numbers under the card
			// have actually stopped moving, which is the single symptom the
			// frozen-projections failure produces.
			// At most one line, and only when it changes how a number should be
			// read. A missing basis explains its own column of TBDs; the
			// preseason-slot case explains numbers that look fine and aren't.
			const missing = powerMissingBasis(rows);
			if (missing.projections) {
				card.appendChild(el('div', {
					class: 'error-box',
					text: 'Projections aren’t published for this season yet — ranked on consensus rankings until they are.',
				}));
			} else if (powerUsesPreseasonProjections(rows)) {
				card.appendChild(el('div', {
					class: 'error-box',
					text: "Projections are preseason — they don't reflect what's happened this season yet.",
				}));
			}

			const detailBasis = powerDetailBasis(rows);
			const detailLabel = detailBasis === 'projections' ? 'projections' : 'consensus rankings';
			const detailOf = (r) => (detailBasis === 'projections' ? r.proj : r.ecr);
			const table = el('table', { class: 'standings' });

			// Click-to-sort, following the same three rules the shared analytics
			// table uses (see appendAnalyticsTable): each header cycles natural
			// direction → reverse → back to the card's own order, ties fall
			// back to that order, and a missing value stays at the bottom in
			// *both* directions. This card doesn't reuse that function because
			// its rows are leagues rather than players — different columns
			// entirely, and no pagination for seven rows — but the semantics
			// are deliberately identical, and pinned by test-power-rank.mjs.
			//
			// Every column is ascending-natural: on a card made of rank
			// ordinals, 1 is the good end of all of them, so best-first is what
			// a first click means everywhere. League sorts alphabetically.
			const SORTS = {
				league: { dir: 1, value: (r) => r.label.toLowerCase() },
				proj: { dir: 1, value: (r) => (r.proj ? r.proj.overall : null), missingLast: true },
				ecr: { dir: 1, value: (r) => (r.ecr ? r.ecr.overall : null), missingLast: true },
				starters: { dir: 1, value: (r) => (detailOf(r) ? detailOf(r).starters : null), missingLast: true },
				depth: {
					dir: 1,
					value: (r) => {
						const d = detailOf(r);
						return d && d.depth != null ? d.depth : null;
					},
					missingLast: true,
				},
				avg: { dir: 1, value: (r) => (r.avg == null ? null : r.avg), missingLast: true },
			};
			let sortKey = null;
			let sortDir = 0;
			const defaultIndex = new Map(rows.map((r, i) => [r, i]));

			function sortedRows() {
				if (!sortKey) return rows;
				const { value, missingLast } = SORTS[sortKey];
				const byDefault = (a, b) => defaultIndex.get(a) - defaultIndex.get(b);
				return [...rows].sort((a, b) => {
					const av = value(a);
					const bv = value(b);
					if (missingLast && (av == null || bv == null)) {
						if (av == null && bv == null) return byDefault(a, b);
						return av == null ? 1 : -1;
					}
					return (av === bv ? 0 : av < bv ? -1 : 1) * sortDir || byDefault(a, b);
				});
			}

			function cycleSort(key) {
				if (sortKey !== key) {
					sortKey = key;
					sortDir = SORTS[key].dir;
				} else if (sortDir === SORTS[key].dir) {
					sortDir = -sortDir;
				} else {
					sortKey = null;
					sortDir = 0;
				}
				renderBody();
			}

			function sortableHeader(label, key, title) {
				const th = el('th', { class: 'sortable', text: label });
				if (title) th.setAttribute('title', title);
				if (sortKey === key) {
					th.appendChild(el('span', { class: 'sort-arrow', text: sortDir === 1 ? ' ▲' : ' ▼' }));
				}
				th.addEventListener('click', () => cycleSort(key));
				return th;
			}

			// TBD rather than a dash: the number isn't missing, it isn't
			// computable yet, and it will be. A dash reads as "nothing here".
			const rankCell = (entry, why) =>
				(entry
					? el('td', { text: String(entry.overall) })
					: el('td', { class: 'power-tbd', text: 'TBD', title: why }));

			function renderBody() {
				table.innerHTML = '';
				const headRow = el('tr');
