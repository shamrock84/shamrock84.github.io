				headRow.appendChild(sortableHeader('League', 'league', 'Team count in parentheses'));
				headRow.appendChild(sortableHeader('Proj', 'proj', 'Rank by projected points of the best legal lineup, plus bench'));
				headRow.appendChild(sortableHeader('ECR', 'ecr', 'Rank by consensus ranking of the same roster'));
				// Abbreviated so six columns fit a phone without wrapping. The
				// tooltips carry the full words, which is where "Ben" earns its
				// keep — on its own it could be read as a name.
				headRow.appendChild(sortableHeader('Start', 'starters', `Starters: lineup rank, by ${detailLabel}`));
				headRow.appendChild(sortableHeader('Ben', 'depth', `Bench: depth rank, by ${detailLabel}`));
				headRow.appendChild(sortableHeader('Avg', 'avg', 'Mean of ECR, Start and Ben'));
				table.appendChild(headRow);

				for (const r of sortedRows()) {
					const row = el('tr');
					// The league size rides with the name now, so every rank
					// column can be a bare number. It also means the size shows
					// on a league whose ranks are all TBD, where previously it
					// had nowhere to go.
					const nameCell = el('td', { text: r.label });
					if (r.size != null) nameCell.appendChild(el('span', { class: 'power-size', text: ` (${r.size})` }));
					const studs = powerPlayersLine('Studs', r.studs, (p) => `Overall ECR ${p.ecr.rank}`);
					if (studs) nameCell.appendChild(studs);
					const sleepers = powerPlayersLine('Sleepers', r.sleepers, (p) => `Sleeper rank ${p.sleeper.rank}`);
					if (sleepers) nameCell.appendChild(sleepers);
					row.appendChild(nameCell);
					// A league with no ranks at all explains itself once, in its
					// own terms — "draft in progress" rather than two separate
					// notes about projections and rankings, neither of which is
					// the actual reason.
					row.appendChild(rankCell(r.proj, r.reason || 'No projections published for this season yet'));
					row.appendChild(rankCell(r.ecr, r.reason || 'No consensus rankings available for this league'));
					const detail = detailOf(r);
					row.appendChild(el('td', detail ? { text: String(detail.starters) } : { class: 'power-tbd', text: 'TBD' }));
					row.appendChild(
						detail && detail.depth != null
							? el('td', { text: String(detail.depth) })
							: el('td', { class: 'power-tbd', text: detail ? '—' : 'TBD' })
					);
					row.appendChild(
						r.avg == null
							? el('td', { class: 'power-tbd', text: 'TBD' })
							: el('td', { class: 'power-avg', text: r.avg.toFixed(1) })
					);
					table.appendChild(row);
				}
			}
			renderBody();
			card.appendChild(table);
			return card;
		}

		function renderTopAvailableCard(groupKey, types, leagues, pools, year) {
			const { total, rows, drafting, awaiting } = computeTopAvailable(leagues, types, pools, year);
			// A group whose only leagues are mid-draft or waiting on next season
			// still gets a card, saying so. Returning null there would read as "no
			// data" when the truth is "ask again once they've drafted".
			if (total === 0 && drafting === 0 && awaiting === 0) return null;

			const card = el('div', { class: 'card', 'data-view': 'analytics', 'data-league-type': groupKey });
			card.appendChild(el('h2', { text: 'Top Available' }));
			// Word for word what the two exposure cards say, so the three read as
			// one set rather than three dialects. This card's denominator is the
			// narrower one — it counts only leagues that could answer the
			// availability question, so it can sit below theirs — and it used to
			// carry a line per excluded league explaining the gap, plus the date
			// of the underlying read. All of it is gone by request. The exclusions
			// still happen; they are simply not narrated, so a group whose count
			// looks short is explained by the comments on computeTopAvailable
			// rather than on screen.
			card.appendChild(el('div', { class: 'team', text: `Across ${leagueCount(total)}` }));

			if (total === 0) {
				// Built from the reasons that actually apply, so a group held up by
				// both says both. Saying only "mid-draft" about a league that has no
				// draft scheduled yet sends you looking at the wrong thing.
				const held = [];
				if (drafting > 0) held.push('mid-draft');
				if (awaiting > 0) held.push('waiting on next season');
				card.appendChild(el('div', { class: 'error-box', text: `Every league here is ${held.join(' or ')}.` }));
				return card;
			}

			if (rows.length === 0) {
				// Worth saying out loud rather than hiding the card: in a deep
				// dynasty group this is the expected answer, and an absent card
				// looks like missing data instead of a picked-over wire.
				card.appendChild(el('div', { class: 'error-box', text: 'Everybody in the top of the rankings is already rostered here.' }));
				return card;
			}

			appendAnalyticsTable(card, rows, total, {
				showExposure: false,
				countHeader: 'Free In',
				showOwned: true,
				pageSize: RANKING_PAGE_SIZE,
			});
			return card;
		}

		function updateVisibility() {
			const q = document.getElementById('search').value.trim().toLowerCase();
			document.querySelectorAll('.card').forEach((card) => {
				const viewMatch = card.dataset.view === currentView;
				const typeMatch = !currentLeagueType || card.dataset.leagueType === currentLeagueType;
				const rows = card.querySelectorAll('tr.player-row');
				let searchMatch = true;
				if (q && rows.length > 0) {
					let anyVisible = false;
					rows.forEach((row) => {
						const match = row.dataset.name.includes(q);
						row.classList.toggle('hidden', !match);
						if (match) anyVisible = true;
					});
					searchMatch = anyVisible;
				} else {
					rows.forEach((row) => row.classList.remove('hidden'));
				}
				card.classList.toggle('hidden', !viewMatch || !typeMatch || !searchMatch);
			});
		}

		// Sub-tabs are scoped to whichever top-level view is active, so they're
		// recomputed every time the view changes rather than once up front. That
		// is also what lets Analytics group leagues its own way: the strip is
		// built from the data-league-type of the cards actually in this view, so
		// its Active/Draft Only pair and the other views' Dynasty/Salary
		// Cap/Redraft/Draft Only never have to know about each other.
		function renderSubTabs() {
			const subtabsEl = document.getElementById('subtabs');
			subtabsEl.innerHTML = '';

			const typesInView = new Set(
				[...document.querySelectorAll(`.card[data-view="${currentView}"]`)]
					.map((c) => c.dataset.leagueType)
					.filter(Boolean)
			);
			const present = SUBTAB_ORDER.filter((t) => typesInView.has(t)).concat(
				[...typesInView].filter((t) => !SUBTAB_ORDER.includes(t))
			);

			if (present.length <= 1) {
				subtabsEl.classList.add('hidden');
				currentLeagueType = present[0] || null;
				return;
			}

			subtabsEl.classList.remove('hidden');
			if (!currentLeagueType || !present.includes(currentLeagueType)) {
				currentLeagueType = present[0];
			}
			for (const type of present) {
				const label = SUBTAB_LABEL_OVERRIDES[type] || LEAGUE_TYPE_LABELS[type] || type;
				const btn = el('button', {
					class: `tab-btn${type === currentLeagueType ? ' active' : ''}`,
					type: 'button',
					role: 'tab',
					text: label,
				});
				btn.addEventListener('click', () => {
					currentLeagueType = type;
					localStorage.setItem(LEAGUE_TYPE_STORAGE_KEY, currentLeagueType);
					subtabsEl.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
					updateVisibility();
				});
				subtabsEl.appendChild(btn);
			}
		}

		function updateSearchVisibility() {
			document.querySelector('.controls').classList.toggle('hidden', currentView !== 'rosters');
		}

		function setLiveStatus(text, isError) {
			const el = document.getElementById('live-status');
			el.textContent = text;
			el.classList.toggle('live-error', !!isError);
		}

		async function refreshLiveScoring() {
			if (!LIVE_SCORING_URL || !pageData) return;
			try {
				const res = await fetch(`${LIVE_SCORING_URL}?t=${Date.now()}`, { cache: 'no-store' });
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				const live = await res.json();
				const byId = new Map((live.leagues || []).map((l) => [l.id, l]));

				for (const league of pageData.leagues) {
					const update = byId.get(league.id);
					if (!update) continue;
					league.scoring = update.scoring;
					league.scoringError = update.scoringError;
				}

				const gridEl = document.getElementById('grid');
				gridEl.querySelectorAll('.card[data-view="scoring"]').forEach((c) => c.remove());
				for (const league of pageData.leagues) {
					if (league.scoring !== undefined || league.scoringError) {
						gridEl.appendChild(renderScoringCard(league));
					}
				}
				updateVisibility();
				setLiveStatus(`Live updates on — last refreshed ${timeAgo(live.generatedAt)}`, false);
			} catch (err) {
				console.warn(`Live scoring refresh failed: ${err.message}`);
				setLiveStatus(`Live update failed: ${err.message}`, true);
			}
		}

		function startLiveScoringPolling() {
			if (!LIVE_SCORING_URL) return;
			document.getElementById('live-status').classList.remove('hidden');
			if (liveScoringTimer) return;
			refreshLiveScoring();
			liveScoringTimer = setInterval(refreshLiveScoring, LIVE_SCORING_POLL_MS);
		}

		function stopLiveScoringPolling() {
			document.getElementById('live-status').classList.add('hidden');
			if (liveScoringTimer) {
				clearInterval(liveScoringTimer);
				liveScoringTimer = null;
			}
		}

		function renderViewTabs(views) {
			const tabsEl = document.getElementById('tabs');
			tabsEl.innerHTML = '';
			const present = VIEW_ORDER.filter((v) => views.has(v)).concat(
				[...views].filter((v) => !VIEW_ORDER.includes(v))
			);
			if (present.length === 0) return;
			if (!present.includes(currentView)) currentView = present[0];

			if (present.length > 1) {
				tabsEl.classList.remove('hidden');
				for (const view of present) {
					const btn = el('button', {
						class: `tab-btn${view === currentView ? ' active' : ''}`,
						type: 'button',
						role: 'tab',
						text: VIEW_LABELS[view] || view,
					});
					btn.addEventListener('click', () => {
						currentView = view;
						localStorage.setItem(VIEW_STORAGE_KEY, currentView);
						tabsEl.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
						renderSubTabs();
						updateSearchVisibility();
						updateVisibility();
						if (currentView === 'scoring') {
							startLiveScoringPolling();
						} else {
							stopLiveScoringPolling();
						}
					});
					tabsEl.appendChild(btn);
				}
			} else {
				tabsEl.classList.add('hidden');
			}

			renderSubTabs();
			updateSearchVisibility();
		}

		// ---- Admin tab ---------------------------------------------------
		// Edits config/leagues.json — the single file that drives the 4-hour
		// sync, live scoring, and lineup submission. Saving commits straight to
		// main with no pull request in between, so api/save-leagues.js
		// re-validates everything server-side; nothing built here is trusted.
		//
		// Labels are deliberately plainer than the config's own key names
		// ("My team ID", not franchiseId) since this is the one part of the page
		// meant to be used without reading the file it edits.

		// Blank means "leave the key out", which is not the same as an empty
		// value — an omitted provider means MFL, an omitted rankingType means
		// "pick automatically from the league type and the time of year". The
		// labels, and the note above the table, say so.
		const ADMIN_PROVIDERS = [['', 'MFL'], ['espn', 'ESPN'], ['sleeper', 'Sleeper']];
		const ADMIN_TYPES = [['dynasty', 'Dynasty'], ['salarycap', 'Salary Cap'], ['draftonly', 'Draft Only'], ['redraft', 'Redraft']];
		// Is the NFL regular season on? A deliberate second copy of the rule
		// in nflSeasonPhase() in scripts/lib/fantasypros.mjs — this page has no
		// build step and can't import from scripts/, so the alternative would be
		// a fetch just to word one sentence of the legend under the Admin table.
		// The sync is the side that actually picks the ranking set; this only
		// describes it, so the two drifting apart would mislead rather than
		// break anything. Keep them in step.
		//
		// Season runs from the Thursday after the first Monday in September
		// (Labor Day) through the second Sunday in February (the Super Bowl).
		function nflInSeason(now = new Date()) {
			const nth = (year, month, weekday, n) => {
				const firstDow = new Date(Date.UTC(year, month, 1)).getUTCDay();
				return Date.UTC(year, month, 1 + ((weekday - firstDow + 7) % 7) + (n - 1) * 7);
			};
			const year = now.getUTCFullYear();
			const day = 24 * 60 * 60 * 1000;
			return now.getTime() >= nth(year, 8, 1, 1) + 3 * day || now.getTime() < nth(year, 1, 0, 2) + day;
		}

		const ADMIN_RANKINGS = [['', 'Automatic'], ['DYNASTY', 'Dynasty'], ['DRAFT', 'Draft'], ['ROS', 'Rest-of-season'], ['WEEKLY', 'Weekly'], ['ADP', 'ADP']];
		const ADMIN_SCORING = [['', 'Automatic'], ['PPR', 'PPR'], ['HALF', 'Half PPR'], ['STD', 'Standard']];

		// Unsaved edits, kept across re-renders (a lineup submission or a
		// finished sync both call renderGrid) so typing isn't lost. Cleared on
		// logout and after a successful save.
		let adminDraft = null;
		let adminConfigLoading = false;
		// Which league cards are open, keyed by object reference rather than by id
		// or position: a league can be added before it has an id, and reordering or
		// removing shuffles every index. adminDraft holds the same objects across
		// re-renders, so identity is the only stable key available.
		const adminExpanded = new Set();
		// Index of the card currently being dragged, or null. Module-level because
		// dragover/drop fire on the card being dragged *over*, which has no other
		// way to know what started the drag.
		let adminDragFrom = null;

		function adminText(value, placeholder, onChange) {
			const input = el('input', { type: 'text', class: 'admin-input', placeholder: placeholder || '' });
			input.value = value == null ? '' : String(value);
			input.addEventListener('input', () => onChange(input.value));
			return input;
		}

		// A value the config carries but this list doesn't know about gets shown
		// as an extra option rather than silently snapping to the first entry —
		// otherwise editing an unrelated league could quietly rewrite it.
		function adminSelect(options, value, onChange) {
			const current = value == null ? '' : String(value);
			const list = options.some(([v]) => v === current) ? options : [...options, [current, `${current} (unrecognized)`]];
			const sel = el('select', { class: 'admin-input admin-select' });
			for (const [val, label] of list) {
				const opt = el('option', { value: val, text: label });
				if (val === current) opt.selected = true;
				sel.appendChild(opt);
			}
			sel.addEventListener('change', () => onChange(sel.value));
			return sel;
		}

		// The label a dropdown would show for a stored value, so the collapsed
		// blurb can't drift from the expanded control: both read the same list.
		function adminLabelFor(options, value) {
			const current = value == null ? '' : String(value);
			return options.find(([v]) => v === current)?.[1] || current;
		}

		// Array order is display order on every other tab, so reordering here is a
		// real setting rather than cosmetic table sorting.
		function moveLeague(from, to) {
			if (!adminDraft || from === to || to < 0 || to >= adminDraft.length) return;
			const [moved] = adminDraft.splice(from, 1);
			adminDraft.splice(to, 0, moved);
			refreshAdminCard();
		}

		function clearDropMarks() {
			for (const node of document.querySelectorAll('.admin-league')) {
				node.classList.remove('admin-drop-before', 'admin-drop-after');
			}
		}

		// Which config fields differ from what the last sync actually used. Only the
		// ones the sync echoes back verbatim are comparable — scoring and rankingType
		// are overrides it consumes rather than records, so they aren't checked here.
		function configDrift(cfg, live) {
			const norm = (v) => (v == null || v === '' ? null : String(v));
			const out = [];
			if (norm(cfg.franchiseId) !== norm(live.franchiseId)) out.push('My team ID');
			if (norm(cfg.type) !== norm(live.type)) out.push('Type');
			if (norm(cfg.provider) !== norm(live.provider)) out.push('Site');
			if (JSON.stringify(cfg.tags || []) !== JSON.stringify(live.tags || [])) out.push('Tags');
			if (norm(cfg.rulesUrl) !== norm(live.rulesUrl)) out.push('Rules link');
			if (cfg.season && norm(cfg.season) !== norm(live.season)) out.push('Season');
			return out;
		}

		// True when the served config matches this row, field for field. Used to
		// confirm a save actually reached the page rather than assuming it did.
		function sameLeagueConfig(a, b) {
			const norm = (v) => (v == null || v === '' ? null : String(v));
			if (!a || !b) return false;
			for (const k of ['id', 'franchiseId', 'type', 'provider', 'rulesUrl', 'scoring', 'rankingType', 'season']) {
				if (norm(a[k]) !== norm(b[k])) return false;
			}
			if (JSON.stringify(a.tags || []) !== JSON.stringify(b.tags || [])) return false;
			return Boolean(a.lineupPilot) === Boolean(b.lineupPilot);
		}

		function refreshAdminCard() {
			const existing = document.querySelector('.card[data-view="admin"]');
			if (!existing) return;
			existing.replaceWith(renderAdminCard());
			updateVisibility();
		}

		async function loadLeagueConfig() {
			try {
				// Cache-bust for the same reason data/rosters.json does: Pages'
				// CDN will happily serve the pre-save copy otherwise.
				const res = await fetch(`${LEAGUES_CONFIG_URL}?t=${Date.now()}`, { cache: 'no-store' });
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				leagueConfig = await res.json();
				leagueConfigError = null;
			} catch (err) {
				leagueConfig = null;
				leagueConfigError = err.message;
			}
		}

		function renderAdminCard() {
			const card = el('div', { class: 'card admin-card', 'data-view': 'admin', 'data-league-type': '' });
			card.appendChild(el('h2', { text: 'Leagues' }));

			if (leagueConfigError) {
				card.appendChild(el('div', { class: 'error-box', text: `Couldn't load the league list: ${leagueConfigError}` }));
				const retry = el('button', { type: 'button', class: 'lineup-save-btn', text: 'Try again' });
				retry.addEventListener('click', async () => {
					retry.disabled = true;
					await loadLeagueConfig();
					refreshAdminCard();
				});
				card.appendChild(el('div', { class: 'lineup-editor-actions' }, [retry]));
				return card;
			}
			if (!leagueConfig) {
				// Fetches itself on first render rather than being loaded up
				// front, so this works identically whether the tab appeared
				// because the page loaded already-logged-in or because someone
				// just logged in. The flag keeps a re-render mid-fetch from
				// firing a second request.
				card.appendChild(el('div', { class: 'admin-note', text: 'Loading the league list…' }));
				if (!adminConfigLoading) {
					adminConfigLoading = true;
					loadLeagueConfig().then(() => {
						adminConfigLoading = false;
						refreshAdminCard();
					});
				}
				return card;
			}
			if (!adminDraft) adminDraft = JSON.parse(JSON.stringify(leagueConfig.leagues || []));

			// One card per league instead of one row of a thirteen-column table.
			// Collapsed, a card is a one-line blurb of what the league is;
			// expanded, its fields wrap into as many columns as there is room
			// for, so nothing ever scrolls sideways.
			const list = el('div', { class: 'admin-list' });

			adminDraft.forEach((league, i) => {
				const node = el('div', { class: 'admin-league' });
				const isOpen = adminExpanded.has(league);
				if (isOpen) node.classList.add('admin-open');

				const head = el('div', { class: 'admin-league-head' });
				// Only the head carries draggable, never the whole card: a
				// draggable container swallows text selection inside its own
				// inputs in WebKit, and the head is the one part with none.
				head.draggable = true;
				head.appendChild(el('span', { class: 'admin-grip', title: 'Drag to reorder', 'aria-hidden': 'true', text: '⠿' }));

				// Read-only, and showing the live name from the last sync rather
				// than the config's own `name`. That field is only a fallback
				// for when the provider can't be reached, so editing it changed
				// nothing visible on any other tab — it was a control that
				// looked like it did something and didn't. It stays as the card
				// title because without it this is a list of bare league IDs
				// with no way to tell which one you're about to remove.
				const live = (pageData?.leagues || []).find((l) => l.id === league.id);
				const name = live?.leagueName || league.name || '';

				const toggle = el('button', { type: 'button', class: 'admin-disclosure', 'aria-expanded': isOpen ? 'true' : 'false' });
				toggle.appendChild(el('span', { class: 'admin-caret', 'aria-hidden': 'true', text: isOpen ? '▾' : '▸' }));
				toggle.appendChild(name
					? el('span', { class: 'admin-league-name', text: name })
					: el('span', { class: 'admin-league-name admin-name-pending', text: 'Name appears after the next sync' }));
				toggle.addEventListener('click', () => {
					if (isOpen) adminExpanded.delete(league);
					else adminExpanded.add(league);
					refreshAdminCard();
				});
				head.appendChild(toggle);

				// Same chips as a Rosters card, built from the draft rather than
				// from synced data so an unsaved change to Site or Type shows up
				// here immediately.
				// Same chips and the same order as a Rosters card: the two gold
				// ones first, then the format. The season is the synced one, not
				// the config pin — what the league is actually on, which through
				// the spring can be a season behind the others. Shown always
				// rather than only when it differs: eighteen cards reading 2027
				// and one reading 2026 is more obvious than a chip that appears
				// only if you knew to expect it.
				const chips = [
					{ text: providerBadgeLabel(league), gold: true },
					...(live?.season ? [{ text: String(live.season), season: true, stale: seasonIsBehind(live.season) }] : []),
					{ text: LEAGUE_TYPE_LABELS[league.type] || league.type || '?' },
					...(league.tags || []).map((text) => ({ text })),
				];
				const badges = el('div', { class: 'admin-badges' });
				for (const chip of chips) {
					const cls = chip.season ? `badge badge-season${chip.stale ? ' badge-season-stale' : ''}` : chip.gold ? 'badge badge-provider' : 'badge';
					badges.appendChild(el('span', { class: cls, text: chip.text }));
				}
				head.appendChild(badges);

				// Touch devices don't fire HTML5 drag events at all, so these are
				// not a redundant second way to reorder — they are the only way
				// on a phone, and the only way from a keyboard.
				const moves = el('div', { class: 'admin-move' });
				const up = el('button', { type: 'button', class: 'admin-icon-btn', title: 'Move up', text: '↑' });
				const down = el('button', { type: 'button', class: 'admin-icon-btn', title: 'Move down', text: '↓' });
				up.disabled = i === 0;
				down.disabled = i === adminDraft.length - 1;
				up.addEventListener('click', () => moveLeague(i, i - 1));
				down.addEventListener('click', () => moveLeague(i, i + 1));
				moves.appendChild(up);
				moves.appendChild(down);
				head.appendChild(moves);
				node.appendChild(head);

				// Everything the collapsed card can say without being opened.
				// Reads off the same option lists the dropdowns below use, so
				// the two can't disagree about what a stored value is called.
				const bits = [league.id ? `ID ${league.id}` : 'No league ID yet'];
				if (league.franchiseId) bits.push(`Team ${league.franchiseId}`);
				// Scoring reads from the league's own settings unless pinned, so the
				// blurb shows what's actually in effect and where it came from —
				// "Automatic" alone would say nothing about which list is in use.
				if (league.scoring) {
					bits.push(adminLabelFor(ADMIN_SCORING, league.scoring));
				} else if (live?.scoringDetected) {
					bits.push(`${adminLabelFor(ADMIN_SCORING, live.scoringDetected)} (auto)`);
				} else {
					bits.push('Scoring: automatic');
				}
				bits.push(`${adminLabelFor(ADMIN_RANKINGS, league.rankingType)} rankings`);
				if (league.lineupPilot) bits.push('Lineup editor');
				if (league.rulesUrl) bits.push('Rules link');
				node.appendChild(el('div', { class: 'admin-blurb', text: bits.join(' · ') }));

				// The two things this tab used to hide. A league whose config no longer
				// matches the last sync looked identical to one that was working, and
				// the sync's own error for that league was sitting in data/rosters.json
				// unread — which is exactly the answer when a team ID is wrong.
				const notices = [];
				if (!live) {
					if (league.id) notices.push({ text: 'Not synced yet — this league appears on the other tabs after the next sync.' });
				} else {
					const drift = configDrift(league, live);
					if (drift.length) {
						notices.push({ text: `Saved but not synced yet — ${drift.join(', ')} ${drift.length === 1 ? 'differs' : 'differ'} from what the last sync used.` });
					}
					// The roster error decides whether the card renders at all, so it
					// leads. standings and lineup are worth surfacing too.
					//
					// scoringError is deliberately not: live scoring doesn't exist outside
					// game days, so "No live scoring available yet" is the normal state for
					// nearly every league for most of the year. Flagging it red on fourteen
					// of eighteen rows would teach you to ignore these notices, which costs
					// more than the one it would occasionally catch.
					if (live.error) notices.push({ error: true, text: `Last sync failed: ${live.error}` });
					else {
						const partial = [
							['standings', live.standingsError],
							['lineup', live.lineupError],
						].filter(([, e]) => e);
						if (partial.length) {
							notices.push({ error: true, text: `Last sync: ${partial.map(([what, e]) => `${what} — ${e}`).join('; ')}` });
						}
					}
				}
				for (const n of notices) {
					node.appendChild(el('div', { class: `admin-notice${n.error ? ' admin-notice-error' : ''}`, text: n.text }));
				}

				if (isOpen) {
					const fields = el('div', { class: 'admin-fields' });
					const field = (labelText, control, wide = false) => {
						const wrap = el('label', { class: `admin-field${wide ? ' admin-field-wide' : ''}` });
						wrap.appendChild(el('span', { class: 'admin-field-label', text: labelText }));
						wrap.appendChild(control);
						fields.appendChild(wrap);
					};
					// Re-render after a dropdown or checkbox changes so the chips
					// and the blurb above follow along. Only safe for controls
					// whose value is already committed when they fire — doing it
					// on a text input's every keystroke would throw away focus
					// mid-word.
					const changed = (apply) => (v) => { apply(v); refreshAdminCard(); };

					field('League ID', adminText(league.id, 'e.g. 26696', (v) => { league.id = v; }));
					field('My team ID', adminText(league.franchiseId, 'e.g. 0001', (v) => { league.franchiseId = v; }));
					field('Site', adminSelect(ADMIN_PROVIDERS, league.provider, changed((v) => { league.provider = v || undefined; })));
					field('Type', adminSelect(ADMIN_TYPES, league.type, changed((v) => { league.type = v; })));
					field('Rankings', adminSelect(ADMIN_RANKINGS, league.rankingType, changed((v) => { league.rankingType = v || undefined; })));
					// No normalisation: blank means "read it from the league", which
					// is not the same as pinning PPR. They used to be the same
					// value and folding them together would now hide the setting.
					field('Scoring', adminSelect(ADMIN_SCORING, league.scoring, changed((v) => { league.scoring = v || undefined; })));
					// Free text rather than a dropdown: the useful values are
					// "whatever this league has rolled over to" and, rarely, one
					// specific year — not a list anyone can enumerate ahead of
					// time. Blank is the normal state and means "follow it".
					field('Season', adminText(league.season, 'auto', (v) => { league.season = v || undefined; }));

					const lineupWrap = el('label', { class: 'admin-field admin-field-check' });
					const lineupBox = el('input', { type: 'checkbox' });
					lineupBox.checked = league.lineupPilot === true;
					lineupBox.addEventListener('change', () => {
						league.lineupPilot = lineupBox.checked ? true : undefined;
						refreshAdminCard();
					});
					lineupWrap.appendChild(lineupBox);
					lineupWrap.appendChild(el('span', { class: 'admin-field-label', text: 'Lineup editor' }));
					fields.appendChild(lineupWrap);

					// Generic placeholder rather than a realistic example: greyed-out
					// sample tags in the many untagged leagues read as real values at
					// a glance, which is exactly the wrong impression on an edit form.
					field('Tags', adminText((league.tags || []).join(', '), 'comma, separated', (v) => {
						const tags = v.split(',').map((t) => t.trim()).filter(Boolean);
						league.tags = tags.length ? tags : undefined;
					}), true);
					// Salary Cap only: this is who the contract-length summary is
					// mailed to, and no other league type produces one. Changing Type
					// re-renders the card, so it appears and disappears as you switch.
					if (league.type === 'salarycap') {
						field('Commissioner email', adminText(league.commishEmail, 'name@example.com', (v) => { league.commishEmail = v || undefined; }), true);
					}
					field('Rules link', adminText(league.rulesUrl, 'https://…', (v) => { league.rulesUrl = v || undefined; }), true);
					node.appendChild(fields);

					// Behind the disclosure rather than on the collapsed row: at
					// eighteen leagues a permanently visible ✕ next to every one
					// of them is a lot of surface for a destructive mis-tap.
					const removeBtn = el('button', { type: 'button', class: 'admin-icon-btn admin-remove-btn', text: '✕ Remove this league' });
					removeBtn.addEventListener('click', () => {
						const label = name || league.id || 'this league';
						if (!window.confirm(`Remove ${label} from the site?\n\nNothing is deleted at MFL, ESPN, or Sleeper — it just stops showing up here.`)) return;
						adminExpanded.delete(league);
						adminDraft.splice(i, 1);
						refreshAdminCard();
					});
					node.appendChild(el('div', { class: 'admin-league-actions' }, [removeBtn]));
				}

				// Where in the list a drop would land: top half of a card means
				// above it, bottom half below.
				const dropsAfter = (e) => {
					const box = node.getBoundingClientRect();
					return e.clientY > box.top + box.height / 2;
				};

				node.addEventListener('dragstart', (e) => {
					adminDragFrom = i;
					e.dataTransfer.effectAllowed = 'move';
					// Firefox refuses to start a drag at all unless data is set.
					e.dataTransfer.setData('text/plain', String(i));
					// The handle is the head; what's moving is the whole card.
					e.dataTransfer.setDragImage(node, 16, 16);
					// Deferred: the drag image is snapshotted after this handler
					// returns, so dimming synchronously would dim the ghost too.
					setTimeout(() => node.classList.add('admin-dragging'), 0);
				});
				node.addEventListener('dragend', () => {
					adminDragFrom = null;
					node.classList.remove('admin-dragging');
					clearDropMarks();
				});
				node.addEventListener('dragover', (e) => {
					if (adminDragFrom === null || adminDragFrom === i) return;
					e.preventDefault();
					e.dataTransfer.dropEffect = 'move';
					clearDropMarks();
					node.classList.add(dropsAfter(e) ? 'admin-drop-after' : 'admin-drop-before');
				});
				node.addEventListener('dragleave', () => {
					node.classList.remove('admin-drop-before', 'admin-drop-after');
				});
				node.addEventListener('drop', (e) => {
					if (adminDragFrom === null) return;
					e.preventDefault();
					const from = adminDragFrom;
					adminDragFrom = null;
					clearDropMarks();
					// Insertion point in the pre-removal array, then corrected for
					// the hole the dragged card leaves behind when it's above the
					// target. Without that correction a downward drag lands one
					// short every time.
					let insertAt = i + (dropsAfter(e) ? 1 : 0);
					if (from < insertAt) insertAt--;
					moveLeague(from, insertAt);
				});

				list.appendChild(node);
			});

			card.appendChild(list);

			const addBtn = el('button', { type: 'button', class: 'admin-add-btn', text: '+ Add a league' });
			addBtn.addEventListener('click', () => {
				// No name: it isn't editable here any more, and the sync fills in
				// the real one from the provider on its next run.
				const fresh = { id: '', franchiseId: '', type: 'draftonly' };
				adminDraft.push(fresh);
				// Opened straight away: collapsed it would be a blank card with
				// nothing to say and no obvious next step.
				adminExpanded.add(fresh);
				refreshAdminCard();
				const nodes = document.querySelectorAll('.admin-league');
				const last = nodes[nodes.length - 1];
				if (last) {
					last.scrollIntoView({ block: 'nearest' });
					last.querySelector('input')?.focus();
				}
			});
			card.appendChild(el('div', { class: 'admin-add-row' }, [addBtn]));

			const actions = el('div', { class: 'lineup-editor-actions' });
			const saveBtn = el('button', { type: 'button', class: 'lineup-save-btn', text: 'Save changes' });
			const revertBtn = el('button', { type: 'button', class: 'admin-revert-btn', text: 'Discard edits' });
			// Re-read the served config without a full page reload, so "is the page
			// showing me stale values?" is answerable in one click.
			const reloadBtn = el('button', { type: 'button', class: 'admin-revert-btn', text: 'Reload from site' });
			const statusEl = el('span', { class: 'lineup-editor-status' });
			actions.appendChild(saveBtn);
			actions.appendChild(revertBtn);
			actions.appendChild(reloadBtn);
			actions.appendChild(statusEl);

			reloadBtn.addEventListener('click', async () => {
				if (adminDraft && !window.confirm('Reload the league list from the site?\n\nAny unsaved edits here are discarded.')) return;
				reloadBtn.disabled = true;
				statusEl.textContent = 'Reloading…';
				await loadLeagueConfig();
				adminDraft = null;
				adminExpanded.clear();
				refreshAdminCard();
			});
			card.appendChild(actions);

			const problemsEl = el('ul', { class: 'admin-problems hidden' });
			card.appendChild(problemsEl);

			// Last thing in the card, after the Save row and the validation errors
			// that answer it. Only the non-obvious columns get a line — anything you
			// work out by using the control once isn't worth a sentence here.
			const legend = el('div', { class: 'admin-legend' });
			legend.appendChild(el('h3', { text: 'Please Note' }));
			const legendList = el('ul');
			for (const line of [
				'Save goes live at once. New or changed leagues appear on the other tabs after the next sync.',
				'Type Salary Cap is what adds the Salary and Yrs columns and the cap summary to a league\'s card.',
				'Scoring on Automatic is read from the league\'s own settings — whatever a reception is worth there. It only picks which FantasyPros list the ECR column uses; it changes no points, standings or lineups.',
				'Lineups puts a lineup editor on the Rosters tab — MFL submits from here, Sleeper is view-only.',
				'Season follows each league\'s own rollover — leave it blank and the sync stays on the old season until the new one exists, which is why a league can show a season chip in the spring. Fill it in only to pin one.',
				// The one setting on this screen that changes without being touched,
				// so it says what it resolves to today as well as what it does.
				`Rankings on Automatic tracks the NFL calendar: rest-of-season in season, dynasty or draft otherwise (right now: ${nflInSeason() ? 'rest-of-season' : 'dynasty or draft'}). Any other choice pins that league year-round.`,
			]) {
				legendList.appendChild(el('li', { text: line }));
			}
			legend.appendChild(legendList);
			card.appendChild(legend);

			revertBtn.addEventListener('click', () => {
				if (!window.confirm('Throw away every change you\'ve made since the last save?')) return;
				adminDraft = null;
				adminExpanded.clear();
				refreshAdminCard();
			});

			saveBtn.addEventListener('click', async () => {
				saveBtn.disabled = true;
				revertBtn.disabled = true;
				statusEl.textContent = 'Saving…';
				problemsEl.innerHTML = '';
				problemsEl.classList.add('hidden');
				try {
					const res = await fetch(SAVE_LEAGUES_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
						body: JSON.stringify({ leagues: adminDraft }),
					});
					const body = await res.json().catch(() => ({}));
					if (res.status === 401) {
						doLogout();
						return;
					}
					if (!res.ok) {
						// The server sends back one line per problem; showing them
						// as a list beats collapsing them into a single sentence.
						if (Array.isArray(body.details) && body.details.length) {
							problemsEl.classList.remove('hidden');
							for (const detail of body.details) problemsEl.appendChild(el('li', { text: detail }));
						}
						throw new Error(body.error || `HTTP ${res.status}`);
					}
					leagueConfig.leagues = JSON.parse(JSON.stringify(adminDraft));
					adminDraft = null;
					adminExpanded.clear();
					// Saving commits to the repository, but this page reads
					// config/leagues.json through GitHub Pages, which keeps serving the
					// previous copy until it redeploys. Reloading inside that window
					// shows the pre-save values and is indistinguishable from the save
					// having silently reverted — so confirm rather than assume.
					const savedLeagues = leagueConfig.leagues;
					statusEl.textContent = `Saved ${body.count} leagues. Confirming…`;
					setTimeout(async () => {
						try {
							const check = await fetch(`${LEAGUES_CONFIG_URL}?t=${Date.now()}`, { cache: 'no-store' });
							const served = (await check.json()).leagues || [];
							const live = served.length === savedLeagues.length
								&& savedLeagues.every((l, i) => sameLeagueConfig(l, served[i]));
							statusEl.textContent = live
								? `Saved ${body.count} leagues — confirmed live.`
								: `Saved ${body.count} leagues. The site is still serving the previous copy; it usually catches up within a minute. Your change is committed either way.`;
						} catch {
							statusEl.textContent = `Saved ${body.count} leagues.`;
						}
					}, 5000);
					const syncNow = el('button', { type: 'button', class: 'admin-revert-btn', text: 'Sync now' });
					syncNow.addEventListener('click', () => {
						statusEl.textContent = 'Syncing — watch the header for progress.';
						syncNow.disabled = true;
						triggerManualSync();
					});
					actions.appendChild(syncNow);
					revertBtn.remove();
				} catch (err) {
					statusEl.textContent = err.message;
					saveBtn.disabled = false;
					revertBtn.disabled = false;
				}
			});

			return card;
		}

		// Safe to call more than once (e.g. after a manual sync completes) —
		// clears the grid before repopulating instead of appending duplicates.
		// Pure render from the already-loaded pageData — no network call.
		// Reused by init() (after a fresh load) and by login/logout/lineup-save
		// (which only need to re-render, not re-fetch).
		function renderGrid() {
			const statusEl = document.getElementById('status');
			const gridEl = document.getElementById('grid');
			const data = pageData;
			if (!data) return;

			renderAuthControl();
			renderProblemsDigest();
			statusEl.textContent = '';
			gridEl.innerHTML = '';

			if (!data.leagues || data.leagues.length === 0) {
				statusEl.textContent = 'No leagues configured yet.';
				// An empty config is precisely when the Admin tab is needed, so
				// it still renders here — otherwise the one screen that could
				// fix this state would be the one screen unreachable from it.
				if (isLoggedIn()) {
					gridEl.appendChild(renderAdminCard());
					renderViewTabs(new Set(['admin']));
					updateVisibility();
				}
				return;
			}

			for (const league of data.leagues) {
				gridEl.appendChild(renderCard(league));
				if (league.standings !== undefined || league.standingsError) {
					gridEl.appendChild(renderStandingsCard(league));
				}
				if (league.scoring !== undefined || league.scoringError) {
					gridEl.appendChild(renderScoringCard(league));
				}
			}

			// Logged-out visitors never get any analytics card, so 'analytics'
			// never makes it into presentViews below and the tab simply isn't
			// offered — the same mechanism that hides the Admin tab. These
			// cards are a portfolio view across every league at once (who you're
			// exposed to, who's hurt, who's free, how your teams rank), which
			// reads as strategy the same way a planned contract length or salary
			// does; unlike those two, there was no per-field gate to fall back
			// on, so the whole set is gated at once.
			if (isLoggedIn()) {
				for (const groupKey of SUBTAB_ORDER) {
					const types = typesInSubtabGroup(groupKey);
					if (!data.leagues.some((l) => types.includes(l.type))) continue;
					gridEl.appendChild(renderAnalyticsCard(groupKey, types, data.leagues));
					gridEl.appendChild(renderInjuryExposureCard(groupKey, types, data.leagues));
					const availableCard = renderTopAvailableCard(groupKey, types, data.leagues, data.rankingPools, data.year);
					if (availableCard) gridEl.appendChild(availableCard);
					const powerCard = renderPowerRankCard(groupKey, types, data.leagues, data.year);
					if (powerCard) gridEl.appendChild(powerCard);
				}
			}

			// Logged-out visitors never get this card, so 'admin' never makes it
			// into presentViews below and the tab simply isn't offered.
			if (isLoggedIn()) gridEl.appendChild(renderAdminCard());

			const presentViews = new Set([...gridEl.querySelectorAll('.card')].map((c) => c.dataset.view).filter(Boolean));
			renderViewTabs(presentViews);
			updateVisibility();
			if (currentView === 'scoring') {
				startLiveScoringPolling();
			}
		}

		async function init() {
			const statusEl = document.getElementById('status');
			const updatedEl = document.getElementById('updated');

			try {
				// Cache-bust so GitHub Pages' CDN can't serve a stale snapshot after a sync.
				const res = await fetch(`data/rosters.json?t=${Date.now()}`, { cache: 'no-store' });
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				const data = await res.json();
				pageData = data;

				updatedEl.textContent = data.generatedAt
					? `Last synced ${timeAgo(data.generatedAt)}`
					: 'Not yet synced — run the "Sync MFL Rosters" GitHub Action.';

				renderGrid();
				// After the render, not before it: the roster is already on
				// screen from the local copy, and this only pulls in plans made
				// on another device. Not awaited — a slow or unreachable store
				// must not hold up the page.
				syncPlans();
			} catch (err) {
				statusEl.textContent = `Couldn't load roster data: ${err.message}`;
				updatedEl.textContent = '';
			}
		}

		// Kicks off a real GitHub Actions sync run instead of waiting up to 4
		// hours for the next scheduled one, then polls the committed JSON for
		// a fresh generatedAt so the page updates itself once it lands (the
		// run + a GitHub Pages rebuild typically take under a minute).
		async function triggerManualSync() {
			const updatedEl = document.getElementById('updated');
			const syncBtn = document.getElementById('sync-btn');
			const previousGeneratedAt = pageData?.generatedAt;

			syncBtn.disabled = true;
			syncBtn.classList.add('spinning');
			updatedEl.textContent = 'Requesting sync…';

			try {
				const res = await fetch(TRIGGER_SYNC_URL, { method: 'POST' });
				const body = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);

				updatedEl.textContent = 'Sync started — checking for fresh data…';
				if (syncPollTimer) clearInterval(syncPollTimer);
				let attempts = 0;
				// The GitHub Action itself typically finishes in under a minute, but
				// GitHub Pages then needs its own ~30-90s to rebuild before the new
				// data/rosters.json is actually live — end-to-end this regularly
				// runs close to 2 minutes. 24 attempts * 10s = 4 min gives that
				// comfortable headroom instead of giving up while Pages is still
				// mid-deploy.
				const maxAttempts = 24;
				syncPollTimer = setInterval(async () => {
					attempts++;
					try {
						const checkRes = await fetch(`data/rosters.json?t=${Date.now()}`, { cache: 'no-store' });
						if (checkRes.ok) {
							const fresh = await checkRes.json();
							if (fresh.generatedAt && fresh.generatedAt !== previousGeneratedAt) {
								clearInterval(syncPollTimer);
								syncPollTimer = null;
								await init();
								syncBtn.disabled = false;
								syncBtn.classList.remove('spinning');
								return;
							}
						}
					} catch {
						// Transient fetch hiccup — just keep polling until maxAttempts.
					}
					if (attempts >= maxAttempts) {
						clearInterval(syncPollTimer);
						syncPollTimer = null;
						syncBtn.disabled = false;
						syncBtn.classList.remove('spinning');
						// Deliberately not "Last synced X ago — still syncing": that
						// combination goes stale and misleading the moment the sync
						// actually finishes a minute after this message appears.
						updatedEl.textContent = "Taking longer than usual — reload the page in a bit to check";
					}
				}, 10000);
			} catch (err) {
				syncBtn.disabled = false;
				syncBtn.classList.remove('spinning');
				updatedEl.textContent = `Couldn't start sync: ${err.message}`;
				setTimeout(() => {
					if (pageData?.generatedAt) updatedEl.textContent = `Last synced ${timeAgo(pageData.generatedAt)}`;
				}, 4000);
			}
		}
		document.getElementById('sync-btn').addEventListener('click', triggerManualSync);

		const searchInput = document.getElementById('search');
		const searchClearBtn = document.getElementById('search-clear');
		function updateSearchClearVisibility() {
			searchClearBtn.classList.toggle('hidden', searchInput.value.length === 0);
		}
		searchInput.addEventListener('input', () => {
			updateVisibility();
			updateSearchClearVisibility();
		});
		searchClearBtn.addEventListener('click', () => {
			searchInput.value = '';
			searchInput.focus();
			updateVisibility();
			updateSearchClearVisibility();
		});
		init();
	</script>
</body>
</html>
