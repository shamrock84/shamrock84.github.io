<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vikings Season Tickets</title>
	<meta property="og:title" content="Vikings Season Tickets"/>
	<meta property="og:image" content="http://www.melbostads.com/images/vikingsseasonticketsimage.jpg"/>
	<link rel="apple-touch-icon" sizes="144x144" href="/fflicons/apple-touch-icon.png?v=2">
	<link rel="icon" type="image/png" sizes="32x32" href="/fflicons/favicon-32x32.png?v=2">
	<link rel="icon" type="image/png" sizes="16x16" href="/fflicons/favicon-16x16.png?v=2">
	<link rel="shortcut icon" href="/fflicons/favicon.ico?v=2">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F2683">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#140f1e">
	<style>
		/* Same palette and conventions as myffl.html (purple = primary accent,
		   gold = "notable, not urgent"); only the tokens this page uses are
		   copied. Keep them in step if myffl.html's palette changes. */
		:root {
			--bg: #f5f3f9;
			--card-bg: #ffffff;
			--text: #1b1425;
			--muted: #6b6478;
			--border: #e3daf0;
			--accent: #4F2683;
			--chip-bg: #ede3f8;
			--ir-text: #991b1b;
			--gain-text: #166534;
			--gold: #FFC62F;
			--gold-chip-bg: #fff3d1;
			--gold-chip-text: #7a5c00;
			--seat-fill: #ede3f8;
			--seat-stroke: #cdbbe6;
			--seat-on-fill: #4F2683;
			--seat-on-stroke: #34195a;
			--seat-on-ink: #ffffff;
			--ir-bg: #fef2f2;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #140f1e;
				--card-bg: #1e1730;
				--text: #ede9f5;
				--muted: #a79bc2;
				--border: #362a4a;
				--accent: #b48ee0;
				--chip-bg: #2c2145;
				--ir-text: #fca5a5;
				--gain-text: #86efac;
				--gold-chip-bg: #3d2e05;
				--gold-chip-text: #f0c33e;
				--seat-fill: #2c2145;
				--seat-stroke: #4a3a66;
				--seat-on-fill: #7a54b5;
				--seat-on-stroke: #b48ee0;
				--ir-bg: #341313;
			}
		}
		body::before {
			content: '';
			display: block;
			height: 4px;
			background: linear-gradient(90deg, var(--accent), var(--gold));
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}
		.hidden { display: none !important; }
		main {
			max-width: 72rem;
			margin: 0 auto;
			padding: 1rem;
		}
		header {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 0.6rem 1rem;
			flex-wrap: wrap;
			margin-bottom: 0.8rem;
		}
		h1 {
			margin: 0;
			font-size: 1.35rem;
			color: var(--accent);
		}
		.subtitle {
			font-size: 0.8rem;
			color: var(--muted);
		}
		.card {
			background: var(--card-bg);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 0.8rem;
		}
		/* Seats sit under each game, indented, so nothing needs a sideways
		   scroll: the table is only the five game columns. */
		.all-bar {
			display: flex;
			justify-content: flex-end;
			margin-bottom: 0.3rem;
		}
		.all-toggle {
			background: none;
			border: none;
			color: var(--accent);
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
			padding: 0;
		}
		.all-toggle:hover { text-decoration: underline; }
		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		th, td {
			padding: 0.4rem 0.5rem;
			text-align: left;
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}
		thead th {
			font-size: 0.75rem;
			text-transform: uppercase;
			letter-spacing: 0.03em;
			color: var(--muted);
			vertical-align: bottom;
			/* The column names stay on screen while the table scrolls under them
			   (handy when typing into the playoff rows). An opaque background, and
			   a shadow instead of a border, which border-collapse would drop. */
			position: sticky;
			top: 0;
			z-index: 2;
			background: var(--card-bg);
			box-shadow: inset 0 -1px 0 var(--border);
		}
		.datecell { display: flex; align-items: center; gap: 0.2rem; }
		.chev {
			flex: none;
			width: 1.6rem;
			height: 1.6rem;
			margin-left: -0.3rem;
			padding: 0;
			border: none;
			border-radius: 6px;
			background: none;
			color: var(--accent);
			font-size: 0.8rem;
			cursor: pointer;
		}
		.chev::before { content: '\25B8'; display: inline-block; transition: transform 0.12s; }
		tr.open .chev::before { transform: rotate(90deg); }
		.chev:focus-visible { outline: 2px solid var(--accent); }
		tr.game.open td { border-bottom: none; }
		tr.seat-row td { border-bottom: none; padding-top: 0.15rem; padding-bottom: 0.15rem; white-space: normal; }
		tr.seat-row.last td { border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
		.seat-line {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 0.3rem 0.8rem;
			margin-left: 1.3rem;
			padding-left: 0.7rem;
			border-left: 2px solid var(--border);
		}
		.owner {
			flex: 0 0 9rem;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--accent);
		}
		.owner small { display: block; font-weight: 500; color: var(--muted); font-size: 0.72rem; }
		/* A seat is an armchair icon: the person's name sits over the backrest
		   (text, or an input when logged in) and the seat number underneath. A
		   filled seat is solid purple; an empty one is a pale outline. */
		.seats { display: flex; flex: 0 0 auto; gap: 0.5rem; flex-wrap: nowrap; min-width: 0; }
		.seat { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; gap: 0.1rem; }
		.seat-art { position: relative; width: 5.6rem; aspect-ratio: 80 / 64; }
		.seat-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
		.seat-svg .part { fill: var(--seat-fill); stroke: var(--seat-stroke); stroke-width: 1.5; transition: fill 0.15s; }
		.seat.taken .seat-svg .part { fill: var(--seat-on-fill); stroke: var(--seat-on-stroke); }
		/* The name box is the backrest: 65% wide, from 7% down, half the height. */
		.seat-name,
		.seat input {
			position: absolute; left: 17.5%; width: 65%; top: 7%; height: 50%;
			display: flex; align-items: center; justify-content: center;
			text-align: center; line-height: 1.1; overflow: hidden; overflow-wrap: anywhere;
			font-size: 0.75rem; font-weight: 600; color: var(--seat-on-ink);
		}
		.seat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
		tbody tr:last-child td { border-bottom: none; }
		td.opp { font-weight: 600; }
		/* Section band (Preseason / Regular Season / Playoffs), like the sheet's;
		   a button inside it folds the section. */
		.sec-btn {
			display: inline-flex; align-items: center; gap: 0.4rem; justify-content: center; width: 100%;
			font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
		}
		.sec-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.sec-chev::before { content: '\25B8'; display: inline-block; transition: transform 0.12s; transform: rotate(90deg); }
		tr.section.folded .sec-chev::before { transform: none; }
		tr.sec-folded { display: none; }
		tr.section td {
			text-align: center;
			font-weight: 700;
			font-size: 0.8rem;
			color: var(--accent);
			background: var(--chip-bg);
		}
		td.face { font-variant-numeric: tabular-nums; }
		tr.past td { color: var(--muted); }
		/* Result: a green WIN / red LOSS tag and a faint wash across the row. */
		.result { margin-left: 0.4rem; padding: 0.05rem 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; }
		.result.W { background: #d7f0dc; color: #14632b; }
		.result.L { background: #f8d9d9; color: #9b1c1c; }
		.result.T { background: var(--chip-bg); color: var(--muted); }
		tr.res-W td { background: rgba(34, 139, 34, 0.07); }
		tr.res-L td { background: rgba(200, 40, 40, 0.07); }
		@media (prefers-color-scheme: dark) {
			.result.W { background: #174023; color: #8fe0a4; }
			.result.L { background: #5a1f1f; color: #f5a3a3; }
		}
		.show-all { font-size: 0.85rem; margin-right: auto; cursor: pointer; }
		tr.past td.opp { font-weight: 500; }
		/* The next game is the one worth finding at a glance: "notable, not urgent". */
		tr.next td { background: var(--gold-chip-bg); }
		tr.next td.opp { color: var(--gold-chip-text); }
		.chip {
			display: inline-block;
			margin-left: 0.4rem;
			padding: 0.05rem 0.4rem;
			border-radius: 999px;
			background: var(--gold-chip-bg);
			border: 1px solid var(--gold-chip-text);
			color: var(--gold-chip-text);
			font-size: 0.68rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.03em;
			vertical-align: middle;
		}
		.tbd { color: var(--muted); }
		.empty { color: var(--muted); }
		/* 16px, not smaller — iOS Safari zooms the page in on focus of any
		   text input under 16px (same fix as .lineup-login-form input). */
		td input {
			width: 100%;
			min-width: 5rem;
			padding: 0.3rem 0.4rem;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--text);
			font: inherit;
			font-size: 16px;
		}
		td input.info { min-width: 3.2rem; }
		td.opp input { min-width: 8rem; }
		td.face input { min-width: 4rem; width: 4.5rem; }
		/* The seat input sits on the backrest: transparent, no box. Touch screens
		   get 16px (below) so iOS Safari doesn't zoom on focus; a mouse gets the
		   smaller size, which fits longer names. A long name scrolls inside it. */
		.seat input {
			min-width: 0; padding: 0 0.1rem; border: none; border-radius: 8px; background: transparent;
			font-family: inherit; font-size: 0.75rem; text-overflow: ellipsis; box-shadow: none;
			color: var(--text);
		}
		@media (pointer: coarse) { .seat input { font-size: 16px; } }
		.seat.taken input { color: var(--seat-on-ink); }
		.seat input.failed { box-shadow: inset 0 0 0 2px var(--ir-text); }
		.seat input:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; background: rgba(255, 255, 255, 0.12); }
		td input:focus-visible,
		.login-form input:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 1px;
		}
		input.saving { opacity: 0.6; }
		input.failed { border-color: var(--ir-text); }
		.status {
			min-height: 1.2em;
			margin-top: 0.6rem;
			font-size: 0.8rem;
			color: var(--muted);
		}
		.status.error { color: var(--ir-text); }
		.status.ok { color: var(--gain-text); }
		.message { padding: 1rem 0.2rem; color: var(--muted); }
		.message.error { color: var(--ir-text); }
		/* Login control: same look as myffl.html's .lineup-login. */
		.login { font-size: 0.8rem; }
		.login-toggle {
			background: none;
			border: none;
			color: var(--accent);
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
			padding: 0;
		}
		.login-toggle:hover { text-decoration: underline; }
		.login-form {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			flex-wrap: wrap;
		}
		.login-form input[type="password"] {
			flex: 1;
			min-width: 8rem;
			padding: 0.4rem 0.6rem;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--text);
			font-size: 16px;
		}
		.login-form button[type="submit"] {
			border: 1px solid var(--accent);
			background: var(--accent);
			color: #fff;
			padding: 0.4rem 0.8rem;
			border-radius: 6px;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
		}
		.login-form button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
		.login-status { font-size: 0.78rem; color: var(--ir-text); }
		/* Tabs and cards. Pill tabs, same look as myffl.html's .tab-btn. */
		.tabs { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
		.tab-btn {
			border: 1px solid var(--border);
			background: var(--card-bg);
			color: var(--muted);
			padding: 0.45rem 1rem;
			border-radius: 999px;
			font: inherit;
			font-size: 0.88rem;
			font-weight: 600;
			cursor: pointer;
		}
		.tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
		.tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		#view > .card + .card { margin-top: 0.8rem; }
		.card-heading { margin: 0 0 0.5rem; font-size: 1.05rem; color: var(--accent); }
		/* A collapsible card, as on myffl.html: the whole heading toggles, the
		   chevron turns, and everything but the heading goes away. */
		.card-heading.collapsible { position: relative; padding-right: 2.3rem; cursor: pointer; }
		.card-collapse-toggle {
			position: absolute; top: 50%; right: 0; transform: translateY(-50%);
			background: none; border: none; padding: 0.15rem 0.3rem; margin: 0;
			color: var(--muted); cursor: pointer; font-size: 1.5rem; line-height: 1; transition: transform 0.15s ease;
		}
		.card-collapse-toggle:hover { color: var(--text); }
		.card.card-collapsed .card-collapse-toggle { transform: translateY(-50%) rotate(-90deg); }
		.card.card-collapsed > *:not(.card-heading) { display: none; }
		.card.card-collapsed > .card-heading { margin-bottom: 0; }
		.season-head { margin-bottom: 0.6rem; }
		.season-title { display: flex; align-items: baseline; gap: 0.7rem; margin: 0 0 0.6rem; font-size: 1.1rem; font-weight: 700; color: var(--accent); }
		.season-card > summary, .season-mini > summary {
			display: flex; align-items: baseline; gap: 0.7rem; cursor: pointer; list-style: none;
			font-weight: 700; color: var(--accent);
		}
		.season-card > summary::-webkit-details-marker, .season-mini > summary::-webkit-details-marker { display: none; }
		.season-card > summary::before, .season-mini > summary::before { content: '\25B8'; display: inline-block; transition: transform 0.12s; }
		.season-card[open] > summary::before, .season-mini[open] > summary::before { transform: rotate(90deg); }
		.season-card > summary { font-size: 1.1rem; }
		.season-card > summary { flex-wrap: wrap; }
		.season-sub { flex: none; width: calc(100% - 1.5rem); margin-left: 1.5rem; white-space: normal; font-size: 0.8rem; font-weight: 400; color: var(--muted); }
		.season-record { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
		.season-card > .season-body { margin-top: 0.6rem; }
		.season-mini { border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; margin-top: 0.5rem; }
		.season-mini > .season-body { margin-top: 0.5rem; }
		.season-card + .season-card { margin-top: 0.8rem; }
		/* The status line stays in view while a long table is edited. */
		.status-bar { position: sticky; bottom: 0; background: var(--bg); padding: 0.2rem 0; }

		/* Header quick-link toolbar: the same look as myffl.html's. Empty means
		   no bar at all (:empty also drops the padding and border). */
		#quicklinks {
			position: sticky; top: 0; z-index: 30;
			display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.4rem;
			background: var(--card-bg);
		}
		#quicklinks:not(:empty) { padding: 0.4rem 1rem; border-bottom: 1px solid var(--border); }
		#quicklinks a { color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600; padding: 0.15rem 0; white-space: nowrap; }
		#quicklinks a:hover, #quicklinks a:focus-visible { color: var(--accent); }
		#quicklinks a::after { content: ''; display: inline-block; width: 1px; height: 0.7rem; background: var(--border); margin-left: 0.4rem; vertical-align: middle; }
		#quicklinks a:last-child::after { display: none; }
		#quicklinks a.quicklink-gold, #quicklinks a.quicklink-purple { padding: 0; }
		#quicklinks a.quicklink-gold .quicklink-pill { background: var(--gold-chip-bg); color: var(--gold-chip-text); }
		#quicklinks a.quicklink-purple .quicklink-pill { background: var(--chip-bg); color: var(--accent); }
		#quicklinks a.quicklink-gold .quicklink-pill, #quicklinks a.quicklink-purple .quicklink-pill { display: inline-block; border-radius: 999px; padding: 0.15rem 0.55rem; }
		#quicklinks a.quicklink-gold:hover .quicklink-pill, #quicklinks a.quicklink-gold:focus-visible .quicklink-pill,
		#quicklinks a.quicklink-purple:hover .quicklink-pill, #quicklinks a.quicklink-purple:focus-visible .quicklink-pill { color: var(--text); }
		/* A group: one button whose menu holds its links. */
		#quicklinks .quicklink-combo { position: relative; display: inline-flex; align-items: center; }
		#quicklinks .quicklink-combo:not(:last-child)::after { content: ''; display: inline-block; width: 1px; height: 0.7rem; background: var(--border); margin-left: 0.4rem; }
		#quicklinks .quicklink-combo-btn { font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 0.15rem 0.55rem; cursor: pointer; }
		#quicklinks .quicklink-combo-btn.quicklink-combo-gold { color: var(--gold-chip-text); background: var(--gold-chip-bg); }
		#quicklinks .quicklink-combo-btn.quicklink-combo-purple { color: var(--accent); background: var(--chip-bg); }
		#quicklinks .quicklink-combo-btn:hover, #quicklinks .quicklink-combo-btn:focus-visible, #quicklinks .quicklink-combo.open .quicklink-combo-btn { color: var(--text); }
		#quicklinks .quicklink-combo-menu { display: none; position: absolute; top: calc(100% + 0.35rem); left: 0; z-index: 31; flex-direction: column; align-items: flex-start; gap: 0.35rem; }
		#quicklinks .quicklink-combo.align-right .quicklink-combo-menu { left: auto; right: 0; }
		#quicklinks .quicklink-combo.open .quicklink-combo-menu { display: flex; }
		#quicklinks .quicklink-combo-menu a { background: var(--card-bg); border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.55rem; }
		#quicklinks .quicklink-combo-menu a::after { display: none; }
		/* Admin > Quick Links rows. */
		.ql-list { display: flex; flex-direction: column; gap: 0.6rem; }
		.ql-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.4rem 0.5rem; }
		.ql-field { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
		.ql-field span { font-size: 0.7rem; color: var(--muted); }
		.ql-link { flex: 2 1 14rem; }
		.ql-nick, .ql-group { flex: 1 1 7rem; }
		.ql-style { flex: 0 0 auto; }
		.ql-row .task-input { width: 100%; }
		.ql-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.8rem; }
		.ql-errors { color: var(--ir-text); font-size: 0.85rem; margin: 0.5rem 0 0; padding-left: 1.1rem; }
		.ql-note { color: var(--muted); font-size: 0.8rem; margin: 0.6rem 0 0; }
		/* Tasks card: the same look as myffl.html's, under its own names. */
		.task-add-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.6rem 0 0.8rem; }
		.task-add-row .task-input:first-child { flex: 2 1 12rem; }
		.task-add-row .suggest-wrap { flex: 1 1 8rem; }
		.task-input {
			font: inherit;
			font-size: 16px;
			padding: 0.35rem 0.55rem;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: var(--card-bg);
			color: inherit;
		}
		.task-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.suggest-wrap { position: relative; min-width: 0; }
		.suggest-wrap .task-input { width: 100%; }
		.suggest-list {
			position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin-top: 2px;
			max-height: 9rem; overflow-y: auto;
			background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
		}
		.suggest-item { padding: 0.3rem 0.55rem; font-size: 0.85rem; cursor: pointer; }
		.suggest-item:hover { background: var(--chip-bg); }
		.task-add-btn {
			font: inherit; font-size: 0.85rem; color: var(--accent); background: transparent;
			border: 1px solid var(--accent); border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer;
		}
		.task-icon-btn {
			font: inherit; font-size: 0.8rem; line-height: 1; color: var(--ir-text); background: var(--ir-bg);
			border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.35rem; cursor: pointer; flex-shrink: 0;
		}
		.task-save-btn { color: var(--accent); background: var(--chip-bg); }
		.task-empty { color: var(--muted); font-size: 0.85rem; margin: 0.4rem 0; }
		.task-counter { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
		.task-counter.limit { color: var(--ir-text); }
		.task-sync-status { color: var(--ir-text); background: var(--ir-bg); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.85rem; margin: 0.4rem 0 0; }
		.task-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
		.task-row.editing { flex-wrap: wrap; }
		.task-row.editing .task-input:first-of-type { flex: 2 1 12rem; }
		.task-text { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
		.task-done .task-text { color: var(--muted); text-decoration: line-through; }
		.task-grip { color: var(--muted); cursor: grab; line-height: 1; flex-shrink: 0; }
		.task-row:active .task-grip { cursor: grabbing; }
		@media (hover: none) { .task-grip { display: none; } }
		.task-move { display: flex; gap: 0.2rem; flex-shrink: 0; }
		.task-move-btn {
			font: inherit; font-size: 0.8rem; line-height: 1; color: var(--accent); background: var(--chip-bg);
			border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.35rem; cursor: pointer; flex-shrink: 0;
		}
		.task-move-btn:disabled { opacity: 0.35; cursor: default; }
		.task-row.dragging { opacity: 0.4; }
		.task-row.drop-before { box-shadow: inset 0 3px 0 0 var(--accent); }
		.task-row.drop-after { box-shadow: inset 0 -3px 0 0 var(--accent); }
		.task-section { margin-top: 0.7rem; }
		.task-section summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
		/* Wide screens: a narrower column with bigger type and looser rows, so
		   five short columns don't stretch across the whole window. */
		@media (min-width: 48.01rem) {
			main { max-width: 54rem; padding: 1.5rem 1rem; }
			h1 { font-size: 1.7rem; }
			.subtitle { font-size: 0.95rem; }
			.card { padding: 1.2rem 1.4rem; }
			table { font-size: 1.05rem; }
			th, td { padding: 0.7rem 0.8rem; }
			thead th { font-size: 0.8rem; }
			tr.section td { font-size: 0.9rem; padding: 0.45rem 0.8rem; }
			.chip { font-size: 0.72rem; }
			tr.seat-row td { padding-top: 0.35rem; padding-bottom: 0.35rem; }
			tr.seat-row.last td { padding-bottom: 1.1rem; }
			.seat-line { gap: 0.4rem 1rem; margin-left: 1.6rem; padding-left: 1rem; }
			/* One line per ticket holder: name and section on the left, then the two
			   seats spread across the rest of the row (roughly under the Opponent and
			   Face Value columns) instead of bunched together. */
			.owner { flex-basis: 19rem; font-size: 1rem; }
			.owner small { display: inline; margin-left: 0.5rem; font-size: 0.82rem; }
			.seat-line { flex-wrap: nowrap; }
			.seats { flex: 1 1 auto; justify-content: space-around; padding: 0 1rem; }
			.seat-art { width: 6.4rem; }
			.seat-name { font-size: 0.85rem; }
			.seat-label { font-size: 0.78rem; margin-top: 0.15rem; }
			.all-toggle, .login, .login-toggle { font-size: 0.9rem; }
			.chev { font-size: 0.9rem; }
		}
		@media (max-width: 40rem) {
			main { padding: 0.6rem; }
			.card { padding: 0.5rem; }
			table { font-size: 0.82rem; }
			.city, .long { display: none; }
			th, td { padding: 0.3rem 0.3rem; }
			td input.info { min-width: 2.6rem; }
			td.opp input { min-width: 5.5rem; }
			td.face input { min-width: 3.4rem; width: 3.6rem; }
			/* Each holder is one line: label on the left, both seats on the right. */
			.seat-line { flex-wrap: nowrap; gap: 0 0.4rem; margin-left: 0.9rem; padding-left: 0.5rem; }
			.owner { flex: 1 1 0; min-width: 0; font-size: 0.85rem; }
			.owner small { font-size: 0.68rem; }
			.seats { gap: 0.25rem; }
			.seat-art { width: 4.9rem; }
			.seat-name { font-size: 0.68rem; }
			.seat-label { font-size: 0.62rem; }
		}
	</style>
</head>
<body>
	<div id="quicklinks" aria-label="Quick links"></div>
	<main>
		<header>
			<h1 id="title">Vikings Season Tickets</h1>
			<div class="login" id="login"></div>
		</header>
		<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
		<div id="view"><div class="card"><div class="message">Loading…</div></div></div>
		<div class="status-bar"><div class="status" id="status" role="status" aria-live="polite"></div></div>
	</main>

	<script>
		// melbostads.com/vikings — who is in each season-ticket seat for every
		// Vikings home game. Three tabs: Schedule (this season) and History
		// (an earlier one, picked from a dropdown) are read-only text for
		// everyone; Admin exists only when logged in (the same password and
		// token as myFFL, same localStorage key) and holds the Tasks card and
		// the Seasons card, where every seat and face value, 2016 on, is an
		// input that saves on change.
		//
		// Two sources, deliberately separate:
		//  - The SCHEDULE is read from the sync's committed snapshot, home games
		//    only: the regular season from nflSchedules.teams.MIN (ESPN's feed,
		//    the same one myFFL's NFL tab shows) and the preseason from
		//    nflPreseason.teams.MIN (ESPN seasontype=1, Vikings only). Playoffs
		//    can't be known until the team qualifies, so MANUAL_PLAYOFF_ROWS
		//    blank rows are typed in by hand (date, day, time, opponent) and
		//    stored under `${season}-po${n}`; outside Admin they only appear once
		//    something is entered. Earlier seasons' schedules come from
		//    data/vikings-history.json (scripts/backfill-vikings-history.mjs),
		//    in the same wire shape.
		//  - The NAMES and face values come from api/vikings.js on Vercel,
		//    keyed `${season}-${week}`, or `${season}-p${week}` for preseason
		//    (their week numbers would otherwise collide). Its GET is public (logged-out viewers
		//    see the names); its POST needs the Bearer token.

		const TEAM = 'MIN';
		const SNAPSHOT_URL = '/data/rosters.json';
		const TICKETS_URL = 'https://shamrock84-github-io.vercel.app/api/vikings';
		const LOGIN_URL = 'https://shamrock84-github-io.vercel.app/api/login';
		const AUTH_TOKEN_KEY = 'mflAuthToken';

		// The seats this account holds. Ids are what the store keys names by
		// (api/vikings.js only checks they are numbers), so don't renumber a seat
		// once names are saved against it.
		const MANUAL_PLAYOFF_ROWS = 3; // a home playoff game per round, at most three

		// `since` / `seasons` limit a group to the years the account held it, so
		// earlier seasons don't show rows that never existed: Kevin's pair starts
		// in 2024 (the old sheet only has his columns from then), and Jeff's
		// Section 101 pair was a 2024-only extra.
		const SEAT_GROUPS = [
			{ owner: 'Jeff', where: 'Sec 114 · Row 35', seats: [{ id: '1', label: 'Seat 1' }, { id: '2', label: 'Seat 2' }] },
			{ owner: 'Jeff', where: 'Sec 101 · Row 35', seasons: [2024], seats: [{ id: '15', label: 'Seat 15' }, { id: '16', label: 'Seat 16' }] },
			{ owner: 'Kevin', where: 'Sec 124 · Row 9', since: 2024, seats: [{ id: '11', label: 'Seat 11' }, { id: '12', label: 'Seat 12' }] },
		];
		const seatGroupsFor = (year) => SEAT_GROUPS.filter((grp) => (!grp.seasons || grp.seasons.includes(year)) && (!grp.since || year >= grp.since));

		// ESPN's abbreviations as the schedule feed spells them (WSH, not WAS).
		const TEAM_NAMES = {
			ARI: 'Arizona Cardinals', ATL: 'Atlanta Falcons', BAL: 'Baltimore Ravens', BUF: 'Buffalo Bills',
			CAR: 'Carolina Panthers', CHI: 'Chicago Bears', CIN: 'Cincinnati Bengals', CLE: 'Cleveland Browns',
			DAL: 'Dallas Cowboys', DEN: 'Denver Broncos', DET: 'Detroit Lions', GB: 'Green Bay Packers',
			HOU: 'Houston Texans', IND: 'Indianapolis Colts', JAX: 'Jacksonville Jaguars', KC: 'Kansas City Chiefs',
			LAC: 'Los Angeles Chargers', LAR: 'Los Angeles Rams', LV: 'Las Vegas Raiders', MIA: 'Miami Dolphins',
			MIN: 'Minnesota Vikings', NE: 'New England Patriots', NO: 'New Orleans Saints', NYG: 'New York Giants',
			NYJ: 'New York Jets', PHI: 'Philadelphia Eagles', PIT: 'Pittsburgh Steelers', SEA: 'Seattle Seahawks',
			SF: 'San Francisco 49ers', TB: 'Tampa Bay Buccaneers', TEN: 'Tennessee Titans', WSH: 'Washington Commanders',
		};

		// A game is a home game when the feed says so; a bye has no `home` at all.
		// Each game is tagged with its section and the key its names are stored
		// under, so nothing downstream has to know which feed it came from.
		function homeGames(schedule, section, keyPrefix, year) {
			return (schedule || [])
				.filter((g) => g && (g.home === true || g.home === false) && g.opp)
				.map((g) => ({ ...g, away: g.home === false, section, key: `${year}-${keyPrefix}${g.wk}` }));
		}

		// "Overall (W-L) | Home (W-L)" from the regular-season results in the
		// schedule itself; a tie adds a third number. Empty before any result.
		function recordLine(schedule) {
			const played = (schedule || []).filter((g) => g && (g.r === 'W' || g.r === 'L' || g.r === 'T'));
			if (!played.length) return '';
			const fmt = (list) => {
				const w = list.filter((g) => g.r === 'W').length;
				const l = list.filter((g) => g.r === 'L').length;
				const t = list.filter((g) => g.r === 'T').length;
				return t ? `${w}-${l}-${t}` : `${w}-${l}`;
			};
			return `Overall Record (${fmt(played)}) | Home Record (${fmt(played.filter((g) => g.home === true))})`;
		}

		// Kickoffs show in the stadium's time zone, not the viewer's, so a name
		// on the list always sits next to the time on the ticket. A TBD kickoff
		// carries ESPN's placeholder (midnight Eastern), so it gets the day only,
		// formatted in Eastern the way myFFL's Schedules card does.
		function formatWhen(g) {
			if (!g.at) return { day: '', date: '', time: 'TBD', tbd: true };
			const d = new Date(g.at);
			if (Number.isNaN(d.getTime())) return { day: '', date: '', time: 'TBD', tbd: true };
			const zone = g.tbd ? 'America/New_York' : 'America/Chicago';
			const day = d.toLocaleDateString('en-US', { weekday: 'short', timeZone: zone });
			const date = d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', timeZone: zone });
			if (g.tbd) return { day: 'TBD', date, time: 'TBD', tbd: true };
			const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: zone });
			return { day, date, time, tbd: false };
		}

		function el(tag, attrs = {}, children = []) {
			const node = document.createElement(tag);
			for (const [k, v] of Object.entries(attrs)) {
				if (k === 'text') node.textContent = v;
				else node.setAttribute(k, v);
			}
			for (const c of [].concat(children)) if (c) node.appendChild(c);
			return node;
		}

		// Collapsed cards are remembered per device, with phone and desktop widths
		// kept apart (same 600px cutoff and key shape as myffl.html), so a card
		// folded on a phone stays open on a desktop. Absence means expanded.
		const collapseKey = (key) => `vikingsCardCollapsed:${window.matchMedia('(max-width: 600px)').matches ? 'mobile' : 'desktop'}:${key}`;
		function isCardCollapsed(key) {
			try { return localStorage.getItem(collapseKey(key)) === '1'; } catch (e) { return false; }
		}
		function setCardCollapsed(key, collapsed) {
			try {
				if (collapsed) localStorage.setItem(collapseKey(key), '1'); else localStorage.removeItem(collapseKey(key));
			} catch (e) { /* the toggle still works for this render */ }
		}
		// The key is fixed per card, not per render: a card is rebuilt on every edit
		// and the new node has to remember what the old one was doing.
		function makeCollapsible(card, heading, key) {
			const collapsed = isCardCollapsed(key);
			card.classList.toggle('card-collapsed', collapsed);
			heading.classList.add('collapsible');
			const toggle = el('button', { type: 'button', class: 'card-collapse-toggle', 'aria-expanded': String(!collapsed), title: collapsed ? 'Expand' : 'Collapse', 'aria-label': collapsed ? 'Expand' : 'Collapse', text: '\u25BE' });
			const flip = () => {
				const next = !card.classList.contains('card-collapsed');
				card.classList.toggle('card-collapsed', next);
				toggle.setAttribute('aria-expanded', String(!next));
				toggle.title = next ? 'Expand' : 'Collapse';
				toggle.setAttribute('aria-label', next ? 'Expand' : 'Collapse');
				setCardCollapsed(key, next);
			};
			toggle.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
			heading.appendChild(toggle);
			heading.addEventListener('click', flip);
		}

		let authToken = null;
		try { authToken = localStorage.getItem(AUTH_TOKEN_KEY) || null; } catch (e) { /* storage blocked: stay logged out */ }
		const isLoggedIn = () => !!authToken;

		let tickets = { games: {} };
		let ticketsFailed = null;

		const statusEl = document.getElementById('status');
		function setStatus(text, kind) {
			statusEl.textContent = text || '';
			statusEl.className = `status${kind ? ' ' + kind : ''}`;
		}

		async function doLogin(password) {
			const res = await fetch(LOGIN_URL, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ password }),
			});
			const body = await res.json().catch(() => ({}));
			if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
			authToken = body.token;
			try { localStorage.setItem(AUTH_TOKEN_KEY, authToken); } catch (e) { /* works for this visit */ }
		}

		function doLogout() {
			authToken = null;
			tasks = {};
			tasksState = 'idle';
			try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) { /* ignore */ }
			setStatus('');
			renderAll();
		}

		function renderLogin() {
			const wrap = document.getElementById('login');
			wrap.textContent = '';
			if (isLoggedIn()) {
				const out = el('button', { type: 'button', class: 'login-toggle', text: 'Log out' });
				out.addEventListener('click', doLogout);
				wrap.appendChild(out);
				return;
			}
			const toggle = el('button', { type: 'button', class: 'login-toggle', text: 'Log in' });
			const form = el('form', { class: 'login-form hidden' });
			const input = el('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password', 'aria-label': 'Password' });
			const submit = el('button', { type: 'submit', text: 'Log in' });
			const msg = el('span', { class: 'login-status' });
			form.append(input, submit, msg);
			toggle.addEventListener('click', () => {
				toggle.classList.add('hidden');
				form.classList.remove('hidden');
				input.focus();
			});
			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				if (!input.value) return;
				msg.textContent = 'Logging in…';
				submit.disabled = true;
				try {
					await doLogin(input.value);
					renderAll();
				} catch (err) {
					msg.textContent = err.message;
					submit.disabled = false;
				}
			});
			wrap.append(toggle, form);
		}

		const gameKey = (g) => g.key;

		// POST one cell as a patch. The server returns the whole document, which
		// we keep as the source of truth but do NOT re-render from: rebuilding
		// the table would steal focus from the cell the manager tabs into next.
		async function saveCell(input, g, patch) {
			input.classList.remove('failed');
			input.classList.add('saving');
			setStatus('Saving…');
			try {
				const res = await fetch(TICKETS_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
					body: JSON.stringify({ game: gameKey(g), ...patch }),
				});
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) {
					// Expired or invalid token: same handling as myFFL, drop it so
					// the page stops claiming a login it no longer has.
					authToken = null;
					try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) { /* ignore */ }
					renderAll();
					setStatus('Your session expired — log in again to save.', 'error');
					return;
				}
				if (!res.ok) throw new Error((body.details && body.details.join('; ')) || body.error || `HTTP ${res.status}`);
				tickets = body.tickets;
				setStatus('Saved', 'ok');
			} catch (err) {
				input.classList.add('failed');
				setStatus(`Not saved: ${err.message}`, 'error');
			} finally {
				input.classList.remove('saving');
			}
		}

		const hasSeats = (g) => Object.values((tickets.games[g.key] || {}).seats || {}).some(Boolean);
		// "Show all games" is a view choice, not stored: every load starts on home games.
		let showAllGames = false;
		const infoOf = (g) => (tickets.games[g.key] || {}).info || {};
		const hasContent = (g) => {
			const t = tickets.games[g.key] || {};
			return !!(t.face || t.info || Object.keys(t.seats || {}).length);
		};
		// What a row is called to a screen reader.
		const gameLabel = (g) => g.manual
			? `Playoff game ${g.n}${infoOf(g).opp ? ' ' + infoOf(g).opp : ''}`
			: `${formatWhen(g).date} ${g.away ? 'at ' : ''}${TEAM_NAMES[g.opp] || g.opp}`;

		// A hand-entered row's date / day / time / opponent: text, or an input
		// per field when logged in. Saved through the same per-cell patch as a seat.
		function manualCell(g, field, editable, extraClass) {
			const value = infoOf(g)[field] || '';
			const td = el('td', { class: [extraClass, field === 'opp' ? 'opp' : ''].filter(Boolean).join(' ') });
			if (!editable) { td.textContent = value; return td; }
			const label = { date: 'date', day: 'day', time: 'time', opp: 'opponent' }[field];
			const input = el('input', { type: 'text', value, maxlength: '40', autocomplete: 'off', class: 'info', 'aria-label': `${gameLabel(g)}, ${label}` });
			let last = value;
			input.addEventListener('change', () => {
				const next = input.value.trim();
				if (next === last) return;
				last = next;
				saveCell(input, g, { info: { [field]: next } });
			});
			td.appendChild(input);
			return td;
		}

		// One seat: a small label over the name (text) or an input (logged in).
		const SEAT_SVG = '<svg class="seat-svg" viewBox="0 0 80 64" aria-hidden="true" focusable="false">'
			+ '<rect class="part" x="2" y="26" width="10" height="26" rx="4"/>'
			+ '<rect class="part" x="68" y="26" width="10" height="26" rx="4"/>'
			+ '<rect class="part" x="14" y="4" width="52" height="34" rx="11"/>'
			+ '<rect class="part" x="10" y="36" width="60" height="15" rx="6"/>'
			+ '<rect class="part" x="16" y="50" width="7" height="9" rx="2"/>'
			+ '<rect class="part" x="57" y="50" width="7" height="9" rx="2"/>'
			+ '</svg>';

		// One seat: the icon with the name over the backrest and the seat number
		// under it. Logged out the name is text; logged in it is an input on the
		// icon, and the seat fills in as soon as something is typed.
		function seatItem(g, seat, editable) {
			const value = ((tickets.games[gameKey(g)] || {}).seats || {})[seat.id] || '';
			const art = el('div', { class: 'seat-art' });
			art.innerHTML = SEAT_SVG; // constant markup above, no user text
			const wrap = el('div', { class: `seat${value ? ' taken' : ''}` }, [art, el('span', { class: 'seat-label', text: seat.label })]);
			if (!editable) {
				if (value) art.appendChild(el('span', { class: 'seat-name', text: value }));
				return wrap;
			}
			const input = el('input', { type: 'text', value, maxlength: '60', autocomplete: 'off', 'aria-label': `${gameLabel(g)}, ${seat.label}` });
			let last = value;
			input.addEventListener('input', () => wrap.classList.toggle('taken', !!input.value.trim()));
			input.addEventListener('change', () => {
				const next = input.value.trim();
				if (next === last) return;
				last = next;
				saveCell(input, g, { seats: { [seat.id]: next } });
			});
			art.appendChild(input);
			return wrap;
		}

		function faceCell(g, editable) {
			const value = (tickets.games[gameKey(g)] || {}).face || '';
			const td = el('td', { class: 'face' });
			if (!editable) {
				if (value) td.textContent = `$${value}`;
				else td.appendChild(el('span', { class: 'empty', text: '—' }));
				return td;
			}
			const input = el('input', { type: 'text', inputmode: 'decimal', value, maxlength: '8', autocomplete: 'off', placeholder: '$', 'aria-label': `${gameLabel(g)}, face value` });
			let last = value;
			input.addEventListener('change', () => {
				const next = input.value.replace(/[$,\s]/g, '');
				input.value = next;
				if (next === last) return;
				last = next;
				saveCell(input, g, { face: next });
			});
			td.appendChild(input);
			return td;
		}

		// Which games have their seats showing. Every load starts the same way,
		// on purpose: finished games closed, upcoming ones open. A chevron or
		// Expand/Collapse all only lasts until the page is refreshed (it survives
		// a login/logout re-render, which is why the choices live in this object).
		// Nothing is stored; an old remembered state is cleared so it can't linger.
		const openPrefs = {};
		// Which section bands (Preseason / Regular Season / Playoffs) are folded,
		// keyed `${year}|${section}`. Same lifetime as openPrefs: it survives a
		// re-render, never a refresh, and everything starts unfolded.
		const sectionFolded = {};
		try { localStorage.removeItem('vikingsOpen'); } catch (e) { /* ignore */ }

		function renderTable(games, editable) {
			const head = el('tr');
			// The long half of a heading hides on a phone (.long) to save width.
			for (const [short, long] of [['Date', ''], ['Day', ''], ['Time', ' (CT)'], ['Opponent', ''], ['Face', ' Value']]) {
				head.appendChild(el('th', {}, [document.createTextNode(short), long ? el('span', { class: 'long', text: long }) : null]));
			}
			const thead = el('thead', {}, [head]);

			const now = Date.now();
			// Blank hand-entered rows are for typing into; to everyone else they
			// only exist once something has been entered.
			// Away games show with "Show all games" on, or once they hold a seat name.
			const rows = games.filter((g) => g.away ? (showAllGames || hasSeats(g)) : (!g.manual || editable || hasContent(g)));
			const rowSections = [...new Set(rows.map((g) => g.section))];
			const nextIndex = rows.findIndex((g) => !g.manual && g.r == null && !(g.at && new Date(g.at).getTime() + 4 * 3600e3 < now));
			const tbody = el('tbody');
			const setters = [];
			const foldAppliers = [];
			let lastSection = null;
			let sectionRows = null;
			rows.forEach((g, i) => {
				// Section rows, like the sheet's Preseason / Regular Season bands.
				// Each is a toggle that folds that section's games and seats away.
				if (rowSections.length > 1 && g.section !== lastSection) {
					lastSection = g.section;
					const foldKey = `${g.key.slice(0, 4)}|${g.section}`;
					const members = (sectionRows = []);
					const btn = el('button', { type: 'button', class: 'sec-btn' }, [el('span', { class: 'sec-chev', 'aria-hidden': 'true' }), document.createTextNode(g.section)]);
					const bandRow = el('tr', { class: 'section' }, [el('td', { colspan: '5' }, [btn])]);
					const applyFold = () => {
						const folded = !!sectionFolded[foldKey];
						btn.setAttribute('aria-expanded', String(!folded));
						bandRow.classList.toggle('folded', folded);
						members.forEach((r) => r.classList.toggle('sec-folded', folded));
					};
					btn.addEventListener('click', () => { sectionFolded[foldKey] = !sectionFolded[foldKey]; applyFold(); });
					tbody.appendChild(bandRow);
					foldAppliers.push(applyFold);
				}
				const done = !g.manual && (g.r != null || (g.at && !g.tbd && new Date(g.at).getTime() + 4 * 3600e3 < now));
				const cls = done ? 'past' : i === nextIndex ? 'next' : '';
				const tr = el('tr', { class: `game ${cls}${g.r === 'W' || g.r === 'L' ? ' res-' + g.r : ''}`.trim() });
				let dateCell;
				if (g.manual) {
					tr.appendChild(dateCell = manualCell(g, 'date', editable));
					tr.appendChild(manualCell(g, 'day', editable));
					tr.appendChild(manualCell(g, 'time', editable));
					tr.appendChild(manualCell(g, 'opp', editable));
				} else {
					const when = formatWhen(g);
					dateCell = el('td', { text: when.date });
					tr.appendChild(dateCell);
					tr.appendChild(el('td', { text: when.day }));
					tr.appendChild(el('td', { class: when.tbd ? 'tbd' : '', text: when.time }));
					// City hides on a phone (.city) so the row stays narrow.
					const full = TEAM_NAMES[g.opp] || g.opp;
					const cut = full.lastIndexOf(' ');
					const opp = el('td', { class: 'opp' }, cut > 0
						? [el('span', { class: 'city', text: full.slice(0, cut + 1) }), document.createTextNode(full.slice(cut + 1))]
						: [document.createTextNode(full)]);
					if (g.away) opp.insertBefore(document.createTextNode('at '), opp.firstChild);
					if (i === nextIndex) opp.appendChild(el('span', { class: 'chip', text: 'Next' }));
					if (g.r === 'W' || g.r === 'L' || g.r === 'T') {
						const score = Number.isFinite(g.pf) && Number.isFinite(g.pa) ? ` ${g.pf}\u2013${g.pa}` : '';
						opp.appendChild(el('span', { class: `result ${g.r}`, text: `${g.r === 'W' ? 'WIN' : g.r === 'L' ? 'LOSS' : 'TIE'}${score}` }));
					}
					tr.appendChild(opp);
				}
				tr.appendChild(faceCell(g, editable));

				// The seats, one indented row per ticket holder.
				const groups = seatGroupsFor(Number(g.key.slice(0, 4)));
				const seatRows = groups.map((grp, gi) => {
					const seats = el('div', { class: 'seats' });
					grp.seats.forEach((st) => seats.appendChild(seatItem(g, st, editable)));
					const line = el('div', { class: 'seat-line' }, [
						el('div', { class: 'owner' }, [document.createTextNode(`${grp.owner}\u2019s Seats`), el('small', { text: grp.where })]),
						seats,
					]);
					return el('tr', { class: `seat-row ${cls}${gi === groups.length - 1 ? ' last' : ''}`.trim() }, [el('td', { colspan: '5' }, [line])]);
				});

				// Chevron inside the date cell, before whatever is already there.
				const btn = el('button', { type: 'button', class: 'chev' });
				const wrap = el('div', { class: 'datecell' });
				wrap.appendChild(btn);
				Array.from(dateCell.childNodes).forEach((n) => wrap.appendChild(n));
				dateCell.appendChild(wrap);

				let open = g.key in openPrefs ? !!openPrefs[g.key] : g.away ? hasSeats(g) : !done;
				const apply = () => {
					tr.classList.toggle('open', open);
					btn.setAttribute('aria-expanded', String(open));
					btn.setAttribute('aria-label', `${open ? 'Hide' : 'Show'} seats for ${gameLabel(g)}`);
					seatRows.forEach((r) => { r.hidden = !open; });
				};
				btn.addEventListener('click', () => {
					open = !open;
					openPrefs[g.key] = open;
					apply();
					updateAll();
				});
				apply();
				setters.push({ key: g.key, get: () => open, set: (v) => { open = v; apply(); } });
				tbody.appendChild(tr);
				seatRows.forEach((r) => tbody.appendChild(r));
				if (sectionRows) sectionRows.push(tr, ...seatRows);
			});
			foldAppliers.forEach((apply) => apply()); // restore folds kept from before a re-render

			// Expand/collapse every game at once.
			const allBtn = el('button', { type: 'button', class: 'all-toggle' });
			function updateAll() { allBtn.textContent = setters.every((x) => x.get()) ? 'Collapse all' : 'Expand all'; }
			allBtn.addEventListener('click', () => {
				const next = !setters.every((x) => x.get());
				setters.forEach((x) => { x.set(next); openPrefs[x.key] = next; });
				updateAll();
			});
			updateAll();
			const showAll = el('input', { type: 'checkbox', id: 'show-all-games' });
			showAll.checked = showAllGames;
			showAll.addEventListener('change', () => { showAllGames = showAll.checked; renderAll(); });
			const showLabel = el('label', { class: 'show-all' }, [showAll, document.createTextNode(' Show all games (away too)')]);
			return el('div', {}, [el('div', { class: 'all-bar' }, [showLabel, allBtn]), el('table', {}, [thead, tbody])]);
		}

		// ---- Views ------------------------------------------------------------

		const HISTORY_URL = '/data/vikings-history.json';
		const FIRST_SEASON = 2016; // the oldest season the Seasons card edits

		let snapshotSeason = null;
		let currentData = null;     // the snapshot's season, built once
		let historyDoc = null;      // data/vikings-history.json
		let historyError = null;
		let tab = 'schedule';

		// One season's games, whichever feed they came from: the snapshot for the
		// current year, data/vikings-history.json for the rest. Both carry the
		// same wire shape, so one builder serves both. Playoffs are always the
		// same three hand-entered rows.
		// Playoffs: when the backfill read them (`postseason` is an array, maybe
		// empty) the home games come from the feed, keyed by round
		// (`${year}-po${wk}`, wk 1-3) so a name stays with its round; otherwise
		// (the current season, or a file without them) the manager types the rows.
		function buildSeason(year, schedule, preseason, postseason) {
			const pre = homeGames(preseason, 'Preseason', 'p', year);
			const reg = homeGames(schedule, 'Regular Season', '', year);
			const list = [...pre, ...reg];
			if (Array.isArray(postseason)) list.push(...homeGames(postseason, 'Playoffs', 'po', year));
			else for (let n = 1; n <= MANUAL_PLAYOFF_ROWS; n++) list.push({ section: 'Playoffs', key: `${year}-po${n}`, manual: true, n });
			return { year, games: list, preCount: pre.filter((g) => !g.away).length, regular: reg.filter((g) => !g.away).length, record: recordLine(schedule) };
		}

		function seasonData(year) {
			if (currentData && String(year) === String(snapshotSeason)) return currentData;
			const h = historyDoc && historyDoc.seasons && historyDoc.seasons[year];
			return h ? buildSeason(year, h.schedule, h.preseason, h.postseason) : null;
		}

		// "1 preseason + 9 home games + 1 playoff game + 1 away game
		// (Tampa Bay)". Away games only appear once a seat name is saved against
		// them. A playoff game counts once it exists: from the feed, or a
		// hand-typed row with something in it (blank rows don't).
		const shortTeam = (abbr) => {
			const n = TEAM_NAMES[abbr] || abbr;
			const c = n.lastIndexOf(' ');
			return c > 0 ? n.slice(0, c) : n;
		};
		function seasonSubtitle(data) {
			const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;
			const playoffs = data.games.filter((g) => g.section === 'Playoffs' && (g.away ? hasSeats(g) : (!g.manual || hasContent(g))));
			const away = data.games.filter((g) => g.away && g.section !== 'Playoffs' && hasSeats(g));
			const awayPlayoffs = playoffs.filter((g) => g.away);
			const parts = [];
			if (data.preCount) parts.push(`${data.preCount} preseason`);
			parts.push(`${data.regular} home games`);
			if (playoffs.length) parts.push(plural(playoffs.length, 'playoff game') + (awayPlayoffs.length ? ` (at ${awayPlayoffs.map((g) => shortTeam(g.opp)).join(', ')})` : ''));
			if (away.length) parts.push(`${plural(away.length, 'away game')} (${away.map((g) => shortTeam(g.opp)).join(', ')})`);
			return parts.join(' + ');
		}

		function seasonCard(data, editable, withTitle = true, withSubtitle = true) {
			const head = el('div', { class: 'season-head' }, [
				// Same form as a History row's summary: "2026  Overall (6-1) | Home (3-0)".
				withTitle ? el('h2', { class: 'season-title' }, [
					el('span', { class: 'season-year', text: String(data.year) }),
					data.record ? el('span', { class: 'season-record', text: data.record.replace(/ Record/g, '') }) : null,
				]) : null,
				withSubtitle ? el('div', { class: 'subtitle', text: seasonSubtitle(data) }) : null,
			]);
			return el('div', {}, [head, data.regular || data.preCount ? renderTable(data.games, editable) : el('div', { class: 'message', text: 'No Vikings home games in this season’s schedule.' })]);
		}

		// One season as a <details>. Its table is built the first time it opens
		// (eleven tables up front would be slow and mostly never looked at), and
		// whether it is open survives a re-render (login, logout, tab change) in
		// `seasonOpen`, keyed by the tab it sits on.
		const seasonOpen = { history: {}, admin: {} };
		function seasonDetails(scope, year, editable, className) {
			const data = seasonData(year);
			const open = !!seasonOpen[scope][year];
			const details = el('details', { class: className });
			if (open) details.open = true;
			const label = data && data.record ? el('span', { class: 'season-record', text: data.record.replace(/ Record/g, '') }) : null;
			// History rows carry the game-count line in the summary so it shows
			// while collapsed; the body then leaves it out.
			const sub = scope === 'history' && data ? el('span', { class: 'season-sub', text: seasonSubtitle(data) }) : null;
			details.appendChild(el('summary', {}, [el('span', { class: 'season-year', text: String(year) }), label, sub]));
			const body = el('div', { class: 'season-body' });
			details.appendChild(body);
			const fill = () => {
				if (body.childNodes.length) return;
				if (!data) {
					body.appendChild(el('div', { class: 'message', text: `The ${year} schedule hasn’t been loaded yet. Run the “Backfill Vikings Schedules” workflow in GitHub Actions, then reload.` }));
				} else {
					body.appendChild(seasonCard(data, editable, false, scope !== 'history'));
				}
			};
			if (open) fill();
			details.addEventListener('toggle', () => {
				seasonOpen[scope][year] = details.open;
				if (details.open) fill();
			});
			return details;
		}

		const message = (text, kind) => el('div', { class: 'card' }, [el('div', { class: `message${kind ? ' ' + kind : ''}`, text })]);

		function scheduleView() {
			if (!currentData || !currentData.regular) return [message('No Vikings home games found in the schedule yet.')];
			return [el('div', { class: 'card' }, [seasonCard(currentData, false)])];
		}

		function historyYears() {
			return Object.keys((historyDoc && historyDoc.seasons) || {}).map(Number).filter((y) => y < Number(snapshotSeason)).sort((a, b) => b - a);
		}

		function historyView() {
			if (historyError) return [message(`Couldn’t load earlier seasons (${historyError}).`, 'error')];
			const years = historyYears();
			if (!years.length) return [message('Earlier seasons haven’t been loaded yet.')];
			return years.map((y) => seasonDetails('history', y, false, 'card season-card'));
		}

		function seasonsCard() {
			const card = el('div', { class: 'card' }, [el('h2', { class: 'card-heading', text: 'Seasons' })]);
			if (!snapshotSeason) { card.appendChild(el('div', { class: 'message', text: 'No season to edit yet.' })); return card; }
			if (ticketsFailed) {
				card.appendChild(el('div', { class: 'message error', text: `Couldn’t load seat names (${ticketsFailed}), so editing is turned off. Reload to try again.` }));
			}
			for (let y = Number(snapshotSeason); y >= FIRST_SEASON; y--) card.appendChild(seasonDetails('admin', y, !ticketsFailed, 'season-mini'));
			return card;
		}

		// ---- Quick links ----------------------------------------------------------
		// The header toolbar, same behaviour as myffl.html's: plain, gold or
		// purple entries, and links sharing a Group fold into one dropdown. The
		// list is public (the GET needs no login) and edited from the Admin tab's
		// Quick Links card. With no links the bar is empty and CSS hides it.
		let quickLinks = [];

		function closeQuickLinkCombos() {
			for (const open of document.querySelectorAll('.quicklink-combo.open')) {
				open.classList.remove('open');
				const b = open.querySelector('.quicklink-combo-btn');
				if (b) b.setAttribute('aria-expanded', 'false');
			}
		}
		// Registered once: renderQuickLinks rebuilds the bar and must not stack these.
		document.addEventListener('click', (e) => { if (!e.target.closest || !e.target.closest('.quicklink-combo')) closeQuickLinkCombos(); });
		document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeQuickLinkCombos(); });

		function appendQuickLink(bar, { url, label, style }) {
			const cls = style === 'gold' ? 'quicklink-gold' : style === 'purple' ? 'quicklink-purple' : '';
			const link = el('a', { href: url, target: '_blank', rel: 'noopener', ...(cls ? { class: cls } : {}) });
			if (cls) link.appendChild(el('span', { class: 'quicklink-pill', text: label }));
			else link.textContent = label;
			bar.appendChild(link);
		}

		function renderQuickLinks() {
			const bar = document.getElementById('quicklinks');
			bar.textContent = '';
			const groups = new Map();
			for (const link of quickLinks) {
				const opts = { url: link.url, label: link.nickname, style: link.style };
				const name = typeof link.group === 'string' ? link.group.trim() : '';
				if (!name) { appendQuickLink(bar, opts); continue; }
				const key = name.toLowerCase();
				let menu = groups.get(key);
				if (!menu) {
					const wrap = el('div', { class: 'quicklink-combo' });
					const btn = el('button', {
						type: 'button',
						class: `quicklink-combo-btn${link.style === 'gold' ? ' quicklink-combo-gold' : link.style === 'purple' ? ' quicklink-combo-purple' : ''}`,
						'aria-haspopup': 'true',
						'aria-expanded': 'false',
						text: `${name} ▾`,
					});
					menu = el('div', { class: 'quicklink-combo-menu' });
					btn.addEventListener('click', () => {
						const opening = !wrap.classList.contains('open');
						closeQuickLinkCombos();
						if (!opening) return;
						wrap.classList.add('open');
						btn.setAttribute('aria-expanded', 'true');
						wrap.classList.remove('align-right');
						if (btn.getBoundingClientRect().left + menu.offsetWidth > window.innerWidth - 8) wrap.classList.add('align-right');
					});
					wrap.append(btn, menu);
					bar.appendChild(wrap);
					groups.set(key, menu);
				}
				appendQuickLink(menu, opts);
			}
		}

		// Admin > Quick Links. Edits go into a draft and nothing is saved until
		// Save, like myFFL's card; the whole ordered list is replaced in one write.
		let qlDraft = null;
		let qlErrors = [];
		let qlSaving = false;
		let qlCardEl = null;
		const qlCopy = (list) => list.map((l) => ({ url: l.url || '', nickname: l.nickname || '', style: l.style || '', group: l.group || '' }));
		const qlDirty = () => JSON.stringify(qlCopy(qlDraft)) !== JSON.stringify(qlCopy(quickLinks));

		function refreshQuickLinksCard() {
			if (!qlCardEl) return;
			const next = buildQuickLinksCard();
			qlCardEl.replaceWith(next);
			qlCardEl = next;
		}

		async function saveQuickLinks() {
			qlErrors = [];
			// Same rules as the server, so a mistake is named before the round trip.
			const draft = qlCopy(qlDraft).map((l) => ({ ...l, url: l.url.trim(), nickname: l.nickname.trim(), group: l.group.trim() }));
			draft.forEach((l, i) => {
				if (!l.nickname) qlErrors.push(`Link ${i + 1}: nickname is required.`);
				if (!/^https?:\/\/\S+$/i.test(l.url)) qlErrors.push(`Link ${i + 1}: link must start with http:// or https://.`);
			});
			if (qlErrors.length) { refreshQuickLinksCard(); return; }
			qlSaving = true;
			refreshQuickLinksCard();
			setStatus('Saving…');
			try {
				const res = await fetch(TICKETS_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
					body: JSON.stringify({ resource: 'quicklinks', links: draft }),
				});
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { qlSaving = false; expireSession(); return; }
				if (!res.ok) throw new Error((body.details && body.details.join('; ')) || body.error || `HTTP ${res.status}`);
				quickLinks = body.links || [];
				qlDraft = qlCopy(quickLinks);
				renderQuickLinks();
				setStatus('Saved', 'ok');
			} catch (err) {
				qlErrors = [`Not saved: ${err.message}`];
				setStatus('');
			}
			qlSaving = false;
			refreshQuickLinksCard();
		}

		function buildQuickLinksCard() {
			if (!qlDraft) qlDraft = qlCopy(quickLinks);
			const qlHead = el('h2', { class: 'card-heading', text: `Quick Links (${qlDraft.length})` });
			const card = el('div', { class: 'card' }, [qlHead]);
			makeCollapsible(card, qlHead, 'quicklinks');
			const list = el('div', { class: 'ql-list' });
			const field = (cls, label, input) => el('label', { class: `ql-field ${cls}` }, [el('span', { text: label }), input]);
			const text = (link, key, placeholder, type) => {
				const input = el('input', { type: 'text', class: 'task-input', value: link[key], placeholder, autocomplete: 'off', ...(type === 'url' ? { inputmode: 'url', maxlength: '500' } : { maxlength: '40' }) });
				input.addEventListener('input', () => { link[key] = input.value; });
				return input;
			};
			qlDraft.forEach((link, i) => {
				const style = el('select', { class: 'task-input' }, [['', 'Plain'], ['gold', 'Gold'], ['purple', 'Purple']].map(([v, t]) => {
					const o = el('option', { value: v, text: t });
					if ((link.style || '') === v) o.selected = true;
					return o;
				}));
				style.addEventListener('change', () => { link.style = style.value; });
				const move = (to) => { qlDraft.splice(to, 0, qlDraft.splice(i, 1)[0]); refreshQuickLinksCard(); };
				const up = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Move up', 'aria-label': 'Move up', text: '↑' });
				const down = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Move down', 'aria-label': 'Move down', text: '↓' });
				up.disabled = i === 0;
				down.disabled = i === qlDraft.length - 1;
				up.addEventListener('click', () => move(i - 1));
				down.addEventListener('click', () => move(i + 1));
				const remove = el('button', { type: 'button', class: 'task-icon-btn', title: 'Remove this link', 'aria-label': 'Remove this link', text: '✕' });
				remove.addEventListener('click', () => { qlDraft.splice(i, 1); refreshQuickLinksCard(); });
				list.appendChild(el('div', { class: 'ql-row' }, [
					field('ql-link', 'Link', text(link, 'url', 'https://…', 'url')),
					field('ql-nick', 'Nickname', text(link, 'nickname', 'e.g. Vikings')),
					field('ql-group', 'Group', text(link, 'group', 'optional')),
					field('ql-style', 'Style', style),
					up, down, remove,
				]));
			});
			if (!qlDraft.length) card.appendChild(el('div', { class: 'task-empty', text: 'No links yet. With none, the toolbar stays hidden.' }));
			card.appendChild(list);
			const add = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add a link' });
			add.addEventListener('click', () => {
				qlDraft.push({ url: '', nickname: '', style: '', group: '' });
				refreshQuickLinksCard();
				const rows = qlCardEl.querySelectorAll('.ql-row');
				const last = rows[rows.length - 1];
				if (last) last.querySelector('input').focus();
			});
			const save = el('button', { type: 'button', class: 'task-add-btn', text: qlSaving ? 'Saving…' : 'Save' });
			save.disabled = qlSaving;
			save.addEventListener('click', saveQuickLinks);
			const discard = el('button', { type: 'button', class: 'task-add-btn', text: 'Discard changes' });
			discard.disabled = qlSaving || !qlDirty();
			discard.addEventListener('click', () => { qlDraft = qlCopy(quickLinks); qlErrors = []; refreshQuickLinksCard(); });
			card.appendChild(el('div', { class: 'ql-actions' }, [add, save, discard]));
			if (qlErrors.length) card.appendChild(el('ul', { class: 'ql-errors' }, qlErrors.map((t) => el('li', { text: t }))));
			card.appendChild(el('div', { class: 'ql-note', text: 'Shown in the header toolbar, in this order. Links sharing a Group name fold into one dropdown with that name. Both a link and a nickname are required.' }));
			return card;
		}

		// ---- Tasks card ---------------------------------------------------------
		// The same list as myffl.html's Tasks card, but its own: stored under its
		// own key by api/vikings.js (`?resource=tasks`, login-gated both ways), not
		// in the plans document. Each change goes up as a per-task patch
		// ({ id: task | null }), queued one at a time so two quick edits can't race
		// each other's read-modify-write on the server. The list is fetched when the
		// Admin tab opens and whenever the page returns to the foreground, so a task
		// added on another device shows up without a reload.

		const MAX_TASK_TEXT_LENGTH = 2000;
		const TASK_COUNTER_THRESHOLD = MAX_TASK_TEXT_LENGTH - 400;
		let tasks = {};
		let tasksState = 'idle'; // idle | loading | ready | error
		let tasksError = '';
		let tasksSyncError = '';
		let editingTaskId = null;
		let tasksCardEl = null;
		let pushChain = Promise.resolve();
		// Changes the server hasn't confirmed yet, id -> task | null. They stay
		// here until a save succeeds (so a failed save is retried with the next
		// one, never silently dropped), and the list is not refetched over them.
		const unsaved = {};
		let saving = false;

		function expireSession() {
			authToken = null;
			tasks = {};
			tasksState = 'idle';
			try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) { /* ignore */ }
			renderAll();
			setStatus('Your session expired — log in again to save.', 'error');
		}

		// First load shows "Loading…"; later calls (opening the tab, coming back to
		// the page) refetch quietly, because another device may have changed the
		// list since this page loaded. Never over unsaved edits, an edit in
		// progress or text typed into the add row.
		async function loadTasks() {
			if (tasksState === 'loading') return;
			const quiet = tasksState === 'ready';
			if (quiet) {
				const typing = tasksCardEl && [...tasksCardEl.querySelectorAll('.task-input')].some((i) => i.value);
				if (saving || Object.keys(unsaved).length || editingTaskId || typing) return;
			} else {
				tasksState = 'loading';
			}
			try {
				const res = await fetch(`${TICKETS_URL}?resource=tasks`, { headers: { Authorization: `Bearer ${authToken}` }, cache: 'no-store' });
				const body = await res.json().catch(() => ({}));
				if (res.status === 401) { tasksState = 'idle'; expireSession(); return; }
				if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
				// A save or edit may have started while this was in flight; don't clobber it.
				if (quiet && (saving || Object.keys(unsaved).length || editingTaskId)) return;
				tasks = body.tasks || {};
				tasksState = 'ready';
			} catch (err) {
				if (quiet) return; // a failed background refresh keeps what is on screen
				tasksState = 'error';
				tasksError = err.message;
			}
			refreshTasksCard();
		}

		// Send every unconfirmed change. One at a time, so two quick edits can't
		// race each other's read-modify-write on the server.
		function flushTasks() {
			pushChain = pushChain.then(async () => {
				const sent = { ...unsaved };
				if (!Object.keys(sent).length) return;
				saving = true;
				try {
					const res = await fetch(TICKETS_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
						body: JSON.stringify({ resource: 'tasks', tasks: sent }),
					});
					const body = await res.json().catch(() => ({}));
					if (res.status === 401) { saving = false; expireSession(); return; }
					if (!res.ok) throw new Error((body.details && body.details.join('; ')) || body.error || `HTTP ${res.status}`);
					// Keep anything edited again while this was in flight.
					for (const id of Object.keys(sent)) if (unsaved[id] === sent[id]) delete unsaved[id];
					tasksSyncError = '';
				} catch (err) {
					tasksSyncError = err.message;
				}
				saving = false;
				refreshTasksCard();
			});
		}

		// Apply a { id: task | null } change locally, show it, and send it.
		function commitTasks(changed) {
			for (const [id, t] of Object.entries(changed)) {
				if (t === null) delete tasks[id]; else tasks[id] = t;
			}
			Object.assign(unsaved, changed);
			refreshTasksCard();
			flushTasks();
		}

		const makeTaskId = () => `t${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
		const taskOrderValue = (t) => (typeof t.order === 'number' ? t.order : t.createdAt);
		function openTaskIdsByCategory(category) {
			return Object.entries(tasks)
				.filter(([, t]) => !t.done && t.category === category)
				.sort((a, b) => taskOrderValue(a[1]) - taskOrderValue(b[1]))
				.map(([id]) => id);
		}
		// Stamps `order` on every task in the category, not just the one moved: a
		// task nobody has reordered has no `order` and would sort back to the front.
		function moveTaskWithinCategory(category, from, to) {
			const ids = openTaskIdsByCategory(category);
			if (from === to || from < 0 || from >= ids.length || to < 0 || to >= ids.length) return;
			const [moved] = ids.splice(from, 1);
			ids.splice(to, 0, moved);
			const changed = {};
			ids.forEach((id, order) => { changed[id] = { ...tasks[id], order }; });
			commitTasks(changed);
		}
		function addTask(text, category) {
			const now = Date.now();
			commitTasks({ [makeTaskId()]: { text, category, done: false, order: now, createdAt: now, completedAt: null } });
		}
		const patchTask = (id, updates) => { if (tasks[id]) commitTasks({ [id]: { ...tasks[id], ...updates } }); };

		// A hand-rolled stand-in for <datalist>, which iOS handles badly.
		function attachCategorySuggestions(input, getCategories) {
			const wrap = el('div', { class: 'suggest-wrap' });
			wrap.appendChild(input);
			const list = el('div', { class: 'suggest-list hidden' });
			wrap.appendChild(list);
			function render() {
				const q = input.value.trim().toLowerCase();
				const matches = getCategories().filter((c) => c.toLowerCase().includes(q) && c.toLowerCase() !== q);
				list.textContent = '';
				if (!matches.length) { list.classList.add('hidden'); return; }
				for (const c of matches) {
					const item = el('div', { class: 'suggest-item', text: c });
					// mousedown, not click: it lands before the input's blur hides the list.
					item.addEventListener('mousedown', (e) => {
						e.preventDefault();
						input.value = c;
						list.classList.add('hidden');
						input.focus();
					});
					list.appendChild(item);
				}
				list.classList.remove('hidden');
			}
			input.addEventListener('focus', render);
			input.addEventListener('input', render);
			input.addEventListener('blur', () => list.classList.add('hidden'));
			return wrap;
		}

		// Only shown once text nears the limit; most tasks are a line.
		function attachTaskCharCounter(input) {
			const counter = el('span', { class: 'task-counter hidden' });
			const update = () => {
				const len = input.value.length;
				counter.classList.toggle('hidden', len < TASK_COUNTER_THRESHOLD);
				counter.classList.toggle('limit', len >= MAX_TASK_TEXT_LENGTH);
				counter.textContent = `${len}/${MAX_TASK_TEXT_LENGTH}`;
			};
			input.addEventListener('input', update);
			update();
			return counter;
		}

		// Bugs first, then the manager's fixed buckets, anything new alphabetically,
		// Backlog last.
		const categoryTier = (key) => (key === 'Bugs' ? 0 : key === 'Manual Task' ? 2 : key === 'Site Enhancement' ? 3 : key === 'Backlog' ? 5 : 4);

		function refreshTasksCard() {
			if (!tasksCardEl || !tasksCardEl.isConnected) return;
			const next = buildTasksCard();
			tasksCardEl.replaceWith(next);
			tasksCardEl = next;
		}

		function buildTasksCard() {
			const card = el('div', { class: 'card' });
			if (tasksState !== 'ready') {
				const loadingHead = el('h2', { class: 'card-heading', text: 'Tasks' });
				card.appendChild(loadingHead);
				makeCollapsible(card, loadingHead, 'tasks');
				card.appendChild(el('div', { class: `message${tasksState === 'error' ? ' error' : ''}`, text: tasksState === 'error' ? `Couldn’t load tasks (${tasksError}). Reload to try again.` : 'Loading…' }));
				return card;
			}
			const entries = Object.entries(tasks);
			const tasksHead = el('h2', { class: 'card-heading', text: `Tasks (${entries.filter(([, t]) => !t.done).length})` });
			card.appendChild(tasksHead);
			makeCollapsible(card, tasksHead, 'tasks');
			// Stays up until the unsaved changes go through; Retry resends them.
			if (tasksSyncError && Object.keys(unsaved).length) {
				const warn = el('div', { class: 'task-sync-status' }, [document.createTextNode(`⚠ Not saved yet (${tasksSyncError}). `)]);
				const retry = el('button', { type: 'button', class: 'task-add-btn', text: 'Retry' });
				retry.addEventListener('click', flushTasks);
				warn.appendChild(retry);
				card.appendChild(warn);
			}

			const categories = [...new Set(entries.map(([, t]) => t.category).filter(Boolean))].sort();
			const addRow = el('div', { class: 'task-add-row' });
			const textInput = el('input', { type: 'text', class: 'task-input', placeholder: 'New task…', autocomplete: 'off', maxlength: String(MAX_TASK_TEXT_LENGTH) });
			const categoryInput = el('input', { type: 'text', class: 'task-input', placeholder: 'Category', autocomplete: 'off' });
			const addBtn = el('button', { type: 'button', class: 'task-add-btn', text: '+ Add' });
			// Both fields are required, so every open task sits under a real category.
			const submit = () => {
				const text = textInput.value.trim();
				const category = categoryInput.value.trim();
				if (!text || !category) return;
				addTask(text, category);
			};
			addBtn.addEventListener('click', submit);
			textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
			addRow.append(textInput, attachTaskCharCounter(textInput), attachCategorySuggestions(categoryInput, () => categories), addBtn);
			card.appendChild(addRow);

			if (!entries.length) {
				card.appendChild(el('div', { class: 'task-empty', text: 'No tasks yet.' }));
				return card;
			}

			let dragFrom = null;
			const buildRow = (id, t, group) => {
				if (editingTaskId === id) return buildEditRow(id, t, categories);
				const row = el('div', { class: `task-row${t.done ? ' task-done' : ''}` });
				const { key, index, groupEntries } = group || {};
				if (group) {
					row.appendChild(el('span', { class: 'task-grip', title: 'Drag to reorder', 'aria-hidden': 'true', text: '⠿' }));
					row.draggable = true;
				}
				const box = el('input', { type: 'checkbox', 'aria-label': 'Done' });
				box.checked = t.done;
				box.addEventListener('change', () => patchTask(id, { done: box.checked, completedAt: box.checked ? Date.now() : null }));
				row.appendChild(box);
				// Done tasks lose their category's section, so the category rides along.
				const label = t.done && t.category ? `${t.text} (${t.category})` : t.text;
				const textSpan = el('span', { class: 'task-text', text: label, role: 'button', tabindex: '0', title: 'Click to edit' });
				const edit = () => { editingTaskId = id; refreshTasksCard(); };
				textSpan.addEventListener('click', edit);
				textSpan.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); edit(); } });
				row.appendChild(textSpan);
				if (group) {
					// Touch screens fire no drag events, so these are the only way to reorder there.
					const up = el('button', { type: 'button', class: 'task-move-btn', title: 'Move up', 'aria-label': 'Move up', text: '↑' });
					const down = el('button', { type: 'button', class: 'task-move-btn', title: 'Move down', 'aria-label': 'Move down', text: '↓' });
					up.disabled = index === 0;
					down.disabled = index === groupEntries.length - 1;
					up.addEventListener('click', () => moveTaskWithinCategory(key, index, index - 1));
					down.addEventListener('click', () => moveTaskWithinCategory(key, index, index + 1));
					row.appendChild(el('div', { class: 'task-move' }, [up, down]));
				}
				const remove = el('button', { type: 'button', class: 'task-icon-btn', title: 'Delete task', 'aria-label': 'Delete task', text: '✕' });
				remove.addEventListener('click', () => commitTasks({ [id]: null }));
				row.appendChild(remove);

				if (group) {
					const after = (e) => { const r = row.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; };
					const clear = () => row.classList.remove('drop-before', 'drop-after');
					row.addEventListener('dragstart', (e) => {
						dragFrom = { key, index };
						e.dataTransfer.effectAllowed = 'move';
						e.dataTransfer.setData('text/plain', String(index));
						setTimeout(() => row.classList.add('dragging'), 0);
					});
					row.addEventListener('dragend', () => { dragFrom = null; row.classList.remove('dragging'); clear(); });
					row.addEventListener('dragover', (e) => {
						if (!dragFrom || dragFrom.key !== key || dragFrom.index === index) return;
						e.preventDefault();
						e.dataTransfer.dropEffect = 'move';
						row.classList.toggle('drop-after', after(e));
						row.classList.toggle('drop-before', !after(e));
					});
					row.addEventListener('dragleave', clear);
					row.addEventListener('drop', (e) => {
						if (!dragFrom || dragFrom.key !== key) return;
						e.preventDefault();
						const from = dragFrom.index;
						dragFrom = null;
						clear();
						// Insertion point in the pre-removal array, less the hole the dragged row leaves.
						let insertAt = index + (after(e) ? 1 : 0);
						if (from < insertAt) insertAt--;
						moveTaskWithinCategory(key, from, insertAt);
					});
				}
				return row;
			};

			const open = entries.filter(([, t]) => !t.done);
			const done = entries.filter(([, t]) => t.done).sort((a, b) => (b[1].completedAt || 0) - (a[1].completedAt || 0));
			const keys = [...new Set(open.map(([, t]) => t.category))].sort((a, b) => categoryTier(a) - categoryTier(b) || (categoryTier(a) === 4 ? a.localeCompare(b) : 0));
			if (open.length) {
				for (const key of keys) {
					const groupEntries = openTaskIdsByCategory(key).map((id) => [id, tasks[id]]);
					const details = el('details', { class: 'task-section', open: 'true' }, [el('summary', { text: `${key} (${groupEntries.length})` })]);
					groupEntries.forEach(([id, t], index) => details.appendChild(buildRow(id, t, { key, index, groupEntries })));
					card.appendChild(details);
				}
			} else {
				card.appendChild(el('div', { class: 'task-empty', text: 'Nothing open — nice.' }));
			}
			if (done.length) {
				const details = el('details', { class: 'task-section' }, [el('summary', { text: `Completed (${done.length})` })]);
				for (const [id, t] of done) details.appendChild(buildRow(id, t));
				card.appendChild(details);
			}
			return card;
		}

		// Edit a task in place: text and category are the only fields that can't
		// change any other way. Moving category sends the task to the end of the
		// new one, since an index from the old category means nothing there.
		function buildEditRow(id, t, categories) {
			const row = el('div', { class: 'task-row editing' });
			const text = el('input', { type: 'text', class: 'task-input', value: t.text, autocomplete: 'off', maxlength: String(MAX_TASK_TEXT_LENGTH), 'aria-label': 'Task' });
			const category = el('input', { type: 'text', class: 'task-input', value: t.category || '', placeholder: 'Category', autocomplete: 'off', 'aria-label': 'Category' });
			const save = () => {
				const nextText = text.value.trim();
				const nextCategory = category.value.trim();
				if (!nextText || !nextCategory) return;
				editingTaskId = null;
				const updates = { text: nextText, category: nextCategory };
				if (nextCategory !== (t.category || '')) updates.order = Date.now();
				patchTask(id, updates);
			};
			const cancel = () => { editingTaskId = null; refreshTasksCard(); };
			const keydown = (e) => { if (e.key === 'Enter') save(); else if (e.key === 'Escape') cancel(); };
			text.addEventListener('keydown', keydown);
			category.addEventListener('keydown', keydown);
			const saveBtn = el('button', { type: 'button', class: 'task-icon-btn task-save-btn', title: 'Save', 'aria-label': 'Save', text: '✓' });
			saveBtn.addEventListener('click', save);
			const cancelBtn = el('button', { type: 'button', class: 'task-icon-btn', title: 'Cancel', 'aria-label': 'Cancel', text: '✕' });
			cancelBtn.addEventListener('click', cancel);
			row.append(text, attachTaskCharCounter(text), attachCategorySuggestions(category, () => categories), saveBtn, cancelBtn);
			setTimeout(() => { text.focus(); text.setSelectionRange(text.value.length, text.value.length); }, 0);
			return row;
		}

		function adminView() {
			tasksCardEl = buildTasksCard();
			loadTasks(); // first load, or a quiet refresh when the tab is reopened
			qlDraft = null; // a fresh copy of what is saved each time the tab opens
			qlErrors = [];
			qlCardEl = buildQuickLinksCard();
			return [tasksCardEl, qlCardEl, seasonsCard()];
		}

		// Coming back to the page (switching apps on a phone or iPad, or restoring
		// it from the back/forward cache) refreshes the list too.
		function refreshTasksIfVisible() {
			if (tab === 'admin' && isLoggedIn() && document.visibilityState === 'visible') loadTasks();
		}
		document.addEventListener('visibilitychange', refreshTasksIfVisible);
		window.addEventListener('pageshow', refreshTasksIfVisible);

		// ---- Shell ---------------------------------------------------------------

		function setTab(next) {
			tab = next;
			editingTaskId = null;
			setStatus('');
			renderAll();
		}

		function renderTabs() {
			const nav = document.getElementById('tabs');
			nav.textContent = '';
			// The Admin tab exists only while logged in; logging out removes it.
			const tabs = [['schedule', 'Schedule'], ['history', 'History'], ...(isLoggedIn() ? [['admin', 'Admin']] : [])];
			for (const [id, label] of tabs) {
				const btn = el('button', { type: 'button', class: `tab-btn${tab === id ? ' active' : ''}`, role: 'tab', 'aria-selected': String(tab === id), text: label });
				btn.addEventListener('click', () => setTab(id));
				nav.appendChild(btn);
			}
		}

		function renderAll() {
			if (tab === 'admin' && !isLoggedIn()) tab = 'schedule';
			renderLogin();
			renderTabs();
			renderQuickLinks();
			const view = document.getElementById('view');
			view.textContent = '';
			tasksCardEl = null;
			const cards = tab === 'history' ? historyView() : tab === 'admin' ? adminView() : scheduleView();
			cards.forEach((c) => view.appendChild(c));
		}

		async function load() {
			const view = document.getElementById('view');
			renderLogin();
			const json = (url) => fetch(url).then(async (r) => {
				if (!r.ok) throw new Error(`HTTP ${r.status}`);
				return r.json();
			});
			// Not awaited with the rest: the bar fills in when it arrives, and a failure
			// just leaves it hidden.
			fetch(`${TICKETS_URL}?resource=quicklinks`, { cache: 'no-store' })
				.then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
				.then((b) => { quickLinks = Array.isArray(b.links) ? b.links : []; renderQuickLinks(); })
				.catch(() => { /* no toolbar */ });
			const [snap, seats, hist] = await Promise.allSettled([
				json(SNAPSHOT_URL),
				fetch(TICKETS_URL).then(async (r) => {
					const b = await r.json().catch(() => ({}));
					if (!r.ok) throw new Error(b.error || `HTTP ${r.status}`);
					return b.tickets;
				}),
				json(HISTORY_URL),
			]);
			if (snap.status === 'rejected') {
				view.textContent = '';
				view.appendChild(message(`Couldn’t load the schedule (${snap.reason.message}).`, 'error'));
				return;
			}
			const sched = snap.value && snap.value.nflSchedules;
			snapshotSeason = sched && sched.season;
			const pre = snap.value && snap.value.nflPreseason;
			// A preseason block left over from another season (the sync keeps the
			// last good read when ESPN fails) must not be shown against this one.
			const preSchedule = pre && String(pre.season) === String(snapshotSeason) ? pre.teams && pre.teams[TEAM] : [];
			if (snapshotSeason) currentData = buildSeason(snapshotSeason, sched.teams && sched.teams[TEAM], preSchedule);
			if (seats.status === 'fulfilled') tickets = { games: (seats.value && seats.value.games) || {} };
			else ticketsFailed = seats.reason.message;
			if (hist.status === 'fulfilled') historyDoc = hist.value;
			else historyError = hist.reason.message === 'HTTP 404' ? null : hist.reason.message; // 404 = not backfilled yet
			renderAll();
		}

		load();
	</script>
</body>
</html>
